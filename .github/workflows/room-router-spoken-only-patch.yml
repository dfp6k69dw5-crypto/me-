name: Patch Room live overlay binding

on:
  push:
    branches: [main]
    paths:
      - 'society/room-router-spoken-only-kick.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Bind the live Room overlay to the actual run path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/room_private_model/__init__.py')
          s = p.read_text()

          old = '''        "n_predict": {"comprehension": 192, "thought": 220, "expression": 220}.get(role, 192),\n'''
          new = '''        "n_predict": 512 * (2 if attempt and role in {"comprehension", "thought"} else 1),\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('live request token-budget anchor missing')

          marker = 'LIVE_OVERLAY_BOUNDARY_V14 = True'
          if marker not in s:
              s += '''\n\n# The base run() function was created in _BASE, so copying it into this package\n# left its __globals__ bound to the base module. Rebuild the same function code\n# against this package namespace so the live compacting, validation and request\n# functions above are the functions the Room actually executes.\nimport types as _types\nLIVE_OVERLAY_BOUNDARY_V14 = True\nrun = _types.FunctionType(\n    _BASE.run.__code__,\n    globals(),\n    name="run",\n    argdefs=_BASE.run.__defaults__,\n    closure=_BASE.run.__closure__,\n)\n'''
          p.write_text(s)

          q = Path('scripts/sitecustomize.py')
          t = q.read_text()
          old = '''    _rpm._request = _room_request\n    _rpm._extract_json = _room_extract_json\n    _rpm._validate = _room_validate\n'''
          new = '''    # A live package overlay owns its sampler. The compatibility shim may still\n    # add truncation salvage and rejection diagnostics, but must not replace the\n    # overlay's high-variance request function.\n    if not getattr(_rpm, "LIVE_EXPRESSION_OVERLAY", ""):\n        _rpm._request = _room_request\n    _rpm._extract_json = _room_extract_json\n    _rpm._validate = _room_validate\n'''
          if old in t:
              t = t.replace(old, new, 1)
          elif new not in t:
              raise SystemExit('sitecustomize request-binding anchor missing')
          q.write_text(t)
          PY

          python3 -m py_compile scripts/room_private_model/__init__.py scripts/sitecustomize.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_private_model as rpm
          assert getattr(rpm, 'LIVE_OVERLAY_BOUNDARY_V14', False)
          assert rpm.run.__globals__ is rpm.__dict__, 'Room run() is still bound to the base module'
          assert getattr(rpm._request, '__module__', '') == 'room_private_model', 'sitecustomize replaced the live sampler'
          print('LIVE_OVERLAY_BOUNDARY_OK', rpm.LIVE_EXPRESSION_OVERLAY)
          PY
      - name: Commit root fix
        shell: bash
        run: |
          git config user.name 'room-overlay-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_private_model/__init__.py scripts/sitecustomize.py
          git commit -m 'Bind Room live overlay to actual inference path' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
