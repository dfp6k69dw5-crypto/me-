<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<title>Loading Botanical Harmonograph…</title>
<style>html,body{margin:0;min-height:100%;background:#07080B;color:#d7d4cc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px}.small{opacity:.6;font-size:13px;margin-top:8px}</style>
</head>
<body><div class="load"><div><div>Loading Botanical Harmonograph…</div><div class="small">assembling the original app</div></div></div>
<script>
(async function(){
  try {
    const parts=[0,1,2,3,4,5].map(n=>`botanical/part${n}.txt?v=4`);
    let html="";
    for(const p of parts){
      const r=await fetch(p,{cache:"no-store"});
      if(!r.ok) throw new Error(`${p}: HTTP ${r.status}`);
      html+=await r.text();
    }
    if(!html.includes("Botanical Harmonograph") || !html.includes("</html>")) throw new Error("source assembly was incomplete");

    const patchOnce=(src,needle,replacement,label)=>{
      if(!src.includes(needle)) throw new Error("growth-history patch missing: "+label);
      return src.replace(needle,replacement);
    };

    const growthHelper=`function growthTraceWidth(Q,u) {
    const h=Math.max(-1,Math.min(1,Q.growthHistory||0));
    const m=Math.max(0,Math.min(1.2,Q.growthMemory||0));
    if(Math.abs(h)<1e-4||m<1e-4) return 1;
    const sw=Math.max(0.18,Math.min(0.82,Q.growthSwitch==null?0.52:Q.growthSwitch));
    const sm=(t)=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
    const late=sm((u-(sw-0.18))/0.36);
    const sd=Q.seed||0;
    let f=1;
    if(h>0){
        const env=Math.exp(-Math.pow((u-(sw+0.16))/0.22,2));
        f+=m*h*(-0.10*(1-late)+0.22*late);
        f+=0.045*m*h*env*Math.sin((3.2+1.3*m)*Math.PI*u+sd*0.011);
    } else {
        const a=-h,env=Math.exp(-Math.pow((u-(sw-0.10))/0.24,2));
        f+=m*a*(0.18*(1-late)-0.08*late);
        f+=0.035*m*a*env*Math.sin((2.6+1.0*m)*Math.PI*u+sd*0.011);
    }
    return Math.max(0.68,Math.min(1.35,f));
}
`;

    html=patchOnce(html,
      'function petalParts(P, over, ll) {',
      growthHelper+'function petalParts(P, over, ll) {',
      'petal helper');
    html=patchOnce(html,
      'const y = sgn * evalW(u, Q.mixW) * Q.pW * fy * wob;',
      'const y = sgn * evalW(u, Q.mixW) * Q.pW * fy * wob * growthTraceWidth(Q,u);',
      'petal width');
    html=patchOnce(html,
      'const wAt = (u) => evalW(u, Q.mixW) * Q.pW * fy * (1 + Q.margin * 0.3 * snoise(u * 6.2, sd));',
      'const wAt = (u) => evalW(u, Q.mixW) * Q.pW * fy * (1 + Q.margin * 0.3 * snoise(u * 6.2, sd)) * growthTraceWidth(Q,u);',
      'vein growth trace');
    html=patchOnce(html,
      'const next={mode:"petal",arrangement,strands:1,symmetry,spread:0,',
      'const growthHistory=pick([1,1,1,-1,-1,0]),growthMemory=growthHistory===0?0:R(rare?.55:.32,rare?.92:.68),growthSwitch=R(.34,.68);\n        const next={mode:"petal",arrangement,strands:1,symmetry,spread:0,growthHistory,growthMemory,growthSwitch,',
      'hybrid growth trajectory');
    html=patchOnce(html,
      'P.mixW, P.mixK, P.mixZ, P.mixV,\n    ]);',
      'P.mixW, P.mixK, P.mixZ, P.mixV, P.growthHistory, P.growthMemory, P.growthSwitch,\n    ]);',
      'growth dependencies');

    document.open();
    document.write(html);
    document.close();
  } catch(err) {
    document.body.innerHTML='<div class="load"><div><strong>Botanical Harmonograph could not load.</strong><div class="small"></div></div></div>';
    document.querySelector('.small').textContent=err && err.message ? err.message : String(err);
  }
})();
</script>
</body>
</html>
