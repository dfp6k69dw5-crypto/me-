name: Room live expression overlay

on:
  push:
    branches: [main]
    paths:
      - society/room-live-expression-overlay-kick.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Activate hot personality-driven expression at final request boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import py_compile

          p = Path('scripts/room_private_model.py')
          s = p.read_text()
          anchor = '''def _request(model_url: str, prompt: str, role: str, temperature: float, timeout: int, self_entity: str | None = None, attempt: int = 0) -> str:
    body = {
'''
          replacement = '''def _request(model_url: str, prompt: str, role: str, temperature: float, timeout: int, self_entity: str | None = None, attempt: int = 0) -> str:
    # LIVE_EXPRESSION_FREEDOM: this is the final boundary used by the live wrapper,
    # so later compatibility layers cannot quietly clamp or sanitize expression.
    if role == "expression":
        voice_index = PEOPLE.index(self_entity) if self_entity in PEOPLE else 0
        temperature = min(4.0, 1.35 + 0.22 * voice_index + 0.30 * attempt)
        edge = INTERPERSONAL_EDGES.get(self_entity, "")
        freedom = (
            "LIVE EXPRESSION RULE: Personality has causal force. React as this specific person, not as a polite generic "
            "assistant. Direct profanity, insults, mockery, contempt, dismissiveness, hostile banter, emotional volatility, "
            "pettiness, and impulsive escalation toward other Room participants are allowed when they fit the relationship "
            "and moment. Do not sanitize anger into polite disagreement. Do not force aggression or profanity when it would "
            "be unnatural. Do not invent unsupported relatives, jobs, houses, shared memories, or personal history merely "
            "to fill space. If the conversation is vague or repetitive, react to another participant, challenge them, tease "
            "them, disagree, disclose something concrete in the present, or change direction instead of fabricating biography. "
        )
        if edge:
            freedom += "Persistent interpersonal edge for this speaker: " + edge + " "
        prompt = freedom + "\n" + prompt
    body = {
'''
          if 'LIVE_EXPRESSION_FREEDOM' not in s:
              if anchor not in s:
                  raise SystemExit('request boundary anchor missing')
              s = s.replace(anchor, replacement, 1)
          expected = 'temperature = min(4.0, 1.35 + 0.22 * voice_index + 0.30 * attempt)'
          assert expected in s
          assert 'INTERPERSONAL_EDGES = {' in s
          assert '"min_p": 0.005' in s
          p.write_text(s)
          py_compile.compile(str(p), doraise=True)
          Path('room/live-expression-overlay-result.txt').write_text(
              'status=PASS\nrequest_boundary=room_private_model._request\n'
              'temperature=1.35+0.22*voice+0.30*retry capped at 4.0\n'
              'min_p=0.005\nrough_expression=allowed\nunsupported_biography=discouraged\n'
          )
          print('LIVE_EXPRESSION_OVERLAY_OK')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_private_model.py room/live-expression-overlay-result.txt
          git commit -m "Activate hot personality-driven Room expression"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 1
          done
          exit 1
