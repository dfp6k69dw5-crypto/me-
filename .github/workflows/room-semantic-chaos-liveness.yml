name: Room semantic chaos liveness guard

on:
  push:
    branches: [main]
    paths:
      - 'society/room-semantic-chaos-liveness-kick.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Add wild last-resort expression fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/room_private_model/__init__.py')
          s=p.read_text()
          marker='SEMANTIC_CHAOS_FALLBACK_V16 = True'
          if marker not in s:
              s += r'''

# Liveness guard for the semantic-chaos contract. The model gets several real
# attempts first. Only when all of them fail do we synthesize a short line that
# still performs the deliberated social act instead of publishing beige prose or
# freezing the Room.
SEMANTIC_CHAOS_FALLBACK_V16 = True

def _fallback_expression(compact: dict, self_entity: str | None = None) -> dict:
    entity = str(self_entity or "sarah").lower()
    if entity not in _ROOM:
        entity = "sarah"
    intent = compact.get("intent") if isinstance(compact.get("intent"), dict) else {}
    move = str(intent.get("move") or "disagree").lower()
    partner = str(intent.get("partner") or "").lower()
    allowed = tuple(globals().get("PEOPLE", ()))
    if partner not in allowed or partner == entity:
        partner = next(person for person in _ROOM if person != entity)
    name = partner.capitalize()
    fresh = _fresh_subject(entity)
    seed = globals()["_sample_seed"]("semantic_fallback_style", entity, 0)

    options = {
        "sarah": {
            "disagree": [
                f"No, {name}. That story about {fresh} is bullshit, and I'm angry you're acting like I imagined it.",
                f"{name}, you're wrong about {fresh}. I don't trust the neat little version you're selling me, and I'm done pretending I do.",
            ],
            "callback": [
                f"{name}, {fresh} happened and you know it. I still remember being left to explain the whole disaster while you disappeared.",
                f"{name}, don't rewrite {fresh}. You promised me you'd own what happened, and I haven't forgotten that.",
            ],
            "disclose": [
                f"{name}, I hate admitting this, but {fresh} made me jealous and I still want you on my side.",
                f"I'm jealous, {name}. Ever since {fresh}, I've been afraid you'll choose everyone else and leave me looking stupid for caring.",
            ],
            "repair": [
                f"{name}, I'm still pissed about {fresh}, but I need you here. Don't leave me with another fake apology and call it peace.",
                f"I'm sorry, {name}. I was wrong about part of {fresh}, but I'm scared of losing you and I need you to stop shutting me out.",
            ],
        },
        "mara": {
            "disagree": [
                f"No, {name}. Your version of {fresh} is ridiculous, and the smug way you're selling it is worse.",
                f"{name}, that's a lie dressed up as confidence. If {fresh} is your proof, you've embarrassed yourself.",
            ],
            "compare": [
                f"I'd trust Jules with {fresh} before you, {name}. Jules would win; you'd still be explaining why losing was strategic.",
                f"{name}, Sarah is better at bluffing than you are. Your story about {fresh} is weaker, louder, and somehow more obvious.",
            ],
            "disclose": [
                f"Fine, {name}, I'm jealous. I wanted the credit for {fresh}, and I resent how easily everyone handed the story to someone else.",
                f"I'll admit it, {name}: I wanted {fresh} to make me look brilliant, and I hate that someone else got the attention.",
            ],
            "close": [
                f"Enough, {name}. This argument about {fresh} is beneath me, and I'm done pretending your theory deserves another minute.",
                f"I'm done, {name}. Drop the nonsense about {fresh}; it's boring, weak, and not worth another breath.",
            ],
        },
        "owen": {
            "disagree": [
                f"No, {name}. You're lying about {fresh}, and I don't believe for a second that the convenient part was an accident.",
                f"{name}, that explanation is bullshit. Someone manipulated the story around {fresh}, and right now I think it was you.",
            ],
            "callback": [
                f"{name}, {fresh} did not vanish from history because you stopped mentioning it. I've kept that grudge for a reason.",
                f"Remember {fresh}, {name}? I do. You still owe me an explanation, and I don't trust your silence.",
            ],
            "compare": [
                f"This {fresh} excuse is worse than your last one, {name}: neater, smugger, and somehow even less believable.",
                f"{name}, Jules lies better than this. Your version of {fresh} is weaker and more suspicious than theirs ever was.",
            ],
            "close": [
                f"Enough, {name}. I'm done discussing {fresh} until you explain what you're leaving out.",
                f"Drop it, {name}. I don't trust this story about {fresh}, and I'm not wasting another minute pretending I do.",
            ],
        },
        "jules": {
            "disagree": [
                f"No, {name}. If you're going to lie about {fresh}, at least make the lie entertaining.",
                f"{name}, that's ridiculous. Your story about {fresh} is so boring I almost want to sabotage it just to improve the ending.",
            ],
            "disclose": [
                f"Fine, {name}, I wanted {fresh} to blow up. I was jealous, bored, and I liked watching everyone accuse the wrong person.",
                f"I'll confess, {name}: I started the rumor about {fresh} because I wanted attention and the room was painfully dull.",
            ],
            "bridge": [
                f"Forget the sensible plan, {name}. I dare you to meet me at {fresh} at midnight and bring the key nobody admits owning.",
                f"{name}, new plan: we steal the brass flamingo, leave it at {fresh}, and tell Owen it was Herman. Prove you're not boring.",
            ],
            "callback": [
                f"{name}, remember {fresh}? You still owe me for that disaster, and I'm not letting you rewrite it into a harmless story.",
                f"{name}, {fresh} happened. You dared me first, I made it worse, and you still owe me for the part involving the key.",
            ],
        },
    }
    choices = options.get(entity, {}).get(move) or [
        f"No, {name}. I'm not pretending {fresh} is normal, and I'm not letting you make it boring."
    ]
    utterance = choices[seed % len(choices)]
    semantic_terms = list(sorted(_terms(fresh)))[:4] or ["grudge"]
    return {
        "decision": "SPEAK",
        "target": partner,
        "move": move,
        "utterance": utterance,
        "semantic_terms": semantic_terms,
    }
'''
          p.write_text(s)

          e=Path('scripts/room_engine_v5.py')
          t=e.read_text()
          t=t.replace('attempts = 9 if role == "expression" else 2', 'attempts = 6 if role == "expression" else 2', 1)
          old='''    if role == "comprehension":\n        fallback = _neutral_comprehension(payload)\n        return _private_model._validate(role, fallback, compact, instruction, self_entity)\n    raise RuntimeError(f"private model output rejected for {role}: {last_reason}")\n'''
          new='''    if role == "comprehension":\n        fallback = _neutral_comprehension(payload)\n        return _private_model._validate(role, fallback, compact, instruction, self_entity)\n    if role == "expression" and hasattr(_private_model, "_fallback_expression"):\n        fallback = _private_model._fallback_expression(compact, self_entity)\n        fallback = _private_model._validate(role, fallback, compact, instruction, self_entity)\n        return _private_model._sanitize_expression(fallback, compact, self_entity)\n    raise RuntimeError(f"private model output rejected for {role}: {last_reason}")\n'''
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('engine fallback anchor missing')
          e.write_text(t)
          PY

          python3 -m py_compile scripts/room_private_model/__init__.py scripts/room_engine_v5.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_private_model as rpm
          assert rpm.LIVE_EXPRESSION_OVERLAY == '2026-08-24-semantic-chaos-v15'
          assert rpm.SEMANTIC_CHAOS_FALLBACK_V16
          tests={'sarah':'disagree','mara':'compare','owen':'close','jules':'bridge'}
          for entity,move in tests.items():
              partner='mara' if entity!='mara' else 'owen'
              compact={'intent':{'move':move,'risk':4,'partner':partner},'context':[]}
              obj=rpm._fallback_expression(compact,entity)
              rpm._validate('expression',obj,compact,'',entity)
              print(entity, obj['utterance'])
          print('SEMANTIC_CHAOS_FALLBACK_OK')
          PY
      - name: Commit liveness guard
        shell: bash
        run: |
          git config user.name 'room-chaos-liveness'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_private_model/__init__.py scripts/room_engine_v5.py
          git commit -m 'Keep semantic-chaos Room speaking under rejection' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
