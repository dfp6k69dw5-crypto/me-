<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Growth Canvas — FEM test harness</title>
<style>
  :root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0b0d10;color:#d7dbe0}
  *{box-sizing:border-box} body{margin:0;background:#0b0d10;color:#d7dbe0}
  main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:100vh}
  #stage{position:relative;min-height:62vh;background:#06080a;overflow:hidden}
  canvas{width:100%;height:100%;display:block;position:absolute;inset:0;touch-action:manipulation}
  aside{padding:14px;border-left:1px solid #252a31;background:#101318;overflow:auto}
  h1{font-size:15px;margin:0 0 12px;font-weight:650} h2{font-size:12px;margin:16px 0 8px;color:#aeb7c2}
  .row{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}
  button,select,input{font:inherit;color:#e6e8eb;background:#171b21;border:1px solid #353c46;border-radius:6px;padding:8px 9px}
  button{cursor:pointer;min-height:36px} button:active{transform:translateY(1px)}
  input[type=number]{width:82px} label{font-size:11px;color:#b8c0ca}
  .check{display:flex;gap:7px;align-items:center;margin:6px 0}.check input{width:18px;height:18px}
  #stats,#accept{font-size:10px;line-height:1.55;white-space:pre-wrap;color:#aeb7c2;background:#0b0e12;border:1px solid #242a31;border-radius:6px;padding:9px}
  .pass{color:#8fd5a6}.fail{color:#f39a9a}
  @media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:56vh auto}aside{border-left:0;border-top:1px solid #252a31}#stage{min-height:56vh}}
</style>
</head>
<body>
<main>
  <section id="stage"><canvas id="c"></canvas></section>
  <aside>
    <h1>GROWTH CANVAS / GPT reduced FEM</h1>
    <div class="row"><label>scenario</label><select id="scenario"><option value="petal">petal / differential + polarity</option><option value="iso">square / isotropic</option><option value="aniso">square / anisotropic</option><option value="diff">square / differential isotropic</option></select></div>
    <div class="row"><label>dt</label><input id="dt" type="number" min="0.001" max="0.2" step="0.005" value="0.025"><label>grow Δt</label><input id="span" type="number" min="0.01" max="5" step="0.1" value="0.5"></div>
    <div class="row"><button id="reset">Reset</button><button id="step">Step</button><button id="grow">Grow</button></div>
    <h2>views</h2>
    <label class="check"><input id="mesh" type="checkbox" checked>mesh wireframe</label>
    <label class="check"><input id="pol" type="checkbox" checked>POL polarity</label>
    <label class="check"><input id="growth" type="checkbox">specified areal growth</label>
    <label class="check"><input id="matgrid" type="checkbox" checked>material-space grid</label>
    <label class="check"><input id="clones" type="checkbox" checked>marked clones</label>
    <h2>state</h2><div id="stats"></div>
    <h2>acceptance</h2><div class="row"><button id="runTests">Run 9 checks</button></div><div id="accept">Not run.</div>
  </aside>
</main>
<script type="module">
import GrowthCanvas from './growth-canvas.js';

const $=s=>document.querySelector(s), canvas=$('#c'), ctx=canvas.getContext('2d');
let gc, rule, cloneLoops=[];

function makeScenario(name){
  if(name==='iso'){
    const g=new GrowthCanvas({shape:'square',resolution:20,seed:12345});
    return [g,{kpar:()=>0.18,kper:()=>0.18}];
  }
  if(name==='aniso'){
    const g=new GrowthCanvas({shape:'square',resolution:20,seed:12345});
    g.setOrganisers({plus:(u,v)=>u<0.03,minus:(u,v)=>u>0.97});
    return [g,{kpar:()=>0.30,kper:()=>0.05}];
  }
  if(name==='diff'){
    const g=new GrowthCanvas({shape:'square',resolution:20,seed:12345});
    const r=(u,v)=>0.10+0.24*(v+1)/2;
    return [g,{kpar:r,kper:r}];
  }
  const g=new GrowthCanvas({shape:'petal',resolution:24,seed:12345,shallowGradient:'freeze'});
  g.setOrganisers({plus:(u,v)=>u<0.045,minus:(u,v)=>u>0.955});
  const r=(u,v)=>0.08+0.30*(v+1)/2;
  return [g,{kpar:(u,v)=>1.55*r(u,v),kper:(u,v)=>0.45*r(u,v)}];
}

function reset(){[gc,rule]=makeScenario($('#scenario').value);cloneLoops=makeCloneLoops(gc);draw();}
function makeCloneLoops(g){
  const out=[], centers=[[.22,-.45],[.22,.45],[.48,-.42],[.48,.42],[.73,-.32],[.73,.32]];
  const bb=g.bbox(), rad=.022*Math.min(bb.x1-bb.x0,bb.y1-bb.y0);
  for(const [u,v] of centers){const c=g.toWorld(u,v);if(!c)continue;const loop=[];for(let k=0;k<28;k++){const a=2*Math.PI*k/28,m=g.toMaterial(c.x+rad*Math.cos(a),c.y+rad*Math.sin(a));if(m)loop.push([m.u,m.v]);}if(loop.length>12)out.push(loop)}
  return out;
}

function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));draw();}
new ResizeObserver(resize).observe($('#stage'));
function xf(){const b=gc.bbox(),w=canvas.width,h=canvas.height,pad=.08*Math.min(w,h),sx=(w-2*pad)/(b.x1-b.x0||1),sy=(h-2*pad)/(b.y1-b.y0||1),s=Math.min(sx,sy),cx=.5*(b.x0+b.x1),cy=.5*(b.y0+b.y1);return (x,y)=>[w/2+(x-cx)*s,h/2-(y-cy)*s];}

function evalRates(u,v){return [typeof rule.kpar==='function'?rule.kpar(u,v,{}):0,typeof rule.kper==='function'?rule.kper(u,v,{}):0]}
function draw(){if(!gc||!canvas.width)return;ctx.clearRect(0,0,canvas.width,canvas.height);const X=xf();
  if($('#growth').checked)drawGrowth(X);else{const o=gc.outline();if(o.length){ctx.beginPath();o.forEach((p,i)=>{const q=X(...p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle='#121923';ctx.fill();}}
  if($('#matgrid').checked)drawMaterialGrid(X);
  if($('#mesh').checked)drawMesh(X);
  if($('#pol').checked)drawPolarity(X);
  if($('#clones').checked)drawClones(X);
  const s=gc.stats(),b=gc.bbox();$('#stats').textContent=`t ${gc.time.toFixed(4)}\nverts ${s.verts}   tris ${s.tris}\narea ${gc.area().toFixed(5)}\nremeshes ${s.remeshes}   steps ${s.steps}\nsolver ${s.ms.toFixed(1)} ms\nbbox ${(b.x1-b.x0).toFixed(3)} × ${(b.y1-b.y0).toFixed(3)}`;
}
function drawGrowth(X){let mn=Infinity,mx=-Infinity,vals=new Float64Array(gc.nt);for(let t=0;t<gc.nt;t++){const a=gc.tri[3*t],b=gc.tri[3*t+1],c=gc.tri[3*t+2],u=(gc.mat[2*a]+gc.mat[2*b]+gc.mat[2*c])/3,v=(gc.mat[2*a+1]+gc.mat[2*b+1]+gc.mat[2*c+1])/3,[kp,kt]=evalRates(u,v),z=kp+kt;vals[t]=z;mn=Math.min(mn,z);mx=Math.max(mx,z)}for(let t=0;t<gc.nt;t++){const z=(vals[t]-mn)/(mx-mn||1);ctx.fillStyle=`hsl(${215-175*z} 58% ${16+25*z}%)`;ctx.beginPath();for(let k=0;k<3;k++){const i=gc.tri[3*t+k],q=X(gc.pos[2*i],gc.pos[2*i+1]);k?ctx.lineTo(...q):ctx.moveTo(...q)}ctx.closePath();ctx.fill()}}
function drawMesh(X){ctx.strokeStyle='rgba(205,216,228,.22)';ctx.lineWidth=1;ctx.beginPath();for(let t=0;t<gc.nt;t++)for(let e=0;e<3;e++){const a=gc.tri[3*t+e],b=gc.tri[3*t+(e+1)%3],p=X(gc.pos[2*a],gc.pos[2*a+1]),q=X(gc.pos[2*b],gc.pos[2*b+1]);ctx.moveTo(...p);ctx.lineTo(...q)}ctx.stroke()}
function drawPolarity(X){const p=gc.polarity(),stride=Math.max(1,Math.floor(gc.n/150));ctx.strokeStyle='rgba(255,202,116,.72)';ctx.lineWidth=1.2;for(let i=0;i<gc.n;i+=stride){const px=p[2*i],py=p[2*i+1];if(Math.hypot(px,py)<.1)continue;const a=X(gc.pos[2*i],gc.pos[2*i+1]),b=X(gc.pos[2*i]+px*.025,gc.pos[2*i+1]+py*.025);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}}
function drawMaterialGrid(X){ctx.strokeStyle='rgba(114,214,194,.48)';ctx.lineWidth=1.25;for(let u=.1;u<1;u+=.1)drawMatCurve(X,t=>[u,-1+2*t]);for(let v=-.8;v<1;v+=.2)drawMatCurve(X,t=>[t,v])}
function drawMatCurve(X,fn){ctx.beginPath();let started=false;for(let i=0;i<=80;i++){const [u,v]=fn(i/80),p=gc.toWorld(u,v);if(!p){started=false;continue}const q=X(p.x,p.y);if(!started){ctx.moveTo(...q);started=true}else ctx.lineTo(...q)}ctx.stroke()}
function drawClones(X){ctx.strokeStyle='rgba(244,130,157,.95)';ctx.lineWidth=2;for(const loop of cloneLoops){ctx.beginPath();let first=true;for(const [u,v] of loop){const p=gc.toWorld(u,v);if(!p)continue;const q=X(p.x,p.y);if(first){ctx.moveTo(...q);first=false}else ctx.lineTo(...q)}ctx.closePath();ctx.stroke()}}

$('#reset').onclick=reset;$('#scenario').onchange=reset;$('#step').onclick=()=>{gc.step(+$('#dt').value,rule);draw()};$('#grow').onclick=()=>{gc.grow(+$('#span').value,{...rule,dt:+$('#dt').value});draw()};for(const id of ['mesh','pol','growth','matgrid','clones'])$('#'+id).onchange=draw;

function turning(g){const p=[];for(let i=0;i<=40;i++){const q=g.toWorld(i/40,0);if(q)p.push(q)}let sum=0,prev=null;for(let i=1;i<p.length;i++){let a=Math.atan2(p[i].y-p[i-1].y,p[i].x-p[i-1].x);if(prev!==null){let d=a-prev;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;sum+=Math.abs(d)}prev=a}return sum}
function maxAspect(g){let m=0,minSigned=Infinity;for(let t=0;t<g.nt;t++){const a=g.tri[3*t],b=g.tri[3*t+1],c=g.tri[3*t+2],p=g.pos,ax=p[2*a],ay=p[2*a+1],bx=p[2*b],by=p[2*b+1],cx=p[2*c],cy=p[2*c+1],l0=(ax-bx)**2+(ay-by)**2,l1=(bx-cx)**2+(by-cy)**2,l2=(cx-ax)**2+(cy-ay)**2,A2=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);m=Math.max(m,Math.max(l0,l1,l2)/Math.abs(A2));minSigned=Math.min(minSigned,A2)}return{max:m,minSigned}}
function meanMaterialEdge(g){let s=0,n=0,seen=new Set();for(let t=0;t<g.nt;t++)for(let e=0;e<3;e++){let a=g.tri[3*t+e],b=g.tri[3*t+(e+1)%3];const k=a<b?a+','+b:b+','+a;if(seen.has(k))continue;seen.add(k);s+=Math.hypot(g.mat[2*a]-g.mat[2*b],g.mat[2*a+1]-g.mat[2*b+1]);n++}return s/n}
async function runAcceptance(){const out=[],report=(n,pass,msg)=>{out.push({n,pass,msg});$('#accept').innerHTML=out.map(x=>`<span class="${x.pass?'pass':'fail'}">${x.pass?'PASS':'FAIL'} ${x.n}</span> — ${x.msg}`).join('<br>');};
  let g=new GrowthCanvas({shape:'square',resolution:14});const k=.2,T=.5;g.grow(T,{dt:.01,kpar:()=>k,kper:()=>k});let b=g.bbox(),expected=Math.exp(k*T),wx=b.x1-b.x0,wy=b.y1-b.y0,err=Math.max(Math.abs(wx/expected-1),Math.abs(wy/expected-1)),rg=g.resultantGrowth(),an=Math.max(...rg.map(x=>Math.abs(x.anisotropy)));report(1,err<.01&&an<1e-5,`scale err ${(100*err).toFixed(3)}%, anis ${an.toExponential(2)}`);await tick();
  g=new GrowthCanvas({shape:'square',resolution:14});g.setOrganisers({plus:(u,v)=>u<.03,minus:(u,v)=>u>.97});g.grow(.7,{dt:.015,kpar:()=>.30,kper:()=>.05});b=g.bbox();const curv2=turning(g);report(2,(b.y1-b.y0)>(b.x1-b.x0)*1.10&&curv2<.02,`rectangle ${(b.x1-b.x0).toFixed(3)}×${(b.y1-b.y0).toFixed(3)}, curvature ${curv2.toFixed(5)}`);await tick();
  const r=(u,v)=>.10+.24*(v+1)/2;const iso=new GrowthCanvas({shape:'square',resolution:16});iso.grow(1,{dt:.025,kpar:r,kper:r});const c3=turning(iso);report(3,c3>.05,`emergent turning ${c3.toFixed(5)} rad`);await tick();
  const combo=new GrowthCanvas({shape:'square',resolution:16});combo.setOrganisers({plus:(u,v)=>u<.03,minus:(u,v)=>u>.97});combo.grow(1,{dt:.025,kpar:(u,v)=>1.6*r(u,v),kper:(u,v)=>.4*r(u,v)});const c4=turning(combo);report(4,c4>c3,`combined ${c4.toFixed(5)} > isotropic differential ${c3.toFixed(5)}`);await tick();
  const cur=[];for(const mode of ['freeze','sources']){const q=new GrowthCanvas({shape:'petal',resolution:16,shallowGradient:mode});q.setOrganisers({plus:(u,v)=>u<.08&&Math.abs(v)<.25,minus:(u,v)=>u>.92&&Math.abs(v)<.25});q.grow(1.2,{dt:.025,kpar:(u,v)=>.08+.42*(v+1)/2,kper:(u,v)=>.025+.09*(v+1)/2});cur.push(turning(q))}report(5,cur[0]>cur[1],`frozen ${cur[0].toFixed(5)}, continuing/sources ${cur[1].toFixed(5)}`);await tick();
  g=new GrowthCanvas({shape:'square',resolution:14});g.addField('checker',{type:'identity',init:(u,v)=>(Math.floor(u*8)+Math.floor((v+1)*4))&1});g.setOrganisers({plus:(u,v)=>u<.03,minus:(u,v)=>u>.97});const A0=g.area();g.grow(1.0,{dt:.02,kpar:()=>.85,kper:()=>.55});let maxRT=0,count=0;for(let i=1;i<20;i++)for(let j=1;j<20;j++){const u=i/20,v=-1+2*j/20,p=g.toWorld(u,v);if(!p)continue;const m=g.toMaterial(p.x,p.y);if(m){maxRT=Math.max(maxRT,Math.hypot(m.u-u,m.v-v));count++}}const edge=meanMaterialEdge(g);report(6,g.area()/A0>3.5&&maxRT<edge,`area ×${(g.area()/A0).toFixed(2)}, round-trip ${maxRT.toExponential(2)} < edge ${edge.toFixed(4)} (${count} samples)`);await tick();
  g=new GrowthCanvas({shape:'square',resolution:14});g.setOrganisers({plus:(u,v)=>u<.03,minus:(u,v)=>u>.97});const val=g.validate(.4,{dt:.02,kpar:()=>.18,kper:()=>.06});report(7,val.pass,`half-dt displacement ${(100*val.relative).toFixed(4)}% diameter`);await tick();
  g=new GrowthCanvas({shape:'square',resolution:12});g.setOrganisers({plus:(u,v)=>u<.03,minus:(u,v)=>u>.97});const A8=g.area();g.grow(1.55,{dt:.025,kpar:()=>1.5,kper:()=>.02});const ar=maxAspect(g),ratio=g.area()/A8;report(8,ratio>=9.8&&ar.max<10&&ar.minSigned>0,`area ×${ratio.toFixed(2)}, max aspect ${ar.max.toFixed(3)}, min signed area2 ${ar.minSigned.toExponential(2)}, ${g.nt} tris`);await tick();
  g=new GrowthCanvas({shape:'square',resolution:21});g.setOrganisers({plus:(u,v)=>u<.02,minus:(u,v)=>u>.98});let t0=performance.now();for(let i=0;i<100;i++)g.step(.01,{kpar:()=>.02,kper:()=>.01});const stepMs=performance.now()-t0;b=g.bbox();let hits=0;t0=performance.now();for(let i=0;i<100000;i++){const x=b.x0+(b.x1-b.x0)*((i*16807%100003)/100003),y=b.y0+(b.y1-b.y0)*((i*48271%100019)/100019);if(g.toMaterial(x,y))hits++}const queryMs=performance.now()-t0;report(9,stepMs<2000&&queryMs<500,`${g.nt} tris: 100 steps ${stepMs.toFixed(1)} ms; 100k toMaterial ${queryMs.toFixed(1)} ms (${hits} hits)`);
  window.acceptanceResults=out;return out;
}
const tick=()=>new Promise(r=>setTimeout(r,0));$('#runTests').onclick=runAcceptance;
reset();resize();if(new URLSearchParams(location.search).get('autorun')==='1')setTimeout(runAcceptance,50);
</script>
</body></html>
