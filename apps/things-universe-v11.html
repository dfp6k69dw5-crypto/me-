function clamp(s){return Math.max(MIN_Z,Math.min(MAX_Z,s))}function zoomAt(x,y,ns){let old=view.s,n=clamp(ns),wx=(x-view.x)/old,wy=(y-view.y)/old;view.s=n;view.x=x-wx*n;view.y=y-wy*n;draw()}function fit(){if(!nodes.length)return;let xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),minx=Math.min(...xs)-60,maxx=Math.max(...xs)+110,miny=Math.min(...ys)-60,maxy=Math.max(...ys)+60,w=$('#stage').clientWidth,h=$('#stage').clientHeight,s=clamp(Math.min(1.35,.9/Math.max((maxx-minx)/w,(maxy-miny)/h,.001)));view={s,x:w/2-s*(minx+maxx)/2,y:h/2-s*(miny+maxy)/2};draw()}
function pt(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function hit(e){let r=canvas.getBoundingClientRect(),best=null,bd=17;for(const n of nodes){let p=screen(n),d=Math.hypot(e.clientX-r.left-p.x,e.clientY-r.top-p.y);if(d<bd){bd=d;best=n}}return best}function beginPinch(){let p=[...pointers.values()];if(p.length<2)return;let a=p[0],b=p[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(b.x-a.x,b.y-a.y)||1;gesture={mode:'pinch',d,s:view.s,wx:(mx-view.x)/view.s,wy:(my-view.y)/view.s};pinched=true;tap=null}function move(){let p=[...pointers.values()];if(p.length>=2){if(gesture.mode!=='pinch')beginPinch();let a=p[0],b=p[1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(b.x-a.x,b.y-a.y)||1,s=clamp(gesture.s*d/gesture.d);view.s=s;view.x=mx-gesture.wx*s;view.y=my-gesture.wy*s;draw()}else if(p.length===1){let q=p[0];if(gesture.mode!=='pan')gesture={mode:'pan',x:q.x,y:q.y,vx:view.x,vy:view.y};let dx=q.x-gesture.x,dy=q.y-gesture.y;if(tap&&Math.abs(dx)+Math.abs(dy)>6)tap.moved=true;view.x=gesture.vx+dx;view.y=gesture.vy+dy;draw()}}
