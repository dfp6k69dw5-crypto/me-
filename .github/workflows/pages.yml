name: Deploy project home to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Live Room data changes constantly and must not redeploy Pages every beat.
      - 'room/*.json'
      - 'room/**/*.json'
      - 'society/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Bake newest Room snapshot when legacy launcher supports it
        run: |
          if grep -q '__ROOM_SNAPSHOT_B64__' apps/sarah-room.html; then
            python3 scripts/bake_room.py
          else
            echo 'Current Room launcher uses the live viewer; skipping legacy snapshot bake.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
