<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Langlands Fluid — Cinematic Ambient</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000;border:0}#app{position:fixed;inset:0}.err{color:#fff;font:16px system-ui;padding:24px;white-space:pre-wrap}</style></head><body><iframe id="app" allow="fullscreen"></iframe><script>(async()=>{try{const parts=[];for(let i=0;i<6;i++){const r=await fetch(`langlands-fluid-desktop-power/part${i}.txt?v=20260812p2`,{cache:'no-store'});if(!r.ok)throw new Error(`payload part ${i}: HTTP ${r.status}`);parts.push((await r.text()).trim())}const s=parts.join('');const a=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.getElementById('app').srcdoc=html}catch(e){document.body.innerHTML='<div class="err">Langlands Fluid failed to load.\n'+String(e)+'</div>'}})();</script></body></html>
