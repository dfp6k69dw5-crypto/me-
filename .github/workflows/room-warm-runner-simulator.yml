name: Room topic birth repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-warm-runner-simulator.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: room-topic-birth-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Narrow newborn topic episodes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/room_topic_bounded.py')
          s = p.read_text()
          old = '''    root = clean[0]\n    facets = [term for term in clean[1:] if not _near(term, root)][:MAX_FACETS]\n    current = facets[0] if facets else root\n    topic.update({\n        "root": root,\n        "current_facet": current,\n        "facets": facets,\n        "visited_facets": [current],\n        "status": "active",\n        "bridge_pending": False,\n        "recent_terms": clean[:MAX_RECENT_TERMS],\n    })\n'''
          new = '''    root = clean[0]\n    # A new episode gets one defensible subject. Candidate words from the\n    # initiating utterance remain recent context, but they are not ontology\n    # facets until later messages independently support them. This keeps topic\n    # birth under the same MIN_FACET_SUPPORT rule used during continuation.\n    topic.update({\n        "root": root,\n        "current_facet": root,\n        "facets": [],\n        "visited_facets": [root],\n        "status": "active",\n        "bridge_pending": False,\n        "recent_terms": clean[:MAX_RECENT_TERMS],\n    })\n'''
          if old not in s:
              raise SystemExit('expected newborn-topic block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/room_topic_bounded.py scripts/room_engine_v5.py scripts/room_social_v5.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_topic_bounded as t
          born=t.new_topic_from_terms(['story','side','show','closer','reassurance'],919,None)
          assert born['root']=='story'
          assert born['current_facet']=='story'
          assert born['facets']==[]
          assert [b['label'] for b in born['branches']]==['story']
          assert 'side' in born['recent_terms']
          # One mention must not promote a facet after birth.
          msg={'speaker':'sarah','text':'side','cognition':{'topic_episode':born['id'],'topic_terms':['side']}}
          once=t.update_topic(born,[msg],920)
          assert once['facets']==[]
          # Two independent messages may promote it.
          msg2={'speaker':'mara','text':'side','cognition':{'topic_episode':born['id'],'topic_terms':['side']}}
          twice=t.update_topic(once,[msg,msg2],921)
          assert any(t._near(x,'side') for x in twice['facets'])
          print('ROOM_TOPIC_BIRTH_GUARD_OK')
          PY

      - name: Commit verified topic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name room-topic-birth-repair
          git config user.email actions@users.noreply.github.com
          git add scripts/room_topic_bounded.py
          if ! git diff --cached --quiet; then
            git commit -m 'Require support before newborn Room facets'
            for n in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              sleep "$n"
            done
          fi

      - name: Controlled Room handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && break
            sleep 2
          done
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
          [ "$active" -eq 0 ] || { echo 'resident Room did not stop'; exit 1; }
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
