name: Room min-p diversity one-time

on:
  push:
    branches: [main]
    paths:
      - society/room-min-p-diversity-kick.txt

permissions:
  contents: write

jobs:
  verify-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify current combined expression state
        shell: bash
        run: |
          set -e
          python -m py_compile scripts/room_private_model.py
          python scripts/room_expression_quality_sim.py
          python scripts/room_cross_voice_novelty_sim.py
          python scripts/room_retry_truncation_sim.py
          python scripts/room_prompt_boundary_sim.py
          grep -q '"min_p": 0.005' scripts/room_private_model.py
          grep -q '"top_k": 60' scripts/room_private_model.py
          grep -q '"top_p": 0.96' scripts/room_private_model.py
          grep -q 'temperature = min(4.0, 0.88 + 0.06 \* voice_index + 0.09 \* attempt)' scripts/room_private_model.py
          grep -q 'attempts = 9 if role == "expression" else 2' scripts/room_private_model.py
          grep -q 'volatile, impulsive, crude, profane' scripts/room_private_model.py
          mkdir -p room
          {
            echo "status=PASS"
            echo "run=${GITHUB_RUN_ID}"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "min_p=0.005"
            echo "top_p=0.96"
            echo "top_k=60"
            echo "temperature_ceiling=4.0"
            echo "expression_attempts=9"
            echo "rough_expression=preserved"
          } > room/min-p-diversity-result.txt
          git add room/min-p-diversity-result.txt
          git commit -m "Verify Room min-p wider expression"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; break; fi
          done
          exit 1
