name: Unpack Growth Canvas
on:
  push:
    paths:
      - 'apps/growth-canvas/growth-canvas.part04'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify tested Growth Canvas source
        shell: bash
        run: |
          set -euo pipefail
          cat apps/growth-canvas/growth-canvas.part00 \
              apps/growth-canvas/growth-canvas.part01 \
              apps/growth-canvas/growth-canvas.part02 \
              apps/growth-canvas/growth-canvas.part03 \
              apps/growth-canvas/growth-canvas.part04 > /tmp/growth.b64
          test "$(wc -c < /tmp/growth.b64)" -eq 19548
          base64 -d /tmp/growth.b64 > /tmp/growth.gz
          echo "0827d37146c945e94ca27b9e5719cf9c9f0325d56bbd3d0159a2bfc0e1e82bc8  /tmp/growth.gz" | sha256sum -c -
          gzip -dc /tmp/growth.gz > apps/growth-canvas/growth-canvas.js
          echo "94be9799b882d16a90dfd8d2bfb4b39fd55a375286e0a731d47815be16e9e0e6  apps/growth-canvas/growth-canvas.js" | sha256sum -c -
          rm -f apps/growth-canvas/growth-canvas.part00 \
                apps/growth-canvas/growth-canvas.part01 \
                apps/growth-canvas/growth-canvas.part02 \
                apps/growth-canvas/growth-canvas.part03 \
                apps/growth-canvas/growth-canvas.part04 \
                apps/growth-canvas/growth-canvas.js.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/growth-canvas
          git commit -m "Add Growth Canvas FEM module"
          git push
