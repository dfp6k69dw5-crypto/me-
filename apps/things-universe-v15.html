function fit(){if(!N.length)return;let b=g.node().getBBox(),w=$('#stage').clientWidth,h=$('#stage').clientHeight,k=Math.max(.015,Math.min(2,.88/Math.max(b.width/w,b.height/h,.001))),x=w/2-k*(b.x+b.width/2),y=h/2-k*(b.y+b.height/2);svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity.translate(x,y).scale(k))}
function reset(){auto=false;token++;N=[];L=[];seeds=[];round=stalls=0;cache.clear();states.clear();lastBridge=null;lg.selectAll('*').remove();eg.selectAll('*').remove();ng.selectAll('*').remove();svg.call(zoom.transform,d3.zoomIdentity);$('#auto').classList.remove('on');$('#auto').textContent='Auto-grow: off';render();ui('Ready')}
$('#add').onclick=()=>{let v=$('#q').value.trim();if(v){$('#q').value='';addThing(v)}};$('#q').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};$('#auto').onclick=toggle;$('#bridge').onclick=findBridge;$('#explain').onclick=explain;$('#fit').onclick=fit;$('#reset').onclick=reset;$('#zp').onclick=()=>svg.transition().call(zoom.scaleBy,1.55);$('#zm').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.55);$('#rx').onclick=()=>$('#reader').classList.remove('open');function vv(){document.documentElement.style.setProperty('--h',Math.round(window.visualViewport?.height||innerHeight)+'px')}window.visualViewport?.addEventListener('resize',vv);addEventListener('resize',()=>{vv();render()});vv();render();ui('Ready');
