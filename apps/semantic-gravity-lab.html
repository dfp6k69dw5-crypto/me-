m:translateX(-50%);display:none;background:#152235;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:9px;max-width:calc(100% - 24px);text-align:center}.toast.show{display:block}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;color:var(--muted);pointer-events:none}.empty b{display:block;color:var(--text);font-size:24px;margin-bottom:7px}.panel{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-height:48%;overflow:auto;display:none;background:#0b1624f4;border:1px solid #334862;border-radius:15px;padding:11px;box-shadow:0 14px 40px #0009}.panel.open{display:block}.ph{display:flex;align-items:center;gap:7px}.ph b{font-size:16px;flex:1}.meter{height:7px;border-radius:999px;background:#203044;overflow:hidden;margin:9px 0 5px}.meter>div{height:100%;width:0;background:#76e2d8}.meterText{font-size:10px;color:var(--muted)}.evidence{border-top:1px solid #ffffff12;margin-top:9px;padding-top:8px}.evidence b{font-size:11px}.evidence p{font-size:10px;line-height:1.4;color:#d4deea;margin:5px 0}.evidence span{color:#8192aa}@media(min-width:700px){.app{max-width:900px;margin:auto;border-left:1px solid #ffffff0a;border-right:1px solid #ffffff0a}}</style></head><body><div class="app"><header class="top"><div class="row"><div class="brand"><b>Semantic Gravity Lab</b><span>separate experiment</span></div><button class="btn" id="clear">Clear</button></div><div class="search"><input id="q" autocomplete="off" placeholder="Add a topic"><button class="btn" id="add">Add</button></div></header><div class="topicbar" id="topics"></div><main class="stage" id="stage"><canvas id="canvas"></canvas><div class="empty" id="empty"><div><b>Topics become geography.</b>Add several ideas. Related topics should settle closer together; weakly related topics should remain farther apart.</div></div><div class="hud"><div class="pill" id="count">0 topics</div><div class="pill" id="status">Ready</div></div><d
