name: Room bounded topic restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-topic-ingestion-restart.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  restart:
    if: contains(github.event.head_commit.message, 'Activate bounded topic ingestion')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto

# one-shot activation
