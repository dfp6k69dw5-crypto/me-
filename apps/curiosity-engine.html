<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>Curiosity Engine</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7" onerror="this.onerror=null;this.src='https://unpkg.com/d3@7/dist/d3.min.js'"></script>
<style>
:root{--bg:#070912;--panel:#0f1523;--panel2:#141d2d;--line:#27344e;--text:#f0f4fd;--muted:#95a2b8;--cyan:#78e5dd;--gold:#dbc98b;--violet:#b59cff;--pink:#f29bc3;--good:#8ee1a9;--warn:#f1c46e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:radial-gradient(760px 520px at 8% -8%,#16213a 0,transparent 60%),radial-gradient(760px 540px at 100% 100%,#151126 0,transparent 58%),var(--bg)}button,input{font:inherit}button{touch-action:manipulation}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.chrome{z-index:20;background:rgba(7,9,18,.91);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07);padding:max(10px,env(safe-area-inset-top)) 12px 10px;display:grid;gap:9px}.titleRow,.modeRow,.actionRow{display:flex;align-items:center;gap:7px}.title{min-width:0;margin-right:auto}.eyebrow{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}h1{font-size:20px;letter-spacing:-.04em;margin:4px 0 0;line-height:1}.btn,.mode,.action,.primary{border:1px solid var(--line);border-radius:12px;background:#111827;color:var(--text);cursor:pointer}.btn{padding:8px 10px;font-size:12px}.mode{padding:9px 11px;font-size:12px;color:var(--muted);background:#101725}.mode.active{color:#071013;background:var(--cyan);border-color:transparent;font-weight:800}.seedRow{display:flex;gap:8px;padding:7px;border:1px solid var(--line);border-radius:16px;background:#0f1625;min-width:0}.seedRow input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:4px 6px;font-size:15px}.primary{padding:10px 13px;background:linear-gradient(135deg,#2b3f5b,#202d46);font-weight:800;white-space:nowrap}.actionRow{overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.actionRow::-webkit-scrollbar{display:none}.action{flex:0 0 auto;padding:8px 10px;font-size:11px;background:#0f1625;border-radius:999px}.action.on{border-color:#557d82;color:var(--cyan)}.workspace{position:relative;min-height:0;overflow:hidden}.graph{position:absolute;inset:0}.graph svg{width:100%;height:100%;display:block}.link{stroke:#66738d;stroke-opacity:.34}.link.hyp{stroke:var(--gold);stroke-dasharray:5 5;stroke-opacity:.82}.node circle{stroke:rgba(255,255,255,.34);stroke-width:1.2}.node text{fill:#dce7fb;font-size:11px;paint-order:stroke;stroke:#070912;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node.seed circle{filter:drop-shadow(0 0 9px rgba(120,229,221,.58))}.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.emptyInner{text-align:center;padding:24px;color:var(--muted);max-width:410px}.emptyInner b{display:block;color:var(--text);font-size:27px;letter-spacing:-.045em;margin-bottom:8px}.insights{position:absolute;top:12px;right:12px;width:min(330px,calc(100% - 24px));max-height:calc(100% - 24px);display:none;z-index:12;border:1px solid var(--line);border-radius:18px;background:rgba(14,20,34,.96);backdrop-filter:blur(18px);overflow:hidden}.insights.open{display:flex;flex-direction:column}.insightsHead{display:flex;align-items:center;padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.06)}.insightsHead strong{font-size:13px}.close{margin-left:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}.tabs{display:flex;padding:7px;gap:5px;border-bottom:1px solid rgba(255,255,255,.05)}.tab{flex:1;border:1px solid var(--line);border-radius:10px;background:#101725;color:var(--muted);font-size:10px;padding:7px 5px;cursor:pointer}.tab.active{color:#061012;background:var(--cyan);border-color:transparent;font-weight:800}.insightsBody{overflow:auto;padding:0 11px 11px}.pane{display:none}.pane.active{display:block}.item{padding:10px 0;border-top:1px solid rgba(255,255,255,.06);font-size:12px;line-height:1.38}.item:first-child{border-top:0}.item strong{display:block;margin-bottom:3px}.muted{color:var(--muted)}.drawer{position:absolute;left:12px;top:12px;width:min(370px,calc(100% - 24px));max-height:calc(100% - 24px);display:none;z-index:13;border:1px solid var(--line);border-radius:18px;background:rgba(14,20,34,.97);backdrop-filter:blur(18px);padding:14px;overflow:auto}.drawer.open{display:block}.tag{display:inline-block;padding:3px 6px;border-radius:999px;background:#1b2639;color:#b6c1d5;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}.drawer h2{font-size:22px;letter-spacing:-.04em;margin:6px 0 8px}.drawer p{font-size:13px;line-height:1.45;color:#c7d1e2}.drawer .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.drawer a{color:var(--cyan);font-size:12px}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;z-index:30;background:#151d2d;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:11px;max-width:calc(100% - 24px);text-align:center}.toast.show{display:block}.status{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:8;background:rgba(14,20,34,.82);border:1px solid rgba(255,255,255,.06);border-radius:999px;color:var(--muted);font-size:10px;padding:7px 9px;pointer-events:none}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 9px rgba(142,225,169,.5)}
@media(min-width:820px){.chrome{grid-template-columns:auto minmax(420px,1fr);grid-template-areas:"title modes" "seed actions";column-gap:12px}.titleRow{grid-area:title}.modeRow{grid-area:modes;justify-content:flex-end}.seedRow{grid-area:seed}.actionRow{grid-area:actions;justify-content:flex-end}.insights{display:flex;flex-direction:column}.insights .close{display:none}}
@media(max-width:819px){.titleRow .btn{padding:7px 8px}.modeRow{overflow-x:auto;scrollbar-width:none}.modeRow::-webkit-scrollbar{display:none}.mode{flex:0 0 auto}.actionRow{margin-right:-4px}.status{display:none}.node text{font-size:10px}.insights{left:12px;right:12px;width:auto;top:12px;max-height:min(60vh,430px)}.drawer{right:12px;width:auto;max-height:min(70vh,520px)}.emptyInner{padding-bottom:88px}}
</style>
</head>
<body>
<div class="app">
  <header class="chrome">
    <div class="titleRow">
      <div class="title"><div class="eyebrow">living knowledge graph</div><h1>Curiosity Engine</h1></div>
      <button class="btn" id="insightsBtn">Insights</button>
      <button class="btn" id="exportBtn">Export</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>
    <div class="modeRow">
      <button class="mode" data-mode="general">General</button>
      <button class="mode" data-mode="research">Research</button>
      <button class="mode active" data-mode="math">Math / Pattern</button>
    </div>
    <div class="seedRow">
      <input id="seedInput" placeholder="an idea, paper topic, equation, pattern…">
      <button class="primary" id="growBtn">Grow</button>
    </div>
    <div class="actionRow">
      <button class="action" id="exploreBtn">Explore selected</button>
      <button class="action" id="wanderBtn">Auto-Wander: off</button>
      <button class="action" id="gapBtn">Find gaps</button>
      <button class="action" id="fitBtn">Fit graph</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <div class="graph" id="graph"></div>
    <div class="empty" id="empty"><div class="emptyInner"><b>Give it one strange thing.</b>It will gather nearby ideas, wander outward, and look for bridges worth testing.</div></div>

    <aside class="insights" id="insights">
      <div class="insightsHead"><strong>What the graph is thinking</strong><button class="close" id="closeInsights">×</button></div>
      <div class="tabs"><button class="tab active" data-pane="queuePane">Queue</button><button class="tab" data-pane="logPane">Log</button><button class="tab" data-pane="bridgePane">Bridges</button></div>
      <div class="insightsBody">
        <div class="pane active" id="queuePane"></div>
        <div class="pane" id="logPane"></div>
        <div class="pane" id="bridgePane"></div>
      </div>
    </aside>

    <section class="drawer" id="drawer">
      <button class="close" id="closeDrawer">×</button>
      <span class="tag" id="dType"></span>
      <h2 id="dTitle"></h2>
      <p id="dDesc"></p>
      <div class="muted" id="dWhy" style="font-size:12px"></div>
      <div class="row"><button class="btn" id="dExplore">Explore from here</button><button class="btn" id="dTest" style="display:none">Test bridge</button></div>
      <div style="margin-top:11px"><a id="dSource" target="_blank" rel="noopener" style="display:none">Open source ↗</a></div>
    </section>

    <div class="toast" id="toast"></div>
    <div class="status"><span class="dot"></span><span id="statusText">Ready</span></div>
  </main>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORE='curiosity-engine-v3';
const STOP=new Set('this that with from into about which where when then than were been have has had does your their there these those using used also such between through while after before every around many much more most less some any over under they them themselves because could would should'.split(' '));
const colors={seed:'#78e5dd',wiki:'#8fc6ff',paper:'#b59cff',author:'#f29bc3',topic:'#dbc98b',pattern:'#8ee1a9',hypothesis:'#f1c46e'};
let mode='math',selected=null,wanderTimer=null,isBusy=false,nodes=[],links=[],bridgeCandidates=[],STATELOG=[];
let sim,svg,g,linkSel,nodeSel,zoom;
function uid(prefix='n'){return prefix+'_'+Math.random().toString(36).slice(2,9)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function words(s=''){return new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)))}
function jaccard(a,b){let A=words(a),B=words(b),i=0;A.forEach(x=>{if(B.has(x))i++});return i/Math.max(1,new Set([...A,...B]).size)}
function nodeById(id){return nodes.find(n=>n.id===id)}
function degree(id){return links.filter(l=>(l.source.id||l.source)===id||(l.target.id||l.target)===id).length}
function addNode(n){let key=(n.canonical||n.title||'').toLowerCase(),existing=nodes.find(x=>(x.canonical||x.title||'').toLowerCase()===key&&x.type===n.type);if(existing){Object.assign(existing,n);return existing}let x={id:uid(),confidence:.7,created:Date.now(),...n};nodes.push(x);return x}
function addLink(a,b,kind='related',strength=.6,hyp=false){if(!a||!b||a.id===b.id)return;if(links.some(l=>{let s=l.source.id||l.source,t=l.target.id||l.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)}))return;links.push({source:a.id,target:b.id,kind,strength,hyp})}
function setStatus(s){$('#statusText').textContent=s}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function log(msg){STATELOG.unshift({t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),msg});STATELOG=STATELOG.slice(0,50);renderLog();save()}
function save(){try{localStorage.setItem(STORE,JSON.stringify({mode,nodes:nodes.map(n=>({...n,x:undefined,y:undefined,vx:undefined,vy:undefined,fx:undefined,fy:undefined})),links:links.map(l=>({...l,source:l.source.id||l.source,target:l.target.id||l.target})),bridges:bridgeCandidates,log:STATELOG}))}catch(e){}}
function restore(){try{let s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;mode=s.mode||'math';nodes=s.nodes||[];links=s.links||[];bridgeCandidates=s.bridges||[];STATELOG=s.log||[]}catch(e){}}
function updateModeButtons(){$$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
async function fetchJSON(url,label='Source',timeout=9000){let c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{let r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error(label+' returned '+r.status);return await r.json()}catch(e){if(e.name==='AbortError')throw Error(label+' timed out');throw e}finally{clearTimeout(timer)}}
function initGraph(){if(!window.d3){toast('Graph library did not load');return}let root=d3.select('#graph'),w=$('#workspace').clientWidth,h=$('#workspace').clientHeight;svg=root.append('svg');g=svg.append('g');zoom=d3.zoom().scaleExtent([.2,4]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);g.append('g').attr('class','links');g.append('g').attr('class','nodes');sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>90+(1-d.strength)*80).strength(d=>.15+d.strength*.45)).force('charge',d3.forceManyBody().strength(-240)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide().radius(d=>d.type==='seed'?34:26));updateGraph();window.addEventListener('resize',()=>{let w=$('#workspace').clientWidth,h=$('#workspace').clientHeight;sim.force('center',d3.forceCenter(w/2,h/2)).alpha(.3).restart()})}
function updateGraph(){if(!sim||!g)return;let ls=g.select('.links').selectAll('line').data(links,d=>`${d.source.id||d.source}-${d.target.id||d.target}`);ls.exit().remove();linkSel=ls.enter().append('line').attr('class',d=>'link'+(d.hyp?' hyp':'')).attr('stroke-width',d=>1+d.strength*2).merge(ls);let ns=g.select('.nodes').selectAll('g').data(nodes,d=>d.id);ns.exit().remove();let en=ns.enter().append('g').attr('class',d=>'node '+(d.type==='seed'?'seed':'')).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));en.append('circle').attr('r',d=>d.type==='seed'?18:(d.type==='hypothesis'?13:10)).attr('fill',d=>colors[d.type]||'#aab5c7');en.append('text').attr('x',14).attr('y',4).text(d=>d.title.length>34?d.title.slice(0,31)+'…':d.title);en.on('click',(e,d)=>{selected=d;showDrawer(d)});nodeSel=en.merge(ns);sim.nodes(nodes).on('tick',()=>{linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`)});sim.force('link').links(links);sim.alpha(.65).restart();$('#empty').style.display=nodes.length?'none':'grid';renderQueue();save()}
function fitGraph(){if(!nodes.length||!g||!svg)return;let b=g.node().getBBox(),w=$('#workspace').clientWidth,h=$('#workspace').clientHeight;if(!b.width&&!b.height)return;let scale=Math.min(1.35,.86/Math.max(Math.max(1,b.width)/w,Math.max(1,b.height)/h)),tx=w/2-scale*(b.x+b.width/2),ty=h/2-scale*(b.y+b.height/2);svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale))}
function showDrawer(n){$('#drawer').classList.add('open');$('#dType').textContent=n.type+(n.hypothesis?' · hypothesis':'');$('#dTitle').textContent=n.title;$('#dDesc').textContent=n.description||'No description yet.';$('#dWhy').textContent=(n.why?'Why connected: '+n.why+' · ':'')+'Confidence '+Math.round((n.confidence||.5)*100)+'%';$('#dSource').style.display=n.url?'inline':'none';if(n.url)$('#dSource').href=n.url;$('#dTest').style.display=n.type==='hypothesis'?'inline-block':'none'}
function scoreQueue(n){let age=Math.min(1,Math.max(0,(Date.now()-(n.created||Date.now()))/60000)),recent=n.lastExpanded&&Date.now()-n.lastExpanded<45000?.28:0;return (1/(1+degree(n.id)))*.6+(n.confidence||.5)*.25+age*.15-recent}
function renderQueue(){let q=nodes.filter(n=>!['seed','hypothesis'].includes(n.type)).sort((a,b)=>scoreQueue(b)-scoreQueue(a)).slice(0,7);$('#queuePane').innerHTML=q.length?q.map(n=>`<div class="item"><strong>${esc(n.title)}</strong><span class="muted">${esc(n.type)} · ${degree(n.id)} connections · curiosity ${Math.round(scoreQueue(n)*100)}</span></div>`).join(''):'<div class="item muted">Grow a seed and the queue will fill itself.</div>'}
function renderLog(){$('#logPane').innerHTML=STATELOG.length?STATELOG.map(x=>`<div class="item"><span class="muted">${esc(x.t)}</span> ${esc(x.msg)}</div>`).join(''):'<div class="item muted">The graph has not wandered yet.</div>'}
function renderBridges(){$('#bridgePane').innerHTML=bridgeCandidates.length?bridgeCandidates.slice(0,8).map(x=>`<div class="item"><strong>${esc(x.aTitle)} ↔ ${esc(x.bTitle)}</strong><span class="muted">${esc(x.reason)} · score ${Math.round(x.score*100)}</span><br><button class="btn testBridge" data-id="${x.id}" style="margin-top:6px">Test</button></div>`).join(''):'<div class="item muted">Run Find gaps after the graph has several branches.</div>';$$('.testBridge').forEach(b=>b.onclick=()=>testBridge(bridgeCandidates.find(x=>x.id===b.dataset.id)))}
async function wikiSearch(q,limit=7){let u='https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit='+limit+'&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=2',j=await fetchJSON(u,'Wikipedia');return Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0))}
async function crossrefSearch(q,limit=7){let u='https://api.crossref.org/works?rows='+limit+'&query.bibliographic='+encodeURIComponent(q),j=await fetchJSON(u,'Crossref');return j.message?.items||[]}
function cleanWiki(s=''){return s.replace(/\s+/g,' ').trim().slice(0,340)}
function crossrefYear(w){let p=w['published-print']?.['date-parts']||w['published-online']?.['date-parts']||w.created?.['date-parts'];return p?.[0]?.[0]||'Year unknown'}
async function growSeed(seed){if(!seed.trim()||isBusy)return;isBusy=true;nodes=[];links=[];bridgeCandidates=[];STATELOG=[];selected=null;$('#drawer').classList.remove('open');setStatus('Growing…');let root=addNode({type:'seed',title:seed.trim(),canonical:'seed:'+seed.trim(),description:'Starting point for this exploration.',confidence:1,why:'user seed'});updateGraph();try{if(mode==='math')await growMath(root,seed);else if(mode==='research')await growResearch(root,seed);else await growGeneral(root,seed);log(`Started with “${seed.trim()}” in ${mode} mode.`);updateGraph();setTimeout(fitGraph,350)}catch(e){toast(e.message);log('A public source failed, so this branch stopped safely.')}finally{isBusy=false;setStatus('Ready')}}
async function growGeneral(parent,q){let arr=await wikiSearch(q,8);arr.forEach(p=>{let n=addNode({type:'wiki',title:p.title,canonical:'wiki:'+p.pageid,description:cleanWiki(p.extract||''),url:p.fullurl,confidence:.82,why:`Wikipedia search relationship to “${q}”`});addLink(parent,n,'retrieved',.75)});log(`Wikipedia returned ${arr.length} nearby concepts for “${q}”.`)}
async function growResearch(parent,q){let arr=await crossrefSearch(q,8);arr.forEach(w=>{let title=w.title?.[0]||'Untitled work',topic=w.subject?.[0]||'research',names=(w.author||[]).slice(0,3).map(a=>[a.given,a.family].filter(Boolean).join(' ')).filter(Boolean);let n=addNode({type:'paper',title,canonical:'doi:'+(w.DOI||title.toLowerCase()),description:`${crossrefYear(w)} · ${w['is-referenced-by-count']||0} citations${names.length?' · '+names.join(', '):''}`,url:w.URL||(w.DOI?'https://doi.org/'+w.DOI:null),confidence:.86,why:`Crossref search relationship to “${q}”`});addLink(parent,n,'retrieved',.8);if(w.subject?.[0]){let t=addNode({type:'topic',title:topic,canonical:'topic:'+topic.toLowerCase(),description:'Subject tag from Crossref metadata.',confidence:.82,why:`subject associated with ${title}`});addLink(n,t,'topic',.78)}(w.author||[]).slice(0,2).forEach(a=>{let nm=[a.given,a.family].filter(Boolean).join(' ').trim();if(!nm)return;let au=addNode({type:'author',title:nm,canonical:'author:'+nm.toLowerCase(),description:'Author associated with this work in Crossref metadata.',confidence:.82,why:`author of ${title}`});addLink(n,au,'author',.8)})});log(`Crossref returned ${arr.length} papers for “${q}”.`)}
function mathFeatures(expr){let f=[],low=expr.toLowerCase();if(/sin|cos/.test(low))f.push(['oscillation / periodicity','trigonometric periodic structure']);if(/e\s*\^|exp/.test(low))f.push(['exponential structure','exponential term']);if(/i\s*\(|e\^\{?i|complex/.test(low))f.push(['complex-plane rotation','imaginary exponential suggests rotation in the complex plane']);if(/t\s*\^\s*[23456789]/.test(low)||/t[²³⁴⁵⁶⁷⁸⁹]/.test(low))f.push(['polynomial growth','higher-order polynomial term']);if(/sin\s*n|sin\s*\(?n/.test(low))f.push(['phase perturbation','sine term changes phase across index n']);if(/2\s*π|2\s*pi|2\\pi/.test(low))f.push(['rotational symmetry','full-turn angular factor']);if(/\/\s*9|\/9/.test(low))f.push(['ninefold spacing','division by 9 suggests nine angular sectors']);if(/3\s*\*?\s*t\s*-\s*t\s*\^?2|3t-t\^2/.test(low.replace(/\s/g,'')))f.push(['parabolic vertical motion','quadratic vertical component']);if(!f.length)f.push(['mathematical structure','general symbolic pattern']);return f}
async function growMath(root,expr){let feats=mathFeatures(expr);for(let [title,why] of feats){let n=addNode({type:'pattern',title,canonical:'pattern:'+title,description:why,confidence:.72,why:'structural heuristic from the equation'});addLink(root,n,'derived',.7)}log(`Extracted ${feats.length} structural features.`);for(let [title] of feats.slice(0,3)){try{let arr=await wikiSearch(title,3);arr.forEach(p=>{let parent=nodes.find(n=>n.canonical==='pattern:'+title),w=addNode({type:'wiki',title:p.title,canonical:'wiki:'+p.pageid,description:cleanWiki(p.extract||''),url:p.fullurl,confidence:.78,why:`public concept related to ${title}`});addLink(parent,w,'retrieved',.65)})}catch(e){}}log('The strongest pattern features reached outward into public concepts.')}
async function expandNode(n){if(!n||isBusy||n.type==='hypothesis')return;isBusy=true;n.lastExpanded=Date.now();setStatus('Exploring…');try{if(['paper','author','topic'].includes(n.type)||mode==='research')await growResearch(n,n.title);else await growGeneral(n,n.title);updateGraph();log(`Expanded “${n.title}”.`)}catch(e){toast(e.message);log(`Could not expand “${n.title}”.`)}finally{isBusy=false;setStatus('Ready')}}
function findGaps(){let eligible=nodes.filter(n=>!['seed','hypothesis'].includes(n.type)),c=[];for(let i=0;i<eligible.length;i++)for(let j=i+1;j<eligible.length;j++){let a=eligible[i],b=eligible[j],connected=links.some(l=>{let s=l.source.id||l.source,t=l.target.id||l.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)});if(connected)continue;let similarity=jaccard(a.title+' '+(a.description||''),b.title+' '+(b.description||'')),diversity=a.type!==b.type?.12:0,score=Math.min(.95,similarity*1.7+diversity);if(score>.18)c.push({id:uid('b'),a:a.id,b:b.id,aTitle:a.title,bTitle:b.title,score,reason:similarity>.12?'shared language across otherwise separate nodes':'cross-type structural gap'})}bridgeCandidates=c.sort((a,b)=>b.score-a.score).slice(0,12);renderBridges();if(bridgeCandidates.length){log(`Gap Finder surfaced ${bridgeCandidates.length} unverified bridge candidates.`);openInsights('bridgePane')}else toast('No strong gap candidates yet');save()}
async function testBridge(c){if(!c||isBusy)return;let a=nodeById(c.a),b=nodeById(c.b);if(!a||!b)return;isBusy=true;setStatus('Testing bridge…');try{let evidence=[];try{evidence=await wikiSearch(`"${a.title}" "${b.title}"`,4)}catch(e){}if(!evidence.length){try{evidence=(await crossrefSearch(a.title+' '+b.title,4)).map(x=>({title:x.title?.[0]||'Untitled work',fullurl:x.URL||(x.DOI?'https://doi.org/'+x.DOI:null)}))}catch(e){}}let strength=evidence.length?Math.min(.92,.34+evidence.length*.13):.28,h=addNode({type:'hypothesis',title:`${a.title} ↔ ${b.title}`,canonical:'hyp:'+a.id+':'+b.id,description:evidence.length?`Search found ${evidence.length} pieces of potentially relevant public evidence. This remains a hypothesis.`:'The combined search did not find convincing evidence. The bridge remains uncertain.',confidence:strength,why:'Gap Finder candidate tested with combined public search',hypothesis:true,url:evidence[0]?.fullurl||null});addLink(a,h,'hypothesis',strength,true);addLink(h,b,'hypothesis',strength,true);updateGraph();selected=h;showDrawer(h);log(evidence.length?`Bridge test found ${evidence.length} potentially relevant results.`:'Bridge test found little support.')}finally{isBusy=false;setStatus('Ready')}}
function toggleWander(){if(wanderTimer){clearInterval(wanderTimer);wanderTimer=null;$('#wanderBtn').textContent='Auto-Wander: off';$('#wanderBtn').classList.remove('on');setStatus('Ready');return}$('#wanderBtn').textContent='Auto-Wander: on';$('#wanderBtn').classList.add('on');setStatus('Wandering…');wanderTimer=setInterval(async()=>{if(isBusy||!nodes.length)return;let q=nodes.filter(n=>!['seed','hypothesis'].includes(n.type)).sort((a,b)=>scoreQueue(b)-scoreQueue(a));if(q[0])await expandNode(q[0]);if(nodes.length>45){toggleWander();toast('Paused at 45 nodes to stay readable')}},9000)}
function openInsights(pane='queuePane'){$('#insights').classList.add('open');$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.pane===pane));$$('.pane').forEach(p=>p.classList.toggle('active',p.id===pane))}
$('#growBtn').onclick=()=>growSeed($('#seedInput').value);$('#seedInput').addEventListener('keydown',e=>{if(e.key==='Enter')growSeed(e.target.value)});$$('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;updateModeButtons();save()});$('#exploreBtn').onclick=()=>selected?expandNode(selected):toast('Tap a node first');$('#wanderBtn').onclick=toggleWander;$('#gapBtn').onclick=findGaps;$('#fitBtn').onclick=fitGraph;$('#insightsBtn').onclick=()=>openInsights('queuePane');$('#closeInsights').onclick=()=>$('#insights').classList.remove('open');$$('.tab').forEach(t=>t.onclick=()=>openInsights(t.dataset.pane));$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');$('#dExplore').onclick=()=>selected&&expandNode(selected);$('#dTest').onclick=()=>{if(!selected||selected.type!=='hypothesis')return;let ids=links.filter(l=>(l.source.id||l.source)===selected.id||(l.target.id||l.target)===selected.id).map(l=>(l.source.id||l.source)===selected.id?(l.target.id||l.target):(l.source.id||l.source));if(ids.length>=2)testBridge({a:ids[0],b:ids[1]})};$('#resetBtn').onclick=()=>{if(wanderTimer)toggleWander();nodes=[];links=[];bridgeCandidates=[];STATELOG=[];selected=null;localStorage.removeItem(STORE);$('#drawer').classList.remove('open');renderLog();renderBridges();updateGraph();setStatus('Ready')};$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({mode,nodes,links:links.map(l=>({...l,source:l.source.id||l.source,target:l.target.id||l.target})),bridges:bridgeCandidates,log:STATELOG},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='curiosity-graph.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),400)};
restore();updateModeButtons();renderLog();renderBridges();initGraph();if(nodes.length)setTimeout(fitGraph,400);else $('#seedInput').value='C_n(t)=((1+t^4)e^{i(2πn/9+.1 sin n)}, 3t-t^2)';
</script>
