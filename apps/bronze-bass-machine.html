<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bronze Bass Machine</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#eee;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{margin:0;font-size:clamp(28px,8vw,54px);letter-spacing:.04em}.sub{color:#aaa;margin:6px 0 18px}.card{background:#13151a;border:1px solid #343741;border-radius:20px;padding:16px;margin:12px 0}.strike{width:min(70vw,330px);aspect-ratio:1;border-radius:50%;margin:18px auto;display:grid;place-items:center;user-select:none;touch-action:manipulation;border:1px solid #8b6a3d;background:radial-gradient(circle at 38% 30%,#b8864933 0 15%,transparent 35%),radial-gradient(circle,#7c572b,#302113 52%,#111 72%);box-shadow:inset 0 0 60px #e6b66b1f,0 0 80px #b47c3330;font-size:28px;font-weight:800;letter-spacing:.14em}.strike.hit{animation:hit .45s}@keyframes hit{0%{transform:scale(.97);filter:brightness(1.7)}100%{transform:scale(1)}}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button,select{background:#17191f;color:#eee;border:1px solid #454954;border-radius:12px;padding:11px 13px;font:inherit}button{cursor:pointer}.status{text-align:center;color:#caa66f;font-size:13px;min-height:20px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ctl{background:#0d0f13;border:1px solid #2a2d34;border-radius:12px;padding:10px}.ctl label{display:flex;justify-content:space-between;font-size:12px;color:#bbb}.ctl output{color:#e1b76f}input{width:100%;accent-color:#b9894a}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}.key{padding:10px 2px;text-align:center;background:#101217;border:1px solid #30333b;border-radius:10px;touch-action:manipulation}.key b{display:block}@media(max-width:520px){.controls{grid-template-columns:1fr 1fr}.keys{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><h1>BRONZE BASS MACHINE</h1><div class="sub">Huge struck metal → inharmonic shimmer → deep consonant hum.</div><section class="card"><div id="strike" class="strike">STRIKE</div><div id="status" class="status">Tap STRIKE to start audio</div><div class="row"><button id="dn">−</button><select id="note"></select><button id="up">+</button><button id="stop">STOP</button></div><div id="keys" class="keys"></div></section><section class="card"><div class="row"><button data-p="bronze">BRONZE CHOIR</button><button data-p="steel">STEEL TEMPLE</button><button data-p="ancient">ANCIENT</button></div><div id="controls" class="controls"></div></section></main><script>
(()=>{const AC=window.AudioContext||window.webkitAudioContext;let c,master,noise,voices=[];const S={metal:[0,1,.88],strike:[0,1,.72],weight:[0,1,.82],hum:[0,1,.63],bloom:[0,1,.62],grind:[0,1,.28],damp:[0,1,.24],size:[1,30,20]};const root=document.getElementById('controls');for(const[k,v]of Object.entries(S)){let d=document.createElement('div');d.className='ctl';d.innerHTML=`<label>${k.toUpperCase()}<output id="o${k}"></output></label><input id="${k}" type="range" min="${v[0]}" max="${v[1]}" step="${k==='size'?'.1':'.01'}" value="${v[2]}">`;root.appendChild(d);let i=d.querySelector('input'),o=d.querySelector('output');let f=()=>o.value=k==='size'?(+i.value).toFixed(1)+' m':Math.round(+i.value*100)+'%';f();i.oninput=()=>{v[2]=+i.value;f()}}
const N=[];for(let m=24;m<=47;m++){let a=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];N.push({n:a[m%12]+(Math.floor(m/12)-1),f:440*2**((m-69)/12)})}let sel=document.getElementById('note');N.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x.n;sel.appendChild(o)});sel.value=12;dn.onclick=()=>sel.value=Math.max(0,+sel.value-1);up.onclick=()=>sel.value=Math.min(N.length-1,+sel.value+1);const keys=document.getElementById('keys');N.slice(0,12).forEach((x,i)=>{let b=document.createElement('div');b.className='key';b.innerHTML=`<b>${x.n}</b>${x.f.toFixed(1)} Hz`;b.onpointerdown=e=>play(x.f,.75,e);keys.appendChild(b)});
function mkNoise(){noise=c.createBuffer(1,c.sampleRate*.35,c.sampleRate);let d=noise.getChannelData(0),b=0;for(let i=0;i<d.length;i++){b=(b+(Math.random()*2-1)*.03)/1.03;d[i]=b*4}}
async function init(){if(!c){c=new AC;master=c.createGain();master.gain.value=.75;let lim=c.createDynamicsCompressor();lim.threshold.value=-10;lim.knee.value=10;lim.ratio.value=12;lim.attack.value=.002;lim.release.value=.2;master.connect(lim);lim.connect(c.destination);mkNoise()}if(c.state!=='running')await c.resume();status.textContent=c.state==='running'?'Audio ready':'Tap again to unlock audio'}
function env(g,t,a,p,r){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+r)}
function osc(f,type='sine'){let o=c.createOscillator();o.type=type;o.frequency.value=f;return o}function pan(i){let p=c.createStereoPanner();p.pan.value=i<4?0:Math.sin(i*1.71)*.72;return p}
const R=[1,1.42,1.98,2.51,2.93,3.62,4.18,4.91,5.78,6.71,7.63,8.84,10.1,11.55,13.2,15.05,17.1,19.5,22.2,25.3,28.8,32.7,37.1,42.3,48.0,54.5,61.8,70.1,79.4,89.8,101.7,115.0,130,147,166,188];
async function play(f,vel=.75,e){e?.preventDefault();try{await init();const t=c.currentTime+.015,M=S.metal[2],W=S.weight[2],H=S.hum[2],B=S.bloom[2],D=S.damp[2],Z=(S.size[2]-1)/29,G=S.grind[2],K=S.strike[2];let bus=c.createGain(),metalBus=c.createGain(),humBus=c.createGain(),coreBus=c.createGain();metalBus.gain.value=.52+.20*M;humBus.gain.value=.25+.20*H;coreBus.gain.value=.44+.26*W;metalBus.connect(bus);humBus.connect(bus);coreBus.connect(bus);let sh=c.createWaveShaper(),n=1024,cv=new Float32Array(n);for(let i=0;i<n;i++){let x=i*2/n-1,a=2+G*12;cv[i]=(1+a)*x/(1+a*Math.abs(x))}sh.curve=cv;let hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=120;metalBus.connect(hp);hp.connect(sh);let gg=c.createGain();gg.gain.value=.12+.3*G;sh.connect(gg);gg.connect(bus);bus.connect(master);
let th=osc(f*.5),tg=c.createGain();th.connect(tg);tg.connect(coreBus);env(tg,t,.003,.24*vel,.16+.12*Z);th.start(t);th.stop(t+.6);let ns=c.createBufferSource();ns.buffer=noise;let nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=900+3400*K+2600*M;let ng=c.createGain();ns.connect(nf);nf.connect(ng);ng.connect(metalBus);env(ng,t,.001,.07+.08*K,.06+.08*M);ns.start(t);ns.stop(t+.25);let cs=c.createBufferSource();cs.buffer=noise;let cf=c.createBiquadFilter();cf.type='bandpass';cf.frequency.value=2200+5200*M;cf.Q.value=2+4*M;let cg=c.createGain();cs.connect(cf);cf.connect(cg);cg.connect(metalBus);env(cg,t,.001,.025+.055*M,.025+.11*M);cs.start(t);cs.stop(t+.25);
let core=osc(f),cG=c.createGain();core.connect(cG);cG.connect(coreBus);env(cG,t,.012,.22*vel*(.55+.45*W),6+10*Z+5*H);core.start(t);core.stop(t+24);let V=[core];R.forEach((r,i)=>{let F=f*r;if(F>14500)return;let h=i/(R.length-1),o=osc(F),g=c.createGain(),p=pan(i);o.connect(g);g.connect(p);p.connect(metalBus);let det=Math.sin(i*4.9)*(1+4*h)*M;o.detune.setValueAtTime(det,t);o.detune.linearRampToValueAtTime(det*.08,t+1.2+2*Z);let spec=Math.exp(-i*(.095-.036*M)),lift=1+h*M*1.8,amp=.11*vel*spec*lift*(.65+K*h);let decay=Math.max(.35,(2.2+9*Z)*(1-h*(.58-.35*M))*(1+h*M*1.2)*(1-.68*D));env(g,t,.002+.005*h,amp,decay);o.start(t);o.stop(t+decay+.5);V.push(o);if(i>5&&i%3===0){let q=osc(F*(1+.0011*M*(1+h))),qg=c.createGain(),qp=pan(i+7);q.connect(qg);qg.connect(qp);qp.connect(metalBus);env(qg,t,.003,amp*.13*M,decay*.85);q.start(t);q.stop(t+decay+.5);V.push(q)}});
[1,2,3,5].forEach((m,i)=>{let o=osc(f*m,i?'triangle':'sine'),g=c.createGain(),p=pan(i);o.connect(g);g.connect(p);p.connect(humBus);let delay=.35+i*.34,pk=(i? .055*B:.15)*vel*Math.pow(.75,i);g.gain.setValueAtTime(.0001,t);g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(Math.max(.0002,pk),t+delay+.55);g.gain.exponentialRampToValueAtTime(.0001,t+8+12*H+6*Z);o.start(t);o.stop(t+28);V.push(o)});voices.push(V);let b=document.getElementById('strike');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')}catch(x){status.textContent='Audio error: '+(x.message||x)}}
strike.onpointerdown=e=>play(N[+sel.value].f,.82,e);stop.onclick=()=>{if(!c)return;let t=c.currentTime;voices.flat().forEach(o=>{try{o.stop(t+.02)}catch{}});voices=[]};const P={bronze:{metal:.82,strike:.68,weight:.86,hum:.72,bloom:.72,grind:.25,damp:.20,size:20},steel:{metal:1,strike:.88,weight:.76,hum:.52,bloom:.55,grind:.32,damp:.08,size:24},ancient:{metal:.92,strike:.58,weight:.9,hum:.64,bloom:.46,grind:.22,damp:.14,size:30}};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let p=P[b.dataset.p];for(let[k,v]of Object.entries(p)){S[k][2]=v;let i=document.getElementById(k);i.value=v;i.dispatchEvent(new Event('input'))}});})();
</script></body></html>
