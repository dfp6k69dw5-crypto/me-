<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080D1A">
<title>RESONATOR NO. 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080D1A}
#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080D1A}
</style>
</head>
<body>
<iframe id="host" src="resonator.html?v=20260814e" allow="microphone; autoplay"></iframe>
<script>
(()=>{
 const frame=document.getElementById('host'); let patched=false;
 function patch(){
  if(patched)return; let d,w;
  try{w=frame.contentWindow;d=frame.contentDocument||w.document}catch(e){return}
  if(!d||!d.head||!d.body||!d.getElementById('view'))return; patched=true;
  const css=d.createElement('style'); css.textContent=`
  html,body{height:100dvh!important;max-height:100dvh!important;overflow:hidden!important;overscroll-behavior:none!important}
  #app{height:100dvh!important;padding:0!important}
  #readout,#brand,#level{display:none!important}
  #stage{flex:1 1 auto!important;min-height:0!important}
  #view{touch-action:none!important}
  #tabs,#panel,#deck{display:none!important}
  #tools{left:12px!important;right:auto!important;bottom:14px!important;display:flex!important;gap:7px!important;width:auto!important;z-index:20!important}
  #tools [data-tool="orbit"],#tools [data-tool="move"],#tools [data-tool="link"],#tools [data-tool="pin"],#home,#undo,#redo{display:none!important}
  #tools .tool{min-width:70px!important;width:auto!important;padding:10px 13px!important;min-height:42px!important;border-radius:22px!important;font-size:10px!important;background:rgba(10,17,32,.76)!important}
  #r2dock{position:fixed;right:12px;top:86px;z-index:10000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #r2dock button{border:1px solid #53617c;background:rgba(8,13,26,.80);color:#e7e5e1;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;height:48px;padding:0 16px;border-radius:25px}
  #r2dock button.on{border-color:#4ED8EA;background:#132538}
  body.r2-advanced #stage{flex:0 0 43vh!important;min-height:250px!important}
  body.r2-advanced #tabs{display:flex!important;flex:0 0 46px!important}
  body.r2-advanced #panel{display:block!important;flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;padding:12px 14px 90px!important;-webkit-overflow-scrolling:touch!important}
  body.r2-keys #deck{display:block!important;position:fixed!important;left:8px!important;right:8px!important;bottom:92px!important;z-index:10001!important;max-height:42vh!important;overflow:auto!important;background:#0D1526!important;border:1px solid #25314F!important;border-radius:15px!important;padding:0 10px 10px!important}
  body.r2-keys #deck.shut #pads,body.r2-keys #deck.shut #msg{display:grid!important}
  body.r2-keys #pads{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
  `; d.head.appendChild(css);
  const dock=d.createElement('div');dock.id='r2dock';dock.innerHTML='<button id="r2adv">ADVANCED</button><button id="r2keys">KEYS</button><button id="r2reset">RESET</button>';d.body.appendChild(dock);
  const adv=d.getElementById('r2adv'),keys=d.getElementById('r2keys'),reset=d.getElementById('r2reset');
  adv.onclick=()=>{const on=d.body.classList.toggle('r2-advanced');if(on)d.body.classList.remove('r2-keys');adv.textContent=on?'PLAY':'ADVANCED';adv.classList.toggle('on',on);keys.classList.remove('on');setTimeout(()=>w.dispatchEvent(new Event('resize')),40)};
  keys.onclick=()=>{const on=d.body.classList.toggle('r2-keys');keys.classList.toggle('on',on);const deck=d.getElementById('deck');if(deck)deck.classList.remove('shut')};
  const js=d.createElement('script');js.textContent=`(function(){
   const cv=document.getElementById('view');if(!cv||window.__r2)return;window.__r2=true;
   state.tool='orbit';state.spin=false;state.r2Zoom=1;state.r2PanX=0;state.r2PanY=0;

   /* Restore the original steel gas-vessel / propane-tank body. */
   try{
    if(!SHAPES.Tank){
     SHAPES.Tank={min:5,max:9,def:7,note:'A large empty steel gas vessel: hemispherical caps on a cylindrical barrel. Its lowest shell modes cluster into slowly beating pairs, and the steel rings for a long time.',make(C){
      const P=[],F=[],S=[],R=0.24,H=0.26,A=4,K=2,rings=[];
      const ring=(x,r)=>{const ids=[];for(let j=0;j<C;j++){const th=2*Math.PI*j/C;ids.push(P.length);P.push([x,r*Math.cos(th),r*Math.sin(th)]);F.push(0)}rings.push(ids);return ids};
      const poleL=P.length;P.push([-(H+R),0,0]);F.push(0);
      for(let k=1;k<=K;k++){const phi=(k/(K+1))*(Math.PI/2);ring(-H-R*Math.cos(phi),R*Math.sin(phi))}
      for(let a=0;a<A;a++)ring(-H+2*H*a/(A-1),R);
      for(let k=K;k>=1;k--){const phi=(k/(K+1))*(Math.PI/2);ring(H+R*Math.cos(phi),R*Math.sin(phi))}
      const poleR=P.length;P.push([H+R,0,0]);F.push(0);
      const link=(a,b)=>{if(a!==b)S.push([a,b])};
      for(const ids of rings)for(let j=0;j<C;j++)link(ids[j],ids[(j+1)%C]);
      for(let r=0;r<rings.length-1;r++){const a=rings[r],b=rings[r+1];for(let j=0;j<C;j++){link(a[j],b[j]);link(a[j],b[(j+1)%C])}}
      for(let j=0;j<C;j++){link(poleL,rings[0][j]);link(poleR,rings[rings.length-1][j])}
      const mid=rings[Math.floor(rings.length/2)];return{P,F,S,axis:1,mic:mid[0],hit:rings[K][Math.floor(C/2)],needSub:0.0004}
     }};
     const shapesEl=document.getElementById('shapes');
     if(shapesEl&&!Array.from(shapesEl.children).some(b=>b.textContent==='Tank')){
      const b=document.createElement('button');b.className='chip';b.textContent='Tank';b.setAttribute('aria-pressed','false');
      b.onclick=()=>{state.shape='Tank';const S=SHAPES.Tank;state.n=S.def;val.size=(S.def-S.min)/(S.max-S.min);syncKnob('size');Array.from(shapesEl.children).forEach(c=>c.setAttribute('aria-pressed',c.textContent==='Tank'));buildShape(true)};
      shapesEl.appendChild(b);
     }
    }
   }catch(e){console.warn('Tank restore failed',e)}

   const oldProject=project;
   project=function(x,y,z){const q=oldProject(x,y,z);const cx=W/2,cy=H*.46;return[cx+(q[0]-cx)*state.r2Zoom+state.r2PanX,cy+(q[1]-cy)*state.r2Zoom+state.r2PanY,q[2]]};
   function orbit(){state.tool='orbit';state.sel=-1;document.querySelectorAll('#tools .tool').forEach(b=>b.setAttribute('aria-pressed','false'))}orbit();
   cv.addEventListener('pointerup',()=>{if(state.tool==='strike'||state.tool==='mic')setTimeout(orbit,0)});
   let multi=null;
   function m(t){const a=t[0],b=t[1],dx=b.clientX-a.clientX,dy=b.clientY-a.clientY;return{d:Math.hypot(dx,dy),a:Math.atan2(dy,dx),x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
   cv.addEventListener('touchstart',e=>{if(e.touches.length===2){state.spin=false;multi=m(e.touches);e.preventDefault();e.stopImmediatePropagation()}},{capture:true,passive:false});
   cv.addEventListener('touchmove',e=>{if(e.touches.length!==2||!multi)return;const q=m(e.touches);state.r2Zoom=Math.max(.3,Math.min(4,state.r2Zoom*(q.d/Math.max(5,multi.d))));state.r2PanX+=q.x-multi.x;state.r2PanY+=q.y-multi.y;let da=q.a-multi.a;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;camRotate(2,da);multi=q;e.preventDefault();e.stopImmediatePropagation()},{capture:true,passive:false});
   cv.addEventListener('touchend',e=>{if(e.touches.length<2)multi=null},{capture:true,passive:true});
   window.r2Reset=()=>{camReset();camRotate(1,.5);camRotate(0,-.32);state.r2Zoom=1;state.r2PanX=0;state.r2PanY=0;state.spin=false;orbit()};
  })();`;d.body.appendChild(js);
  reset.onclick=()=>{try{w.r2Reset&&w.r2Reset()}catch(e){}};
  const deck=d.getElementById('deck');if(deck)deck.classList.add('shut');
  setTimeout(()=>w.dispatchEvent(new Event('resize')),60);
 }
 frame.addEventListener('load',()=>{patched=false;setTimeout(patch,120);setTimeout(patch,600)});const t=setInterval(patch,350);setTimeout(()=>clearInterval(t),12000);
})();
</script>
</body></html>
