<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Langlands Fluid — View First</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#000;overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="langlands-fluid-unified.html?v=72" allow="fullscreen"></iframe><script>(()=>{const f=document.getElementById('app');function install(){let d;try{d=f.contentDocument}catch(e){return}if(!d||!d.body||!d.querySelector('.panel'))return;const s=d.createElement('style');s.textContent=`body.desktopAmbient .panel{width:min(360px,calc(100vw - 36px))!important;background:rgba(8,8,8,.58)!important;backdrop-filter:blur(8px)!important;box-shadow:0 10px 30px rgba(0,0,0,.22)!important}body.phoneProfile .panel{max-height:min(46vh,470px)!important}body.adjusting .panel{background:transparent!important;backdrop-filter:none!important;box-shadow:none!important;border-color:transparent!important}body.adjusting .panel .ctl,body.adjusting .panel .ambientCtl,body.adjusting .panel button,body.adjusting .panel .title,body.adjusting .panel .note,body.adjusting .panel .status,body.adjusting .panel .hint,body.adjusting .panel .math,body.adjusting .panel .ambientState{opacity:.055!important;transition:opacity .12s ease}body.adjusting .panel .control-active{opacity:1!important;background:rgba(10,10,10,.72)!important;border-color:#555!important;box-shadow:0 6px 24px rgba(0,0,0,.30)!important}body.adjusting .panel .control-active *{opacity:1!important}body.adjusting .panel .sec{background:transparent!important;border-color:transparent!important}body.adjusting.phoneProfile .panel{max-height:118px!important;overflow:hidden!important;background:transparent!important}`;d.head.appendChild(s);const p=d.querySelector('.panel');let timer=null;function begin(el){clearTimeout(timer);d.body.classList.add('adjusting');p.querySelectorAll('.control-active').forEach(n=>n.classList.remove('control-active'));const c=el.closest('.ctl,.ambientCtl');if(c)c.classList.add('control-active')}function end(){clearTimeout(timer);timer=setTimeout(()=>{d.body.classList.remove('adjusting');p.querySelectorAll('.control-active').forEach(n=>n.classList.remove('control-active'))},180)}p.addEventListener('pointerdown',e=>{if(e.target.matches&&e.target.matches('input[type=range]'))begin(e.target)},true);p.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('input[type=range]'))begin(e.target)},true);p.addEventListener('pointerup',e=>{if(e.target.matches&&e.target.matches('input[type=range]'))end()},true);p.addEventListener('pointercancel',end,true);p.addEventListener('touchend',end,{capture:true,passive:true});}f.addEventListener('load',()=>{setTimeout(install,500);setTimeout(install,1800)});})();</script></body></html>
