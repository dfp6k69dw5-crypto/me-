name: Quarantine The Room

on:
  push:
    branches: [main]
    paths:
      - 'society/quarantine-kick.txt'

permissions:
  contents: read

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hold Room world lock
        run: |
          echo "Room quarantine lock acquired"
          sleep 120
          echo "Room quarantine lock released"
