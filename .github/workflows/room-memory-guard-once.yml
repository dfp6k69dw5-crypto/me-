name: Room memory guard once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_room_memory_guard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Apply memory guard
        run: python3 tools/apply_room_memory_guard.py
      - name: Verify memory guard
        shell: bash
        run: |
          python3 -m py_compile scripts/room_engine_v5_core.py scripts/room_engine_v5.py scripts/room_private_commit.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_engine_v5_core as c
          assert not c._memory_worthy_text('.')
          assert not c._memory_worthy_text("you're")
          assert not c._memory_worthy_text('food,')
          assert not c._memory_worthy_text("that's, what I do.")
          assert c._memory_worthy_text("I'm sorry.", 'repair')
          assert c._memory_worthy_text('The movie ending felt unexpectedly bleak.')
          print('ROOM_MEMORY_GUARD_OK')
          PY
      - name: Commit memory guard
        shell: bash
        run: |
          git config user.name 'room-memory-guard'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_engine_v5_core.py
          git commit -m 'Keep low-information speech out of Room memory' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
