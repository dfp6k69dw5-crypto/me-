name: The Room Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: the-room-pulse-chain
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Keep The Room running at GitHub's fastest sustainable cadence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Keep one Room beat in flight at a time. As soon as it finishes,
          # dispatch the next one. This avoids flooding the concurrency queue
          # with one-minute dispatches that GitHub then cancels/replaces.
          stop_at=$((SECONDS + 19800))
          while [ "$SECONDS" -lt "$stop_at" ]; do
            active="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow sarah-society.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting")] | length')"

            if [ "$active" = "0" ]; then
              echo "Room is free; dispatching the next conversational beat"
              gh workflow run sarah-society.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f entity=auto
              # Give the newly dispatched run time to appear in the Actions API.
              sleep 12
            else
              echo "Room beat still running; checking again shortly"
              sleep 8
            fi
          done

          echo "Handing The Room pulse to a fresh GitHub runner"
          gh workflow run sarah-society-pulse.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
