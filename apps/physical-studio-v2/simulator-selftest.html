<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulator Self-Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#101010;color:#eee;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}button{padding:10px 13px;border:1px solid #555;border-radius:8px;background:#222;color:#fff;font:inherit}.pass{color:#8fe39b}.fail{color:#ff8f8f}.warn{color:#ffd27d}#log{margin-top:14px;white-space:pre-wrap}.fixtures{display:grid;grid-template-columns:repeat(2,180px);gap:10px;margin-top:16px}.fixture{position:relative;width:180px;height:260px;overflow:hidden;border:1px solid #444;background:#111}.fixture canvas{width:100%;height:100%}.overflow{position:absolute;left:165px;top:20px;width:80px;height:40px;background:#f44}.inside{position:absolute;left:20px;top:20px;width:80px;height:40px;background:#4f4}</style></head><body><strong>PHYSICAL STUDIO · SIMULATOR SELF-TEST</strong> <button id="run">RUN SELF-TEST</button><span id="state"> idle</span><div class="fixtures"><div class="fixture"><canvas id="blank" width="180" height="260"></canvas></div><div class="fixture"><canvas id="changed" width="180" height="260"></canvas></div><div class="fixture" id="fits"><div class="inside"></div></div><div class="fixture" id="over"><div class="overflow"></div></div></div><div id="log"></div><script>
const logEl=document.getElementById('log'),state=document.getElementById('state');const sleep=ms=>new Promise(r=>setTimeout(r,ms));let results=[];function log(s,c=''){logEl.innerHTML+=`<div class="${c}">${s}</div>`}function expect(name,actual,expected){const ok=actual===expected;results.push(ok);log(`${ok?'PASS':'FAIL'}  ${name} — got ${actual}, expected ${expected}`,ok?'pass':'fail');return ok}
function variation(img){let min=255,max=0;for(let i=0;i<img.data.length;i+=16){const v=(img.data[i]+img.data[i+1]+img.data[i+2])/3;min=Math.min(min,v);max=Math.max(max,v)}return max-min}
function diff(a,b){let s=0,n=0;for(let i=0;i<a.data.length;i+=32){s+=Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2]);n+=3}return s/Math.max(1,n)}
function img(c){return c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height)}
function uiFits(root){const rr=root.getBoundingClientRect();for(const el of root.children){const r=el.getBoundingClientRect();if(r.left<rr.left||r.right>rr.right||r.top<rr.top||r.bottom>rr.bottom)return false}return true}
async function audioProbe(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return{available:false};const ctx=new AC({latencyHint:'interactive'});await ctx.audioWorklet.addModule('./physics-worklet.js?selftest=1');const node=new AudioWorkletNode(ctx,'physical-graph',{outputChannelCount:[2]});const analyser=new AnalyserNode(ctx,{fftSize:1024});const mute=new GainNode(ctx,{gain:0});node.connect(analyser).connect(mute).connect(ctx.destination);await ctx.resume();node.port.postMessage({t:'graph',bodies:[{mass:1,damping:.1,anchor:true},{mass:1,damping:.1,anchor:false}],springs:[{a:0,b:1,stiffness:500,damping:2}]});await sleep(80);const b=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(b);const pre=Math.sqrt(b.reduce((s,v)=>s+v*v,0)/b.length);node.port.postMessage({t:'hit',index:1,amount:2});await sleep(110);analyser.getFloatTimeDomainData(b);const post=Math.sqrt(b.reduce((s,v)=>s+v*v,0)/b.length);const finite=b.every(Number.isFinite);node.disconnect();analyser.disconnect();mute.disconnect();await ctx.close();return{available:true,pre,post,finite}}
async function run(){results=[];logEl.innerHTML='';state.textContent=' running';const blank=document.getElementById('blank'),changed=document.getElementById('changed');const bx=blank.getContext('2d'),cx=changed.getContext('2d');bx.fillStyle='#222';bx.fillRect(0,0,180,260);cx.fillStyle='#222';cx.fillRect(0,0,180,260);const blankImg=img(blank),sameImg=img(changed);expect('Blank detector rejects solid frame',variation(blankImg)>8,false);expect('Frame-diff reports identical frames unchanged',diff(blankImg,sameImg)>1.2,false);cx.fillStyle='#d66';cx.fillRect(20,40,80,120);const changedImg=img(changed);expect('Blank detector accepts varied frame',variation(changedImg)>8,true);expect('Frame-diff detects visible change',diff(blankImg,changedImg)>1.2,true);expect('UI bounds accepts contained control',uiFits(document.getElementById('fits')),true);expect('UI bounds rejects overflow',uiFits(document.getElementById('over')),false);expect('NaN/Infinity guard rejects invalid signal',[0,.1,NaN,Infinity].every(Number.isFinite),false);expect('Finite guard accepts valid signal',[0,.1,-.2,.3].every(Number.isFinite),true);try{const a=await audioProbe();if(!a.available){log('WARN  AudioContext unavailable in this browser','warn')}else{expect('Real worklet is near silent before excitation',a.pre<.01,true);expect('Real worklet produces signal after excitation',a.post>.0001,true);expect('Real worklet output stays finite',a.finite,true)}}catch(e){results.push(false);log('FAIL  Real worklet self-test — '+e.message,'fail')}const pass=results.filter(Boolean).length,total=results.length;state.innerHTML=pass===total?` <span class="pass">PASS ${pass}/${total}</span>`:` <span class="fail">FAIL ${pass}/${total}</span>`}
document.getElementById('run').onclick=run;
</script></body></html>
