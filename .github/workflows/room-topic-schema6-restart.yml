name: Room topic schema6 restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-topic-schema6-restart.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  restart:
    if: contains(github.event.head_commit.message, 'Activate topic schema 6')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify topic code
        run: python3 -m py_compile scripts/room_topic_bounded.py scripts/room_private_commit.py scripts/room_engine_v5.py
      - name: Dispatch fresh Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
