name: Open Allen input

on:
  push:
    branches: [main]
    paths:
      - 'society/room-open-allen.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Remove Allen key gate from Room and relay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('room/index.html')
          s = page.read_text()
          old_composer = '''<div class="composer"><div class="composer-inner"><div id="authHint" class="authhint">Allen is locked on this browser. Enter the private Room key once.</div><div id="authRow" class="authrow"><input id="allenKey" type="password" autocomplete="current-password" placeholder="Allen Room key" aria-label="Allen Room key"><button id="unlock" type="button">Unlock</button></div><div class="talkrow"><textarea id="turn" maxlength="700" rows="1" placeholder="Speak as Allen…" aria-label="Speak as Allen"></textarea><button id="send" class="send" type="button">Send</button></div><div id="sendState" class="sendstate"></div></div></div>'''
          new_composer = '''<div class="composer"><div class="composer-inner"><div class="talkrow"><textarea id="turn" maxlength="700" rows="1" placeholder="Speak as Allen…" aria-label="Speak as Allen"></textarea><button id="send" class="send" type="button">Send</button></div><div id="sendState" class="sendstate"></div></div></div>'''
          assert old_composer in s, 'Allen keyed composer anchor missing'
          s = s.replace(old_composer, new_composer, 1)
          s = s.replace("const ALLEN_AUTH=RELAY_BASE+'/api/allen/auth';\n", '', 1)
          old_state = "let allenKey=localStorage.getItem('roomAllenKey')||'',allenUnlocked=false,sending=false;"
          assert old_state in s, 'Allen auth state anchor missing'
          s = s.replace(old_state, "let sending=false;", 1)

          start = s.index('function authHeaders(){')
          marker = 'refreshLive(false);loadHistory(false);initAllen();'
          end = s.index(marker, start) + len(marker)
          open_block = '''async function speakAsAllen(){const text=$('#turn').value.trim();if(!text||sending)return;sending=true;$('#send').disabled=true;setSendState('Sending Allen…');try{const r=await timedFetch(ALLEN_POST,5000,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));$('#turn').value='';setSendState('Allen queued for the next Room beat.','ok');setTimeout(()=>refreshLive(false),900)}catch(e){setSendState(String(e?.message||e||'send failed'),'bad')}finally{sending=false;$('#send').disabled=false;$('#turn').focus()}}
$('#status').onclick=()=>{refreshLive(true);loadHistory(true)};
$('#send').onclick=speakAsAllen;
$('#turn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();speakAsAllen()}});
refreshLive(false);loadHistory(false);'''
          s = s[:start] + open_block + s[end:]
          assert 'Allen Room key' not in s
          assert 'Unlock Allen' not in s
          assert 'roomAllenKey' not in s
          page.write_text(s)

          worker = Path('cloudflare/room-worker/src/index.js')
          w = worker.read_text()
          old_auth = '''    if (url.pathname === "/api/allen/auth" && request.method === "GET") {
      if (!(await allenAuthorized(request, env))) return json({ error: "unauthorized" }, 401);
      return json({ ok: true, identity: "Allen" });
    }
'''
          new_auth = '''    if (url.pathname === "/api/allen/auth" && request.method === "GET") {
      return json({ ok: true, identity: "Allen", public: true });
    }
'''
          assert old_auth in w, 'Allen auth route anchor missing'
          w = w.replace(old_auth, new_auth, 1)
          old_post = '''    if (url.pathname === "/api/allen" && request.method === "POST") {
      if (!(await allenAuthorized(request, env))) return json({ error: "unauthorized" }, 401);
      try {
'''
          new_post = '''    if (url.pathname === "/api/allen" && request.method === "POST") {
      try {
'''
          assert old_post in w, 'Allen POST auth anchor missing'
          w = w.replace(old_post, new_post, 1)
          old_view = '''    if (url.pathname === "/allen" && (request.method === "GET" || request.method === "HEAD")) {
      return request.method === "HEAD" ? html("") : html(ALLEN_VIEWER);
    }
'''
          new_view = '''    if (url.pathname === "/allen" && (request.method === "GET" || request.method === "HEAD")) {
      return request.method === "HEAD" ? html("") : html(VIEWER);
    }
'''
          assert old_view in w, 'Allen keyed viewer route anchor missing'
          w = w.replace(old_view, new_view, 1)
          worker.write_text(w)
          PY

          node --check cloudflare/room-worker/src/index.js
          grep -q 'Speak as Allen' room/index.html
          ! grep -q 'Allen Room key' room/index.html

          git config user.name "room-ui-patcher"
          git config user.email "actions@users.noreply.github.com"
          git add room/index.html cloudflare/room-worker/src/index.js
          git commit -m "Remove Allen Room key gate"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$n"
          done
          exit 1
