name: Room code handoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/room_*.py'
      - '.github/workflows/sarah-society.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: room-code-handoff-main
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Verify Room code
        run: python3 -m py_compile scripts/room_*.py
      - name: Replace resident Room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && break
            sleep 2
          done
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
          [ "$active" -eq 0 ] || exit 1
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
