<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080D1A">
<title>RESONATOR NO. 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080D1A}
#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080D1A}
#status{position:fixed;left:10px;top:max(6px,env(safe-area-inset-top));z-index:20;color:#65728f;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;pointer-events:none}
</style>
</head>
<body>
<div id="status">NO. 2 · DIRECT MOBILE LAYOUT</div>
<iframe id="host" src="resonator.html?v=20260814d" allow="microphone; autoplay"></iframe>
<script>
(()=>{
 const frame=document.getElementById('host');
 function patch(){
   let d;
   try{d=frame.contentDocument||frame.contentWindow.document;}catch(e){return;}
   if(!d||!d.head||!d.body)return;
   if(d.getElementById('res2-direct-layout'))return;
   const s=d.createElement('style');
   s.id='res2-direct-layout';
   s.textContent=`
   @media (max-width:700px){
     html,body{height:100dvh!important;max-height:100dvh!important;overflow:hidden!important;overscroll-behavior:none!important}
     #app{height:100dvh!important;padding-bottom:0!important}
     #stage{flex:0 0 46vh!important;min-height:260px!important}
     #tools{left:12px!important;right:12px!important;bottom:10px!important;gap:6px!important;flex-wrap:nowrap!important}
     #tools [data-tool="move"],#tools [data-tool="link"],#tools [data-tool="pin"],#home,#undo,#redo{display:none!important}
     #tools .tool{flex:1 1 0!important;min-width:0!important;padding:10px 4px!important;font-size:10px!important}
     #tabs{flex:0 0 46px!important}
     .tab{padding:12px 2px!important;font-size:9px!important}
     #panel{display:block!important;flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;padding:12px 14px 70px!important;-webkit-overflow-scrolling:touch!important}
     #deck{flex:0 0 34px!important;padding:0 10px 2px!important;z-index:50!important}
     #deck.shut #pads,#deck.shut #msg{display:none!important}
     #deck.shut{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;max-height:none!important;overflow:hidden!important;box-shadow:none!important}
     #deck:not(.shut){position:fixed!important;left:8px!important;right:8px!important;bottom:max(8px,env(safe-area-inset-bottom))!important;max-height:43vh!important;overflow:auto!important;background:#0D1526!important;border:1px solid #25314F!important;border-radius:12px!important;padding:0 10px 10px!important;box-shadow:0 16px 50px rgba(0,0,0,.7)!important}
     #handle{height:34px!important;position:sticky!important;top:0!important;background:#0D1526!important;z-index:2!important}
     #pads{grid-template-columns:repeat(6,1fr)!important;gap:5px!important}
     .pad{padding:10px 0!important}
     #bodytext{font-size:10.5px!important;margin-bottom:10px!important}
     .knob{margin-bottom:9px!important}
     .knob .lab{margin-bottom:3px!important}
     .knob .hint{display:none!important}
     #panel .row:first-child{display:none!important}
     #readout{top:10px!important;left:12px!important;font-size:9px!important;max-width:55vw!important}
     #brand{top:9px!important;right:10px!important;font-size:11px!important}
     #level{top:28px!important;right:10px!important;font-size:9px!important}
   }
   `;
   d.head.appendChild(s);
   const deck=d.getElementById('deck');
   const handle=d.getElementById('handle');
   if(deck){deck.classList.add('shut');}
   if(handle){handle.setAttribute('aria-expanded','false');}
   const status=document.getElementById('status');
   if(status)status.textContent='NO. 2 · LAYOUT ACTIVE';
 }
 frame.addEventListener('load',()=>{patch();setTimeout(patch,250);setTimeout(patch,1000);});
 const timer=setInterval(patch,500);
 setTimeout(()=>clearInterval(timer),10000);
})();
</script>
</body>
</html>
