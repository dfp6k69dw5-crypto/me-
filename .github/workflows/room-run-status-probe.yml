name: Room run status observer
# explicit observer kick: 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-run-status-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record latest Room workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p room
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 5 \
            --json databaseId,status,conclusion,event,createdAt,updatedAt,headSha,displayTitle \
            > room/run-status-probe.json
          git config user.name "room-run-status-observer"
          git config user.email "actions@users.noreply.github.com"
          git add room/run-status-probe.json
          git commit -m "Record Room workflow status" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$n"
          done
          exit 1
