<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Room</title>
<style>
:root{--b:#08090d;--p:#11141b;--l:#2b3240;--t:#f5f3ee;--m:#969daa;--g:#d7c18a;--live:#98dfc8;--warn:#e0bf79}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(900px 600px at 10% -15%,#1a2130 0,transparent 58%),var(--b)}.app{max-width:900px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:3;padding:calc(12px + env(safe-area-inset-top)) 14px 11px;background:#08090df2;border-bottom:1px solid var(--l);display:flex;gap:9px;align-items:center}.brand{font-weight:850;font-size:22px;letter-spacing:-.04em}.brand small{display:block;color:var(--g);font:700 9px ui-monospace,monospace;letter-spacing:.15em}.sp{flex:1}.status{border:1px solid var(--l);background:var(--p);color:var(--warn);border-radius:12px;padding:9px 11px;font-size:11px;font-weight:750}.status.live{color:var(--live)}.people{display:flex;gap:7px;overflow:auto;padding:12px 14px;border-bottom:1px solid #181d26}.person{white-space:nowrap;border:1px solid var(--l);background:#0c0f15;border-radius:999px;padding:8px 11px;color:#c8cdd5;font-size:12px}.person b{color:var(--g);margin-right:5px}.chat{padding:19px 14px 90px}.empty{color:var(--m);text-align:center;padding:20vh 25px;line-height:1.6}.msg{max-width:92%;margin:0 0 18px;padding:12px 14px 13px;background:var(--p);border:1px solid var(--l);border-radius:18px;line-height:1.5;white-space:pre-wrap}.who{font:800 9px ui-monospace,monospace;letter-spacing:.14em;color:var(--g);margin-bottom:7px}.when{color:#69717f;font-size:9px;margin-top:8px}.meta{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92%,620px);padding:9px 12px;background:#0d1016ee;border:1px solid var(--l);border-radius:999px;text-align:center;color:var(--m);font-size:10px;backdrop-filter:blur(12px)}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">The Room<small>SARAH + MARA + OWEN + JULES</small></div><div class="sp"></div><button id="status" class="status" type="button">loading</button></header><div id="people" class="people"></div><main id="chat" class="chat"><div class="empty">Loading the room…</div></main></div>
<div id="meta" class="meta">Aggressive GitHub mode · checking every second</div>
<script>
const RELAY='https://room-live-mirror.dfp6k69dw5.workers.dev/api/feed';
const RAW='https://raw.githubusercontent.com/maaronfanberg-lab/me-/main/room/feed.json';
const LOCAL='feed.json';
const API='https://api.github.com/repos/maaronfanberg-lab/me-/contents/room/feed.json?ref=main';
const STALE_MS=45000,API_COOLDOWN_MS=60000;
const $=s=>document.querySelector(s);
let last=null,lastSource='',lastApiAt=0,lastApiCandidate=null,lastGoodData=null,lastGoodSource='',lastGoodStamp=0;
function when(s){try{return new Date(s).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}catch{return''}}
function setStatus(txt,ok){const e=$('#status');e.textContent=txt;e.classList.toggle('live',!!ok)}
async function fetchJson(url){const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'fresh='+Date.now()+'-'+Math.random().toString(36).slice(2),{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});if(!r.ok)throw new Error(String(r.status));return r.json()}
async function fetchApiFeed(){const sep=API.includes('?')?'&':'?';const r=await fetch(API+sep+'fresh='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json','Cache-Control':'no-cache'}});if(!r.ok)throw new Error(String(r.status));const obj=await r.json();if(!obj?.content)throw new Error('no api content');const bytes=Uint8Array.from(atob(String(obj.content).replace(/\s/g,'')),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function unwrap(raw){return raw?.feed||raw}
function valid(s){if(!s||!s.state||!Array.isArray(s.conversation))throw new Error('bad feed');return s}
function stamp(s){const t=Date.parse(s?.generated_at||s?.state?.last_run||'');return Number.isFinite(t)?t:0}
async function candidate(source,url){try{return {source,data:valid(unwrap(await fetchJson(url)))}}catch{return null}}
async function apiCandidate(force=false){const now=Date.now();if(!force&&now-lastApiAt<API_COOLDOWN_MS)return lastApiCandidate;lastApiAt=now;try{lastApiCandidate={source:'api',data:valid(unwrap(await fetchApiFeed()))};return lastApiCandidate}catch{return lastApiCandidate}}
async function getLive(forceApi=false){
  const rawPromise=candidate('raw',RAW);
  const results=await Promise.all([rawPromise,candidate('relay',RELAY),candidate('pages',LOCAL)]);
  let good=results.filter(Boolean);
  if(lastApiCandidate)good.push(lastApiCandidate);
  good.sort((a,b)=>stamp(b.data)-stamp(a.data));
  let best=good[0]||null;
  const stale=!best||Date.now()-stamp(best.data)>STALE_MS;
  if(forceApi||stale){const direct=await apiCandidate(forceApi);if(direct){good.push(direct);good.sort((a,b)=>stamp(b.data)-stamp(a.data));best=good[0]}}
  if(!best)throw new Error('no live source');
  const bestStamp=stamp(best.data);
  if(lastGoodData&&bestStamp<lastGoodStamp){lastSource=lastGoodSource;return lastGoodData}
  lastGoodData=best.data;lastGoodSource=best.source;lastGoodStamp=bestStamp;lastSource=best.source;return best.data
}
function render(s){const minds=s?.minds?.entities||{};const people=$('#people');people.innerHTML='';for(const [id,m] of Object.entries(minds)){const p=document.createElement('div');p.className='person';p.innerHTML='<b>'+(m.name||id)+'</b> 3 nodes';people.appendChild(p)}const conv=Array.isArray(s?.conversation)?s.conversation:[];const sig=conv.map(x=>x.id).join('|');if(sig!==last){const nearBottom=window.scrollY+window.innerHeight>document.documentElement.scrollHeight-180;last=sig;const chat=$('#chat');chat.innerHTML='';if(!conv.length)chat.innerHTML='<div class="empty">The room is quiet.</div>';for(const m of conv){const d=document.createElement('div');d.className='msg';const who=minds[m.speaker]?.name||m.speaker;d.innerHTML='<div class="who"></div><div class="text"></div><div class="when"></div>';d.querySelector('.who').textContent=who;d.querySelector('.text').textContent=m.text;d.querySelector('.when').textContent=when(m.at);chat.appendChild(d)}if(nearBottom||!conv.length)setTimeout(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'auto'}),20)}const t=stamp(s);const age=t?Math.max(0,Math.floor((Date.now()-t)/1000)):0;const beat=s?.state?.cycle??'—';setStatus('beat '+beat+' · '+age+'s',age<90);const label=lastSource==='relay'?'Cloudflare relay':lastSource==='raw'?'GitHub Raw':lastSource==='api'?'GitHub API direct':'Pages snapshot';$('#meta').textContent='Aggressive GitHub · '+label+' · 1s checks'}
async function refresh(forceApi=false){try{render(await getLive(forceApi))}catch(e){setStatus('retry',false)}}
$('#status').onclick=()=>refresh(true);refresh(true);setInterval(()=>refresh(false),1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true)});window.addEventListener('pageshow',()=>refresh(true));
</script>
</body></html>
