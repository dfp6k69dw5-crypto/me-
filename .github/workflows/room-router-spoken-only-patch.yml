name: Patch Room concrete-chaos acceptance

on:
  push:
    branches: [main]
    paths:
      - 'society/room-router-spoken-only-kick.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Accept coherent concrete wildness without magic words
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/room_private_model/__init__.py')
          s=p.read_text()
          old='''        history = re.search(\n            r"\\b(?:remember|last time|years ago|that night|when we|the time we|back when|used to|that motel|that wedding|the dare|the bet|the pact|the voicemail)\\b",\n            low, re.I,\n        )\n        if expected == "callback" and not history:\n            raise ValueError("high_risk_callback_not_realized")\n        if expected in {"disagree", "disclose", "compare", "close", "repair"} and not (charged or history):\n            raise ValueError("high_risk_not_realized")\n\n    if expected == "disagree" and not re.search(\n        r"\\b(?:no|not|don'?t|disagree|but|however|instead|rather|wrong|nonsense|ridiculous|bullshit|fuck|stupid|idiot|actually)\\b",\n        low,\n    ):\n        raise ValueError("disagreement_not_realized")\n'''
          new='''        history = re.search(\n            r"\\b(?:remember|last time|years ago|that night|when we|the time we|back when|used to|that motel|that wedding|the dare|the bet|the pact|the voicemail)\\b",\n            low, re.I,\n        )\n        wild_anchor = re.search(\n            r"\\b(?:motel|fire|herman|suitcase|wedding|duluth|church|bell|radio|tower|tattoo|birthday|cake|laundromat|forged|apology|garden|statue|karaoke|inheritance|midnight|road trip|key|restaurant|banned|bet|engagement|umbrella|hotel|roof|flamingo|voicemail|betray\\w*)\\b",\n            low, re.I,\n        )\n        # A callback need not literally say 'remember'. A concrete recurring Room\n        # invention is itself evidence that the callback happened.\n        if expected == "callback" and not (history or wild_anchor or charged):\n            raise ValueError("high_risk_callback_not_realized")\n        if expected in {"disagree", "disclose", "compare", "close", "repair"} and not (charged or history or wild_anchor):\n            raise ValueError("high_risk_not_realized")\n\n    disagreement_marker = re.search(\n        r"\\b(?:no|not|don'?t|disagree|but|however|instead|rather|wrong|nonsense|ridiculous|bullshit|fuck|stupid|idiot|actually)\\b",\n        low, re.I,\n    )\n    if expected == "disagree" and not (disagreement_marker or (risk >= 3 and (charged or history or wild_anchor))):\n        raise ValueError("disagreement_not_realized")\n'''
          if old not in s:
              if 'wild_anchor = re.search(' in s:
                  print('already patched')
              else:
                  raise SystemExit('concrete-chaos validator anchor missing')
          else:
              s=s.replace(old,new,1)
          s=s.replace('LIVE_EXPRESSION_OVERLAY = "2026-08-24-volatile-agenda-v12"', 'LIVE_EXPRESSION_OVERLAY = "2026-08-24-concrete-chaos-v13"')
          p.write_text(s)
          PY
          python3 -m py_compile scripts/room_private_model/__init__.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'room-chaos-acceptance-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_private_model/__init__.py
          git commit -m 'Accept concrete Room chaos without magic words' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
