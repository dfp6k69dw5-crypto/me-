<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07090c"><title>Genome Flower — DNA → Development → Growth</title>
<style>:root{color-scheme:dark;--bg:#07090c;--panel:rgba(12,15,20,.84);--line:#29313b;--text:#f4f6f8;--muted:#9ba6b2;--accent:#d7c58b;--good:#8fe0be}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation;background:radial-gradient(circle at 50% 48%,#11161d 0,#080b10 46%,#050608 100%)}.top{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{background:linear-gradient(180deg,rgba(5,7,10,.72),rgba(5,7,10,.2));padding:8px 10px;border-radius:14px;backdrop-filter:blur(8px)}.brand b{display:block;font-size:14px;letter-spacing:.02em}.brand span{display:block;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}.status{max-width:47vw;text-align:right;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 2px;text-shadow:0 1px 4px #000}.dock{position:fixed;z-index:4;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 14px 50px rgba(0,0,0,.45)}.actions{display:grid;grid-template-columns:1.2fr 1.2fr .8fr .8fr;gap:8px}button{appearance:none;border:1px solid #323b46;background:#151a21;color:var(--text);border-radius:13px;min-height:44px;padding:8px 9px;font-weight:700;font-size:12px;touch-action:manipulation}button:active{transform:translateY(1px);background:#1d242d}.primary{border-color:#6d6548;background:#242116;color:#f6e9b8}.mutate{border-color:#285345;background:#10251f;color:#bdf2dd}.row{display:flex;gap:8px;align-items:center;margin-top:8px}.metric{min-width:0;flex:1;padding:7px 9px;border:1px solid #242b34;border-radius:11px;background:rgba(0,0,0,.18)}.metric label{display:block;color:#75808c;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px;color:#d8dde3}.drawer{position:fixed;z-index:5;left:10px;right:10px;bottom:calc(108px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(9,12,16,.95);backdrop-filter:blur(16px);display:none}.drawer.open{display:block}.drawer h2{font-size:13px;margin:0 0 8px}.drawer p{font-size:11px;color:var(--muted);line-height:1.45;margin:6px 0}.seq{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#aab5c1;line-height:1.45;background:#05070a;padding:9px;border-radius:9px;border:1px solid #20262e}.traits{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#bac3cd}.traits span:nth-child(odd){color:#77838e}@media(max-width:520px){.dock{padding:8px}.actions{gap:6px}button{font-size:11px;padding:7px 5px}.row{gap:5px}.metric{padding:6px}.brand b{font-size:13px}}</style></head>
<body><canvas id="stage"></canvas><div class="top"><div class="brand"><b>GENOME FLOWER</b><span>DNA → GRN → GPT growth</span></div><div id="status" class="status">initialising</div></div><div id="drawer" class="drawer"><h2>Genome / developmental state</h2><p id="explain"></p><div id="traits" class="traits"></div><p>Sequence preview</p><div id="seq" class="seq"></div></div><div class="dock"><div class="actions"><button id="mutate" class="mutate">Mutate DNA</button><button id="big" class="primary">Big mutation</button><button id="undo">Undo</button><button id="info">Genome</button></div><div class="row"><div class="metric"><label>sequence</label><strong id="digest">—</strong></div><div class="metric"><label>changes</label><strong id="changes">0 bases</strong></div><div class="metric"><label>flower</label><strong id="flowerstat">—</strong></div></div></div>
<script type="module">
import {GrowthCanvas} from '../growth-canvas/growth-canvas.js';
import {FlowerGenome,genomeDifference} from './flower-genome.js';
const TAU=Math.PI*2,clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false}),statusEl=document.getElementById('status'),digestEl=document.getElementById('digest'),changesEl=document.getElementById('changes'),flowerstatEl=document.getElementById('flowerstat'),drawer=document.getElementById('drawer'),seqEl=document.getElementById('seq'),traitsEl=document.getElementById('traits'),explainEl=document.getElementById('explain');let genome=new FlowerGenome({seed:(Date.now()^0x5eed1234)>>>0}),history=[],lastParent=null,current=null,busy=false,renderToken=0;
function sizeCanvas(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(innerWidth*d));canvas.height=Math.max(1,Math.floor(innerHeight*d));canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);if(current)drawFlower(current)}addEventListener('resize',sizeCanvas,{passive:true});sizeCanvas();const nextFrame=()=>new Promise(r=>requestAnimationFrame(r));function setStatus(s){statusEl.textContent=s}function rand01(seed){let x=seed>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}function mixSeed(...xs){let h=2166136261;for(const x0 of xs){let x=x0>>>0;for(let k=0;k<4;k++){h^=(x>>>(k*8))&255;h=Math.imul(h,16777619)}}return(h^(h>>>16))>>>0}
function configurePetal(genome,dev){const t=genome.traits,gc=new GrowthCanvas({shape:'petal',resolution:20,retainResidual:0,shallowGradient:'freeze',maxGrowthPerStep:.10,maxRotationPerStep:10,seed:genome.digest}),avgD=Array.from(genome.diffusion).reduce((a,b)=>a+b,0)/genome.diffusion.length,avgDecay=Array.from(genome.decay).reduce((a,b)=>a+b,0)/genome.decay.length;gc.addField('AUXIN',{type:'signal',diffusion:.006+avgD*.025,decay:.008+avgDecay*.03,dilutable:true,init:(u,v)=>dev.sampleChannel(0,u,v)});gc.addField('MARGIN',{type:'identity',init:(u,v)=>dev.sampleChannel(2,u,v)>.52?1:0});gc.addField('PIGMENT_A',{type:'identity',init:(u,v)=>dev.sampleChannel(4,u,v)});gc.addField('PIGMENT_B',{type:'identity',init:(u,v)=>dev.sampleChannel(5,u,v)});const w=t.organiserWidth,style=t.polarityStyle;if(style<.34)gc.setOrganisers({plus:(u,v)=>u<w,minus:(u,v)=>u>1-w});else if(style<.68)gc.setOrganisers({plus:(u,v)=>u>1-w,minus:(u,v)=>u<w});else gc.setOrganisers({plus:(u,v)=>u<w&&Math.abs(v)<.48,minus:(u,v)=>u>1-w||Math.abs(v)>1-w*2});gc.grow(t.growthTime,{kpar:(u,v,f)=>{const g=dev.growthAt(u,v);return g.kpar*(.82+.34*f.AUXIN)*(1+.12*f.MARGIN)},kper:(u,v,f)=>{const g=dev.growthAt(u,v);return g.kper*(.86+.28*f.AUXIN)*(1+.20*f.MARGIN)},dt:.055});return gc}
function buildPetalBitmap(gc,genome,dev){const bb=gc.bbox(),pad=.045*Math.max(bb.x1-bb.x0,bb.y1-bb.y0),x0=bb.x0-pad,x1=bb.x1+pad,y0=bb.y0-pad,y1=bb.y1+pad,aspect=(y1-y0)/(x1-x0),W=260,H=Math.max(260,Math.min(520,Math.round(W*aspect))),off=document.createElement('canvas');off.width=W;off.height=H;const ox=off.getContext('2d'),im=ox.createImageData(W,H),d=im.data,t=genome.traits;for(let py=0;py<H;py++){const wy=y1-(py+.5)/H*(y1-y0);for(let px=0;px<W;px++){const wx=x0+(px+.5)/W*(x1-x0),m=gc.toMaterial(wx,wy),q=(py*W+px)*4;if(!m){d[q+3]=0;continue}let[r,g,b]=genome.colorAt(m.u,m.v,dev);const edge=clamp((1-Math.abs(m.v))*16)*clamp(m.u*22)*clamp((1-m.u)*30+.22),ridge=Math.pow(Math.max(0,1-Math.abs(m.v)),1.7),sheen=t.sheen*Math.pow(Math.max(0,Math.sin((m.u*.85+m.v*.16)*Math.PI)),5)*ridge,micro=(Math.sin(m.u*211+m.v*127+t.phase)+Math.sin(m.u*91-m.v*173-t.phase))*.012;r=clamp(r+sheen*.23+micro);g=clamp(g+sheen*.23+micro);b=clamp(b+sheen*.26+micro);d[q]=r*255;d[q+1]=g*255;d[q+2]=b*255;d[q+3]=255*clamp(edge*(.91+t.translucency*.18))}}ox.putImageData(im,0,0);ox.globalCompositeOperation='source-atop';ox.globalAlpha=.07+t.veinContrast*.18;ox.strokeStyle='rgba(255,255,255,.8)';ox.lineWidth=.55;for(let v=-.8;v<=.8;v+=.2){ox.beginPath();let started=false;for(let u=.08;u<.98;u+=.025){const p=gc.toWorld(u,v*(.35+.65*u));if(!p)continue;const x=(p.x-x0)/(x1-x0)*W,y=(y1-p.y)/(y1-y0)*H;if(!started){ox.moveTo(x,y);started=true}else ox.lineTo(x,y)}ox.stroke()}ox.globalCompositeOperation='source-over';ox.globalAlpha=1;const base=gc.toWorld(0,0)||{x:0,y:0},tip=gc.toWorld(1,0)||{x:0,y:1},anchorX=(base.x-x0)/(x1-x0)*W,anchorY=(y1-base.y)/(y1-y0)*H,tipY=(y1-tip.y)/(y1-y0)*H;return{canvas:off,anchorX,anchorY,tipSpan:Math.max(1,Math.abs(anchorY-tipY))}}
async function phenotype(genome){const t0=performance.now();setStatus('developing regulatory network…');await nextFrame();const dev=genome.develop({nu:31,nv:31,steps:22});setStatus('growing tissue with FEM…');await nextFrame();const gc=configurePetal(genome,dev);setStatus('carrying pigment through growth…');await nextFrame();const petal=buildPetalBitmap(gc,genome,dev);return{genome,dev,gc,petal,ms:performance.now()-t0}}
function drawSepals(cx,cy,R,t){ctx.save();ctx.translate(cx,cy);for(let i=0;i<5;i++){const a=i*TAU/5+.3;ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(R*.15,-R*.34,R*.07,-R*.62);ctx.quadraticCurveTo(-R*.1,-R*.28,0,0);ctx.fillStyle=`hsla(${t.sepalHue*360},48%,25%,.8)`;ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=8;ctx.fill();ctx.restore()}ctx.restore()}
function drawStamens(cx,cy,R,t,seed){ctx.save();ctx.translate(cx,cy);for(let i=0;i<t.stamenCount;i++){const q=rand01(mixSeed(seed,i,91)),a=i*TAU/t.stamenCount+(q-.5)*.26,len=R*t.stamenLength*(.72+.34*rand01(mixSeed(seed,i,92)));ctx.save();ctx.rotate(a);ctx.strokeStyle='rgba(238,216,145,.72)';ctx.lineWidth=Math.max(1,R*.008);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(R*.04,-len*.48,0,-len);ctx.stroke();ctx.fillStyle='rgba(231,183,84,.95)';ctx.beginPath();ctx.ellipse(0,-len,R*t.antherSize,R*t.antherSize*.52,.25,0,TAU);ctx.fill();ctx.restore()}ctx.fillStyle='rgba(154,118,58,.95)';ctx.beginPath();ctx.arc(0,0,R*.105,0,TAU);ctx.fill();ctx.fillStyle='rgba(226,190,99,.42)';for(let i=0;i<16;i++){const a=i*TAU/16,r=R*(.025+.07*rand01(mixSeed(seed,i,94)));ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,R*.012,0,TAU);ctx.fill()}ctx.restore()}
function drawPetalInstance(p,cx,cy,R,angle,scaleX,scaleY,depth,seed,i){const img=p.petal.canvas,ax=p.petal.anchorX,ay=p.petal.anchorY;ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.transform(1,0,Math.sin((rand01(mixSeed(seed,i,70))-.5)*.16),1,0,0);ctx.scale(scaleX,scaleY);ctx.shadowColor=`rgba(0,0,0,${.22+depth*.25})`;ctx.shadowBlur=R*(.045+.06*depth);ctx.shadowOffsetY=R*.025;const s=R/(p.petal.tipSpan||Math.max(1,ay));ctx.scale(s,s);ctx.drawImage(img,-ax,-ay);ctx.restore()}
function drawFlower(p){const W=innerWidth,H=innerHeight,usableH=Math.max(220,H-112),cx=W*.5,cy=Math.min(H*.49,usableH*.54+18),R=Math.min(W*.46,usableH*.43)*p.genome.traits.petalScale,t=p.genome.traits,seed=p.genome.digest;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#07090c';ctx.fillRect(0,0,W,H);const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.7);bg.addColorStop(0,'#131922');bg.addColorStop(.48,'#0a0e13');bg.addColorStop(1,'#050608');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);drawSepals(cx,cy,R,t);const items=[];for(let w=t.whorls-1;w>=0;w--)for(let i=0;i<t.petalCount;i++){const jseed=mixSeed(seed,w,i),a=i*TAU/t.petalCount+(w?Math.PI/t.petalCount*.78:0)+(rand01(jseed)-.5)*t.radialJitter*TAU,front=(Math.sin(a)+1)*.5,asym=1+(rand01(mixSeed(jseed,4))-.5)*t.asymmetry*2;items.push({a,w,i,front,asym,depth:front})}items.sort((a,b)=>a.depth-b.depth||b.w-a.w);for(const it of items){const ring=it.w?(.68+.13*t.overlap):1,frontLift=.93+.12*it.front,sx=t.petalAspect*(.88+.16*rand01(mixSeed(seed,it.i,it.w,11)))*ring*it.asym,sy=frontLift*ring*(.96+.08*rand01(mixSeed(seed,it.i,it.w,12)))*(1+t.bilateral*Math.cos(it.a)*.2);drawPetalInstance(p,cx,cy,R,it.a,sx,sy,it.depth,seed,it.i+it.w*97)}drawStamens(cx,cy,R,t,seed);const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.22,cx,cy,Math.max(W,H)*.68);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.48)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
function updateInfo(p,parent){const s=p.genome.summary();digestEl.textContent=s.digest.toUpperCase();changesEl.textContent=parent?`${genomeDifference(parent,p.genome).bases} bases`:`${s.mutations} total`;flowerstatEl.textContent=`${s.petalCount} petals · ${p.gc.stats().tris} tris`;explainEl.textContent=`${s.bases.toLocaleString()} DNA bases decode ${s.genes} genes, ${s.regulatoryWeights.toLocaleString()} regulatory interactions and ${s.decodedVariables.toLocaleString()} tracked sequence/decoded variables. The visible petal is grown by the finite-element Growth Canvas rather than drawn from a width/curvature preset.`;const keys=['petalCount','growthTime','growthAmp','anisotropy','marginBoost','polarityStyle','hue','hue2','spotStrength','stripeStrength','stamenCount','developmentalNoise'];traitsEl.innerHTML=keys.map(k=>`<span>${k}</span><span>${typeof s[k]==='number'?s[k].toFixed(k.includes('Count')?0:3):s[k]}</span>`).join('');seqEl.textContent=p.genome.sequence.slice(0,768)+' …'}
async function regenerate(parent=null){if(busy)return;busy=true;const token=++renderToken;try{setStatus('reading DNA…');await nextFrame();const p=await phenotype(genome);if(token!==renderToken)return;current=p;drawFlower(p);updateInfo(p,parent);setStatus(`${p.ms.toFixed(0)} ms · ${p.gc.stats().verts} vertices · ${p.genome.summary().decodedVariables.toLocaleString()} variables`)}catch(e){console.error(e);setStatus('error · '+e.message)}finally{busy=false}}
document.getElementById('mutate').onclick=async()=>{if(busy)return;history.push(genome);lastParent=genome;genome=genome.mutate({rate:.0015,seed:(Date.now()^genome.digest)>>>0});await regenerate(lastParent)};document.getElementById('big').onclick=async()=>{if(busy)return;history.push(genome);lastParent=genome;genome=genome.mutate({rate:.009,indelRate:.12,seed:(Date.now()^genome.digest^0xb16b00b5)>>>0});await regenerate(lastParent)};document.getElementById('undo').onclick=async()=>{if(busy||!history.length)return;const old=genome;genome=history.pop();lastParent=old;await regenerate(old)};document.getElementById('info').onclick=()=>drawer.classList.toggle('open');canvas.addEventListener('click',()=>{if(drawer.classList.contains('open'))drawer.classList.remove('open')});regenerate();
</script></body></html>
