<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#b18a72"><title>KINETIC LAB</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui;background:linear-gradient(#c8a58f 0 46%,#796a60 62%,#4e5532 78%,#3b4728 100%);color:#fff}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.topbar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.35)}.topbar .status{opacity:.7;font-size:10px;letter-spacing:.06em}.card{position:absolute;top:calc(env(safe-area-inset-top) + 48px);width:min(300px,calc(50vw - 18px));background:rgba(113,78,62,.70);border:1px solid rgba(255,239,229,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:10px 12px 12px;box-shadow:0 14px 38px rgba(34,22,17,.22);pointer-events:auto;display:none}.card.show{display:block}.card.left{left:12px}.card.right{right:12px}.cardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.cardHead strong{font-size:11px;letter-spacing:.08em}.count{font-size:9px;opacity:.72}.row{display:grid;grid-template-columns:74px 1fr 52px;gap:8px;align-items:center;margin:8px 0}.row label{font-size:10px;opacity:.94}.row output{font-size:10px;text-align:right;font-variant-numeric:tabular-nums}.row input{width:100%;accent-color:#d8b4f4}.palette{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);display:flex;gap:7px;padding:7px 9px;border-radius:18px;background:rgba(83,63,53,.50);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto;box-shadow:0 10px 28px rgba(0,0,0,.22)}.tool{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(126,92,72,.58);color:white;border-radius:12px;width:48px;height:44px;font-size:10px;font-weight:700;line-height:1.05}.tool .ico{display:block;font-size:18px;margin-bottom:3px}.tool.active{background:rgba(191,137,103,.88);border-color:rgba(255,239,224,.72)}.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);font-size:10px;opacity:.82;text-shadow:0 1px 8px rgba(0,0,0,.5);white-space:nowrap}.transport{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);display:flex;gap:7px;pointer-events:auto}.round{appearance:none;border:1px solid rgba(255,255,255,.2);background:rgba(70,55,46,.54);color:#fff;border-radius:999px;width:46px;height:46px;font-size:17px}.badge{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);font-size:10px;padding:7px 9px;border-radius:10px;background:rgba(67,51,44,.38);backdrop-filter:blur(8px)}@media(max-width:640px){.card{width:calc(100vw - 24px)}.card.right{top:calc(env(safe-area-inset-top) + 180px)}.palette{gap:4px;padding:6px}.tool{width:44px;height:42px;font-size:9px}.tool .ico{font-size:16px}}</style></head><body><div id="app"></div><div class="hud"><div class="topbar"><div>KINETIC LAB</div><div class="status" id="status">3D physics workspace</div></div><div class="card left show" id="bodyCard"><div class="cardHead"><strong>BODY</strong><span class="count" id="bodyCount">1 selected</span></div><div class="row"><label>Mass</label><input id="massCtl" type="range" min="5" max="120" value="38"><output id="massOut">38</output></div><div class="row"><label>Damping</label><input id="dampCtl" type="range" min="0" max="100" value="16"><output id="dampOut">0.16</output></div></div><div class="card right show" id="springCard"><div class="cardHead"><strong>SPRING</strong><span class="count" id="springCount">1 selected</span></div><div class="row"><label>Stiffness</label><input id="stiffCtl" type="range" min="20" max="500" value="180"><output id="stiffOut">180</output></div><div class="row"><label>Length</label><input id="lengthCtl" type="range" min="20" max="180" value="100"><output id="lengthOut">1.00</output></div></div><div class="palette" id="palette"><button class="tool active" data-mode="select"><span class="ico">◉</span>Select</button><button class="tool" data-mode="body"><span class="ico">●</span>Body</button><button class="tool" data-mode="anchor"><span class="ico">◆</span>Anchor</button><button class="tool" data-mode="spring"><span class="ico">⌁</span>Spring</button><button class="tool" data-mode="mallet"><span class="ico">✦</span>Mallet</button><button class="tool" data-mode="mic"><span class="ico">◎</span>Mic</button></div><div class="hint" id="hint">drag empty space to orbit · pinch to zoom · two-finger drag to pan</div><div class="transport"><button class="round" id="playBtn" title="Pause/play">❚❚</button><button class="round" id="resetBtn" title="Reset">↺</button></div><div class="badge" id="badge">12 bodies · 28 springs</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const root=document.getElementById('app');const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xb9957e,.035);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,100);camera.position.set(6,4.8,7);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.075;controls.target.set(0,.4,0);controls.minDistance=2.4;controls.maxDistance=18;controls.rotateSpeed=.75;controls.zoomSpeed=.9;controls.panSpeed=.8;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.HemisphereLight(0xffead9,0x3f4930,2.2));const sun=new THREE.DirectionalLight(0xfff1df,3.2);sun.position.set(-4,8,5);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x4c5a32,roughness:1,metalness:0}));ground.rotation.x=-Math.PI/2;ground.position.y=-2.1;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(30,30,0x786e60,0x766b5d);grid.position.y=-2.08;grid.material.opacity=.28;grid.material.transparent=true;scene.add(grid);
const bodyMat=new THREE.MeshStandardMaterial({color:0x342a24,roughness:.28,metalness:.45});const anchorMat=new THREE.MeshStandardMaterial({color:0x6e594b,roughness:.45,metalness:.25});const selectedMat=new THREE.MeshStandardMaterial({color:0xc9a1e5,emissive:0x4b244e,emissiveIntensity:.55,roughness:.3,metalness:.3});const springMat=new THREE.LineBasicMaterial({color:0x332721,transparent:true,opacity:.72});const springSelMat=new THREE.LineBasicMaterial({color:0xe6b8ff,transparent:true,opacity:1});const bodies=[],springs=[];const basePositions=[[-2.2,.7,-.7],[-1.25,1.5,-.3],[-.2,1.8,.1],[.9,1.45,.6],[1.9,.7,.9],[-1.7,-.15,.3],[-.65,.35,.85],[.45,.15,-.7],[1.45,-.25,-.1],[-1.1,-1.0,-.5],[0,-.95,.45],[1.2,-1.05,.25]];const anchors=new Set([0,4,9,11]);function addBody(p,i){const g=anchors.has(i)?new THREE.OctahedronGeometry(.22,0):new THREE.SphereGeometry(.22,24,18);const m=new THREE.Mesh(g,anchors.has(i)?anchorMat:bodyMat);m.position.set(...p);m.castShadow=true;m.userData={type:'body',index:i,mass:38,damping:.16,anchor:anchors.has(i),rest:new THREE.Vector3(...p),vel:new THREE.Vector3()};scene.add(m);bodies.push(m)}basePositions.forEach(addBody);const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[1,5],[1,6],[2,6],[2,7],[3,7],[3,8],[4,8],[5,6],[6,7],[7,8],[5,9],[6,9],[6,10],[7,10],[7,11],[8,11],[9,10],[10,11],[1,7],[2,8],[5,10],[6,11],[0,6]];function addSpring(a,b){const geo=new THREE.BufferGeometry().setFromPoints([bodies[a].position,bodies[b].position]);const line=new THREE.Line(geo,springMat);line.userData={type:'spring',a,b,stiffness:180,length:bodies[a].position.distanceTo(bodies[b].position)};scene.add(line);springs.push(line)}links.forEach(x=>addSpring(...x));
const mic=new THREE.Group();const micRing=new THREE.Mesh(new THREE.TorusGeometry(.25,.035,10,32),new THREE.MeshStandardMaterial({color:0x8edcf4,emissive:0x17425a,emissiveIntensity:.7}));mic.add(micRing);const micStem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.55,10),micRing.material);micStem.rotation.z=Math.PI/2;micStem.position.x=.32;mic.add(micStem);mic.position.set(2.7,.8,1.5);mic.userData={type:'mic'};scene.add(mic);
const mallet=new THREE.Group();const malletHead=new THREE.Mesh(new THREE.SphereGeometry(.18,20,16),new THREE.MeshStandardMaterial({color:0xf1a46f,emissive:0x6f2d11,emissiveIntensity:.5}));const malletStem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.7,10),new THREE.MeshStandardMaterial({color:0x7a4e32}));malletStem.rotation.z=Math.PI/2;malletStem.position.x=.4;mallet.add(malletHead,malletStem);mallet.position.set(-2.6,1.9,.5);mallet.userData={type:'mallet'};scene.add(mallet);
let selectedBody=bodies[6],selectedSpring=springs[13],mode='select',running=true,draggingBody=null,lastPointer=null,springStart=null;function updateSelection(){bodies.forEach(b=>b.material=b===selectedBody?selectedMat:(b.userData.anchor?anchorMat:bodyMat));springs.forEach(s=>s.material=s===selectedSpring?springSelMat:springMat);document.getElementById('bodyCard').classList.toggle('show',!!selectedBody);document.getElementById('springCard').classList.toggle('show',!!selectedSpring);if(selectedBody){massCtl.value=selectedBody.userData.mass;massOut.value=Math.round(selectedBody.userData.mass);dampCtl.value=Math.round(selectedBody.userData.damping*100);dampOut.value=selectedBody.userData.damping.toFixed(2)}if(selectedSpring){stiffCtl.value=selectedSpring.userData.stiffness;stiffOut.value=Math.round(selectedSpring.userData.stiffness);lengthCtl.value=Math.round(selectedSpring.userData.length*100);lengthOut.value=selectedSpring.userData.length.toFixed(2)}}updateSelection();
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function hitAt(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const bodyHits=ray.intersectObjects(bodies,false);if(bodyHits.length)return bodyHits[0].object;const springHits=ray.intersectObjects(springs,false);if(springHits.length)return springHits[0].object;const misc=ray.intersectObjects([mic,mallet],true);if(misc.length){let o=misc[0].object;while(o.parent&&o.parent!==scene)o=o.parent;return o}return null}
async function ensureAudio(){if(window._audio)return window._audio;const ctx=new AudioContext({latencyHint:'interactive'});const code=`class P extends AudioWorkletProcessor{constructor(){super();this.phase=0;this.amp=0;this.freq=180;this.dec=.9993;this.port.onmessage=e=>{if(e.data.t==='hit'){this.amp=Math.min(1,this.amp+e.data.a);this.freq=e.data.f||this.freq}else if(e.data.t==='param'){this.freq=e.data.f||this.freq;this.dec=e.data.d||this.dec}}}process(i,o){let out=o[0][0];for(let n=0;n<out.length;n++){this.phase+=2*Math.PI*this.freq/sampleRate;this.amp*=this.dec;out[n]=Math.sin(this.phase)*this.amp*.25+Math.sin(this.phase*1.997)*this.amp*.12+Math.sin(this.phase*2.81)*this.amp*.07}return true}}registerProcessor('kinetic',P)`;const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));await ctx.audioWorklet.addModule(url);const node=new AudioWorkletNode(ctx,'kinetic');const comp=new DynamicsCompressorNode(ctx,{threshold:-16,knee:18,ratio:5,attack:.003,release:.18});node.connect(comp).connect(ctx.destination);await ctx.resume();window._audio={ctx,node};return window._audio}
function strike(b,amount=.7){if(!b||b.userData.anchor)return;b.userData.vel.y+=amount*.12;b.userData.vel.x+=(Math.random()-.5)*amount*.05;b.userData.vel.z+=(Math.random()-.5)*amount*.05;ensureAudio().then(a=>{const f=90+420/(Math.sqrt(Math.max(5,b.userData.mass)));a.node.port.postMessage({t:'hit',a:amount,f})})}
renderer.domElement.addEventListener('pointerdown',e=>{const h=hitAt(e);lastPointer={x:e.clientX,y:e.clientY};if(mode==='select'){if(h?.userData.type==='body'){selectedBody=h;selectedSpring=null;draggingBody=h;controls.enabled=false;updateSelection()}else if(h?.userData.type==='spring'){selectedSpring=h;selectedBody=null;updateSelection()}}else if(mode==='mallet'){if(h?.userData.type==='body'){selectedBody=h;selectedSpring=null;updateSelection();strike(h,1)}}else if(mode==='anchor'){if(h?.userData.type==='body'){h.userData.anchor=!h.userData.anchor;h.userData.vel.set(0,0,0);updateSelection()}}else if(mode==='spring'){if(h?.userData.type==='body'){if(!springStart){springStart=h;selectedBody=h;updateSelection()}else if(h!==springStart){addSpring(springStart.userData.index,h.userData.index);selectedSpring=springs[springs.length-1];springStart=null;updateSelection();badge.textContent=bodies.length+' bodies · '+springs.length+' springs'}}}else if(mode==='body'){const p=new THREE.Vector3();ray.ray.at(5,p);const i=bodies.length;anchors.delete(i);addBody([p.x,p.y,p.z],i);selectedBody=bodies[i];selectedSpring=null;updateSelection();badge.textContent=bodies.length+' bodies · '+springs.length+' springs'}else if(mode==='mic'){if(h?.userData.type==='body'){mic.position.copy(h.position).add(new THREE.Vector3(.6,.5,.6))}}});renderer.domElement.addEventListener('pointermove',e=>{if(!draggingBody||!lastPointer)return;const dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;const scale=.006*camera.position.distanceTo(controls.target);const right=new THREE.Vector3();camera.getWorldDirection(right);right.cross(camera.up).normalize();const up=camera.up.clone().normalize();draggingBody.position.addScaledVector(right,dx*scale).addScaledVector(up,-dy*scale);draggingBody.userData.rest.copy(draggingBody.position);lastPointer={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>{draggingBody=null;lastPointer=null;controls.enabled=true});
function step(dt){if(!running)return;for(const s of springs){const a=bodies[s.userData.a],b=bodies[s.userData.b],delta=b.position.clone().sub(a.position),len=Math.max(.001,delta.length()),dir=delta.multiplyScalar(1/len),stretch=len-s.userData.length,k=s.userData.stiffness*.00005,force=dir.multiplyScalar(stretch*k);if(!a.userData.anchor)a.userData.vel.addScaledVector(force,1/Math.max(5,a.userData.mass));if(!b.userData.anchor)b.userData.vel.addScaledVector(force,-1/Math.max(5,b.userData.mass))}for(const b of bodies){if(b.userData.anchor){b.position.copy(b.userData.rest);b.userData.vel.set(0,0,0);continue}const pull=b.userData.rest.clone().sub(b.position).multiplyScalar(.0007);b.userData.vel.add(pull);b.userData.vel.multiplyScalar(Math.max(.88,1-b.userData.damping*.07));b.position.addScaledVector(b.userData.vel,Math.min(2,dt*60))}}
function updateLines(){for(const s of springs){const a=bodies[s.userData.a].position,b=bodies[s.userData.b].position,arr=s.geometry.attributes.position.array;arr[0]=a.x;arr[1]=a.y;arr[2]=a.z;arr[3]=b.x;arr[4]=b.y;arr[5]=b.z;s.geometry.attributes.position.needsUpdate=true}}
let prev=performance.now();function animate(t){requestAnimationFrame(animate);const dt=Math.min(.033,(t-prev)/1000);prev=t;step(dt);updateLines();controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});palette.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;palette.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));hint.textContent=mode==='select'?'drag empty space to orbit · tap a body or spring to edit':mode==='body'?'tap empty space to add a body':mode==='anchor'?'tap a body to toggle anchor':mode==='spring'?'tap two bodies to connect a spring':mode==='mallet'?'tap a body to strike it':'tap a body to move the microphone'});massCtl.oninput=()=>{if(selectedBody){selectedBody.userData.mass=+massCtl.value;massOut.value=massCtl.value}};dampCtl.oninput=()=>{if(selectedBody){selectedBody.userData.damping=+dampCtl.value/100;dampOut.value=selectedBody.userData.damping.toFixed(2)}};stiffCtl.oninput=()=>{if(selectedSpring){selectedSpring.userData.stiffness=+stiffCtl.value;stiffOut.value=stiffCtl.value}};lengthCtl.oninput=()=>{if(selectedSpring){selectedSpring.userData.length=+lengthCtl.value/100;lengthOut.value=selectedSpring.userData.length.toFixed(2)}};playBtn.onclick=()=>{running=!running;playBtn.textContent=running?'❚❚':'▶'};resetBtn.onclick=()=>{bodies.forEach(b=>{b.position.copy(b.userData.rest);b.userData.vel.set(0,0,0)});camera.position.set(6,4.8,7);controls.target.set(0,.4,0);controls.update()};</script></body></html>
