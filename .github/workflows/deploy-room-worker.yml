name: Deploy validated Room Worker
# self-reporting deployment gate plus live Allen auth probe: 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/room-worker/**'
      - '.github/workflows/deploy-room-worker.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-room-live-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Check Cloudflare token without exposing it
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare API token is available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare API token is unavailable in CLOUDFLARE_API_TOKEN or CF_API_TOKEN.'
          fi

      - name: Probe live Allen auth without a credential
        id: allen_auth
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          code=$(curl -sS --connect-timeout 3 --max-time 8 \
            -o /tmp/allen-auth-response.json \
            -w '%{http_code}' \
            "${ROOM_RELAY_URL}/api/allen/auth")
          rc=$?
          set -e
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          echo "curl_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "Allen auth HTTP ${code}; curl rc ${rc}"
          cat /tmp/allen-auth-response.json 2>/dev/null || true
          test "$rc" -eq 0

      - name: Refuse unvalidated Worker source
        id: validate
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        run: |
          node scripts/room_worker_ingest_sim.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('room/worker-ingest-simulator-diagnostic.json'))
          if not d.get('pass'):
              raise SystemExit('Worker source simulator is not green; refusing deployment')
          print('Worker source simulator is green.')
          PY

      - name: Deploy existing room-live-mirror Worker
        id: deploy_worker
        if: steps.creds.outputs.available == 'true' && steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy --config cloudflare/room-worker/wrangler.toml 2>&1 | tee /tmp/room-worker-deploy.txt
          grep -Fq "$ROOM_RELAY_URL" /tmp/room-worker-deploy.txt || {
            echo 'Wrangler did not confirm the expected room-live-mirror workers.dev URL; refusing to ingest.'
            exit 1
          }
          echo 'Wrangler confirmed the expected Room Worker deployment target.'

      - name: Push current Room feed through deployed Worker
        id: ingest
        if: steps.deploy_worker.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          token_json=$(curl -fsS --connect-timeout 3 --max-time 8 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror")
          relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
          test -n "$relay_token"
          ingest=$(curl -fsS --connect-timeout 3 --max-time 8 \
            -X POST \
            -H "Authorization: Bearer ${relay_token}" \
            -H 'Content-Type: application/json' \
            --data-binary @room/feed.json \
            "${ROOM_RELAY_URL}/api/ingest")
          printf '%s\n' "$ingest"
          accepted=$(printf '%s' "$ingest" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("accepted"))).lower())')
          test "$accepted" = true

      - name: Verify live relay now matches the current Room boot
        id: verify
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --connect-timeout 3 --max-time 8 \
            -H 'Origin: https://maaronfanberg-lab.github.io' \
            "${ROOM_RELAY_URL}/api/feed?fresh=$(date +%s)" > /tmp/live-relay.json
          python3 - <<'PY'
          import json
          from datetime import datetime
          local=json.load(open('room/feed.json'))
          raw=json.load(open('/tmp/live-relay.json'))
          remote=raw.get('feed',raw)
          ls=local.get('state',{}); rs=remote.get('state',{})
          def ts(x):
              return datetime.fromisoformat(str(x).replace('Z','+00:00')).timestamp()
          lg=local.get('generated_at') or ls.get('last_run')
          rg=remote.get('generated_at') or rs.get('last_run')
          lag=ts(lg)-ts(rg)
          print(json.dumps({
            'local_boot':ls.get('boot_id'),
            'relay_boot':rs.get('boot_id'),
            'local_cycle':ls.get('cycle'),
            'relay_cycle':rs.get('cycle'),
            'timestamp_lag_seconds':lag,
          },indent=2))
          if ls.get('boot_id') != rs.get('boot_id'):
              raise SystemExit('Relay is still on the wrong Room boot')
          if lag > 90:
              raise SystemExit('Relay is still stale')
          PY

      - name: Write non-secret deployment status
        if: always()
        env:
          CREDS_AVAILABLE: ${{ steps.creds.outputs.available }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ALLEN_AUTH_OUTCOME: ${{ steps.allen_auth.outcome }}
          ALLEN_AUTH_HTTP: ${{ steps.allen_auth.outputs.http_code }}
          ALLEN_AUTH_CURL_RC: ${{ steps.allen_auth.outputs.curl_rc }}
        run: |
          mkdir -p room
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          token_available=os.environ.get('CREDS_AVAILABLE')=='true'
          auth={}
          try:
              auth=json.load(open('/tmp/allen-auth-response.json'))
          except Exception:
              pass
          auth_http=str(os.environ.get('ALLEN_AUTH_HTTP') or '')
          allen_live=(auth_http=='200')
          out={
            'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'worker':'room-live-mirror',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'token_available':token_available,
            'validate':os.environ.get('VALIDATE_OUTCOME') or 'skipped',
            'deploy':os.environ.get('DEPLOY_OUTCOME') or 'skipped',
            'ingest':os.environ.get('INGEST_OUTCOME') or 'skipped',
            'verify':os.environ.get('VERIFY_OUTCOME') or 'skipped',
            'allen_auth_transport':os.environ.get('ALLEN_AUTH_OUTCOME') or 'skipped',
            'allen_auth_http':auth_http,
            'allen_auth_error':auth.get('error'),
            'allen_live':allen_live,
          }
          out['pass']=token_available and out['validate']=='success' and out['deploy']=='success' and out['ingest']=='success' and out['verify']=='success'
          if out['pass']:
              out['state']='deployed-and-verified'
          elif not token_available:
              out['state']='missing-cloudflare-api-token'
          elif out['validate']!='success':
              out['state']='worker-source-validation-failed'
          elif out['deploy']!='success':
              out['state']='wrangler-deploy-failed'
          elif out['ingest']!='success':
              out['state']='relay-ingest-failed'
          else:
              out['state']='relay-verification-failed'
          open('room/cloudflare-deploy-status.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Publish deployment status
        if: always()
        run: |
          git config user.name "room-worker-deployer"
          git config user.email "actions@users.noreply.github.com"
          git add room/cloudflare-deploy-status.json
          git commit -m "Record Room Worker deployment status" || exit 0
          for n in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$n"
          done
          exit 1
