name: Room startup probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-startup-probe-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROOM_PROMPT_PERCEPTION: ${{ secrets.ROOM_PROMPT_PERCEPTION }}
      ROOM_PROMPT_DELIBERATION: ${{ secrets.ROOM_PROMPT_DELIBERATION }}
      ROOM_PROMPT_EXPRESSION: ${{ secrets.ROOM_PROMPT_EXPRESSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Probe current production wrapper without storing dialogue
        run: |
          set -u
          git config user.name "the-room-probe"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .room_model/runtime room
          secret_ok=false
          download_ok=false
          hashes_ok=false
          server_ready=false
          [ -n "${ROOM_PROMPT_PERCEPTION:-}" ] && [ -n "${ROOM_PROMPT_DELIBERATION:-}" ] && [ -n "${ROOM_PROMPT_EXPRESSION:-}" ] && secret_ok=true
          if $secret_ok; then
            if gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'society-brain-q4_0.gguf' --dir .room_model && \
               gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .room_model; then
              download_ok=true
            fi
          fi
          if $download_ok; then
            if echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  .room_model/society-brain-q4_0.gguf' | sha256sum -c - >/dev/null 2>&1 && \
               echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .room_model/llama-runtime-linux-x64.tar.gz' | sha256sum -c - >/dev/null 2>&1; then
              hashes_ok=true
            fi
          fi
          model_pid=""
          if $hashes_ok; then
            tar -xzf .room_model/llama-runtime-linux-x64.tar.gz -C .room_model/runtime
            server_bin=$(find .room_model/runtime -type f -name 'llama-server' | head -1)
            if [ -n "${server_bin:-}" ]; then
              chmod +x "$server_bin"
              env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION -u ROOM_NODE_PROMPT \
                "$server_bin" -m .room_model/society-brain-q4_0.gguf --host 127.0.0.1 --port 18080 -c 16384 -np 2 >.room_model/server.log 2>&1 &
              model_pid=$!
              for attempt in $(seq 1 120); do
                if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18080/health >/dev/null 2>&1; then server_ready=true; break; fi
                if ! kill -0 "$model_pid" 2>/dev/null; then break; fi
                sleep 1
              done
            fi
          fi
          if $server_ready; then
            ROOM_NODE_PROMPT='probe-enabled' ROOM_MODEL_URL='http://127.0.0.1:18080/completion' PYTHONPATH=scripts python3 - <<'PY'
import json, time
from pathlib import Path
import room_engine_v5 as engine
cfg=json.loads(Path('room/config.json').read_text())
state=json.loads(Path('room/state.json').read_text())
conv=json.loads(Path('room/conversation.json').read_text())
context=conv[-5:]
event=context[-1] if context else {'speaker':'mara','text':'What are you thinking about?','cognition':{'target':'sarah'}}
topic=state.get('topic_episode') or {'root':'books','current_facet':'books','facets':['books']}
people=['sarah','mara','owen','jules']
results={}
for entity in people:
    partner=str(event.get('speaker') or 'mara').lower()
    if partner==entity or partner not in people+['allen']:
        partner=next(x for x in people if x!=entity)
    payload={'entity':entity,'profile':cfg['p'][entity],'event':event,'context':context,'topic':topic,'partner':partner,
             'relationship':{'trust':0.1,'direct_familiarity':0.2,'warmth':0.2,'respect':0.2},
             'deliberation':{'action':'BRIDGE','preferred_partner':partner,'focus':topic.get('current_facet') or 'books','new_information_goal':'add one fresh concise point'}}
    t=time.monotonic()
    try:
        obj=engine._private_run('expression',payload,timeout=25)
        text=str((obj or {}).get('utterance') or '')
        results[entity]={'status':'accepted','chars':len(text),'elapsed_ms':round((time.monotonic()-t)*1000)}
    except Exception as exc:
        raw=str(exc)
        reason=raw.rsplit(':',1)[-1].strip() if ':' in raw else type(exc).__name__
        results[entity]={'status':'rejected','reason':reason[:80],'elapsed_ms':round((time.monotonic()-t)*1000)}
Path('.room_model/results.json').write_text(json.dumps(results))
PY
          else
            printf '%s' '{}' > .room_model/results.json
          fi
          [ -n "$model_pid" ] && kill "$model_pid" 2>/dev/null || true
          SECRET_OK="$secret_ok" DOWNLOAD_OK="$download_ok" HASHES_OK="$hashes_ok" SERVER_READY="$server_ready" python3 - <<'PY'
import json, os
from pathlib import Path
results=json.loads(Path('.room_model/results.json').read_text())
out={'probe_version':1,'secret_ok':os.environ['SECRET_OK']=='true','download_ok':os.environ['DOWNLOAD_OK']=='true','hashes_ok':os.environ['HASHES_OK']=='true','server_ready':os.environ['SERVER_READY']=='true','expressions':results}
Path('room/private-model-diagnostic.json').write_text(json.dumps(out,indent=2)+'\n')
PY
          git add room/private-model-diagnostic.json
          git commit -m "Record one-shot Room startup probe" || true
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$attempt"
          done
          exit 1
