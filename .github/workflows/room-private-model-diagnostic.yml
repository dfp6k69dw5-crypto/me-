name: Room live brain promotion validation

on:
  push:
    branches: [room-brain-live-llama32]
    paths:
      - '.github/workflows/room-private-model-diagnostic.yml'
      - '.github/workflows/sarah-society.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: room-brain-live-llama32
          fetch-depth: 1

      - name: Validate production workflow YAML and shell
        run: |
          set -euo pipefail
          ruby - <<'RB'
          require 'yaml'
          path = '.github/workflows/sarah-society.yml'
          doc = YAML.load_file(path)
          jobs = doc['jobs'] || doc[:jobs]
          raise 'jobs missing' unless jobs
          beat = jobs['beat'] || jobs[:beat]
          raise 'beat job missing' unless beat
          steps = beat['steps'] || beat[:steps]
          step = steps.find { |s| (s['name'] || s[:name]).to_s.include?('Keep all 12 cognitive nodes hot') }
          raise 'Room run step missing' unless step
          run = step['run'] || step[:run]
          raise 'Room shell missing' if run.to_s.empty?
          File.write('/tmp/room-production-run.sh', run)
          puts 'yaml-ok'
          RB
          bash -n /tmp/room-production-run.sh
          grep -q 'ROOM_BRAIN_ACTIVE=\$ROOM_BRAIN_ACTIVE' /tmp/room-production-run.sh
          grep -q 'llama3.2-1b' /tmp/room-production-run.sh
          grep -q 'qwen2.5-0.5b-fallback' /tmp/room-production-run.sh
          echo 'production-workflow-syntax-ok'
