name: Room code refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/room_*.py'
      - '.github/workflows/sarah-society.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: room-code-refresh-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Cancel resident Room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && exit 0
            sleep 2
          done
          exit 1

      - name: Apply pending source patch
        run: |
          set -euo pipefail
          if [ -f tools/apply_room_memory_routing_guard.py ]; then python3 tools/apply_room_memory_routing_guard.py; fi
          python3 -m py_compile scripts/room_*.py
          grep -q 'brain_probe()' .github/workflows/sarah-society.yml

      - name: Commit source patch
        run: |
          set -euo pipefail
          git config user.name room-code-refresh
          git config user.email actions@users.noreply.github.com
          git add scripts/room_engine_v5_core.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route Room memories to relevant minds only'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch fresh Room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
