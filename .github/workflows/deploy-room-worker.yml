name: Verify native Room Worker deployment

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/room-worker/**'
      - '.github/workflows/deploy-room-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-room-live-mirror
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate Room Worker source locally
        run: |
          set -euo pipefail
          node scripts/room_worker_ingest_sim.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('room/worker-ingest-simulator-diagnostic.json'))
          if not d.get('pass'):
              raise SystemExit('Worker source simulator is not green')
          print('Worker source simulator is green.')
          PY

      - name: Wait for Cloudflare native Git deployment
        id: live_source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl -fsS --connect-timeout 3 --max-time 8 \
              "${ROOM_RELAY_URL}/?verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/room-viewer.html; then
              if grep -Fq 'roomLastGoodFeedV1' /tmp/room-viewer.html \
                && grep -Fq 'GITHUB FALLBACK' /tmp/room-viewer.html \
                && grep -Fq 'The Room history has not been declared empty.' /tmp/room-viewer.html; then
                echo "Live Worker exposes the resilient Room viewer on attempt ${attempt}."
                echo 'resilient_viewer=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'Cloudflare native deployment did not expose the resilient viewer before verification timeout.'
          exit 1

      - name: Verify live Room feed is present
        id: feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 3 --max-time 8 \
            -H 'Origin: https://maaronfanberg-lab.github.io' \
            "${ROOM_RELAY_URL}/api/feed?fresh=$(date +%s)" \
            > /tmp/live-relay.json
          python3 - <<'PY'
          import json
          raw=json.load(open('/tmp/live-relay.json'))
          feed=raw.get('feed', raw)
          state=feed.get('state') or {}
          conversation=feed.get('conversation') or []
          brain=feed.get('brain') or {}
          if not conversation:
              raise SystemExit('Live Room feed is empty')
          if not state.get('cycle'):
              raise SystemExit('Live Room feed has no cycle')
          print(json.dumps({
              'cycle': state.get('cycle'),
              'messages': len(conversation),
              'boot_id': state.get('boot_id'),
              'brain': brain.get('active'),
              'run_id': brain.get('run_id'),
          }, indent=2))
          PY

      - name: Record verified native deployment
        run: |
          set -euo pipefail
          mkdir -p room
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          raw=json.load(open('/tmp/live-relay.json'))
          feed=raw.get('feed', raw)
          state=feed.get('state') or {}
          brain=feed.get('brain') or {}
          out={
            'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'worker':'room-live-mirror',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'deployment_owner':'cloudflare-github-app',
            'resilient_viewer':True,
            'feed_present':True,
            'cycle':state.get('cycle'),
            'messages':len(feed.get('conversation') or []),
            'brain':brain.get('active'),
            'run_id':brain.get('run_id'),
            'pass':True,
            'state':'native-deployed-and-verified',
          }
          open('room/cloudflare-deploy-status.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          git config user.name "room-worker-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add room/cloudflare-deploy-status.json
          git commit -m "Record verified native Room Worker deployment" || exit 0
          for n in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$n"
          done
          exit 1
