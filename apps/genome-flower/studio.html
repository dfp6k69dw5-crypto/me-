<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0c"><title>Genome Flower Studio</title>
<style>
:root{color-scheme:dark;--bg:#080a0c;--panel:rgba(10,13,16,.9);--line:#2b333a;--text:#f3f5f6;--muted:#94a0a9;--accent:#ddc98a;--green:#9de2c5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation}.top{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;pointer-events:none}.brand{padding:8px 10px;border-radius:13px;background:rgba(4,6,8,.55);backdrop-filter:blur(10px)}.brand b{display:block;font-size:14px}.brand span,.status{display:block;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}.status{text-align:right;max-width:48vw;padding-top:8px;text-shadow:0 1px 5px #000}.dock{position:fixed;z-index:5;left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));padding:9px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.55)}.actions{display:grid;grid-template-columns:1.2fr 1.05fr .95fr .72fr;gap:6px}button{appearance:none;border:1px solid #343d45;background:#151b20;color:var(--text);border-radius:12px;min-height:44px;padding:7px 5px;font-weight:750;font-size:11px;touch-action:manipulation}.mutate{background:#10251e;border-color:#2c5a4a;color:#c9f5df}.primary{background:#292316;border-color:#6d6040;color:#f6e6b1}.metrics{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:5px;margin-top:7px}.metric{padding:6px 7px;border:1px solid #242c32;border-radius:10px;background:rgba(0,0,0,.16);min-width:0}.metric label{display:block;color:#6f7c85;font:8px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.drawer{position:fixed;z-index:7;left:9px;right:9px;bottom:calc(118px + env(safe-area-inset-bottom));max-height:65vh;overflow:auto;display:none;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(8,11,14,.965);backdrop-filter:blur(18px)}.drawer.open{display:block}.drawer h2{font-size:14px;margin:0 0 4px}.drawer p{font-size:10px;line-height:1.45;color:var(--muted);margin:4px 0 10px}.control{display:grid;grid-template-columns:112px 1fr 37px;gap:8px;align-items:center;margin:8px 0}.control label{font-size:10px;color:#c3cbd0}.control output{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;color:var(--accent)}input[type=range]{width:100%;accent-color:#cbb56e}.drawer .buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.seq{font:8px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#9eaab2;background:#050709;padding:8px;border-radius:9px}.traits{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}.traits span:nth-child(odd){color:#75818a}@media(min-width:720px){.drawer{left:50%;right:auto;width:520px;transform:translateX(-50%)}.dock{left:50%;right:auto;width:680px;transform:translateX(-50%)}}
</style></head><body>
<canvas id="stage"></canvas><div class="top"><div class="brand"><b>GENOME FLOWER</b><span id="typeLabel">DNA → development → tissue</span></div><div class="status" id="status">initialising</div></div>
<div class="drawer" id="controls"><h2>Sequence mutation controls</h2><p>These sliders do not directly reshape the flower. They change how the 8,192-base sequence is mutated; the new sequence is then decoded and grown.</p><div id="controlList"></div><div class="buttons"><button id="resetProfile">Reset mutation profile</button><button id="closeControls">Done</button></div></div>
<div class="drawer" id="genomeDrawer"><h2>Genome / phenotype</h2><p id="explain"></p><div class="traits" id="traits"></div><p>Sequence preview</p><div class="seq" id="seq"></div></div>
<div class="dock"><div class="actions"><button id="mutate" class="mutate">Mutate DNA</button><button id="big" class="primary">Big mutation</button><button id="controlsBtn">Sequence sliders</button><button id="undo">Undo</button></div><div class="metrics"><div class="metric"><label>sequence</label><strong id="digest">—</strong></div><div class="metric"><label>changes</label><strong id="changes">0 bases</strong></div><div class="metric"><label>flower type</label><strong id="flowerstat">—</strong></div></div></div>
<script type="module">
import {GrowthCanvas} from '../growth-canvas/growth-canvas.js';
import {FlowerGenome,genomeDifference} from './flower-genome.js';
import {DEFAULT_SEQUENCE_PROFILE,normalizeProfile,mutateSequence} from './sequence-mutation-engine.js';
import {drawPhotorealFlower,classifyFlower} from './photoreal-flower-renderer.js';
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false});const statusEl=document.getElementById('status'),digestEl=document.getElementById('digest'),changesEl=document.getElementById('changes'),flowerstatEl=document.getElementById('flowerstat'),typeLabel=document.getElementById('typeLabel');const controls=document.getElementById('controls'),genomeDrawer=document.getElementById('genomeDrawer'),traitsEl=document.getElementById('traits'),seqEl=document.getElementById('seq'),explainEl=document.getElementById('explain');let genome=new FlowerGenome({seed:(Date.now()^0x5eed1234)>>>0}),history=[],current=null,busy=false,DPR=1,profile={...DEFAULT_SEQUENCE_PROFILE};
function sizeCanvas(){DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(innerWidth*DPR));canvas.height=Math.max(1,Math.floor(innerHeight*DPR));canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(DPR,0,0,DPR,0,0);if(current)paint(current)}addEventListener('resize',sizeCanvas,{passive:true});sizeCanvas();const frame=()=>new Promise(r=>requestAnimationFrame(r));const setStatus=s=>statusEl.textContent=s;
const labels={pressure:'Mutation pressure',cluster:'Clustered changes',transition:'Transition bias',hotspot:'Hotspot targeting',regulatory:'Regulatory targeting',microIndel:'Micro-indels',duplication:'Duplications',inversion:'Inversions',recombination:'Recombination'};function buildControls(){const host=document.getElementById('controlList');host.innerHTML='';for(const k of Object.keys(DEFAULT_SEQUENCE_PROFILE)){const row=document.createElement('div');row.className='control';const lab=document.createElement('label');lab.textContent=labels[k]||k;const input=document.createElement('input');input.type='range';input.min='0';input.max='100';input.step='1';input.value=Math.round(profile[k]*100);input.dataset.key=k;const out=document.createElement('output');out.textContent=input.value;input.oninput=()=>{profile[k]=Number(input.value)/100;out.textContent=input.value};row.append(lab,input,out);host.append(row)}}buildControls();
function configurePetal(genome,dev){const t=genome.traits,gc=new GrowthCanvas({shape:'petal',resolution:20,retainResidual:0,shallowGradient:'freeze',maxGrowthPerStep:.10,maxRotationPerStep:10,seed:genome.digest});const avgD=Array.from(genome.diffusion).reduce((a,b)=>a+b,0)/genome.diffusion.length,avgDecay=Array.from(genome.decay).reduce((a,b)=>a+b,0)/genome.decay.length;gc.addField('AUXIN',{type:'signal',diffusion:.006+avgD*.025,decay:.008+avgDecay*.03,dilutable:true,init:(u,v)=>dev.sampleChannel(0,u,v)});gc.addField('MARGIN',{type:'identity',init:(u,v)=>dev.sampleChannel(2,u,v)>.52?1:0});const w=t.organiserWidth,style=t.polarityStyle;if(style<.34)gc.setOrganisers({plus:(u,v)=>u<w,minus:(u,v)=>u>1-w});else if(style<.68)gc.setOrganisers({plus:(u,v)=>u>1-w,minus:(u,v)=>u<w});else gc.setOrganisers({plus:(u,v)=>u<w&&Math.abs(v)<.48,minus:(u,v)=>u>1-w||Math.abs(v)>1-w*2});const kpar=(u,v,f)=>{const g=dev.growthAt(u,v);return g.kpar*(.82+.34*f.AUXIN)*(1+.12*f.MARGIN)},kper=(u,v,f)=>{const g=dev.growthAt(u,v);return g.kper*(.86+.28*f.AUXIN)*(1+.20*f.MARGIN)};gc.grow(t.growthTime,{kpar,kper,dt:.055});return gc}
function petalBitmap(gc,genome,dev){const bb=gc.bbox(),pad=.05*Math.max(bb.x1-bb.x0,bb.y1-bb.y0),x0=bb.x0-pad,x1=bb.x1+pad,y0=bb.y0-pad,y1=bb.y1+pad,aspect=(y1-y0)/(x1-x0),W=340,H=Math.max(320,Math.min(680,Math.round(W*aspect))),off=document.createElement('canvas');off.width=W;off.height=H;const ox=off.getContext('2d'),im=ox.createImageData(W,H),d=im.data,t=genome.traits;for(let py=0;py<H;py++){const wy=y1-(py+.5)/H*(y1-y0);for(let px=0;px<W;px++){const wx=x0+(px+.5)/W*(x1-x0),m=gc.toMaterial(wx,wy),q=(py*W+px)*4;if(!m){d[q+3]=0;continue}let [r,g,b]=genome.colorAt(m.u,m.v,dev);const edge=clamp((1-Math.abs(m.v))*18)*clamp(m.u*24)*clamp((1-m.u)*34+.2),ridge=Math.pow(Math.max(0,1-Math.abs(m.v)),1.8),sideLight=(.5+.5*m.v)*.045,sheen=t.sheen*Math.pow(Math.max(0,Math.sin((m.u*.83+m.v*.12)*Math.PI)),6)*ridge,micro=(Math.sin(m.u*233+m.v*137+t.phase)+Math.sin(m.u*97-m.v*181-t.phase))*.010;r=clamp(r+sheen*.24+micro+sideLight);g=clamp(g+sheen*.23+micro+sideLight);b=clamp(b+sheen*.27+micro+sideLight);d[q]=r*255;d[q+1]=g*255;d[q+2]=b*255;d[q+3]=255*clamp(edge*(.9+t.translucency*.2))}}ox.putImageData(im,0,0);ox.globalCompositeOperation='source-atop';ox.globalAlpha=.08+t.veinContrast*.28;ox.strokeStyle='rgba(255,255,255,.82)';for(let v=-.84;v<=.84;v+=.14){ox.lineWidth=.55;ox.beginPath();let started=false;for(let u=.06;u<.99;u+=.018){const p=gc.toWorld(u,v*(.28+.72*u));if(!p)continue;const x=(p.x-x0)/(x1-x0)*W,y=(y1-p.y)/(y1-y0)*H;if(!started){ox.moveTo(x,y);started=true}else ox.lineTo(x,y)}ox.stroke()}ox.globalCompositeOperation='source-over';ox.globalAlpha=1;const base=gc.toWorld(0,0)||{x:0,y:0},tip=gc.toWorld(1,0)||{x:0,y:1};return{canvas:off,anchorX:(base.x-x0)/(x1-x0)*W,anchorY:(y1-base.y)/(y1-y0)*H,tipSpan:Math.max(1,Math.abs((y1-base.y)/(y1-y0)*H-(y1-tip.y)/(y1-y0)*H))}}
async function phenotype(g){const t0=performance.now();setStatus('decoding DNA…');await frame();const dev=g.develop({nu:31,nv:31,steps:22});setStatus('growing petal tissue…');await frame();const gc=configurePetal(g,dev);setStatus('building flower architecture…');await frame();const petal=petalBitmap(gc,g,dev);return{genome:g,dev,gc,petal,ms:performance.now()-t0}}
function paint(p){const type=drawPhotorealFlower(ctx,p,{width:innerWidth,height:innerHeight,dpr:DPR});typeLabel.textContent=type.toUpperCase()+' phenotype · DNA → GRN → GPT';flowerstatEl.textContent=`${type} · ${p.genome.traits.petalCount} gene-count cue`}
function updateInfo(p,parent){const s=p.genome.summary(),type=classifyFlower(p.genome);digestEl.textContent=s.digest.toUpperCase();changesEl.textContent=parent?`${genomeDifference(parent,p.genome).bases} bases`:`${s.mutations} total`;flowerstatEl.textContent=type;explainEl.textContent=`${s.bases.toLocaleString()} bases → ${s.genes} regulatory genes → ${s.regulatoryWeights.toLocaleString()} interactions → spatial expression and polarity → finite-element petal growth → ${type} floral architecture.`;const keys=['petalCount','whorls','petalScale','petalAspect','overlap','bilateral','growthTime','anisotropy','marginBoost','hue','spotStrength','stripeStrength','stamenCount'];traitsEl.innerHTML=keys.map(k=>`<span>${k}</span><span>${Number(s[k]).toFixed(k.includes('Count')||k==='whorls'?0:3)}</span>`).join('');seqEl.textContent=p.genome.sequence.slice(0,900)+' …'}
async function regenerate(parent=null){if(busy)return;busy=true;try{const p=await phenotype(genome);current=p;paint(p);updateInfo(p,parent);setStatus(`${p.ms.toFixed(0)} ms · ${p.gc.stats().verts} vertices · ${p.genome.summary().decodedVariables.toLocaleString()} variables`)}catch(e){console.error(e);setStatus('error · '+e.message)}finally{busy=false}}
async function mutate(big=false){if(busy)return;history.push(genome);const parent=genome;genome=mutateSequence(genome,normalizeProfile(profile),big,Date.now());await regenerate(parent)}
document.getElementById('mutate').onclick=()=>mutate(false);document.getElementById('big').onclick=()=>mutate(true);document.getElementById('undo').onclick=async()=>{if(busy||!history.length)return;const old=genome;genome=history.pop();await regenerate(old)};document.getElementById('controlsBtn').onclick=()=>{genomeDrawer.classList.remove('open');controls.classList.toggle('open')};document.getElementById('closeControls').onclick=()=>controls.classList.remove('open');document.getElementById('resetProfile').onclick=()=>{profile={...DEFAULT_SEQUENCE_PROFILE};buildControls()};canvas.onclick=()=>{controls.classList.remove('open');genomeDrawer.classList.remove('open')};document.querySelector('.brand').addEventListener('click',()=>{controls.classList.remove('open');genomeDrawer.classList.toggle('open')});document.querySelector('.brand').style.pointerEvents='auto';regenerate();
</script></body></html>
