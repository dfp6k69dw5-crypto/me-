<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071018">
<title>Things Universe v19</title>
<link rel="stylesheet" href="things-universe-v19.css?v=20260816w">
</head>
<body>
<div class="app">
<header class="top">
  <div class="row"><div class="brand"><b>Things Universe</b><span class="ver">v19</span></div><button class="btn" id="fit">Fit</button><button class="btn" id="reset">Reset</button></div>
  <div class="search"><input id="q" autocomplete="off" placeholder="Type the first idea"><button class="btn" id="add">Add thing</button></div>
  <div class="tools"><button class="btn" id="auto">Auto-grow: off</button><button class="btn" id="explain">Explain bridge</button><button class="btn" id="bridge">Find bridge</button></div>
</header>
<main class="stage" id="stage">
  <canvas id="canvas" aria-label="concept universe"></canvas>
  <div class="empty" id="empty"><div><b>Give me some ideas.</b>Add as many starting ideas as you like. Each concept keeps branching through explicit conceptual relationships.</div></div>
  <div class="bar"><div class="pill pair" id="pair">No starting ideas</div><div class="pill stat" id="status">Ready</div></div>
  <div class="zoomBtns"><button class="btn" id="zm">−</button><button class="btn" id="zp">+</button></div>
  <div class="hud"><div class="pill" id="count">0 nodes</div><div class="pill" id="bc">0 shared</div><div class="pill" id="zoomPct">100%</div></div>
  <div class="think" id="think">Thinking…</div><div class="toast" id="toast"></div>
  <div class="reader" id="reader"><div class="rh"><strong>Conceptual relationship</strong><button class="btn" id="rx">Close</button></div><div class="rb" id="rb"></div></div>
</main>
</div>
<script src="things-universe-v16-data.js?v=20260816w"></script>
<script src="things-universe-v16-sources.js?v=20260816w"></script>
<script src="things-universe-v19-app.js?v=20260816w"></script>
</body>
</html>
