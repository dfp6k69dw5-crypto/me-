name: Record Room and production probe status once

on:
  push:
    branches: [main]
    paths:
      - 'society/room-status2-kick.txt'

permissions:
  contents: write
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 5
      - name: Record workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "room-status"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p room
          printf '{"room":' > room/run-status2.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 5 --json databaseId,status,conclusion,createdAt,event,headSha >> room/run-status2.json
          printf ',"production_probe":' >> room/run-status2.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-production-probe.yml --limit 5 --json databaseId,status,conclusion,createdAt,event,headSha >> room/run-status2.json
          printf '}\n' >> room/run-status2.json
          git rm -f .github/workflows/room-status2-once.yml society/room-status2-kick.txt
          git add room/run-status2.json
          git commit -m "Record Room and production probe status"
          git push origin HEAD:main
