<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111316"><title>PHYSICS WORKBENCH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111316;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui;color:#f4efe8}#engine{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111316}.top{position:fixed;z-index:30;top:calc(env(safe-area-inset-top) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.name{font-size:11px;letter-spacing:.16em;font-weight:700;opacity:.7}.state{font-size:10px;opacity:.45}.palette{position:fixed;z-index:40;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:7px;padding:6px;border-radius:15px;background:rgba(28,25,23,.54);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1)}button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(60,53,49,.72);color:#f5eee7;height:38px;min-width:40px;border-radius:10px;font-size:15px}button.active{background:rgba(128,92,69,.82);border-color:rgba(255,220,194,.65)}.card{position:fixed;z-index:45;top:calc(env(safe-area-inset-top) + 58px);left:14px;width:min(310px,calc(100vw - 28px));padding:11px 12px 12px;border-radius:14px;background:rgba(103,75,61,.74);backdrop-filter:blur(18px);border:1px solid rgba(255,230,214,.18);box-shadow:0 10px 35px rgba(0,0,0,.22);display:none}.card.show{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.title{font-size:11px;font-weight:800;letter-spacing:.08em}.count{font-size:9px;opacity:.65}.row{display:grid;grid-template-columns:72px 1fr 46px;gap:8px;align-items:center;margin:8px 0}.row label{font-size:10px;opacity:.85}.row output{font-size:10px;text-align:right;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#dfb5f5}.hint{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 67px);font-size:10px;opacity:.45;white-space:nowrap;pointer-events:none}.add{font-size:20px;line-height:1}@media(min-width:700px){.card{width:330px}.palette{left:18px}}</style></head><body><iframe id="engine" src="resonator.html?v=workbench1" allow="microphone; autoplay"></iframe><div class="top"><div class="name">PHYSICS WORKBENCH</div><div class="state" id="state">loading</div></div><div class="card" id="card"><div class="head"><span class="title" id="ctitle">BODY</span><span class="count" id="ccount">selected</span></div><div class="row"><label id="l1">Mass</label><input id="r1" type="range" min="0" max="100" value="45"><output id="o1">0.45</output></div><div class="row"><label id="l2">Damping</label><input id="r2" type="range" min="0" max="100" value="20"><output id="o2">0.20</output></div></div><div class="palette" id="palette"><button data-tool="orbit" class="active" aria-label="Orbit">↻</button><button data-tool="move" aria-label="Move">✥</button><button data-tool="link" aria-label="Spring">⌁</button><button data-tool="pin" aria-label="Anchor">⌖</button><button data-tool="strike" aria-label="Strike">●</button><button data-tool="mic" aria-label="Microphone">◉</button><button class="add" id="inspect" aria-label="Inspector">＋</button></div><div class="hint" id="hint">drag anywhere to orbit · pinch to zoom</div><script>(()=>{const f=document.getElementById('engine'),palette=document.getElementById('palette'),card=document.getElementById('card'),stateEl=document.getElementById('state'),hint=document.getElementById('hint'),inspect=document.getElementById('inspect');let d,w,ready=false,patched=false;function q(s){try{return d.querySelector(s)}catch(e){return null}}function tool(n){return q('.tool[data-tool="'+n+'"]')}function choose(n){if(!ready)return;const b=tool(n);if(b)b.click();palette.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool===n));hint.textContent=n==='orbit'?'drag anywhere to orbit · pinch to zoom':n==='move'?'touch a body and drag it':n==='link'?'touch two bodies to connect a spring':n==='pin'?'touch a body to anchor it':n==='strike'?'touch a body to excite it':'touch a body to place the microphone';if(n!=='orbit')showCard(n)}function showCard(n){const title=document.getElementById('ctitle'),l1=document.getElementById('l1'),l2=document.getElementById('l2');card.classList.add('show');if(n==='link'){title.textContent='SPRING';l1.textContent='Stiffness';l2.textContent='Length'}else if(n==='mic'){title.textContent='MICROPHONE';l1.textContent='Gain';l2.textContent='Direction'}else if(n==='strike'){title.textContent='EXCITER';l1.textContent='Impulse';l2.textContent='Hardness'}else{title.textContent=n==='pin'?'ANCHOR':'BODY';l1.textContent='Mass';l2.textContent='Damping'}}function patch(){try{w=f.contentWindow;d=f.contentDocument||w.document}catch(e){return}if(!d||!d.body||!q('#view'))return;ready=true;stateEl.textContent='ready';if(patched)return;patched=true;const s=d.createElement('style');s.textContent=`html,body,#app{height:100%!important;overflow:hidden!important;background:#111316!important}#app{padding:0!important}#brand,#readout,#level,#tabs,#panel,#deck,#tools{display:none!important}#stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:100%!important;background:#111316!important}#view{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;touch-action:none!important}`;d.head.appendChild(s);setTimeout(()=>w.dispatchEvent(new Event('resize')),60);setTimeout(()=>w.dispatchEvent(new Event('resize')),300);choose('orbit')}f.addEventListener('load',()=>{patched=false;setTimeout(patch,120)});let t=setInterval(()=>{patch();if(ready)clearInterval(t)},250);palette.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)choose(b.dataset.tool)});inspect.onclick=()=>card.classList.toggle('show');['r1','r2'].forEach((id,i)=>{const r=document.getElementById(id),o=document.getElementById('o'+(i+1));r.oninput=()=>o.value=(r.value/100).toFixed(2)});})();</script></body></html>
