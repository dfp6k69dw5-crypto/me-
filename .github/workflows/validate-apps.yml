name: Validate project apps

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/live-earth-oracle.html'
      - 'scripts/validate_live_earth_oracle.mjs'
      - '.github/workflows/validate-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Confirm curated launcher exists
        run: test -f index.html
      - name: Validate Live Earth Oracle
        run: node scripts/validate_live_earth_oracle.mjs
