name: Fast Oracle Recorder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-oracle-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record snapshot
        run: node scripts/log_fast_oracle_snapshot.mjs
      - name: Commit snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/fast-oracle; then
            echo 'No snapshot change to commit.'
            exit 0
          fi
          git config user.name 'fast-oracle-recorder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fast-oracle
          git commit -m "Log Fast Oracle snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Unable to push snapshot after retries.' >&2
          exit 1
