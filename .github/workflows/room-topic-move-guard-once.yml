name: Room topic move guard once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_room_topic_move_guard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Apply topic move guard
        run: python3 tools/apply_room_topic_move_guard.py
      - name: Verify topic move guard
        shell: bash
        run: |
          python3 -m py_compile scripts/room_engine_v5.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_engine_v5 as e
          assert 'support' in e._TOPIC_SOCIAL_MOVE_TERMS
          assert 'support' not in e._semantic_cues('I support you and appreciate your support')
          msg={'text':'I support you','cognition':{'move_type':'support','topic_terms':['support','art']}}
          assert e._sanitize_declared_topic_terms(msg) == ['art']
          msg={'text':'The sculpture needs structural support','cognition':{'move_type':'discuss','topic_terms':['sculpture','structural support']}}
          assert 'sculpture' in e._sanitize_declared_topic_terms(msg)
          print('ROOM_TOPIC_MOVE_GUARD_OK')
          PY
      - name: Commit topic move guard
        shell: bash
        run: |
          git config user.name 'room-topic-move-guard'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_engine_v5.py
          git commit -m 'Keep social moves out of Room topic facets' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
