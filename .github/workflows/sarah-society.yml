name: The Room

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Legacy pulse compatibility; ignored because all four entities process every beat
        required: true
        default: auto
        type: choice
        options: [auto, sarah, mara, owen, jules]
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  beat:
    name: continuous 12-node shared cognition
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Keep all 12 cognitive nodes hot and publish every beat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
          ROOM_PROMPT_PERCEPTION: ${{ secrets.ROOM_PROMPT_PERCEPTION }}
          ROOM_PROMPT_DELIBERATION: ${{ secrets.ROOM_PROMPT_DELIBERATION }}
          ROOM_PROMPT_EXPRESSION: ${{ secrets.ROOM_PROMPT_EXPRESSION }}
        run: |
          set -uo pipefail
          git config user.name "the-room"
          git config user.email "actions@users.noreply.github.com"
          git config pull.rebase true
          git fetch origin main
          git reset --hard origin/main

          export ROOM_BRAIN_ACTIVE="llama3.2-1b"
          export ROOM_MODEL_URL="http://127.0.0.1:8080/completion"
          export ROOM_NODE_TIMEOUT_SECONDS="45"
          export ROOM_NODE_KILL_GRACE_SECONDS="5"
          export ROOM_RELAY_CONNECT_TIMEOUT_SECONDS="3"
          export ROOM_RELAY_MAX_TIME_SECONDS="8"
          export ROOM_BEAT_FAILURE_LIMIT="4"

          BRAIN_PATH="$RUNNER_TEMP/llama3.2-1b-instruct-q4_k_m.gguf"
          BRAIN_URL="https://github.com/maaronfanberg-lab/me-/releases/download/llama3.2-1b/llama3.2-1b-instruct-q4_k_m.gguf"
          EXPECTED_SHA="$(cat room/brain/llama3.2-1b.sha256 | awk '{print $1}')"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 -o "$BRAIN_PATH" "$BRAIN_URL"
          echo "$EXPECTED_SHA  $BRAIN_PATH" | sha256sum -c -

          LLAMA_DIR="$RUNNER_TEMP/llama.cpp"
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git "$LLAMA_DIR"
          cmake -S "$LLAMA_DIR" -B "$LLAMA_DIR/build" -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DGGML_CCACHE=OFF
          cmake --build "$LLAMA_DIR/build" --config Release -j2 --target llama-server
          "$LLAMA_DIR/build/bin/llama-server" -m "$BRAIN_PATH" -c 2048 -ngl 0 --host 127.0.0.1 --port 8080 >"$RUNNER_TEMP/llama-server.log" 2>&1 &
          LLAMA_PID=$!
          trap 'kill "$LLAMA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null || { cat "$RUNNER_TEMP/llama-server.log"; exit 1; }

          prompt="${ROOM_PROMPT_EXPRESSION:-${ROOM_PROMPT_DELIBERATION:-${ROOM_PROMPT_PERCEPTION:-room}}}"
          export ROOM_NODE_PROMPT="$prompt"
          mkdir -p room_parts room_work

          run_beat() {
            rm -f room_parts/*.json room_work/*.json
            export ROOM_CYCLE_KEY="$(python3 - <<'PY'
import json
from pathlib import Path
p=Path('room/state.json')
try: s=json.loads(p.read_text())
except Exception: s={}
print(f"{int(s.get('cycle',0))+1}:{__import__('os').environ.get('GITHUB_RUN_ID','local')}")
PY
)"
            for n in 0 3 6 9; do ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase sense & done; wait || return 1
            for n in 1 4 7 10; do ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase sense & done; wait || return 1
            for n in 2 5 8 11; do ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase sense & done; wait || return 1
            python3 scripts/room_engine_v5.py bus || return 1
            for n in 0 3 6 9; do ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-sense.json & done; wait || return 1
            for n in 1 4 7 10; do ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-sense.json & done; wait || return 1
            python3 scripts/room_engine_v5.py bus2 --bus room_work/bus-sense.json || return 1
            for n in 2 5 8 11; do
              ROOM_NODE_ID="$n" ROOM_EXPRESSION_RANK="$((n/3))" python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-recurrent.json || return 1
            done
            python3 scripts/room_private_commit.py || return 1
            python3 scripts/build_room_feed.py || return 1
          }

          publish_relay() {
            curl -fsS --connect-timeout "$ROOM_RELAY_CONNECT_TIMEOUT_SECONDS" --max-time "$ROOM_RELAY_MAX_TIME_SECONDS" -X POST "$ROOM_RELAY_URL/publish" -H 'content-type: application/json' --data-binary @room/feed.json >/dev/null || true
          }
          ack_allen_turns() { true; }

          consecutive_failures=0
          max_failures="$ROOM_BEAT_FAILURE_LIMIT"
          while true; do
            if ! run_beat; then
              consecutive_failures=$((consecutive_failures + 1))
              echo "Room beat failed ($consecutive_failures/$max_failures); resyncing current main"
              if [ "$consecutive_failures" -ge "$max_failures" ]; then
                echo "repeated_beat_failure"
                gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto || true
                exit 1
              fi
              git fetch origin main || true
              git reset --hard origin/main || true
              sleep 3
              continue
            fi
            consecutive_failures=0
            git add room society/live.json
            if git diff --cached --quiet; then continue; fi
            git commit -m "Room cognition v5 attention-routed skills beat"
            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then pushed=1; publish_relay; ack_allen_turns; break; fi
              git fetch origin main || { sleep $((attempt * 2)); continue; }
              if ! git rebase origin/main; then git rebase --abort || true; break; fi
              sleep 1
            done
            if [ "$pushed" -eq 0 ]; then
              echo "Room publish lost its race; discard unpublished local beat and resync to authoritative main"
              git fetch origin main || true
              git reset --hard origin/main || true
              sleep 8
            fi
            sleep 20
          done
