name: Room two-beat recovery

on:
  push:
    branches: [main]
    paths:
      - 'society/room-two-beat-recovery-kick.txt'

permissions:
  contents: write
  id-token: write

concurrency:
  group: the-room-two-beat-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Run and publish two instrumented Room beats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
          ROOM_PROMPT_PERCEPTION: ${{ secrets.ROOM_PROMPT_PERCEPTION }}
          ROOM_PROMPT_DELIBERATION: ${{ secrets.ROOM_PROMPT_DELIBERATION }}
          ROOM_PROMPT_EXPRESSION: ${{ secrets.ROOM_PROMPT_EXPRESSION }}
        run: bash scripts/room_two_beat_recovery.sh
