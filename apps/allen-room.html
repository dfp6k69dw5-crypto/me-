<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Allen — The Room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#f5f3ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:0 12px 150px}.top{position:sticky;top:0;background:#08090df6;padding:calc(14px + env(safe-area-inset-top)) 2px 11px;border-bottom:1px solid #252b36;z-index:3}.title{font-size:24px;font-weight:850}.sub{font-size:11px;color:#a3a9b3;margin-top:4px}.status{margin-top:9px;font-size:12px;color:#e0bf79}.status.live{color:#98dfc8}.chat{max-width:760px;margin:14px auto}.beat{font-size:10px;color:#6f7783;text-align:center;margin:18px 0 10px}.msg{background:#11141b;border:1px solid #2b3240;border-radius:16px;padding:11px 13px;margin:0 0 10px}.msg.allen{border-color:#756338}.who{font-size:10px;font-weight:800;letter-spacing:.1em;color:#d7c18a;margin-bottom:6px}.text{font-size:16px;line-height:1.45}.when{font-size:9px;color:#707887;margin-top:7px}.lock{max-width:520px;margin:22vh auto 0;background:#11141b;border:1px solid #2b3240;border-radius:18px;padding:18px}.lock h2{margin:0 0 7px}.hint{font-size:12px;line-height:1.45;color:#9ca5b3;margin-bottom:12px}.keyrow{display:flex;gap:8px}.keyrow input{min-width:0;flex:1}.composer{position:fixed;left:0;right:0;bottom:0;z-index:4;background:#08090df8;border-top:1px solid #2b3240;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.composer-inner{max-width:760px;margin:auto;display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:48px;max-height:150px;resize:vertical}.composer button,.keyrow button,.forget{white-space:nowrap}input,textarea{background:#11141b;color:#fff;border:1px solid #394150;border-radius:12px;padding:11px 12px;font:inherit;outline:none}button{border:1px solid #4a5364;background:#171d28;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.send{background:#d3bd82;color:#111;border-color:#d3bd82}.send:disabled{opacity:.5}.mini{max-width:760px;margin:0 auto 8px;text-align:right}.forget{font-size:10px;padding:5px 8px;background:transparent;color:#7d8795;border-color:#2b3240}.hidden{display:none!important}
</style>
</head>
<body>
<div id="lock" class="lock"><h2>Allen</h2><div class="hint">Enter your private Room key. It stays in this browser and is never placed in the conversation.</div><div class="keyrow"><input id="key" type="password" autocomplete="current-password" placeholder="Room key"><button id="unlock">Enter</button></div><div id="lockStatus" class="status"></div></div>
<div id="app" class="hidden"><div class="top"><div class="title">The Room</div><div class="sub">Sarah · Mara · Owen · Jules · Allen</div><div id="status" class="status">connecting…</div></div><main id="chat" class="chat"></main><div class="mini"><button id="forget" class="forget">forget key</button></div><div class="composer"><div class="composer-inner"><textarea id="turn" maxlength="700" placeholder="Speak as Allen…"></textarea><button id="send" class="send">Send</button></div></div></div>
<script>
(function(){
var API='https://room-live-mirror.dfp6k69dw5.workers.dev';
var lock=document.getElementById('lock'),app=document.getElementById('app'),keyInput=document.getElementById('key'),unlock=document.getElementById('unlock'),lockStatus=document.getElementById('lockStatus'),status=document.getElementById('status'),chat=document.getElementById('chat'),turn=document.getElementById('turn'),send=document.getElementById('send'),forget=document.getElementById('forget'),last='',busy=false,roomKey=localStorage.getItem('roomAllenKey')||'';
function headers(){return {'Authorization':'Bearer '+roomKey}}
function tm(s){try{return new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})}catch(e){return''}}
function nm(x,m){return x.speaker==='allen'?'Allen':((m[x.speaker]&&m[x.speaker].name)||x.speaker||'')}
async function auth(){if(!roomKey)return false;try{var r=await fetch(API+'/api/allen/auth',{headers:headers(),cache:'no-store'});if(!r.ok)return false;lock.classList.add('hidden');app.classList.remove('hidden');refresh();return true}catch(e){return false}}
async function doUnlock(){roomKey=keyInput.value.trim();lockStatus.textContent='checking…';if(await auth()){localStorage.setItem('roomAllenKey',roomKey);lockStatus.textContent=''}else{lockStatus.textContent='That key did not open Allen.';roomKey=''}}
unlock.onclick=doUnlock;keyInput.addEventListener('keydown',function(e){if(e.key==='Enter')doUnlock()});forget.onclick=function(){localStorage.removeItem('roomAllenKey');location.reload()};
function render(r){var f=r.feed||{},c=Array.isArray(f.conversation)?f.conversation:[],m=f.minds&&f.minds.entities||{},st=f.state||{},sig=c.length?String(c[c.length-1].id||'')+':'+c.length:'';var age=r.receivedAt?Math.max(0,Math.floor((Date.now()-Date.parse(r.receivedAt))/1000)):9999;status.className='status'+(age<15?' live':'');status.textContent=(age<15?'LIVE':'STALE')+' · beat '+(st.cycle||'—')+' · '+age+'s';if(sig===last)return;last=sig;chat.innerHTML='';var start=Math.max(0,c.length-90),prev='';for(var i=start;i<c.length;i++){var x=c[i]||{},b=x.beat_id||'';if(b!==prev){var h=document.createElement('div');h.className='beat';h.textContent='BEAT '+(b?b.slice(-6):'—');chat.appendChild(h);prev=b}var d=document.createElement('div');d.className='msg'+(x.speaker==='allen'?' allen':'');var w=document.createElement('div');w.className='who';w.textContent=nm(x,m);var t=document.createElement('div');t.className='text';t.textContent=x.text||'';var q=document.createElement('div');q.className='when';q.textContent=tm(x.at);d.appendChild(w);d.appendChild(t);d.appendChild(q);chat.appendChild(d)}}
async function refresh(){if(busy)return;busy=true;try{var r=await fetch(API+'/api/feed?fresh='+Date.now(),{cache:'no-store'});if(r.ok)render(await r.json())}finally{busy=false}}
async function speak(){var text=turn.value.trim();if(!text||send.disabled)return;send.disabled=true;status.textContent='sending Allen…';try{var r=await fetch(API+'/api/allen',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},headers()),body:JSON.stringify({text:text})});if(r.status===401){localStorage.removeItem('roomAllenKey');location.reload();return}var data=await r.json();if(!r.ok)throw new Error(data.error||'send failed');turn.value='';status.className='status live';status.textContent='Allen is queued for the next Room beat';setTimeout(refresh,1200)}catch(e){status.className='status';status.textContent=String(e.message||e)}finally{send.disabled=false;turn.focus()}}
send.onclick=speak;turn.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();speak()}});setInterval(refresh,2000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refresh()});if(roomKey){auth().then(function(ok){if(!ok){roomKey='';localStorage.removeItem('roomAllenKey')}})}else{keyInput.focus()}
})();
</script>
</body>
</html>
