name: Record The Room run status once

on:
  push:
    branches: [main]
    paths:
      - 'society/room-status-kick.txt'

permissions:
  contents: write
  actions: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 5
      - name: Record current The Room runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "room-status"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p room
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 8 --json databaseId,status,conclusion,createdAt,event,headSha > room/normal-run-status.json
          git rm -f .github/workflows/room-status-once.yml society/room-status-kick.txt
          git add room/normal-run-status.json
          git commit -m "Record current Room workflow status"
          git push origin HEAD:main
