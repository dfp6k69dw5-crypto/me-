<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07100a">
<title>Genome Flower — DNA to Photograph</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100a;color:#f5f7f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07100a;z-index:1}#photo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#07100a;z-index:10;display:none}#photo.show{display:block}.shade{position:fixed;inset:0;z-index:11;pointer-events:none;display:none;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 24%,transparent 70%,rgba(0,0,0,.42))}.shade.show{display:block}.photoTop{position:fixed;z-index:22;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}.photoTop.show{display:flex}.photoTitle{padding:8px 10px;border-radius:13px;background:rgba(4,8,6,.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}.photoTitle b{display:block;font-size:12px;letter-spacing:.04em}.photoTitle span,#photoStatus{display:block;color:#c0cbc4;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}.photoStatusBox{text-align:right;max-width:52vw;padding:7px 2px;text-shadow:0 1px 5px #000}.photoBar{position:fixed;z-index:25;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(114px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1.45fr .8fr;gap:7px;padding:7px;border:1px solid rgba(73,96,81,.85);border-radius:15px;background:rgba(7,13,9,.91);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.48)}button{appearance:none;border:1px solid #425b4a;background:#13241a;color:#f4f7f4;border-radius:11px;min-height:44px;font-weight:800;font-size:11px;padding:7px}#renderPhoto{background:#efe2b1;color:#1d2118;border-color:#fff0b9}#showDNA{background:#16283a;border-color:#3f5e78;color:#dcebf7}.notice{position:fixed;z-index:24;left:50%;transform:translateX(-50%);bottom:calc(174px + env(safe-area-inset-bottom));width:min(520px,calc(100vw - 24px));padding:8px 10px;border-radius:11px;background:rgba(6,10,8,.83);backdrop-filter:blur(12px);color:#aab9af;font-size:9px;line-height:1.4;text-align:center;pointer-events:none}.notice.hidden{display:none}.spinner{position:fixed;z-index:30;left:50%;top:45%;transform:translate(-50%,-50%);display:none;width:58px;height:58px;border:4px solid rgba(255,255,255,.16);border-top-color:#efe2b1;border-radius:50%;animation:spin .85s linear infinite}.spinner.show{display:block}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@media(min-width:760px){.photoBar{left:50%;right:auto;width:690px;transform:translateX(-50%)}.notice{bottom:174px}}
</style>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<iframe id="core" src="studio-v2.html?v=20260808-photo-botany2" title="Genome Flower DNA controls"></iframe>
<img id="photo" alt="AI-generated photographic rendering of the current genome-derived flower phenotype">
<div class="shade" id="shade"></div>
<div class="photoTop" id="photoTop"><div class="photoTitle"><b>GENOME FLOWER · PHOTOGRAPH</b><span id="photoPhenotype">DNA-derived phenotype</span></div><div class="photoStatusBox"><span id="photoStatus">ready</span></div></div>
<div class="spinner" id="spinner"></div>
<div class="notice" id="notice">Move the DNA sliders in the studio, then tap <b>Generate photograph</b>. The first photo may ask you to sign in/approve image-model use. The procedural flower underneath is only the live DNA preview.</div>
<div class="photoBar"><button id="renderPhoto">GENERATE PHOTOGRAPH</button><button id="showDNA">DNA CONTROLS</button></div>
<script>
(()=>{
'use strict';
const core=document.getElementById('core'),photo=document.getElementById('photo'),shade=document.getElementById('shade'),photoTop=document.getElementById('photoTop'),photoStatus=document.getElementById('photoStatus'),photoPhenotype=document.getElementById('photoPhenotype'),spinner=document.getElementById('spinner'),notice=document.getElementById('notice'),renderBtn=document.getElementById('renderPhoto'),dnaBtn=document.getElementById('showDNA');
let rendering=false,lastPrompt='',lastDigest='';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function doc(){try{return core.contentDocument}catch(e){return null}}
function values(){const d=doc(),o={};if(!d)return o;d.querySelectorAll('#controlList input[type=range][data-key]').forEach(el=>o[el.dataset.key]=Number(el.value)/100);return o}
function val(o,k,f=.5){return Number.isFinite(o[k])?clamp(o[k]):f}
function currentMeta(){const d=doc();return{phenotype:(d&&d.getElementById('flowerstat')?.textContent||'novel flowering plant').trim(),digest:(d&&d.getElementById('digest')?.textContent||'').trim()}}
function level(x,lo='low',mid='moderate',hi='strong'){return x<.32?lo:x>.68?hi:mid}
function pigment(o){const a=val(o,'anthocyanin'),c=val(o,'carotenoid'),g=val(o,'chlorophyll'),sat=val(o,'pigmentSaturation'),light=val(o,'pigmentLightness');let hue='cream to soft neutral';if(a>.62&&c>.58)hue='warm scarlet, coral, orange-red and golden undertones';else if(a>.62)hue='anthocyanin-rich crimson, magenta, violet or blue-purple';else if(c>.58)hue='carotenoid-rich yellow, gold and orange';else if(g>.62)hue='unusual but botanically plausible pale green to chartreuse petal tissue';else if(a>.42)hue='soft pink, mauve or lavender';else if(c>.42)hue='pale yellow to apricot';return `${hue}; ${level(sat,'muted','natural','rich')} saturation; ${light<.34?'deep':light>.68?'pale/luminous':'mid-value'} petal lightness`}
function buildPrompt(){
 const o=values(),m=currentMeta();
 const petalCount=Math.max(3,Math.round(3+val(o,'petalNumber')*45)),whorls=Math.max(1,Math.round(1+val(o,'whorlNumber')*7));
 const bilateral=val(o,'bilateral'),sym=bilateral>.68?'strong bilateral symmetry with clearly different dorsal, lateral and ventral organs':bilateral<.32?'strong radial symmetry':'weak to moderate bilateral bias within an otherwise radial flower';
 const fusion=val(o,'petalFusion'),tube=val(o,'tubeDepth'),lip=val(o,'lipIdentity'),spur=val(o,'spurGrowth');
 const aspect=val(o,'petalAspect'),overlap=val(o,'petalOverlap');
 const cup=val(o,'cupCurvature'),reflex=val(o,'reflex'),twist=val(o,'twist'),ruffle=val(o,'ruffle'),serr=val(o,'serration'),fringe=val(o,'fringe');
 const thick=val(o,'thickness'),cones=val(o,'epidermalCones');
 const spots=val(o,'spots'),stripes=val(o,'stripes'),specks=val(o,'speckles'),throat=val(o,'throatBlotch'),band=val(o,'marginBand'),grad=val(o,'pigmentGradient'),veins=val(o,'venationDensity'),patternScale=val(o,'patternScale');
 const stamens=Math.max(1,Math.round(2+val(o,'stamenNumber')*34)),stamenLen=val(o,'stamenLength'),anther=val(o,'antherSize'),spread=val(o,'filamentSpread'),style=val(o,'styleLength'),stigma=val(o,'stigmaSize'),pollen=val(o,'pollenDisplay'),center=val(o,'centerOpenness');
 const cluster=val(o,'solitaryCluster'),disk=val(o,'compositeDisk'),branch=val(o,'branching'),density=val(o,'clusterDensity'),ped=val(o,'pedicelLength'),bract=val(o,'bractSize'),leaf=val(o,'leafBroadness'),lobing=val(o,'leafLobing');
 const noise=val(o,'developmentalNoise'),asym=val(o,'asymmetry'),scale=val(o,'organScale'),depth=val(o,'depth'),phyllo=val(o,'phyllotaxis'),stability=val(o,'stability'),plasticity=val(o,'plasticity');
 const architecture=[
  `${petalCount} primary petal/tepal initiation cue with about ${whorls} floral whorl${whorls===1?'':'s'}`,
  sym,
  `${fusion>.66?'substantially fused corolla':fusion<.34?'mostly separate petals':'partially fused petal bases'}`,
  `${tube>.66?'deep tubular/campanulate throat':tube<.34?'open shallow throat':'moderate corolla tube'}`,
  `${lip>.62?'a pronounced specialized lower lip/labellum':''}`,
  `${spur>.62?'one or more visible nectar-spur-like extensions':''}`,
  `${aspect>.67?'long narrow petals':aspect<.33?'broad rounded petals':'intermediate petal proportions'}`,
  `${overlap>.67?'heavy petal overlap':overlap<.33?'open petals with little overlap':'moderate overlap'}`
 ].filter(Boolean).join('; ');
 const surface=[`${cup>.66?'strong cupping':cup<.34?'fairly flat presentation':'gentle cupping'}`,`${reflex>.66?'strongly reflexed outer petals':reflex>.38?'some reflexing':'little reflexing'}`,`${twist>.65?'visible torsion/twisting':'subtle petal torsion'}`,`${ruffle>.65?'strongly ruffled margins':ruffle>.36?'gently undulating margins':'mostly smooth margins'}`,`${serr>.65?'fine serration':''}`,`${fringe>.65?'fringed or fimbriate edge':''}`,`${thick>.65?'substantial waxy petal tissue':thick<.33?'very thin translucent petal tissue':'normal petal thickness'}`,`${cones>.62?'fine conical epidermal-cell sparkle/velvety texture':''}`].filter(Boolean).join('; ');
 const patterns=[spots>.55?`${level(spots)} spots`:null,stripes>.55?`${level(stripes)} longitudinal/radial striping`:null,specks>.55?`${level(specks)} fine speckling`:null,throat>.55?`${level(throat)} throat blotch`:null,band>.55?`${level(band)} contrasting margin band`:null,grad>.45?`${level(grad)} pigment gradient from throat/base toward margins`:null,veins>.42?`${level(veins)} visible petal venation`:null,`pattern scale ${patternScale<.35?'fine':patternScale>.7?'coarse':'medium'}`].filter(Boolean).join('; ');
 const repro=`about ${stamens} visible stamens; ${stamenLen>.66?'long exserted':stamenLen<.34?'short recessed':'medium-length'} filaments; ${anther>.66?'large':'moderate'} anthers; ${spread>.62?'widely spreading':'compact'} filament arrangement; ${style>.62?'prominent elongated':'moderate'} style; ${stigma>.62?'large':'small-to-medium'} stigma; ${pollen>.58?'obvious realistic pollen':'subtle pollen'}; ${center>.62?'open exposed reproductive center':'partly enclosed center'}`;
 const support=`${disk>.65?'strong composite-head/disk-floret tendency; ':''}${cluster>.68?'clustered inflorescence with multiple blossoms':cluster<.34?'single dominant bloom':'small loose cluster'}; ${branch>.58?'visible branching flowering stems':'simple support stem'}; ${density>.67?'dense cluster spacing':'natural airy spacing'}; ${ped>.62?'long pedicels':'short-to-medium pedicels'}; ${bract>.58?'visible sepals/bracts':'restrained bracts'}; ${leaf>.62?'broad leaves':'narrow-to-medium leaves'}${lobing>.62?' with clear lobing/dissection':''}`;
 const dev=`natural biological imperfection: ${noise>.68?'high':noise<.32?'low':'moderate'} developmental noise, ${asym>.62?'noticeable but plausible':'subtle'} asymmetry, ${scale>.65?'large':'medium'} organ scale, ${depth>.65?'strong three-dimensional floral depth':'natural three-dimensional depth'}, ${phyllo>.6?'noticeable phyllotactic offset':'regular organ placement'}, ${stability>.65?'high developmental canalization':'moderate developmental stability'}, ${plasticity>.65?'visible individual-to-individual plasticity':'restrained plasticity'}`;
 return `Create a genuinely photorealistic macro botanical photograph of ONE living flowering plant phenotype generated from a synthetic DNA/regulatory-development model. This must look like a real camera photograph, not CGI, not a digital painting, not a 3D render, not vector art.\n\nGenome phenotype neighborhood: ${m.phenotype || 'novel hybrid flowering plant'}. Treat that name only as a loose botanical neighborhood, NEVER as a rigid species template. Obey the genetic phenotype below even when it creates a plausible unfamiliar hybrid.\n\nFLORAL ARCHITECTURE: ${architecture}.\nPETAL GROWTH/SURFACE: ${surface}.\nPIGMENT BIOLOGY: ${pigment(o)}.\nPATTERN FORMATION: ${patterns}.\nREPRODUCTIVE ORGANS: ${repro}.\nINFLORESCENCE / SUPPORT: ${support}.\nDEVELOPMENTAL VARIATION: ${dev}.\n\nRender authentic botanical anatomy: real petal thickness and translucency, subsurface transmitted sunlight, fine veins, realistic stamens/anthers/pollen/pistil, believable sepals, stems and leaves, slight edge wear and tiny natural imperfections. Natural outdoor or greenhouse light, shallow depth of field, realistic lens bokeh, true macro-photo exposure and color response. The bloom should occupy most of the frame. Do not add text, labels, borders, diagrams, fantasy glow, plastic surfaces, impossible floating organs, or decorative illustration effects. Photograph it as though a skilled macro photographer found this genetically unusual but biologically plausible flower growing in a garden.`;
}
function showPhoto(){photo.classList.add('show');shade.classList.add('show');photoTop.classList.add('show');core.style.visibility='hidden';dnaBtn.textContent='DNA CONTROLS'}
function showDNA(){photo.classList.remove('show');shade.classList.remove('show');photoTop.classList.remove('show');core.style.visibility='visible';dnaBtn.textContent='DNA CONTROLS'}
async function renderPhoto(){if(rendering)return;const d=doc();if(!d||!d.querySelector('#controlList input[data-key]')){photoStatus.textContent='DNA engine still loading';return}if(!window.puter?.ai?.txt2img){photoStatus.textContent='image service unavailable';return}rendering=true;spinner.classList.add('show');renderBtn.disabled=true;renderBtn.textContent='GENERATING…';notice.classList.add('hidden');const meta=currentMeta(),prompt=buildPrompt();lastPrompt=prompt;lastDigest=meta.digest;photoStatus.textContent='DNA → phenotype → image model…';photoPhenotype.textContent=(meta.phenotype||'novel phenotype')+' · '+(meta.digest||'');try{const ratio=innerWidth>innerHeight?{w:16,h:9}:{w:9,h:16};const img=await puter.ai.txt2img({prompt,provider:'openai-image-generation',model:'gpt-image-2',quality:'high',ratio});await new Promise((resolve,reject)=>{if(img.complete&&img.naturalWidth)return resolve();img.onload=resolve;img.onerror=reject});photo.src=img.src;showPhoto();photoStatus.textContent='photographic render · current DNA';}catch(err){console.error(err);photoStatus.textContent='photo generation failed';notice.classList.remove('hidden');notice.innerHTML='Photo generation did not complete. The DNA engine is still intact underneath. Try <b>Generate photograph</b> again; the image service may ask you to sign in or approve model use.';}finally{spinner.classList.remove('show');renderBtn.disabled=false;renderBtn.textContent='GENERATE PHOTOGRAPH';rendering=false}}
renderBtn.addEventListener('click',renderPhoto);dnaBtn.addEventListener('click',()=>{if(photo.classList.contains('show'))showDNA();else if(photo.src)showPhoto()});
core.addEventListener('load',()=>{photoStatus.textContent='DNA engine ready · adjust sliders';});
window.__GENOME_PHOTO_TEST__={buildPrompt,values,currentMeta,get lastPrompt(){return lastPrompt},get lastDigest(){return lastDigest}};
})();
</script>
</body></html>
