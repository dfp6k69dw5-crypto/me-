const GENERIC=[['system','can be viewed as'],['pattern','can involve'],['culture','can influence'],['history','has'],['meaning','can carry'],['structure','can have']];
let nodes=[],edges=[],rootA=null,rootB=null,round=0,bridgeCount=0,auto=false,busy=false,token=0;
const sideState={A:{seen:new Set(),queue:[],expanded:new Set()},B:{seen:new Set(),queue:[],expanded:new Set()}},cache=new Map();
const key=s=>String(s||'').toLowerCase().trim().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ').slice(0,70);
const label=s=>String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const id=()=> 'n'+Math.random().toString(36).slice(2,9);
const byId=x=>nodes.find(n=>n.id===x),byKey=k=>nodes.find(n=>n.k===k);
function side(n){return n.a&&n.b?'both':n.a?'A':n.b?'B':''}
function jitter(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%10000)/10000-.5}
function newPos(s,parent,k){let w=$('#stage').clientWidth||700,h=$('#stage').clientHeight||500;if(parent&&Number.isFinite(parent.x))return{x:parent.x+55+jitter(k+'x')*90,y:parent.y+jitter(k+'y')*120};return s==='A'?{x:w*.28,y:h*.5}:{x:w*.72,y:h*.5}}
function node(term,s='',parent=null,rel='related to'){
  let k=key(term),n=byKey(k),was=!!n;if(!n){let p=newPos(s,parent,k);n={id:id(),k,l:label(term),a:false,b:false,bridge:false,parentA:null,parentB:null,relA:'',relB:'',depthA:99,depthB:99,x:p.x,y:p.y};nodes.push(n)}
  if(s==='A'){n.a=true;if(parent&&n.parentA==null){n.parentA=parent.id;n.relA=rel;n.depthA=(parent.depthA<99?parent.depthA:0)+1}else if(!parent)n.depthA=0}

  if(was&&n.a&&n.b)markBridge(n,false);return n
}

async function semantic(term){let k=key(term);if(cache.has(k))return cache.get(k);let m=new Map();for(const [w,r] of KNOW[k]||[])m.set(key(w),{k:key(w),l:label(w),r,score:210-m.size*9,src:'local'});try{let ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),3500),res=await fetch(`${DM}?ml=${encodeURIComponent(k)}&max=65`,{signal:ctl.signal});clearTimeout(to);if(res.ok)for(const x of await res.json()){let q=key(x.word);if(q&&q!==k&&!m.has(q)&&q.length>1)m.set(q,{k:q,l:label(x.word),r:'semantically related to',score:Math.log10((x.score||1)+10)*25,src:'net'})}}catch{}if(!m.size)for(const [w,r] of GENERIC)m.set(key(w),{k:key(w),l:label(w),r,score:40-m.size,src:'generic'});let out=[...m.values()].sort((a,b)=>b.score-a.score);cache.set(k,out);return out}

async function sharedBridge(){if(round<4||!rootA||!rootB)return 0;let ak=sideState.A.queue.filter(k=>!sideState.A.expanded.has(k)).slice(0,5),bk=sideState.B.queue.filter(k=>!sideState.B.expanded.has(k)).slice(0,5);if(!ak.length||!bk.length)return 0;let ma=new Map(),mb=new Map();for(const q of ak)for(const x of (await semantic(q)).slice(0,30))if(!ma.has(x.k))ma.set(x.k,{...x,from:q});for(const q of bk)for(const x of (await semantic(q)).slice(0,30))if(!mb.has(x.k))mb.set(x.k,{...x,from:q});let best=null;for(const [k,a] of ma){let b=mb.get(k);if(!b||k===rootA.k||k===rootB.k)continue;let score=a.score+b.score;if(!best||score>best.score)best={k,a,b,score}}if(!best||best.score<100)return 0;let pa=byKey(best.a.from),pb=byKey(best.b.from),n=byKey(best.k)||node(best.a.l);n.a=n.b=true;n.parentA=n.parentA||pa?.id;n.parentB=n.parentB||pb?.id;n.relA=n.relA||best.a.r;n.relB=n.relB||best.b.r;addEdge(pa,n,best.a.r,'A',true);addEdge(pb,n,best.b.r,'B',true);sideState.A.seen.add(n.k);sideState.B.seen.add(n.k);if(!sideState.A.queue.includes(n.k))sideState.A.queue.push(n.k);if(!sideState.B.queue.includes(n.k))sideState.B.queue.push(n.k);markBridge(n);render();return 1}
async function doRound(){if(busy||!rootA)return 0;busy=true;round++;thinking(true,'Round '+round+'…');let added=0;try{added+=await expand('A',rootB?5:7);if(rootB)added+=await expand('B',5);if(rootB)await sharedBridge();ui(`Round ${round}: +${added}`);return added}catch(e){ui('Retrying next round');return 0}finally{busy=false;thinking(false)}}
async function sprout(n,s,limit=8){thinking(true,'Sprouting '+n.l+'…');let added=0;for(const c of (await semantic(n.k)).slice(0,limit)){let ex=!!byKey(c.k),q=node(c.l,s,n,c.r);addEdge(n,q,c.r,s,false);sideState[s].seen.add(q.k);if(!sideState[s].queue.includes(q.k))sideState[s].queue.push(q.k);if(!ex)added++}render();thinking(false);ui('Sprouted '+added)}
async function addThing(t){let s=!rootA?'A':!rootB?'B':'';if(!s){toast('Reset to start a new pair');return}let n=node(t,s);if(s==='A')rootA=n;else rootB=n;sideState[s].seen.add(n.k);sideState[s].queue.push(n.k);render();await sprout(n,s,8);if(rootA&&rootB){resetFrontiers();round=0;ui('Two islands ready')}setTimeout(fitGraph,220)}

async function findBridge(){if(!rootA||!rootB){toast('Add two ideas first');return}let before=bridgeCount;$('#bridge').disabled=true;for(let i=0;i<20;i++){await doRound();if(bridgeCount>before&&i>2)break}$('#bridge').disabled=false;if(bridgeCount>before)explain();else toast('No bridge yet — keep growing')}
function neighbors(id){return edges.map(e=>{let s=e.source?.id||e.source,t=e.target?.id||e.target;return s===id?t:t===id?s:null}).filter(Boolean)}

function explain(){if(!rootA||!rootB){toast('Add two ideas first');return}let p=path(rootA,rootB),h=`<h2>${rootA.l} ↔ ${rootB.l}</h2>`;if(!p)h+=`<div class="box"><strong>Still separate</strong><p>${round} growth rounds. The two territories are still separate islands.</p></div>`;else{let z='';for(let i=0;i<p.length-1;i++){let e=edgeBetween(p[i],p[i+1]);z+=`<li><b>${p[i].l}</b> — ${e?.rel||'related to'} → <b>${p[i+1].l}</b></li>`}h+=`<div class="box"><strong>Bridge found</strong><ul>${z}</ul></div>`}h+=`<div class="box"><p>These are exploratory semantic relationships, not proof of causation.</p></div>`;$('#rb').innerHTML=h;$('#reader').classList.add('open')}

const zoom=d3.zoom().scaleExtent([.015,40]).on('zoom',e=>{currentTransform=e.transform;g.attr('transform',e.transform);$('#zoomPct').textContent=Math.round(e.transform.k*100)+'%'});svg.call(zoom);
let sim=d3.forceSimulation().force('link',d3.forceLink().id(d=>d.id).distance(d=>d.bridge?105:88).strength(d=>d.bridge?.5:.34)).force('charge',d3.forceManyBody().strength(-230)).force('collision',d3.forceCollide(d=>d.bridge?18:13)).alphaDecay(.035).velocityDecay(.36);
function nodeFill(n){return n.bridge?'#c6a7ff':side(n)==='A'?'#76e2d8':side(n)==='B'?'#d8c985':'#9cb1c9'}
function render(){let w=$('#stage').clientWidth,h=$('#stage').clientHeight;sim.force('center',d3.forceCenter(w/2,h/2));let L=lg.selectAll('line').data(edges,d=>`${d.source?.id||d.source}-${d.target?.id||d.target}`);L.exit().remove();L=L.enter().append('line').attr('stroke-width',d=>d.bridge?1.8:1.05).merge(L).attr('class',d=>'link'+(d.bridge?' bridge':''));let E=eg.selectAll('text').data(edges,d=>`${d.source?.id||d.source}-${d.target?.id||d.target}`);E.exit().remove();E=E.enter().append('text').attr('class','edgeText').merge(E).text(d=>d.rel);let N=ng.selectAll('g').data(nodes,d=>d.id);N.exit().remove();let en=N.enter().append('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.18).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));en.append('circle');en.append('text').attr('x',11).attr('y',3);en.on('click',(e,d)=>{e.stopPropagation();$('#tag').textContent=d.bridge?'bridge concept':side(d)==='A'?'A territory':'B territory';$('#ct').textContent=d.l;semantic(d.k).then(a=>$('#cd').textContent=a.length?'Nearby: '+a.slice(0,7).map(x=>x.l).join(', '):'No nearby concepts loaded.');$('#card').classList.add('open')});N=en.merge(N);N.select('circle').attr('r',d=>d===rootA||d===rootB?12:d.bridge?9:6.5).attr('fill',nodeFill);N.select('text').text(d=>d.l.length>31?d.l.slice(0,29)+'…':d.l);sim.nodes(nodes).on('tick',()=>{L.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);E.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);N.attr('transform',d=>`translate(${d.x},${d.y})`)});sim.force('link').links(edges);sim.alpha(.72).restart();ui()}
function fitGraph(){if(!nodes.length)return;let box=g.node().getBBox(),w=$('#stage').clientWidth,h=$('#stage').clientHeight;if(!box.width||!box.height)return;let k=Math.max(.015,Math.min(2,.88/Math.max(box.width/w,box.height/h,.001))),x=w/2-k*(box.x+box.width/2),y=h/2-k*(box.y+box.height/2);svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(x,y).scale(k))}
function resize(){let w=$('#stage').clientWidth,h=$('#stage').clientHeight;svg.attr('viewBox',`0 0 ${w} ${h}`);sim.force('center',d3.forceCenter(w/2,h/2)).alpha(.18).restart()}
$('#add').onclick=()=>{let v=$('#q').value.trim();if(v){$('#q').value='';addThing(v)}};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#add').click()}});$('#auto').onclick=toggleAuto;$('#bridge').onclick=findBridge;$('#explain').onclick=explain;$('#fit').onclick=fitGraph;$('#zp').onclick=()=>svg.transition().duration(160).call(zoom.scaleBy,1.55);$('#zm').onclick=()=>svg.transition().duration(160).call(zoom.scaleBy,1/1.55);$('#cx').onclick=()=>$('#card').classList.remove('open');$('#rx').onclick=()=>$('#reader').classList.remove('open');$('#reset').onclick=()=>{auto=false;token++;nodes=[];edges=[];rootA=rootB=null;round=bridgeCount=0;for(const s of ['A','B']){sideState[s].seen=new Set();sideState[s].queue=[];sideState[s].expanded=new Set()}$('#auto').classList.remove('on');$('#auto').textContent='Auto-grow: off';$('#card').classList.remove('open');lg.selectAll('*').remove();eg.selectAll('*').remove();ng.selectAll('*').remove();svg.call(zoom.transform,d3.zoomIdentity);render();ui('Ready')};
function vv(){document.documentElement.style.setProperty('--h',Math.round(window.visualViewport?.height||innerHeight)+'px');requestAnimationFrame(resize)}window.visualViewport?.addEventListener('resize',vv);window.visualViewport?.addEventListener('scroll',vv);addEventListener('resize',vv);vv();resize();render();ui('Ready');
</script>
