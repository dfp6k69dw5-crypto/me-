name: Room maintenance supervisor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sarah-society.yml'
      - '.github/workflows/room-warm-runner-simulator.yml'
      - 'scripts/room_warm_runner_watchdog_sim.py'
      - 'scripts/room_*.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: room-maintenance-supervisor
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Clear previous diagnostic
        run: rm -f room/warm-runner-watchdog-diagnostic.json
      - name: Run deterministic hung-node simulator
        id: simulator
        continue-on-error: true
        run: python3 scripts/room_warm_runner_watchdog_sim.py
      - name: Publish simulator diagnostic
        if: always()
        run: |
          test -f room/warm-runner-watchdog-diagnostic.json || printf '%s\n' '{"pass":false,"error":"watchdog simulator produced no diagnostic"}' > room/warm-runner-watchdog-diagnostic.json
          git config user.name "room-warm-runner-simulator"
          git config user.email "actions@users.noreply.github.com"
          git add room/warm-runner-watchdog-diagnostic.json
          git commit -m "Record Room warm-runner watchdog diagnostic" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$n"
          done
          exit 1
      - name: Enforce simulator result
        if: always()
        env:
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
        run: test "$SIMULATOR_OUTCOME" = success

  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Verify Room Python
        run: python3 -m py_compile scripts/room_*.py
      - name: Replace resident Room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && break
            sleep 2
          done
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
          [ "$active" -eq 0 ] || exit 1
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
