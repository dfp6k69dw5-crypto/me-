<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07100a"><title>Genome Flower — DNA to Photograph</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100a;color:#f5f7f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07100a;z-index:1}#photo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#07100a;z-index:10;display:none}#photo.show{display:block}.shade{position:fixed;inset:0;z-index:11;pointer-events:none;display:none;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 24%,transparent 70%,rgba(0,0,0,.42))}.shade.show{display:block}.photoTop{position:fixed;z-index:22;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}.photoTop.show{display:flex}.photoTitle{padding:8px 10px;border-radius:13px;background:rgba(4,8,6,.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}.photoTitle b{display:block;font-size:12px;letter-spacing:.04em}.photoTitle span,#photoStatus{display:block;color:#c0cbc4;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px}.photoStatusBox{text-align:right;max-width:52vw;padding:7px 2px;text-shadow:0 1px 5px #000}.photoBar{position:fixed;z-index:25;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(114px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1.45fr .8fr;gap:7px;padding:7px;border:1px solid rgba(73,96,81,.85);border-radius:15px;background:rgba(7,13,9,.91);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.48)}button{appearance:none;border:1px solid #425b4a;background:#13241a;color:#f4f7f4;border-radius:11px;min-height:44px;font-weight:800;font-size:11px;padding:7px}#renderPhoto{background:#efe2b1;color:#1d2118;border-color:#fff0b9}#showDNA{background:#16283a;border-color:#3f5e78;color:#dcebf7}.notice{position:fixed;z-index:24;left:50%;transform:translateX(-50%);bottom:calc(174px + env(safe-area-inset-bottom));width:min(520px,calc(100vw - 24px));padding:8px 10px;border-radius:11px;background:rgba(6,10,8,.83);backdrop-filter:blur(12px);color:#aab9af;font-size:9px;line-height:1.4;text-align:center;pointer-events:none}.notice.hidden{display:none}.spinner{position:fixed;z-index:30;left:50%;top:45%;transform:translate(-50%,-50%);display:none;width:58px;height:58px;border:4px solid rgba(255,255,255,.16);border-top-color:#efe2b1;border-radius:50%;animation:spin .85s linear infinite}.spinner.show{display:block}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@media(min-width:760px){.photoBar{left:50%;right:auto;width:690px;transform:translateX(-50%)}.notice{bottom:174px}}</style></head><body>
<iframe id="core" src="studio-v2.html?v=20260808-photo-botany2" title="Genome Flower DNA controls"></iframe>
<img id="photo" alt="AI-generated photographic rendering of the current genome-derived flower phenotype">
<div class="shade" id="shade"></div><div class="photoTop" id="photoTop"><div class="photoTitle"><b>GENOME FLOWER · PHOTOGRAPH</b><span id="photoPhenotype">DNA-derived phenotype</span></div><div class="photoStatusBox"><span id="photoStatus">DNA engine loading…</span></div></div><div class="spinner" id="spinner"></div>

</body></html>
