<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050608"><title>OMEF FULL — loading</title><style>html,body{margin:0;min-height:100%;background:#050608;color:#f4f2eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}.boot b{display:block;font-size:28px;letter-spacing:-.03em}.boot span{display:block;color:#8e98a7;margin-top:8px}.err{color:#efb1a8;white-space:pre-wrap}</style></head>
<body><div class="boot" id="boot"><div><b>OMEF FULL</b><span>assembling the 123-D organism + sculpting engine…</span></div></div><script>
(async()=>{try{const tag='20260807b';const urls=Array.from({length:6},(_,i)=>`omef-full/part${i}.txt?v=${tag}`);const [parts,sculpt]=await Promise.all([Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u}: ${r.status}`);return r.text()})),fetch(`omef-full/sculpt-v2.js?v=${tag}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`sculpt-v2.js: ${r.status}`);return r.text()})]);let html=parts.join('');if(!html.includes('<title>OMEF FULL — Total-State Attractor</title>')||!html.includes('state vector = 123 dimensions')||!html.includes('</html>'))throw new Error('OMEF FULL assembly integrity check failed');if(!sculpt.includes('window.__OMEF_SCULPT__')||!sculpt.includes('Sculpt the organism'))throw new Error('OMEF FULL sculpt integrity check failed');const close='</scr'+'ipt>';const marker='})();\n'+close;const at=html.lastIndexOf(marker);if(at<0)throw new Error('OMEF FULL injection point not found');html=html.slice(0,at)+'\n'+sculpt+'\n'+marker+html.slice(at+marker.length);document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>OMEF FULL could not assemble</b><span class="err">'+String(e).replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))+'</span></div>';console.error(e)}})();
</script></body></html>
