name: The Room

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Legacy pulse compatibility; ignored because all four entities process every beat
        required: true
        default: auto
        type: choice
        options: [auto, sarah, mara, owen, jules]
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  beat:
    name: continuous 12-node shared cognition
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Keep all 12 cognitive nodes hot and publish every beat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
        run: |
          set -uo pipefail
          git config user.name "the-room"
          git config user.email "actions@users.noreply.github.com"

          stop_at=$((SECONDS + 19800))
          beat_seq=0
          relay_token=""
          relay_token_refresh_at=0

          publish_relay() {
            [ -n "${ROOM_RELAY_URL:-}" ] || return 0

            now=$(date +%s)
            if [ -z "$relay_token" ] || [ "$now" -ge "$relay_token_refresh_at" ]; then
              token_json=$(curl -fsS \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror") || {
                  echo "Cloudflare relay token unavailable; Room continues normally"
                  return 0
                }
              relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
              if [ -z "$relay_token" ]; then
                echo "Cloudflare relay token was empty; Room continues normally"
                return 0
              fi
              relay_token_refresh_at=$((now + 240))
            fi

            if ! curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${relay_token}" \
              -H "Content-Type: application/json" \
              --data-binary @room/feed.json \
              "${ROOM_RELAY_URL%/}/api/ingest" >/dev/null; then
              echo "Cloudflare relay unavailable; Room continues normally"
            fi
            return 0
          }

          run_beat() {
            beat_seq=$((beat_seq + 1))
            export ROOM_CYCLE_KEY="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${beat_seq}"
            rm -rf room_parts room_work
            mkdir -p room_parts room_work

            pids=()
            for n in $(seq 0 11); do
              (
                export ROOM_NODE_ID="$n"
                python3 scripts/room_engine.py node --phase sense
              ) &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do
              wait "$pid" || failed=1
            done
            [ "$failed" -eq 0 ] || return 1

            python3 scripts/room_engine.py bus || return 1

            pids=()
            for n in $(seq 0 11); do
              (
                export ROOM_NODE_ID="$n"
                python3 scripts/room_engine.py node --phase recurrent --bus room_work/bus-sense.json
              ) &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do
              wait "$pid" || failed=1
            done
            [ "$failed" -eq 0 ] || return 1

            python3 scripts/room_engine.py commit || return 1
            python3 scripts/build_room_feed.py || return 1
          }

          while [ "$SECONDS" -lt "$stop_at" ]; do
            if ! run_beat; then
              echo "A Room beat failed internally; retrying on the same warm runner"
              sleep 3
              continue
            fi

            git add room society/live.json
            if git diff --cached --quiet; then
              continue
            fi

            git commit -m "Room cognition v4 shared beat"

            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                pushed=1
                publish_relay
                break
              fi

              echo "Push attempt $attempt collided with a newer main; rebasing"
              if ! git fetch origin main; then
                sleep $((attempt * 2))
                continue
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase cleanly; leaving the state intact and retrying shortly"
                break
              fi
              sleep 1
            done

            if [ "$pushed" -eq 0 ]; then
              echo "Beat is locally committed but not published yet; cooling briefly"
              sleep 8
            fi
          done

          echo "Warm Room runner is handing itself to a fresh runner"
          for attempt in 1 2 3 4 5; do
            if gh workflow run sarah-society.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f entity=auto; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          exit 0
