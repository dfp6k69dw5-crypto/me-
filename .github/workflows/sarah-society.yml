name: Sarah Society

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Who gets the next three-node turn?
        required: true
        default: auto
        type: choice
        options:
          - auto
          - sarah
          - mara
          - owen
          - jules

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: sarah-society-world-main
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      entity: ${{ steps.pick.outputs.entity }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        name: Choose who is active
        env:
          FORCED_ENTITY: ${{ github.event.inputs.entity || 'auto' }}
        run: python3 scripts/society_select.py

  nodes:
    needs: select
    if: needs.select.outputs.entity != 'rest'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node: [0, 1, 2]
    steps:
      - uses: actions/checkout@v6
      - name: Load GitHub-held brain and runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p society_model runtime
          gh release view society-brain-v1 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'society-brain-q4_0.gguf' --dir society_model
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir runtime
          tar -xzf runtime/llama-runtime-linux-x64.tar.gz -C runtime
          completion="$(find runtime -type f -name 'llama-completion' | head -n 1)"
          test -n "$completion"
          chmod +x "$completion"
          echo "LLAMA_COMPLETION=$GITHUB_WORKSPACE/$completion" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/$(dirname "$completion")" >> "$GITHUB_ENV"
          echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  society_model/society-brain-q4_0.gguf' | sha256sum -c -
      - name: Node ${{ matrix.node }} thinks locally
        env:
          ENTITY_ID: ${{ needs.select.outputs.entity }}
          NODE_ID: ${{ matrix.node }}
          SOCIETY_MODEL_PATH: ${{ github.workspace }}/society_model/society-brain-q4_0.gguf
        run: python3 scripts/society_node.py
      - uses: actions/upload-artifact@v4
        with:
          name: society-${{ needs.select.outputs.entity }}-node-${{ matrix.node }}
          path: society_parts/*.json
          retention-days: 1

  commit-turn:
    needs: [select, nodes]
    if: needs.select.outputs.entity != 'rest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: society-${{ needs.select.outputs.entity }}-node-*
          path: society_parts
          merge-multiple: true
      - name: Resolve three nodes into one entity turn
        env:
          ENTITY_ID: ${{ needs.select.outputs.entity }}
        run: python3 scripts/society_commit.py
      - name: Commit the continuing world
        run: |
          git config user.name "sarah-society"
          git config user.email "actions@users.noreply.github.com"
          git add society
          git commit -m "Society turn: ${{ needs.select.outputs.entity }}" || true
          git pull --rebase origin main
          git push origin HEAD:main

  publish-room:
    needs: commit-turn
    if: needs.commit-turn.result == 'success'
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newest world
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload newest Room
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy newest Room
        id: deployment
        uses: actions/deploy-pages@v4
