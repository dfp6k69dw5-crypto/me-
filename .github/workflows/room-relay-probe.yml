name: Room relay transport probe
# source-only publish after green simulator: 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-relay-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply only the boot-aware ingest patch in the checkout
        run: python3 scripts/apply_room_worker_reboot_fix.py

      - name: Execute actual patched RoomState.putLatest
        id: worker_sim
        continue-on-error: true
        run: node scripts/room_worker_ingest_sim.mjs

      - name: Publish only validated Worker source
        if: steps.worker_sim.outcome == 'success'
        run: |
          git config user.name "room-relay-probe"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/room-worker/src/index.js
          git commit -m "Apply Room Worker boot-aware feed ordering" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$n"
          done
          exit 1

      - name: Enforce patched simulator result
        if: always()
        env:
          SIMULATOR_OUTCOME: ${{ steps.worker_sim.outcome }}
        run: test "$SIMULATOR_OUTCOME" = success
