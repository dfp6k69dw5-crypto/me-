name: The Room

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Legacy pulse compatibility; ignored because all four entities process every beat
        required: true
        default: auto
        type: choice
        options: [auto, sarah, mara, owen, jules]
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  beat:
    name: continuous 12-node shared cognition
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Keep all 12 cognitive nodes hot and publish every beat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
          ROOM_PROMPT_PERCEPTION: ${{ secrets.ROOM_PROMPT_PERCEPTION }}
          ROOM_PROMPT_DELIBERATION: ${{ secrets.ROOM_PROMPT_DELIBERATION }}
          ROOM_PROMPT_EXPRESSION: ${{ secrets.ROOM_PROMPT_EXPRESSION }}
        run: |
          set -uo pipefail
          git config user.name "the-room"
          git config user.email "actions@users.noreply.github.com"

          # Private prompts are optional runtime secrets. If all three are present,
          # one runner-local model server is shared while each process receives only its own role prompt.
          export ROOM_MODEL_URL=""
          model_pid=""
          if [ -n "${ROOM_PROMPT_PERCEPTION:-}" ] && [ -n "${ROOM_PROMPT_DELIBERATION:-}" ] && [ -n "${ROOM_PROMPT_EXPRESSION:-}" ]; then
            mkdir -p .room_model/runtime
            gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'society-brain-q4_0.gguf' --dir .room_model
            gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .room_model
            echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  .room_model/society-brain-q4_0.gguf' | sha256sum -c -
            echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .room_model/llama-runtime-linux-x64.tar.gz' | sha256sum -c -
            tar -xzf .room_model/llama-runtime-linux-x64.tar.gz -C .room_model/runtime
            server_bin=$(find .room_model/runtime -type f -name 'llama-server' | head -1)
            if [ -n "$server_bin" ]; then
              chmod +x "$server_bin"
              env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION -u ROOM_NODE_PROMPT \
                "$server_bin" -m .room_model/society-brain-q4_0.gguf --host 127.0.0.1 --port 18080 -c 8192 -np 4 >.room_model/server.log 2>&1 &
              model_pid=$!
              for attempt in $(seq 1 120); do
                if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
                  export ROOM_MODEL_URL='http://127.0.0.1:18080/completion'
                  break
                fi
                if ! kill -0 "$model_pid" 2>/dev/null; then break; fi
                sleep 1
              done
            fi
            if [ -z "$ROOM_MODEL_URL" ]; then
              echo "Private local model unavailable; deterministic research-informed cognition remains active"
            fi
          fi

          stop_at=$((SECONDS + 19800))
          beat_seq=0
          relay_token=""
          relay_token_refresh_at=0

          publish_relay() {
            [ -n "${ROOM_RELAY_URL:-}" ] || return 0
            now=$(date +%s)
            if [ -z "$relay_token" ] || [ "$now" -ge "$relay_token_refresh_at" ]; then
              token_json=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror") || {
                echo "Cloudflare relay token unavailable; Room continues normally"
                return 0
              }
              relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
              if [ -z "$relay_token" ]; then
                echo "Cloudflare relay token was empty; Room continues normally"
                return 0
              fi
              relay_token_refresh_at=$((now + 240))
            fi
            if ! curl -fsS -X POST -H "Authorization: Bearer ${relay_token}" -H "Content-Type: application/json" --data-binary @room/feed.json "${ROOM_RELAY_URL%/}/api/ingest" >/dev/null; then
              echo "Cloudflare relay unavailable; Room continues normally"
            fi
            return 0
          }

          run_beat() {
            beat_seq=$((beat_seq + 1))
            export ROOM_CYCLE_KEY="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${beat_seq}"
            rm -rf room_parts room_work
            mkdir -p room_parts room_work

            # Phase 1: all nodes sense; only the four comprehension nodes receive the perception prompt.
            pids=()
            for n in $(seq 0 11); do
              if [ $((n % 3)) -eq 0 ]; then node_prompt="${ROOM_PROMPT_PERCEPTION:-}"; else node_prompt=""; fi
              (
                env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \
                  ROOM_NODE_PROMPT="$node_prompt" ROOM_NODE_ID="$n" \
                  python3 scripts/room_engine_v5.py node --phase sense
              ) &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
            [ "$failed" -eq 0 ] || return 1

            env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \
              python3 scripts/room_engine_v5.py bus || return 1

            # Phase 2: comprehension settles and the four thought nodes deliberate from perception.
            pids=()
            for n in $(seq 0 11); do
              [ $((n % 3)) -eq 2 ] && continue
              if [ $((n % 3)) -eq 1 ]; then node_prompt="${ROOM_PROMPT_DELIBERATION:-}"; else node_prompt=""; fi
              (
                env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \
                  ROOM_NODE_PROMPT="$node_prompt" ROOM_NODE_ID="$n" \
                  python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-sense.json
              ) &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
            [ "$failed" -eq 0 ] || return 1

            env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \
              python3 scripts/room_engine_v5.py bus2 --bus room_work/bus-sense.json || return 1

            # Phase 3: expression nodes receive deliberation + perception, then all four must speak.
            pids=()
            for n in 2 5 8 11; do
              (
                env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \
                  ROOM_NODE_PROMPT="${ROOM_PROMPT_EXPRESSION:-}" ROOM_NODE_ID="$n" \
                  python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-recurrent.json
              ) &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
            [ "$failed" -eq 0 ] || return 1

            env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \
              python3 scripts/room_engine_v5.py commit || return 1
            python3 scripts/build_room_feed.py || return 1
          }

          while [ "$SECONDS" -lt "$stop_at" ]; do
            if ! run_beat; then
              echo "A Room beat failed internally; retrying on the same warm runner"
              sleep 3
              continue
            fi
            git add room society/live.json
            if git diff --cached --quiet; then continue; fi
            git commit -m "Room cognition v5 research-informed beat"

            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                pushed=1
                publish_relay
                break
              fi
              echo "Push attempt $attempt collided with a newer main; rebasing"
              if ! git fetch origin main; then sleep $((attempt * 2)); continue; fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not rebase cleanly; leaving the state intact and retrying shortly"
                break
              fi
              sleep 1
            done
            if [ "$pushed" -eq 0 ]; then
              echo "Beat is locally committed but not published yet; cooling briefly"
              sleep 8
            fi
          done

          if [ -n "$model_pid" ]; then kill "$model_pid" 2>/dev/null || true; fi
          echo "Warm Room runner is handing itself to a fresh runner"
          for attempt in 1 2 3 4 5; do
            if gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 0
