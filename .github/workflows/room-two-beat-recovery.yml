name: Room two-beat recovery

on:
  push:
    branches: [main]
    paths:
      - 'society/room-two-beat-recovery-kick.txt'

permissions:
  contents: write
  id-token: write

concurrency:
  group: the-room-two-beat-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Run and publish two instrumented Room beats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
          ROOM_PROMPT_PERCEPTION: ${{ secrets.ROOM_PROMPT_PERCEPTION }}
          ROOM_PROMPT_DELIBERATION: ${{ secrets.ROOM_PROMPT_DELIBERATION }}
          ROOM_PROMPT_EXPRESSION: ${{ secrets.ROOM_PROMPT_EXPRESSION }}
        run: |
          set -uo pipefail
          git config user.name "the-room-recovery"
          git config user.email "actions@users.noreply.github.com"
          ROOM_NODE_TIMEOUT_SECONDS=45
          ROOM_NODE_KILL_GRACE_SECONDS=5
          stage="startup"
          beat_seq=0
          model_pid=""
          export ROOM_MODEL_URL=""

          publish_failure() {
            code="$1"
            rm -rf room_parts room_work
            mkdir -p room
            python3 - "$stage" "$code" "$beat_seq" "$GITHUB_RUN_ID" <<'PY' > room/two-beat-recovery.json
          import json, sys
          from datetime import datetime, timezone
          stage, code, beat_seq, run_id = sys.argv[1:]
          print(json.dumps({
              "checked_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "result": "failure",
              "stage": stage,
              "exit_code": int(code),
              "beat_seq": int(beat_seq),
              "run_id": run_id,
          }, indent=2))
          PY
            git add room/two-beat-recovery.json
            git commit -m "Record two-beat Room recovery failure" || true
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main --depth=40 || { sleep 2; continue; }
              git rebase origin/main || { git rebase --abort || true; break; }
            done
            [ -n "$model_pid" ] && kill "$model_pid" 2>/dev/null || true
            exit 1
          }

          stage="model-download"
          mkdir -p .room_model/runtime
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'society-brain-q4_0.gguf' --dir .room_model || publish_failure $?
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .room_model || publish_failure $?
          echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  .room_model/society-brain-q4_0.gguf' | sha256sum -c - || publish_failure $?
          echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .room_model/llama-runtime-linux-x64.tar.gz' | sha256sum -c - || publish_failure $?
          tar -xzf .room_model/llama-runtime-linux-x64.tar.gz -C .room_model/runtime || publish_failure $?

          stage="model-start"
          server_bin=$(find .room_model/runtime -type f -name 'llama-server' | head -1)
          [ -n "$server_bin" ] || publish_failure 127
          chmod +x "$server_bin"
          env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION -u ROOM_NODE_PROMPT \
            "$server_bin" -m .room_model/society-brain-q4_0.gguf --host 127.0.0.1 --port 18080 -c 16384 -np 2 >.room_model/server.log 2>&1 &
          model_pid=$!
          for attempt in $(seq 1 120); do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18080/health >/dev/null 2>&1; then export ROOM_MODEL_URL='http://127.0.0.1:18080/completion'; break; fi
            if ! kill -0 "$model_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          [ -n "$ROOM_MODEL_URL" ] || publish_failure 125

          wait_batch() { failed=0; for pid in "$@"; do wait "$pid" || failed=1; done; [ "$failed" -eq 0 ]; }
          relay_token=""
          refresh_relay_token() {
            token_json=$(curl -fsS --connect-timeout 3 --max-time 8 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror") || return 1
            relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
            [ -n "$relay_token" ]
          }
          publish_relay() {
            refresh_relay_token || return 0
            curl -fsS --connect-timeout 3 --max-time 8 -X POST -H "Authorization: Bearer ${relay_token}" -H "Content-Type: application/json" --data-binary @room/feed.json "${ROOM_RELAY_URL%/}/api/ingest" >/dev/null || true
          }

          run_beat() {
            beat_seq=$((beat_seq + 1))
            export ROOM_CYCLE_KEY="recovery:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${beat_seq}"
            rm -rf room_parts room_work
            mkdir -p room_parts room_work
            printf '%s\n' '{"messages":[]}' > room_work/allen-inbox.json

            stage="beat-${beat_seq}-participant"
            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" python3 scripts/room_participant.py room_work/allen-inbox.json room_work/allen-ack.json || publish_failure $?

            stage="beat-${beat_seq}-sense-unprompted"
            pids=(); for n in 1 2 4 5 7 8 10 11; do (timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION ROOM_NODE_PROMPT="" ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase sense) & pids+=("$!"); done
            wait_batch "${pids[@]}" || publish_failure 1

            for pair in "0 3" "6 9"; do
              stage="beat-${beat_seq}-sense-prompted-${pair// /-}"
              pids=(); for n in $pair; do (timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION ROOM_NODE_PROMPT="${ROOM_PROMPT_PERCEPTION:-}" ROOM_NODE_ID="$n" python3 scripts/room_skill_exec.py scripts/room_engine_v5.py node --phase sense) & pids+=("$!"); done
              wait_batch "${pids[@]}" || publish_failure 1
            done

            stage="beat-${beat_seq}-sense-bus"
            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION python3 scripts/room_engine_v5.py bus || publish_failure $?

            stage="beat-${beat_seq}-recurrent-unprompted"
            pids=(); for n in 0 3 6 9; do (timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION ROOM_NODE_PROMPT="" ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-sense.json) & pids+=("$!"); done
            wait_batch "${pids[@]}" || publish_failure 1

            for pair in "1 4" "7 10"; do
              stage="beat-${beat_seq}-recurrent-prompted-${pair// /-}"
              pids=(); for n in $pair; do (timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION ROOM_NODE_PROMPT="${ROOM_PROMPT_DELIBERATION:-}" ROOM_NODE_ID="$n" python3 scripts/room_skill_exec.py scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-sense.json) & pids+=("$!"); done
              wait_batch "${pids[@]}" || publish_failure 1
            done

            stage="beat-${beat_seq}-recurrent-bus"
            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION python3 scripts/room_engine_v5.py bus2 --bus room_work/bus-sense.json || publish_failure $?

            expr_nodes=(2 5 8 11); shift=$((beat_seq % 4))
            for rank in 0 1 2 3; do
              idx=$(((rank + shift) % 4)); n=${expr_nodes[$idx]}
              stage="beat-${beat_seq}-expression-node-${n}-rank-${rank}"
              timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION ROOM_NODE_PROMPT="${ROOM_PROMPT_EXPRESSION:-}" ROOM_NODE_ID="$n" ROOM_EXPRESSION_RANK="$rank" python3 scripts/room_skill_exec.py scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-recurrent.json || publish_failure $?
            done

            stage="beat-${beat_seq}-private-commit"
            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION python3 scripts/room_private_commit.py commit || publish_failure $?
            stage="beat-${beat_seq}-build-feed"
            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" python3 scripts/build_room_feed.py || publish_failure $?
          }

          for wanted in 1 2; do
            run_beat
            stage="beat-${beat_seq}-git-publish"
            git add room society/live.json
            git commit -m "Room cognition v5 attention-routed skills beat" || publish_failure $?
            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main --depth=40 || { sleep 2; continue; }
              if ! git rebase origin/main; then git rebase --abort || true; break; fi
            done
            [ "$pushed" -eq 1 ] || publish_failure 74
            publish_relay
          done

          stage="success"
          rm -f room/two-beat-recovery.json
          printf '%s\n' "two consecutive recovery beats published $(date -u +%Y-%m-%dT%H:%M:%SZ)" > room/two-beat-recovery-success.txt
          git add room/two-beat-recovery-success.txt room/two-beat-recovery.json
          git commit -m "Verify two consecutive repaired Room beats" || true
          git push origin HEAD:main || true
          kill "$model_pid" 2>/dev/null || true
