<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080D1A">
<title>RESONATOR NO. 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080D1A}
#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080D1A}
#status{display:none!important}
</style>
</head>
<body>
<div id="status"></div>
<iframe id="host" src="resonator.html?v=20260814e" allow="microphone; autoplay"></iframe>
<script>
(()=>{
 const frame=document.getElementById('host');
 let patched=false;
 function patch(){
   if(patched)return;
   let d,w;
   try{w=frame.contentWindow;d=frame.contentDocument||w.document;}catch(e){return;}
   if(!d||!d.head||!d.body||!d.getElementById('view'))return;
   patched=true;

   const css=d.createElement('style');
   css.id='res2-interaction-layer';
   css.textContent=`
   html,body{height:100dvh!important;max-height:100dvh!important;overflow:hidden!important;overscroll-behavior:none!important}
   #app{height:100dvh!important;padding-bottom:0!important}

   /* Remove all top diagnostic/brand/status text. */
   #readout,#brand,#level{display:none!important}

   /* PLAY is the default: the object owns the screen. */
   #stage{flex:1 1 auto!important;min-height:0!important}
   #view{cursor:grab!important}
   #view:active{cursor:grabbing!important}
   #tabs,#panel{display:none!important}
   #deck{display:none!important}

   /* Orbit is no longer a mode. Rotation is simply what the object does. */
   #tools{left:12px!important;right:auto!important;bottom:12px!important;display:flex!important;gap:7px!important;flex-wrap:nowrap!important;width:auto!important;z-index:9!important}
   #tools [data-tool="orbit"],#tools [data-tool="move"],#tools [data-tool="link"],#tools [data-tool="pin"],#home,#undo,#redo{display:none!important}
   #tools .tool{min-width:72px!important;width:auto!important;padding:10px 13px!important;min-height:42px!important;border-radius:21px!important;font-size:10px!important;background:rgba(10,17,32,.72)!important;backdrop-filter:blur(12px)!important}
   #tools .tool[aria-pressed="true"]{background:#132538!important}

   #r2dock{position:fixed;right:10px;top:74px;z-index:10000;display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:auto}
   #r2dock button{appearance:none;border:1px solid rgba(118,133,170,.55);background:rgba(8,13,26,.76);color:#c6d2ec;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;padding:0 12px;height:38px;border-radius:19px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
   #r2dock button.on{border-color:#4ED8EA;color:#F0EAD8;background:#132538}
   #r2hint{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;color:#7685aa;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-align:center;opacity:.8;transition:opacity .6s}
   #r2hint.hide{opacity:0}

   /* ADVANCED is deliberately a different state, not permanent clutter. */
   body.r2-advanced #stage{flex:0 0 43vh!important;min-height:250px!important}
   body.r2-advanced #tabs{display:flex!important;flex:0 0 45px!important}
   body.r2-advanced #panel{display:block!important;flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;padding:12px 14px 92px!important;-webkit-overflow-scrolling:touch!important}
   body.r2-advanced #r2hint{display:none!important}
   body.r2-advanced #tools{bottom:9px!important}
   body.r2-advanced .tab{padding:11px 2px!important;font-size:9px!important}
   body.r2-advanced .knob{margin-bottom:11px!important}

   /* KEYS are an optional floating drawer, never part of the normal layout. */
   body.r2-keys #deck{display:block!important;position:fixed!important;left:8px!important;right:8px!important;bottom:94px!important;z-index:10001!important;max-height:42vh!important;overflow:auto!important;background:#0D1526!important;border:1px solid #25314F!important;border-radius:15px!important;padding:0 10px 10px!important;box-shadow:0 18px 60px rgba(0,0,0,.72)!important}
   body.r2-keys #deck.shut #pads,body.r2-keys #deck.shut #msg{display:grid!important}
   body.r2-keys #handle{position:sticky!important;top:0!important;height:36px!important;background:#0D1526!important;z-index:2!important}
   body.r2-keys #pads{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
   body.r2-keys .pad{padding:12px 0!important}

   @media(min-width:700px){
     body.r2-advanced #stage{flex-basis:52vh!important}
     body.r2-keys #deck{left:auto!important;width:430px!important}
   }
   `;
   d.head.appendChild(css);

   const dock=d.createElement('div');
   dock.id='r2dock';
   dock.innerHTML='<button id="r2adv">ADVANCED</button><button id="r2keys">KEYS</button><button id="r2reset">RESET</button>';
   d.body.appendChild(dock);
   const hint=d.createElement('div');
   hint.id='r2hint';
   hint.innerHTML='DRAG TO TURN · PINCH TO ZOOM<br>TWO FINGERS TO MOVE / ROLL';
   d.getElementById('stage').appendChild(hint);

   const adv=d.getElementById('r2adv'), keys=d.getElementById('r2keys'), reset=d.getElementById('r2reset');
   adv.onclick=()=>{
     const on=d.body.classList.toggle('r2-advanced');
     if(on)d.body.classList.remove('r2-keys');
     adv.textContent=on?'PLAY':'ADVANCED'; adv.classList.toggle('on',on); keys.classList.remove('on');
     setTimeout(()=>w.dispatchEvent(new Event('resize')),40);
   };
   keys.onclick=()=>{
     const on=d.body.classList.toggle('r2-keys');
     keys.classList.toggle('on',on);
     const deck=d.getElementById('deck'); if(deck)deck.classList.remove('shut');
   };

   const js=d.createElement('script');
   js.textContent=`
   (function(){
     const cv=document.getElementById('view');
     if(!cv||window.__r2Direct)return; window.__r2Direct=true;
     state.tool='orbit'; state.spin=false;
     state.r2Zoom=1; state.r2PanX=0; state.r2PanY=0;

     project=function(x,y,z){
       const M=state.M;
       const X=M[0]*x+M[1]*y+M[2]*z;
       const Y=M[3]*x+M[4]*y+M[5]*z;
       const Z=M[6]*x+M[7]*y+M[8]*z;
       const s=Math.min(W,H)*0.86*state.r2Zoom, f=2.9/(2.9-Z);
       return[W/2+state.r2PanX+X*s*f,H*0.46+state.r2PanY+Y*s*f,f];
     };

     function orbitUI(){
       state.tool='orbit'; state.sel=-1;
       document.querySelectorAll('#tools .tool').forEach(b=>b.setAttribute('aria-pressed','false'));
     }
     orbitUI();

     cv.addEventListener('pointerup',()=>{
       if(state.tool==='strike'||state.tool==='mic')setTimeout(orbitUI,0);
     });

     let vx=0,vy=0,lastX=0,lastY=0,lastT=0,moved=0,lastTap=0,raf=0;
     const stopInertia=()=>{if(raf){cancelAnimationFrame(raf);raf=0;}};
     const inertia=()=>{
       stopInertia();
       const step=()=>{
         vx*=.92;vy*=.92;
         if(Math.abs(vx)+Math.abs(vy)<.035){raf=0;return;}
         camRotate(1,vx*.008);camRotate(0,vy*.008);
         raf=requestAnimationFrame(step);
       };raf=requestAnimationFrame(step);
     };
     cv.addEventListener('pointerdown',e=>{
       if(e.pointerType==='touch'&&state.r2Multi)return;
       stopInertia();lastX=e.clientX;lastY=e.clientY;lastT=performance.now();vx=vy=0;moved=0;
       const h=document.getElementById('r2hint');if(h)h.classList.add('hide');
     },true);
     cv.addEventListener('pointermove',e=>{
       if(state.r2Multi&&e.pointerType==='touch'){e.stopImmediatePropagation();e.preventDefault();return;}
       if(state.tool!=='orbit')return;
       const now=performance.now(),dt=Math.max(8,now-lastT),dx=e.clientX-lastX,dy=e.clientY-lastY;
       vx=dx*16/dt;vy=dy*16/dt;moved+=Math.abs(dx)+Math.abs(dy);lastX=e.clientX;lastY=e.clientY;lastT=now;
     },true);
     cv.addEventListener('pointerup',e=>{
       if(state.r2Multi)return;
       if(state.tool==='orbit'&&moved>8)inertia();
       if(moved<8){const now=performance.now();if(now-lastTap<320){
         camReset();camRotate(1,.5);camRotate(0,-.32);state.r2Zoom=1;state.r2PanX=0;state.r2PanY=0;stopInertia();
       }lastTap=now;}
     },true);

     let multi=null;
     const measure=t=>{
       const a=t[0],b=t[1],dx=b.clientX-a.clientX,dy=b.clientY-a.clientY;
       return{dist:Math.hypot(dx,dy),ang:Math.atan2(dy,dx),cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2};
     };
     cv.addEventListener('touchstart',e=>{
       if(e.touches.length===2){state.r2Multi=true;state.spin=false;stopInertia();multi=measure(e.touches);e.preventDefault();e.stopImmediatePropagation();}
     },{capture:true,passive:false});
     cv.addEventListener('touchmove',e=>{
       if(e.touches.length!==2||!multi)return;
       const q=measure(e.touches);
       if(multi.dist>5)state.r2Zoom=Math.max(.42,Math.min(2.8,state.r2Zoom*(q.dist/multi.dist)));
       state.r2PanX+=q.cx-multi.cx;state.r2PanY+=q.cy-multi.cy;
       let da=q.ang-multi.ang;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;camRotate(2,da);
       multi=q;e.preventDefault();e.stopImmediatePropagation();
     },{capture:true,passive:false});
     cv.addEventListener('touchend',e=>{if(e.touches.length<2){state.r2Multi=false;multi=null;}},{capture:true,passive:true});
     cv.addEventListener('touchcancel',()=>{state.r2Multi=false;multi=null;},{capture:true,passive:true});

     window.r2Reset=()=>{camReset();camRotate(1,.5);camRotate(0,-.32);state.r2Zoom=1;state.r2PanX=0;state.r2PanY=0;state.spin=false;stopInertia();orbitUI();};
   })();`;
   d.body.appendChild(js);
   reset.onclick=()=>{try{w.r2Reset&&w.r2Reset();}catch(e){}};

   const deck=d.getElementById('deck');if(deck)deck.classList.add('shut');
   const handle=d.getElementById('handle');if(handle)handle.setAttribute('aria-expanded','false');

   setTimeout(()=>w.dispatchEvent(new Event('resize')),60);
 }
 frame.addEventListener('load',()=>{patched=false;setTimeout(patch,100);setTimeout(patch,500);});
 const timer=setInterval(patch,350);setTimeout(()=>clearInterval(timer),12000);
})();
</script>
</body>
</html>
