<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0d10"><title>PHYSICS STUDIO</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d10;color:#ece8df;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}*{box-sizing:border-box}#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d10}.hud{position:fixed;z-index:50;pointer-events:none}.top{left:14px;right:14px;top:calc(env(safe-area-inset-top) + 10px);height:42px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}.status{font-size:10px;opacity:.5}.rail{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}.rail button,.dock button,.sheet button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(15,18,23,.88);color:#eee9df;border-radius:14px;font:600 10px/1 ui-sans-serif,system-ui;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.18)}.rail button{width:54px;height:48px}.rail button.on{border-color:rgba(120,220,255,.8);background:rgba(24,43,54,.94)}.dock{left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;background:rgba(10,12,16,.76);backdrop-filter:blur(14px);padding:7px;border:1px solid rgba(255,255,255,.10);border-radius:18px}.dock button{height:42px;padding:0 14px}.dock button.on{border-color:rgba(120,220,255,.75);background:rgba(24,43,54,.94)}.sheet{position:fixed;z-index:45;left:72px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 68px);max-height:52vh;transform:translateY(calc(100% + 90px));transition:transform .2s ease;background:rgba(12,14,18,.96);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:20px 20px 12px 12px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.45)}.sheet.open{transform:translateY(0)}.sheetHead{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08)}.sheetTitle{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.sheet button{height:32px;padding:0 11px}.sheetBody{height:min(46vh,520px)}#panelHost{width:100%;height:100%;border:0;background:transparent}.tip{position:fixed;z-index:30;left:78px;right:78px;bottom:calc(env(safe-area-inset-bottom) + 78px);text-align:center;font-size:11px;opacity:.45;pointer-events:none}@media(min-width:800px){.rail{left:18px}.sheet{left:86px;right:18px;max-width:520px}.dock{bottom:20px}}</style></head><body><iframe id="host" src="resonator.html?v=studio1" allow="microphone; autoplay"></iframe><div class="hud top"><div class="brand">Physics Studio</div><div class="status" id="status">loading engine…</div></div><div class="hud rail" id="rail"><button data-tool="orbit" class="on">ORBIT</button><button data-tool="move">MOVE</button><button data-tool="link">SPRING</button><button data-tool="pin">ANCHOR</button><button data-tool="strike">STRIKE</button><button data-tool="mic">MIC</button></div><div class="hud dock"><button id="inspect">INSPECT</button><button id="keys">KEYS</button><button id="home">HOME</button></div><div class="sheet" id="sheet"><div class="sheetHead"><div class="sheetTitle">Instrument Inspector</div><button id="close">CLOSE</button></div><div class="sheetBody"><iframe id="panelHost" title="Instrument controls"></iframe></div></div><div class="tip" id="tip">Drag the structure to orbit · choose MOVE to grab masses</div><script>(()=>{const host=document.getElementById('host'),rail=document.getElementById('rail'),status=document.getElementById('status'),sheet=document.getElementById('sheet'),inspect=document.getElementById('inspect'),keys=document.getElementById('keys'),home=document.getElementById('home'),close=document.getElementById('close'),tip=document.getElementById('tip');let d,w,ready=false;function q(sel){try{return d&&d.querySelector(sel)}catch(e){return null}}function qa(sel){try{return [...d.querySelectorAll(sel)]}catch(e){return[]}}function toolButton(name){return q(`.tool[data-tool="${name}"]`)}function selectTool(name){if(!ready)return;const b=toolButton(name);if(b)b.click();rail.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.tool===name));tip.textContent=name==='orbit'?'Drag the structure to orbit':name==='move'?'Tap a mass, then drag it through space':name==='link'?'Tap one mass, then another, to create/remove a spring':name==='pin'?'Tap a mass to anchor or release it':name==='strike'?'Tap a mass to excite the structure':'Tap a mass to place the pickup';}function patch(){try{w=host.contentWindow;d=host.contentDocument||w.document}catch(e){return}if(!d||!d.body||!d.getElementById('view'))return;ready=true;status.textContent='engine ready';const style=d.createElement('style');style.textContent=`html,body,#app{height:100%!important;max-height:100%!important;overflow:hidden!important;background:#0b0d10!important}#app{padding:0!important}#brand,#readout,#level,#tabs,#panel,#deck,#tools{display:none!important}#stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:100%!important;background:#0b0d10!important}#view{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;touch-action:none!important}`;d.head.appendChild(style);const resize=()=>{try{w.dispatchEvent(new Event('resize'))}catch(e){}};setTimeout(resize,50);setTimeout(resize,350);selectTool('orbit');}host.addEventListener('load',()=>setTimeout(patch,120));const wait=setInterval(()=>{patch();if(ready)clearInterval(wait)},300);rail.addEventListener('click',e=>{const b=e.target.closest('button[data-tool]');if(b)selectTool(b.dataset.tool)});inspect.onclick=()=>{if(!ready)return;sheet.classList.add('open');inspect.classList.add('on');try{const tabs=d.getElementById('tabs'),panel=d.getElementById('panel');if(tabs)tabs.style.cssText='display:flex!important;position:fixed!important;left:0!important;right:0!important;bottom:52vh!important;z-index:9998!important;background:#11151b!important;border-top:1px solid #2a3038!important';if(panel)panel.style.cssText='display:block!important;position:fixed!important;left:72px!important;right:8px!important;bottom:calc(env(safe-area-inset-bottom) + 68px)!important;height:46vh!important;z-index:9997!important;overflow-y:auto!important;background:#11151b!important;padding:12px 12px 90px!important;border-radius:18px 18px 10px 10px!important;-webkit-overflow-scrolling:touch!important';}catch(e){}};function hideInspector(){sheet.classList.remove('open');inspect.classList.remove('on');try{const tabs=d.getElementById('tabs'),panel=d.getElementById('panel');if(tabs)tabs.style.display='none';if(panel)panel.style.display='none'}catch(e){}}close.onclick=hideInspector;keys.onclick=()=>{if(!ready)return;hideInspector();const deck=d.getElementById('deck');if(!deck)return;const showing=deck.dataset.studioOpen==='1';if(showing){deck.style.display='none';deck.dataset.studioOpen='0';keys.classList.remove('on')}else{deck.dataset.studioOpen='1';deck.style.cssText='display:block!important;position:fixed!important;left:72px!important;right:8px!important;bottom:calc(env(safe-area-inset-bottom) + 68px)!important;z-index:9999!important;max-height:42vh!important;overflow:auto!important;background:#11151b!important;border:1px solid #2a3038!important;border-radius:18px!important;padding:10px!important';deck.classList.remove('shut');keys.classList.add('on')}};home.onclick=()=>{if(!ready)return;const b=q('#home');if(b)b.click();else if(typeof w.camReset==='function'){w.camReset();if(typeof w.camRotate==='function'){w.camRotate(1,.5);w.camRotate(0,-.32)}}};})();</script></body></html>
