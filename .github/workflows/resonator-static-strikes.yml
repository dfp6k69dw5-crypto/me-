name: Resonator static strikes

on:
  push:
    paths:
      - '.github/workflows/resonator-static-strikes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove strike-driven visual motion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/resonator.html')
          s = p.read_text()

          # Replace the entire physics-visual payload section using stable boundary markers.
          a = "      // FIX8: reuse returned buffers instead of allocating every frame."
          b = "      if(this.att>0){"
          ia = s.find(a)
          ib = s.find(b, ia)
          if ia < 0 or ib < 0:
              raise RuntimeError(f'visual payload markers not found: {ia}, {ib}')
          s = s[:ia] + "      // Meter only: keep audio physics internal and do not ship body motion to the UI.\n      this.port.postMessage({t:'frame',pk:this.peak});\n" + s[ib:]

          # Main thread no longer receives or stores mass displacement/velocity arrays.
          a = "   if(d.t==='frame'){\n"
          b = "   } else if(d.t==='rec'){"
          ia = s.find(a)
          ib = s.find(b, ia)
          if ia < 0 or ib < 0:
              raise RuntimeError(f'frame handler markers not found: {ia}, {ib}')
          s = s[:ia] + "   if(d.t==='frame'){\n     state.peak=d.pk; state.ranOnce=true; drawLevel();\n" + s[ib:]

          # Render the body at its rest geometry, not the exaggerated physical displacement.
          old = " const D=state.disp,SPD=state.spd,mag=val.mag,N=g.P.length;"
          if old not in s:
              raise RuntimeError('render-state line not found')
          s = s.replace(old, " const SPD=null,N=g.P.length;", 1)

          old = "   const x=g.P[i][0]+(D?D[i*3]*mag:0),y=g.P[i][1]+(D?D[i*3+1]*mag:0),z=g.P[i][2]+(D?D[i*3+2]*mag:0);"
          if old not in s:
              raise RuntimeError('dynamic geometry line not found')
          s = s.replace(old, "   const x=g.P[i][0],y=g.P[i][1],z=g.P[i][2];", 1)

          # Static tools do not need 60 full canvas redraws per second.
          old = "function frame(){requestAnimationFrame(frame);if(!W)resize();g2.clearRect(0,0,W,H);"
          if old not in s:
              raise RuntimeError('frame loop line not found')
          s = s.replace(old, "function frame(ts){requestAnimationFrame(frame);if(!W)resize();if(state.tool!=='orbit'&&!drag&&ts-(state._lastDraw||0)<100)return;state._lastDraw=ts;g2.clearRect(0,0,W,H);", 1)

          p.write_text(s)

          idx = Path('index.html')
          t = idx.read_text()
          t, n = re.subn(r'apps/resonator\.html\?v=[^"\s<]+', 'apps/resonator.html?v=20260818b', t, count=1)
          if n != 1:
              raise RuntimeError(f'index cache-bust count={n}')
          idx.write_text(t)

          Path('.github/workflows/resonator-static-strikes.yml').unlink()
          PY

          grep -q "Meter only: keep audio physics internal" apps/resonator.html
          grep -q "const SPD=null,N=g.P.length" apps/resonator.html
          grep -q "apps/resonator.html?v=20260818b" index.html
          test ! -e .github/workflows/resonator-static-strikes.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Resonator still on strikes'
          git pull --rebase origin main
          git push origin HEAD:main
