name: Allen social boundary simulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-allen-social-sim.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/allen-social-participant-20260819
          fetch-depth: 0
      - name: Run exact Allen social boundary simulator and engine self-test on isolated branch
        shell: bash
        run: |
          set +e
          python3 scripts/room_allen_response_sim.py > /tmp/allen-social.txt 2>&1
          sim_status=$?
          python3 scripts/room_engine_v5.py selftest > /tmp/engine-selftest.txt 2>&1
          engine_status=$?
          set -e
          python3 - "$sim_status" "$engine_status" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          sim_status=int(sys.argv[1]); engine_status=int(sys.argv[2])
          def read(path):
              try:return open(path).read()[-6000:]
              except Exception:return ''
          payload={
              'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'pass':sim_status==0 and engine_status==0,
              'sim_exit_code':sim_status,
              'engine_selftest_exit_code':engine_status,
              'sim_output':read('/tmp/allen-social.txt'),
              'engine_selftest_output':read('/tmp/engine-selftest.txt'),
              'validated_ref':'fix/allen-social-participant-20260819',
          }
          open('room/allen-social-sim-diagnostic.json','w').write(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
      - name: Record diagnostic on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'allen-social-simulator'
          git config user.email 'actions@users.noreply.github.com'
          git add room/allen-social-sim-diagnostic.json
          git commit -m 'Record validated Allen social boundary candidate' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:fix/allen-social-participant-20260819; then exit 0; fi
            git fetch origin fix/allen-social-participant-20260819
            git rebase origin/fix/allen-social-participant-20260819 || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1

