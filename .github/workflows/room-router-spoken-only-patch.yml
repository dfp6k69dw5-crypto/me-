name: Patch Room expression coherence

on:
  push:
    branches: [main]
    paths:
      - 'society/room-router-spoken-only-kick.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Patch hot-expression quality checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/room_expression_quality.py')
          s=p.read_text()
          old='''    if len(text) > MAX_EXPRESSION_CHARS:\n        return "rambling_expression"\n    if _PRONOUN_R.search(text):\n        return "malformed_pronoun"\n'''
          new='''    if len(text) > MAX_EXPRESSION_CHARS:\n        return "rambling_expression"\n\n    # High-temperature first attempts are allowed to be socially wild, but they\n    # still have to be readable speech. Reject mechanical sampler damage and let\n    # the existing retry path regenerate at a cooler temperature.\n    words = _tokens(text)\n    if re.match(r"^[,.;:)}\\]]", text):\n        return "malformed_opening"\n    if re.search(r"[\\\"'”’]?\\}\\s*,?\\s*\\{", text):\n        return "structured_debris"\n    if re.search(r"\\b([A-Za-z]{3,})-\\1\\b", text, re.I):\n        return "local_word_duplication"\n    if len(words) < 3 and not re.search(r"\\b(?:no|nope|wrong|fuck|shit|bullshit|idiot|moron|damn|hell)\\b", text, re.I):\n        return "empty_fragment"\n    if len(words) > 48:\n        return "wordy_expression"\n    if any(len(_tokens(sentence)) > 36 for sentence in _sentences(text)):\n        return "run_on_expression"\n    if _PRONOUN_R.search(text):\n        return "malformed_pronoun"\n'''
          if old not in s:
              if 'return "structured_debris"' in s and 'return "run_on_expression"' in s:
                  print('already patched')
              else:
                  raise SystemExit('expected quality anchor missing')
          else:
              p.write_text(s.replace(old,new,1))
          PY
          python3 -m py_compile scripts/room_expression_quality.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'room-quality-patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_expression_quality.py
          git commit -m 'Retry incoherent hot Room expressions' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
