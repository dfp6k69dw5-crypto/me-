name: Room hot restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-hot-restart.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch fresh Room runner from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run sarah-society.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f entity=auto
          echo "Fresh Room runner dispatched from ${GITHUB_SHA}."
