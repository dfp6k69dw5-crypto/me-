name: Genome Flower distribution
on:
  push:
    branches: [main]
    paths:
      - 'apps/genome-flower/**'
      - 'scripts/genome_flower_distribution.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sample 512 genomes
        run: node scripts/genome_flower_distribution.mjs
