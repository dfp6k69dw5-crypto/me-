name: Room relay transport probe
# timestamp/boot freshness probe: 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-relay-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Probe public relay feed and browser CORS
        run: |
          rm -f room/relay-transport-diagnostic.json
          http_code=$(curl -sS --connect-timeout 3 --max-time 8 \
            -H 'Origin: https://maaronfanberg-lab.github.io' \
            -D /tmp/relay-headers.txt -o /tmp/relay-body.json \
            -w '%{http_code}' \
            https://room-live-mirror.dfp6k69dw5.workers.dev/api/feed || true)
          HTTP_CODE="$http_code" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def epoch(value):
              if not value: return 0.0
              try:
                  return datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()
              except Exception:
                  return 0.0

          local=json.load(open('room/feed.json'))
          headers={}
          p=Path('/tmp/relay-headers.txt')
          if p.exists():
              for line in p.read_text(errors='replace').splitlines():
                  if ':' in line:
                      k,v=line.split(':',1); headers[k.strip().lower()]=v.strip()
          remote=None; parse_error=''
          b=Path('/tmp/relay-body.json')
          if b.exists():
              try:
                  raw=json.loads(b.read_text(errors='replace'))
                  remote=raw.get('feed',raw) if isinstance(raw,dict) else None
              except Exception as e: parse_error=str(e)

          ls=local.get('state',{})
          rs=(remote or {}).get('state',{})
          local_generated=local.get('generated_at') or ls.get('last_run') or ''
          relay_generated=(remote or {}).get('generated_at') or rs.get('last_run') or ''
          local_epoch=epoch(local_generated); relay_epoch=epoch(relay_generated)
          lag=round(local_epoch-relay_epoch,3) if local_epoch and relay_epoch else None
          local_boot=str(ls.get('boot_id') or '')
          relay_boot=str(rs.get('boot_id') or '')
          acao=headers.get('access-control-allow-origin','')
          http=int(os.environ.get('HTTP_CODE') or 0)
          out={
            'http_status':http,
            'local_cycle':ls.get('cycle'),
            'relay_cycle':rs.get('cycle'),
            'local_boot_id':local_boot,
            'relay_boot_id':relay_boot,
            'same_boot':bool(local_boot and relay_boot and local_boot==relay_boot),
            'local_generated_at':local_generated,
            'relay_generated_at':relay_generated,
            'timestamp_lag_seconds':lag,
            'access_control_allow_origin':acao,
            'content_type':headers.get('content-type',''),
            'cache_control':headers.get('cache-control',''),
            'parse_error':parse_error,
            'browser_cors_ok':acao in ('*','https://maaronfanberg-lab.github.io'),
            'relay_reachable':http==200 and remote is not None,
            'relay_timestamp_current':lag is not None and lag<=90,
          }
          out['pass']=out['relay_reachable'] and out['browser_cors_ok'] and out['same_boot'] and out['relay_timestamp_current']
          Path('room/relay-transport-diagnostic.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Publish relay diagnostic
        if: always()
        run: |
          test -f room/relay-transport-diagnostic.json || printf '%s\n' '{"pass":false,"error":"relay probe produced no diagnostic"}' > room/relay-transport-diagnostic.json
          git config user.name "room-relay-probe"
          git config user.email "actions@users.noreply.github.com"
          git add room/relay-transport-diagnostic.json
          git commit -m "Record Room relay transport diagnostic" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$n"
          done
          exit 1
