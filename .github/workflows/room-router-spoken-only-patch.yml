name: Patch Room callback wildness

on:
  push:
    branches: [main]
    paths:
      - 'society/room-router-spoken-only-kick.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - name: Require genuinely bizarre shared incidents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/room_private_model/__init__.py')
          s=p.read_text()
          old='''    wild_anchor = re.search(\n        r"\\b(?:motel|fire|herman|suitcase|wedding|duluth|church|bell|radio|tower|tattoo|birthday|cake|laundromat|forged|apology|garden|statue|karaoke|inheritance|midnight|road trip|key|restaurant|banned|bet|engagement|rumor|umbrella|hotel|roof|flamingo|voicemail|betray\\w*)\\b",\n        low, re.I,\n    )\n'''
          new='''    wild_anchor = re.search(\n        r"\\b(?:motel fire|herman|locked suitcase|fake wedding|duluth|church bell|radio[- ]tower|tattoo pact|birthday[- ]cake|laundromat|forged apology|garden statue|karaoke|inheritance|midnight road trip|suspicious key|restaurant\\b.{0,24}\\bbanned|the bet|engagement rumor|red umbrella|hotel roof|brass flamingo|voicemail|betray\\w*)\\b",\n        low, re.I,\n    )\n'''
          if old not in s:
              if new not in s:
                  raise SystemExit('wild-anchor anchor missing')
          else:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 -m py_compile scripts/room_private_model/__init__.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_private_model as rpm
          def ok(text):
              compact={'intent':{'move':'callback','risk':4}}
              obj={'decision':'SPEAK','target':'mara','move':'callback','utterance':text}
              try:
                  rpm._validate('expression',obj,compact,'','sarah')
                  return True
              except ValueError:
                  return False
          assert not ok("I bet we're all good at pretending. How would you explain your perspective?")
          assert ok("Mara, Herman took the brass flamingo and you still owe me an explanation.")
          assert ok("Mara, remember the disastrous midnight road trip? You still owe me an explanation.")
          print('CALLBACK_WILDNESS_GATE_OK')
          PY
      - name: Commit callback fix
        shell: bash
        run: |
          git config user.name 'room-callback-gate'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_private_model/__init__.py
          git commit -m 'Close tame callback loophole in Room' || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
