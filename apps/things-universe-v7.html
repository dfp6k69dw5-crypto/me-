const c=$('#g'),ctx=c.getContext('2d');function resize(){let r=$('#stage').getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);layout();draw()}function draw(){let w=$('#stage').clientWidth,h=$('#stage').clientHeight;ctx.clearRect(0,0,w,h);if(!N.length){stat('Ready');pair();return}ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.s,view.s);for(const e of E){let a=nid(e.a),b=nid(e.b);if(!a||!b)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=e.bridge?'#c7a7ff':'#58708f';ctx.globalAlpha=e.bridge?1:.45;ctx.lineWidth=(e.bridge?2.3:1.1)/view.s;ctx.stroke();ctx.globalAlpha=1}for(const n of N){ctx.beginPath();ctx.arc(n.x,n.y,n.bridge?9:7,0,6.29);ctx.fillStyle=n.bridge?'#c7a7ff':side(n)==='A'?'#70e2da':side(n)==='B'?'#e3cc7b':'#9cb1c9';ctx.fill();if(view.s>.48||N.length<40){ctx.font=`${Math.max(8,9/view.s)}px sans-serif`;ctx.fillStyle='#eef4ff';ctx.strokeStyle='#071018';ctx.lineWidth=3/view.s;let t=n.l.length>23?n.l.slice(0,21)+'…':n.l;ctx.strokeText(t,n.x+10,n.y+3);ctx.fillText(t,n.x+10,n.y+3)}}ctx.restore();pair();stat($('#status').textContent||'Ready')}function fit(){if(!N.length)return;let xs=N.map(n=>n.x),ys=N.map(n=>n.y),mi=Math.min(...xs)-45,ma=Math.max(...xs)+75,miy=Math.min(...ys)-45,may=Math.max(...ys)+45,w=$('#stage').clientWidth,h=$('#stage').clientHeight,s=Math.min(1.35,.9/Math.max((ma-mi)/w,(may-miy)/h,.001));view={s,x:w/2-s*(mi+(ma-mi)/2),y:h/2-s*(miy+(may-miy)/2)};draw()}function hit(x,y){let r=c.getBoundingClientRect(),wx=(x-r.left-view.x)/view.s,wy=(y-r.top-view.y)/view.s,b=null,bd=14/view.s;for(const n of N){let d=Math.hypot(n.x-wx,n.y-wy);if(d<bd){bd=d;b=n}}return b}
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,m:false};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.m=true;view.x=drag.vx+dx;view.y=drag.vy+dy;draw()});c.addEventListener('pointerup',e=>{if(drag&&!drag.m){let n=hit(e.clientX,e.clientY);if(n){sel=n;$('#tag').textContent=n.bridge?'bridge node':'tree '+side(n);$('#ct').textContent=n.l;semantic(n.k).then(a=>$('#cd').textContent='Nearby: '+a.slice(0,6).map(x=>x.l).join(', '));$('#card').classList.add('open')}}drag=null});
$('#add').onclick=()=>{let v=$('#q').value.trim();if(v){$('#q').value='';addThing(v)}};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')$('#add').click()});$('#fit').onclick=fit;$('#reset').onclick=()=>{auto=false;tok++;N=[];E=[];A=B=sel=null;round=bridges=stall=0;view={x:0,y:0,s:1};for(const s of ['A','B']){S[s].seen=new Set;S[s].q=[];S[s].exp=new Set}$('#auto').classList.remove('on');$('#auto').textContent='Auto-grow: off';$('#card').classList.remove('open');draw()};$('#auto').onclick=toggle;$('#bridge').onclick=hard;$('#explain').onclick=explain;$('#cx').onclick=()=>$('#card').classList.remove('open');$('#rx').onclick=()=>$('#reader').classList.remove('open');$('#sa').onclick=()=>{if(sel){A=sel;resetSearch();round=0}};$('#sb').onclick=()=>{if(sel){B=sel;resetSearch();round=0}};$('#grow').onclick=()=>sel&&sprout(sel,6);resize();draw();
