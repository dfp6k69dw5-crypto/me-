name: The Room Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: the-room-pulse-chain
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retire stale pulse runner
        run: echo "Retired stale Room Pulse runner so queued Room repairs can execute."
