name: Room control-language repair
# trigger after workflow registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-warm-runner-simulator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: room-control-language-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Patch and verify control-language guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/room_private_model_autonomy.py')
          s = p.read_text()
          marker = '_CONTROL_ANNOTATION_RE = re.compile('
          if marker not in s:
              anchor = '\ndef _public_meta_language(utterance: str, compact: dict) -> bool:\n'
              assert anchor in s
              block = r'''

_CONTROL_ANNOTATION_RE = re.compile(
    r"(?:^|\s)[\(\[]\s*(?:speak|respond|reply|answer|continue|wait|pause|silence|think|thought|action|narration|stage\s*direction)\s*[\)\]](?:\s|$)",
    re.IGNORECASE,
)


def _contains_control_annotation(utterance: str) -> bool:
    return bool(_CONTROL_ANNOTATION_RE.search(str(utterance or "")))
'''
              s = s.replace(anchor, block + anchor, 1)
          old = '''                if _public_meta_language(utterance, compact):
                    last_reason = "meta_language"
                    continue
'''
          new = '''                if _contains_control_annotation(utterance):
                    last_reason = "control_annotation"
                    continue
                if _public_meta_language(utterance, compact):
                    last_reason = "meta_language"
                    continue
'''
          if 'last_reason = "control_annotation"' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('scripts/room_engine_v5_core.py')
          s = p.read_text()
          if '_MEMORY_CONTROL_ANNOTATION_RE = re.compile(' not in s:
              anchor = '\n_MEMORY_SCAFFOLD = {\n'
              assert anchor in s
              block = r'''

_MEMORY_CONTROL_ANNOTATION_RE = re.compile(
    r"(?:^|\s)[\(\[]\s*(?:speak|respond|reply|answer|continue|wait|pause|silence|think|thought|action|narration|stage\s*direction)\s*[\)\]](?:\s|$)",
    re.IGNORECASE,
)


def _memory_contains_control_annotation(text):
    return bool(_MEMORY_CONTROL_ANNOTATION_RE.search(str(text or "")))
'''
              s = s.replace(anchor, block + anchor, 1)
          old = '''    lexical = [w.strip("'-") for w in re.findall(r"[a-z][a-z'-]*", str(text or "").lower())]
'''
          new = '''    if _memory_contains_control_annotation(text):
        return False
    lexical = [w.strip("'-") for w in re.findall(r"[a-z][a-z'-]*", str(text or "").lower())]
'''
          if '_memory_contains_control_annotation(text):' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          python3 -m py_compile scripts/room_private_model_autonomy.py scripts/room_engine_v5_core.py scripts/room_engine_v5.py scripts/room_private_commit.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('aut', Path('scripts/room_private_model_autonomy.py'))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod._contains_control_annotation('Hey there (speak)')
          assert mod._contains_control_annotation('[respond] hello')
          assert mod._contains_control_annotation('Okay (stage direction)')
          assert not mod._contains_control_annotation('I like food (especially pasta).')
          assert not mod._contains_control_annotation('Can you speak more quietly?')
          print('PASS control-language guard')
          PY

      - name: Commit verified repair if needed
        run: |
          set -euo pipefail
          git config user.name room-control-language-repair
          git config user.email actions@users.noreply.github.com
          git add scripts/room_private_model_autonomy.py scripts/room_engine_v5_core.py
          if git diff --cached --quiet; then
            echo 'Source already repaired'
            exit 0
          fi
          git commit -m 'Block control annotations from Room speech and memory'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1

      - name: Restart Room on repaired source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && break
            sleep 2
          done
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
          [ "$active" -eq 0 ] || exit 1
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
