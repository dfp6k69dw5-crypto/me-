name: The Room Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: the-room-pulse-chain
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Replace resident Room on explicit pulse kick
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do
            echo "Cancelling resident Room run $id for code handoff"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && exit 0
            sleep 2
          done
          echo "Resident Room did not stop cleanly"
          exit 1

      - name: Keep The Room running at GitHub's fastest sustainable cadence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          stop_at=$((SECONDS + 19800))
          api_backoff=15
          last_cooled_failure=""
          queued_timeout=90
          while [ "$SECONDS" -lt "$stop_at" ]; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 1 --json databaseId,status,conclusion,createdAt 2>/tmp/room-gh-error)"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              sleep "$api_backoff"
              api_backoff=$((api_backoff * 2))
              [ "$api_backoff" -gt 120 ] && api_backoff=120
              continue
            fi
            api_backoff=15
            latest_id="$(printf '%s' "$runs" | jq -r '.[0].databaseId // empty')"
            latest_status="$(printf '%s' "$runs" | jq -r '.[0].status // "none"')"
            latest_conclusion="$(printf '%s' "$runs" | jq -r '.[0].conclusion // ""')"
            latest_created="$(printf '%s' "$runs" | jq -r '.[0].createdAt // empty')"
            case "$latest_status" in
              in_progress) sleep 8; continue ;;
              queued|pending|waiting|requested)
                now_epoch="$(date -u +%s)"
                created_epoch="$(date -u -d "$latest_created" +%s 2>/dev/null || echo "$now_epoch")"
                queued_age=$((now_epoch - created_epoch))
                if [ "$queued_age" -ge "$queued_timeout" ]; then
                  if gh run cancel "$latest_id" --repo "$GITHUB_REPOSITORY"; then
                    last_cooled_failure="$latest_id"
                    sleep 8
                  else
                    sleep "$api_backoff"
                  fi
                else
                  sleep 8
                fi
                continue
                ;;
            esac
            if [ -n "$latest_id" ] && [ "$latest_conclusion" != "success" ] && [ "$latest_id" != "$last_cooled_failure" ]; then
              last_cooled_failure="$latest_id"
              sleep 90
              continue
            fi
            if gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto; then
              sleep 12
            else
              sleep "$api_backoff"
            fi
          done
          for attempt in 1 2 3 4 5; do
            if gh workflow run sarah-society-pulse.yml --repo "$GITHUB_REPOSITORY" --ref main; then exit 0; fi
            sleep 30
          done
          exit 0
