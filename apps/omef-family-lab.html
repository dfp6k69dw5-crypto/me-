<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>OMEF Family Lab</title><style>:root{--bg:#0d0d0d;--panel:#1b1b1b;--text:#eee;--muted:#aaa;--line:#333;--accent:#10a59a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:980px;margin:auto}.stage{position:sticky;top:0;height:50svh;min-height:340px;background:#000;z-index:10;border-bottom:1px solid var(--line)}canvas{width:100%;height:100%;display:block;object-fit:contain;background:#000}.hud{position:absolute;left:12px;top:12px;font:12px Menlo,monospace}.focus{position:absolute;right:12px;top:12px;border:1px solid #444;background:#111;color:#fff;border-radius:999px;padding:8px 12px}.panel{background:var(--panel)}section{padding:14px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{border:1px solid #3c3c3c;background:#262626;color:#eee;border-radius:10px;padding:11px;font-weight:700}.grid button.active{background:var(--accent);color:#fff}.row{display:grid;grid-template-columns:100px 1fr 48px;gap:8px;align-items:center;margin:9px 0;color:var(--muted);font-size:13px}.v{background:#333;color:#fff;border-radius:7px;padding:5px;text-align:center;font:11px Menlo,monospace}input{width:100%;accent-color:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:10px;padding:11px;background:var(--accent);color:white;font-weight:800}.actions button.secondary{background:#555}.metrics{margin-top:8px;color:#999;font:10px/1.5 Menlo,monospace}body.focusMode .panel{display:none}body.focusMode .stage{position:fixed;inset:0;width:100vw;height:100svh;z-index:999}</style></head><body><div class="app"><div class="stage"><canvas id="cv" width="1000" height="760"></canvas><div class="hud"><div id="name">OMEF Family Lab</div><div id="status">ready</div></div><button class="focus" id="focus">Focus</button></div><div class="panel"><section><h1>OMEF-derived map families</h1><div class="sub">These are different autonomous recurrences extracted from different OMEF subsystems. They are not presets of one common map.</div><div class="grid" id="families"></div></section><section><div class="row"><label>Coupling</label><input id="couple" type="range" min="0" max="200" value="100"><span class="v" id="coupleV">1.00</span></div><div class="row"><label>Memory</label><input id="memory" type="range" min="0" max="200" value="100"><span class="v" id="memoryV">1.00</span></div><div class="row"><label>Instability</label><input id="edge" type="range" min="0" max="200" value="100"><span class="v" id="edgeV">1.00</span></div><div class="row"><label>Projection</label><input id="proj" type="range" min="0" max="100" value="50"><span class="v" id="projV">50</span></div><div class="metrics" id="metrics"></div></section><section><div class="row"><label>Points</label><input id="points" type="range" min="10000" max="120000" step="10000" value="50000"><span class="v" id="pointsV">50K</span></div><div class="row"><label>Ink</label><input id="ink" type="range" min="1" max="100" value="28"><span class="v" id="inkV">28</span></div><div class="actions"><button id="mutate">Mutate</button><button id="rerender" class="secondary">Render again</button></div></section></div></div><script>(function(){'use strict';var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),current='pair',seed=17,token=0;var $=id=>document.getElementById(id);function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function p(){return{c:+$('couple').value/100,m:+$('memory').value/100,e:+$('edge').value/100,q:+$('proj').value/100}}function controls(){['couple','memory','edge'].forEach(id=>$(id+'V').textContent=(+$(id).value/100).toFixed(2));$('projV').textContent=$('proj').value;$('pointsV').textContent=Math.round(+$('points').value/1000)+'K';$('inkV').textContent=$('ink').value}function makePair(P,sd){var r=rng(sd),x=.1,y=.2,z=-.1,w=.05;return()=>{var a=1.35+.65*P.c,b=-1.55+.45*P.e,c=.75+.35*P.m,d=.45+.3*P.c;var nx=Math.tanh(a*x+b*Math.sin(y)+.55*Math.sin(z*w*3)+.18*(y-z));var ny=Math.tanh(a*y-b*Math.cos(x)+d*x*z+.2*w);var nz=Math.tanh(c*z+1.05*x*y-.45*w+.12*Math.sin(x*4));var nw=Math.tanh(.82*w+.72*(x-z)+.28*Math.sin(y*3));x=nx;y=ny;z=nz;w=nw;return[x+.45*z,y+.35*w]}}function makeTriad(P,sd){var x=.17,y=-.08,z=.23;return()=>{var k=.9+.9*P.c,g=.55+.75*P.e;var nx=Math.tanh(.72*x+k*y*z+.52*Math.sin(2.2*y)-.18*z);var ny=Math.tanh(.68*y-k*x*z+.58*Math.sin(2.6*z)+.21*x);var nz=Math.tanh(.74*z+g*x*y+.48*Math.sin(2.4*x)-.16*y);x=nx;y=ny;z=nz;return[1.4*(x*z-y*y),1.4*(y*z+x*x-.25)]}}function makeFib(P,sd){var h=new Float64Array(21);for(var i=0;i<21;i++)h[i]=.03*Math.sin(i*.7+sd);var n=0;return()=>{var i=n%21,a=h[(n+20)%21],b=h[(n+19)%21],c=h[(n+16)%21],d=h[(n+13)%21],e=h[(n+8)%21];var v=Math.tanh(.48*a+.31*b+.24*c*P.m-.21*d+.17*e+.85*P.c*Math.sin(2.4*c)-.42*P.e*a*d);h[i]=v;n++;return[1.9*(v-c)+.55*(a-e),1.7*(b-d)+.7*Math.sin(3*v)]}}function makeGolden(P,sd){var p1=sd*.01,p2=.7+sd*.007,x=.1,y=.2;var phi=(1+Math.sqrt(5))/2;return()=>{p1+=.031*(1+.55*P.c)+.006*Math.sin(y);p2+=.031/phi*(1+.45*P.m)+.005*Math.sin(x);x=Math.tanh(.82*x+.75*Math.sin(p1)+.45*Math.sin(phi*p2)+.22*P.e*x*y);y=Math.tanh(.82*y+.75*Math.cos(p2)-.45*Math.cos(p1/phi)-.22*P.e*x*x);return[1.5*x+Math.sin(p1)*.55,1.5*y+Math.sin(p2)*.55]}}function makeRegime(P,sd){var a=[.4,.3,.2,.1],x=.08,y=.12;return()=>{var s0=1.4*x-.6*y,s1=.9*y+.4*x*x,s2=-1.1*x+.55*y,s3=-.9*y-.5*x;var m=Math.max(s0,s1,s2,s3),v=[Math.exp(s0-m),Math.exp(s1-m),Math.exp(s2-m),Math.exp(s3-m)],sum=v[0]+v[1]+v[2]+v[3],rate=.015+.055*P.c;for(var i=0;i<4;i++)a[i]=(1-rate)*a[i]+rate*v[i]/sum;var nx=Math.tanh(.64*x+1.45*(a[0]-a[3])+.52*Math.sin(2.2*y)+.25*P.e*x*y);var ny=Math.tanh(.64*y+1.45*(a[1]-a[2])+.52*Math.cos(2.1*x)-.25*P.e*x*x);x=nx;y=ny;return[2*(a[0]-a[3])+.7*x,2*(a[1]-a[2])+.7*y]}}function makeShadow(P,sd){var hist=new Float64Array(34),n=0,x=.1,y=-.12;return()=>{var h13=hist[(n+21)%34],h21=hist[(n+13)%34],h34=hist[n%34],shadow=.65*(h13-x)+.35*(h21-h34);var nx=Math.tanh(.7*x+.95*P.c*Math.sin(y)+P.m*.8*shadow+.2*P.e*x*y);var ny=Math.tanh(.72*y-.9*P.c*Math.cos(x)-P.m*.7*(h21-y)+.18*P.e*shadow);hist[n%34]=nx;n=(n+1)%34;x=nx;y=ny;return[1.8*(x-h13)+.5*y,1.6*(y-h21)+.6*shadow]}}function makeAccounting(P,sd){var x=.2,y=-.1,z=.16;return()=>{var nx=Math.tanh(.92*x+.65*P.c*Math.sin(y)+.22*z),ny=Math.tanh(.88*y-.62*P.c*Math.cos(z)+.25*x),nz=Math.tanh(.84*z+.52*x*y-.31*y);var lam=.12+.32*P.m;var r1=nx+ny-nz,r2=nx-2*ny+.5*nz;nx-=lam*(.35*r1+.22*r2);ny-=lam*(.35*r1-.44*r2);nz+=lam*(.35*r1-.11*r2);x=nx;y=ny;z=nz;return[1.8*(x-y),1.8*(z+.35*x*y)]}}function makeSpectral(P,sd){var x=.02,y=.03,dx=.01,dy=-.01;return()=>{var gain=.98+.28*P.e;var ndx=gain*dx+.52*P.c*Math.sin(2.8*y)-.26*x+.21*x*y;var ndy=gain*dy-.52*P.c*Math.sin(2.5*x)-.24*y-.18*x*x;dx=Math.tanh(ndx);dy=Math.tanh(ndy);x=Math.tanh(x+.38*dx);y=Math.tanh(y+.38*dy);return[2.2*dx+.6*x,2.2*dy+.6*y]}}var families={pair:['Pair Network',makePair],triad:['Triadic Tensor',makeTriad],fib:['Fibonacci Delay',makeFib],golden:['Golden Oscillator',makeGolden],regime:['Regime Simplex',makeRegime],shadow:['Shadow Observer',makeShadow],account:['Accounting Constraint',makeAccounting],spectral:['Spectral Edge',makeSpectral]};var box=$('families');Object.keys(families).forEach(k=>{var b=document.createElement('button');b.textContent=families[k][0];b.onclick=()=>{current=k;box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};if(k===current)b.classList.add('active');box.appendChild(b)});function make(){return families[current][1](p(),seed)}function sample(n){var st=make(),pts=[],minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,q;for(var i=0;i<n;i++){q=st();if(i<250)continue;if(!isFinite(q[0])||!isFinite(q[1]))continue;pts.push([q[0],q[1]]);minX=Math.min(minX,q[0]);maxX=Math.max(maxX,q[0]);minY=Math.min(minY,q[1]);maxY=Math.max(maxY,q[1])}return{pts,minX,maxX,minY,maxY,w:maxX-minX,h:maxY-minY}}function fingerprint(s){var a=0,b=0,c=0;for(var i=0;i<s.pts.length;i+=Math.max(1,Math.floor(s.pts.length/400))){var q=s.pts[i];a+=Math.sin(q[0]*3.1+i*.01);b+=Math.cos(q[1]*2.7-i*.013);c+=q[0]*q[1]}return(Math.abs((a*997+b*313+c*271)|0)).toString(16).slice(0,8)}function render(){token++;var my=token;controls();ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);$('status').textContent='rendering';var total=+$('points').value,s=sample(total),fill=.92,scale=Math.min(cv.width*fill/(s.w||1),cv.height*fill/(s.h||1)),ox=cv.width/2-scale*(s.minX+s.maxX)/2,oy=cv.height/2+scale*(s.minY+s.maxY)/2,alpha=.008+(+$('ink').value)/900,idx=0;ctx.fillStyle='rgba(255,255,255,'+alpha+')';function batch(){if(my!==token)return;var t=performance.now();ctx.beginPath();while(idx<s.pts.length&&performance.now()-t<7){var q=s.pts[idx++],px=ox+q[0]*scale,py=oy-q[1]*scale;ctx.rect(px,py,.8,.8)}ctx.fill();if(idx<s.pts.length)requestAnimationFrame(batch);else{$('status').textContent='ready';$('name').textContent=families[current][0]+' · '+s.pts.length.toLocaleString()+' pts';$('metrics').textContent='family '+current+' · fingerprint '+fingerprint(s)+' · span '+s.w.toFixed(3)+' × '+s.h.toFixed(3)}}requestAnimationFrame(batch)}['couple','memory','edge','proj','points','ink'].forEach(id=>$(id).oninput=()=>{controls();clearTimeout(window._r);window._r=setTimeout(render,180)});$('mutate').onclick=()=>{seed=(seed+7919)>>>0;render()};$('rerender').onclick=render;$('focus').onclick=()=>{document.body.classList.toggle('focusMode');$('focus').textContent=document.body.classList.contains('focusMode')?'Controls':'Focus'};render()})();</script></body></html>
