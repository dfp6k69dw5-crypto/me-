name: Room evaluative-topic repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-warm-runner-simulator.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: room-evaluative-topic-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - name: Patch and verify evaluative topic filter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/room_engine_v5.py')
          s=p.read_text()
          old='    "confused", "comfortable", "uncomfortable", "honest", "open", "okay", "fine",\n'
          new='    "confused", "comfortable", "uncomfortable", "honest", "open", "okay", "fine",\n    "tough", "hard", "difficult", "easy", "rough",\n'
          if old in s:
              s=s.replace(old,new,1)
          elif '"tough", "hard", "difficult", "easy", "rough"' not in s:
              raise SystemExit('state term anchor missing')
          p.write_text(s)
          PY
          python3 -m py_compile scripts/room_engine_v5.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_engine_v5 as e
          assert not any(x in e._semantic_cues('This is a tough difficult situation') for x in ('tough','difficult'))
          msg={'text':'These tough emotions are about grief','cognition':{'topic_terms':['tough','emotions','grief']}}
          assert e._sanitize_declared_topic_terms(msg)==['emotions','grief']
          print('ROOM_EVALUATIVE_TOPIC_GUARD_OK')
          PY
      - name: Commit if needed
        run: |
          set -euo pipefail
          git config user.name room-evaluative-topic-repair
          git config user.email actions@users.noreply.github.com
          git add scripts/room_engine_v5.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep generic evaluative words out of Room topics'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Restart Room on verified code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && break
            sleep 2
          done
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
