name: Room Allen auth fallback repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/room-allen-auth-fallback-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the same simulator is red before the patch
        shell: bash
        run: |
          set +e
          node scripts/room_allen_auth_sim.mjs > /tmp/allen-auth-baseline.log 2>&1
          rc=$?
          set -e
          cat /tmp/allen-auth-baseline.log
          if [ "$rc" -eq 0 ]; then
            echo "Expected the pre-patch source to fail the fallback invariant, but it was already green."
            exit 1
          fi
          grep -q '"invariant":"hash-fallback-present"' /tmp/allen-auth-baseline.log

      - name: Patch only Allen authentication
        env:
          ALLEN_KEY_SHA256: e53d0db863593fc618b4b764f70b31a5b9652931d8f8f7838a24cbd8cf87aa4d
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("cloudflare/room-worker/src/index.js")
          source = path.read_text(encoding="utf-8")
          verifier = os.environ["ALLEN_KEY_SHA256"]

          replacements = [
              (
                  'const MAX_QUEUE = 50;\n\nlet oidcMetadataCache = null;',
                  f'const MAX_QUEUE = 50;\nconst ALLEN_KEY_SHA256 = "{verifier}";\n\nlet oidcMetadataCache = null;'
              ),
              (
                  '''function allenAuthorized(request, env) {\n  const expected = String(env.ROOM_ALLEN_KEY || "");\n  return Boolean(expected && bearer(request) === expected);\n}''',
                  '''async function sha256Hex(value) {\n  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(value)));\n  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");\n}\n\nfunction constantTimeHexEqual(a, b) {\n  if (a.length !== b.length) return false;\n  let diff = 0;\n  for (let i = 0; i < a.length; i += 1) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return diff === 0;\n}\n\nasync function allenAuthorized(request, env) {\n  const token = bearer(request);\n  if (!token) return false;\n  const expected = String(env.ROOM_ALLEN_KEY || "");\n  if (expected && token === expected) return true;\n  return constantTimeHexEqual(await sha256Hex(token), ALLEN_KEY_SHA256);\n}'''
              ),
              (
                  '''    if (url.pathname === "/api/allen/auth" && request.method === "GET") {\n      if (!env.ROOM_ALLEN_KEY) return json({ error: "allen-key-not-configured" }, 503);\n      if (!allenAuthorized(request, env)) return json({ error: "unauthorized" }, 401);\n      return json({ ok: true, identity: "Allen" });\n    }''',
                  '''    if (url.pathname === "/api/allen/auth" && request.method === "GET") {\n      if (!(await allenAuthorized(request, env))) return json({ error: "unauthorized" }, 401);\n      return json({ ok: true, identity: "Allen" });\n    }'''
              ),
              (
                  '''    if (url.pathname === "/api/allen" && request.method === "POST") {\n      if (!env.ROOM_ALLEN_KEY) return json({ error: "allen-key-not-configured" }, 503);\n      if (!allenAuthorized(request, env)) return json({ error: "unauthorized" }, 401);''',
                  '''    if (url.pathname === "/api/allen" && request.method === "POST") {\n      if (!(await allenAuthorized(request, env))) return json({ error: "unauthorized" }, 401);'''
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one patch target, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Run the same simulator after the patch
        run: node scripts/room_allen_auth_sim.mjs

      - name: Record repository validation
        shell: bash
        run: |
          cat >> docs/research/room-allen-auth-fallback-2026-08-19.md <<'EOF'

          ## Repository validation result

          The same `scripts/room_allen_auth_sim.mjs` invariant was run immediately before and after the source change. Before the patch it failed because the source had no hash fallback. After the patch it passed all five checks: fallback auth without an environment secret; wrong-token rejection; missing-token 401; compatibility with an existing `ROOM_ALLEN_KEY`; and verifier-backed Allen POST queueing.

          The plaintext fallback token was not written to the repository or workflow. Only its SHA-256 verifier is committed.

          Production validation remains: wait for the automatic Cloudflare deployment, then confirm unauthenticated `/api/allen/auth` returns 401 rather than `allen-key-not-configured` 503 before releasing the private token to the user.
          EOF

      - name: Remove one-shot repair workflow
        run: rm .github/workflows/room-allen-auth-fallback-repair.yml

      - name: Commit and push validated repair
        shell: bash
        run: |
          git config user.name "room-repair-bot"
          git config user.email "room-repair-bot@users.noreply.github.com"
          git add cloudflare/room-worker/src/index.js scripts/room_allen_auth_sim.mjs docs/research/room-allen-auth-fallback-2026-08-19.md .github/workflows/room-allen-auth-fallback-repair.yml
          git commit -m "fix: make Allen auth independent of Worker secret"

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish Allen auth repair after repeated rebases."
          exit 1
