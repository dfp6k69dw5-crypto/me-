name: Unpack Growth Canvas
on:
  push:
    paths:
      - 'apps/growth-canvas/growth-canvas.js.gz.b64'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tested Growth Canvas source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/growth-canvas/growth-canvas.js.gz.b64 ]; then
            exit 0
          fi
          base64 -d apps/growth-canvas/growth-canvas.js.gz.b64 | gzip -d > apps/growth-canvas/growth-canvas.js
          rm apps/growth-canvas/growth-canvas.js.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/growth-canvas/growth-canvas.js apps/growth-canvas/growth-canvas.js.gz.b64
          git commit -m "Add Growth Canvas FEM module"
          git push
