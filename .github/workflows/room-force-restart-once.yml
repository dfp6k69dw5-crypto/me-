name: Force restart The Room once

on:
  push:
    branches: [main]
    paths:
      - 'society/room-force-restart-kick.txt'

permissions:
  contents: write
  actions: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 5
      - name: Cancel stale Room runs and dispatch one clean run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "room-recovery"
          git config user.email "actions@users.noreply.github.com"
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 30 --json databaseId,status --jq '.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | .databaseId')
          cancelled=""
          for id in $ids; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            cancelled="${cancelled}${id},"
          done
          sleep 3
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
          mkdir -p room
          printf 'restarted_at=%s\ncancelled_run_ids=%s\nsource_run=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$cancelled" "$GITHUB_RUN_ID" > room/force-restart-result.txt
          git rm -f .github/workflows/room-force-restart-once.yml society/room-force-restart-kick.txt
          git add room/force-restart-result.txt
          git commit -m "Record forced Room workflow restart"
          git push origin HEAD:main
