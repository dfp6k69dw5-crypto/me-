name: Deploy project home to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Live Room data changes constantly and must not redeploy Pages every beat.
      # Viewer HTML under room/ must remain deployable.
      - 'room/*.json'
      - 'room/**/*.json'
      - 'society/**'
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Bake newest Room snapshot
        run: python3 scripts/bake_room.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy attempt 1
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Brief retry pause 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 5
      - name: Deploy attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Brief retry pause 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 10
      - name: Deploy attempt 3
        id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
