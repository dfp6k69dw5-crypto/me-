name: Room personality edge patch

on:
  push:
    branches: [main]
    paths:
      - society/room-personality-patch-kick.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Add dysfunctional interpersonal edges without touching Room liveness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import py_compile

          p = Path('scripts/room_private_model.py')
          s = p.read_text()

          people = 'PEOPLE = ["sarah", "mara", "owen", "jules"]\n'
          edges = '''
          INTERPERSONAL_EDGES = {
              "sarah": (
                  "Abandonment-sensitive and emotionally volatile: she can attach intensely, read distance as rejection, "
                  "swing from warmth to anger, demand reassurance, idealize someone and then sharply devalue them, and later "
                  "try to repair the rupture without becoming a different person."
              ),
              "mara": (
                  "Status-sensitive, proud, and criticism-reactive: she can be grandiose, competitive, entitled, contemptuous, "
                  "mocking, defensive when challenged, hungry to win the social exchange, and willing to retaliate verbally when "
                  "she feels diminished or embarrassed."
              ),
              "owen": (
                  "Suspicious, irritable, and grievance-holding: he can assume bad motives, hear slights where others may not, "
                  "argue hard, distrust reassurance, keep score, hold grudges, become cutting or hostile, and resist backing down "
                  "when he thinks someone is manipulating him."
              ),
              "jules": (
                  "Dramatic, impulsive, and attention-seeking: they can provoke for a reaction, exaggerate, flirt with conflict, "
                  "compete for attention, change emotional direction quickly, take interpersonal risks, and turn boredom into "
                  "chaos simply because a flat room feels unbearable."
              ),
          }
          '''.lstrip()
          if 'INTERPERSONAL_EDGES = {' not in s:
              if people not in s:
                  raise SystemExit('PEOPLE anchor missing; refusing unsafe patch')
              s = s.replace(people, people + edges, 1)

          expression_anchor = '    if role == "expression":\n        base_guard = (\n'
          expression_replacement = '    if role == "expression":\n        edge = INTERPERSONAL_EDGES.get(self_entity, "")\n        base_guard = (\n'
          if 'edge = INTERPERSONAL_EDGES.get(self_entity, "")' not in s:
              if expression_anchor not in s:
                  raise SystemExit('expression anchor missing; refusing unsafe patch')
              s = s.replace(expression_anchor, expression_replacement, 1)

          behavior_anchor = (
              '            "rough language into polite disagreement merely for civility. These behaviors are available, not mandatory: "\n'
          )
          behavior_replacement = (
              '            "rough language into polite disagreement merely for civility. The speaker also has a persistent "\n'
              '            "maladaptive interpersonal pattern that may shape attachment, rivalry, grudges, repair, and conflict: " + edge + " "\n'
              '            "These behaviors are available, not mandatory: "\n'
          )
          if 'maladaptive interpersonal pattern that may shape attachment' not in s:
              if behavior_anchor not in s:
                  raise SystemExit('behavior anchor missing; refusing unsafe patch')
              s = s.replace(behavior_anchor, behavior_replacement, 1)

          old_attempts = 'attempts = 5 if role == "expression" else 2'
          new_attempts = 'attempts = 9 if role == "expression" else 2'
          if old_attempts in s:
              s = s.replace(old_attempts, new_attempts, 1)
          elif new_attempts not in s:
              raise SystemExit('retry anchor missing; refusing unsafe patch')

          p.write_text(s)
          py_compile.compile(str(p), doraise=True)
          assert 'INTERPERSONAL_EDGES = {' in s
          assert 'Room participants may be' in s
          assert 'maladaptive interpersonal pattern that may shape attachment' in s
          assert new_attempts in s
          assert 'temperature = min(1.28, 0.88 + 0.06 * voice_index + 0.09 * attempt)' in s
          print('PATCH_OK')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_private_model.py
          if git diff --cached --quiet; then
            echo "Already patched"
            exit 0
          fi
          git commit -m "Give Room entities dysfunctional interpersonal edges"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep 1
          done
          exit 1
