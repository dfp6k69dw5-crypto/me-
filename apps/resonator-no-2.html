<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080D1A"><title>RESONATOR NO. 2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080D1A;color:#f0ead8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;overscroll-behavior:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.rail{position:fixed;right:max(18px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 145px);display:grid;gap:14px;z-index:5}.btn{height:66px;min-width:112px;padding:0 22px;border:1px solid #53617c;border-radius:34px;background:rgba(12,19,35,.78);color:#e7e5e1;font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;backdrop-filter:blur(12px)}.btn:active{background:#17243b}.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:3;opacity:.45;font-size:11px;white-space:nowrap;pointer-events:none;transition:opacity .5s}.sheet{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto;border:1px solid #33415f;border-radius:24px;background:rgba(8,13,26,.96);padding:18px;transform:translateY(calc(100% + 40px));transition:transform .25s ease;box-shadow:0 20px 60px #0008;touch-action:pan-y}.sheet.open{transform:none}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head b{letter-spacing:2px}.x{width:42px;height:42px;border-radius:50%;border:1px solid #44516b;background:#111a2c;color:#fff;font-size:22px}.row{display:grid;grid-template-columns:105px 1fr 52px;gap:10px;align-items:center;margin:15px 0}.row input{width:100%;accent-color:#75d9eb}.val{text-align:right;color:#f49a55}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.seg button{padding:12px 4px;border:1px solid #35415c;background:#10182a;color:#cdd5e7;border-radius:10px}.seg button.on{border-color:#75d9eb;color:#fff;background:#132638}.footer{opacity:.45;font-size:11px;line-height:1.5;margin-top:14px}@media(max-width:500px){.rail{right:14px;top:calc(env(safe-area-inset-top) + 130px)}.btn{min-width:104px;height:62px;padding:0 16px}.hint{display:none}}
</style></head><body>
<canvas id="c"></canvas><div class="rail"><button class="btn" id="advanced">ADVANCED</button><button class="btn" id="keys">KEYS</button><button class="btn" id="reset">RESET</button></div><div class="hint" id="hint">drag · pinch · two-finger move · twist</div>
<div class="sheet" id="sheet"><div class="head"><b>ADVANCED</b><button class="x" id="close">×</button></div>
<div class="row"><span>masses</span><input id="masses" type="range" min="5" max="40" value="16"><span class="val" id="mv">16</span></div>
<div class="row"><span>length</span><input id="length" type="range" min="120" max="520" value="310"><span class="val" id="lv">310</span></div>
<div class="row"><span>curve</span><input id="curve" type="range" min="0" max="100" value="28"><span class="val" id="cv">28</span></div>
<div class="row"><span>damping</span><input id="damp" type="range" min="0" max="100" value="42"><span class="val" id="dv">42</span></div>
<div class="row"><span>motion</span><input id="motion" type="range" min="0" max="100" value="20"><span class="val" id="ov">20</span></div>
<div class="seg"><button data-shape="string" class="on">STRING</button><button data-shape="ring">RING</button><button data-shape="helix">HELIX</button></div><div class="footer">The object remains directly manipulable whenever this panel is closed. Double-tap the field to excite it.</div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W=0,H=0,D=1;const S={rx:-.2,ry:.35,rz:0,zoom:1,tx:0,ty:20,masses:16,length:310,curve:.28,damp:.42,motion:.20,shape:'string',phase:0};const ptr=new Map();let gesture=null,lastTap=0,audio=null;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();
function rot(p){let{x,y,z}=p,co=Math.cos(S.rx),si=Math.sin(S.rx);[y,z]=[y*co-z*si,y*si+z*co];co=Math.cos(S.ry);si=Math.sin(S.ry);[x,z]=[x*co+z*si,-x*si+z*co];co=Math.cos(S.rz);si=Math.sin(S.rz);[x,y]=[x*co-y*si,x*si+y*co];return{x,y,z}}
function project(p){p=rot(p);let f=620/(620+p.z);return{x:W/2+S.tx+p.x*S.zoom*f,y:H/2+S.ty+p.y*S.zoom*f,z:p.z,f}}
function points(){let a=[],n=S.masses,L=S.length,t=S.phase;for(let i=0;i<n;i++){let u=n===1?0:i/(n-1),x=(u-.5)*L,y=0,z=0;if(S.shape==='string'){y=Math.sin(u*Math.PI*2+t)*L*.07*S.curve;z=Math.sin(u*Math.PI*3+t*.7)*L*.11*S.curve}else if(S.shape==='ring'){let q=u*Math.PI*2;x=Math.cos(q)*L*.38;y=Math.sin(q)*L*.38;z=Math.sin(q*3+t)*L*.10*S.curve}else{let q=u*Math.PI*4;x=(u-.5)*L*.8;y=Math.cos(q+t*.25)*L*.18;z=Math.sin(q+t*.25)*L*.18}let pulse=Math.sin(u*Math.PI*5-t*2)*S.motion*7;x+=pulse*Math.sin(t*.3+u);y+=pulse*.35;a.push({x,y,z})}return a}
function draw(){S.phase+=.008+S.motion*.015;g.fillStyle='#080D1A';g.fillRect(0,0,W,H);let grd=g.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.65);grd.addColorStop(0,'#111d35');grd.addColorStop(1,'#080D1A');g.fillStyle=grd;g.fillRect(0,0,W,H);let p=points().map(project);g.lineWidth=1.5;g.strokeStyle='rgba(117,217,235,.45)';g.beginPath();p.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));if(S.shape==='ring')g.closePath();g.stroke();let sorted=p.map((q,i)=>({q,i})).sort((a,b)=>b.q.z-a.q.z);for(const {q,i} of sorted){let r=Math.max(3,7*q.f*S.zoom);let glow=g.createRadialGradient(q.x-r*.3,q.y-r*.3,0,q.x,q.y,r*1.8);glow.addColorStop(0,'#fff');glow.addColorStop(.22,i===0||i===p.length-1?'#75d9eb':'#cbd6f2');glow.addColorStop(1,'rgba(70,90,140,0)');g.fillStyle=glow;g.beginPath();g.arc(q.x,q.y,r*1.8,0,Math.PI*2);g.fill();g.fillStyle=i===0||i===p.length-1?'#75d9eb':'#cbd6f2';g.beginPath();g.arc(q.x,q.y,r*.62,0,Math.PI*2);g.fill()}requestAnimationFrame(draw)}draw();
function snapshot(){let a=[...ptr.values()];if(a.length===1)return{x:a[0].x,y:a[0].y};if(a.length>=2){let A=a[0],B=a[1],dx=B.x-A.x,dy=B.y-A.y;return{cx:(A.x+B.x)/2,cy:(A.y+B.y)/2,dist:Math.hypot(dx,dy),ang:Math.atan2(dy,dx)}}return null}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture=snapshot();let now=performance.now();if(now-lastTap<300){excite();lastTap=0}else lastTap=now;e.preventDefault()});
c.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});let now=snapshot();if(!gesture||!now){gesture=now;return}if(ptr.size===1){let dx=now.x-gesture.x,dy=now.y-gesture.y;S.ry+=dx*.009;S.rx+=dy*.009}else{let scale=now.dist/Math.max(20,gesture.dist);S.zoom=Math.max(.25,Math.min(4.5,S.zoom*scale));S.tx+=now.cx-gesture.cx;S.ty+=now.cy-gesture.cy;let da=now.ang-gesture.ang;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;S.rz+=da}gesture=now;e.preventDefault()},{passive:false});
function up(e){ptr.delete(e.pointerId);gesture=snapshot()}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
function excite(){S.motion=Math.min(1,S.motion+.32);setTimeout(()=>S.motion=Math.max(.08,S.motion-.25),700);try{audio=audio||new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.value=165+S.masses*10;gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.16,audio.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.7);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+.72)}catch(_){}}
function reset(){Object.assign(S,{rx:-.2,ry:.35,rz:0,zoom:1,tx:0,ty:20});}document.getElementById('reset').onclick=reset;const sheet=document.getElementById('sheet');document.getElementById('advanced').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');document.getElementById('keys').onclick=()=>excite();
[['masses','masses','mv',1],['length','length','lv',1],['curve','curve','cv',.01],['damp','damp','dv',.01],['motion','motion','ov',.01]].forEach(([id,k,v,m])=>{let el=document.getElementById(id),out=document.getElementById(v);el.oninput=()=>{S[k]=+el.value*m;out.textContent=el.value}});document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-shape]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.shape=b.dataset.shape});setTimeout(()=>document.getElementById('hint').style.opacity=0,3500);
})();
</script></body></html>
