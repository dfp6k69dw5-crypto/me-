name: One-time Room v4 reset

on:
  push:
    branches: [main]
    paths:
      - 'society/v4-reset-kick.txt'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Reset Room to sterile v4
        run: |
          set -euo pipefail
          git config user.name "the-room-reset"
          git config user.email "actions@users.noreply.github.com"
          python3 scripts/room_sterilize.py
          python3 scripts/build_room_feed.py
          git add -A room society
          git commit -m "Sterilize Room historical cognition v4" || true
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$attempt"
          done
          exit 1
