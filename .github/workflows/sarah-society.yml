name: The Room

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Legacy pulse compatibility; ignored because all four entities process every beat
        required: true
        default: auto
        type: choice
        options: [auto, sarah, mara, owen, jules]

permissions:
  contents: write

concurrency:
  group: the-room-world-main
  cancel-in-progress: false

jobs:
  beat:
    name: 12-node shared cognitive beat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Run all 12 cognitive nodes in parallel
        env:
          ROOM_CYCLE_KEY: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf room_parts room_work
          mkdir -p room_parts room_work

          echo "Launching 12 sense nodes inside one GitHub runner"
          pids=()
          for n in $(seq 0 11); do
            (
              export ROOM_NODE_ID="$n"
              python3 scripts/room_engine.py node --phase sense
            ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          [ "$failed" -eq 0 ] || { echo "A sense node failed"; exit 1; }

          echo "Broadcasting shared cognitive bus"
          python3 scripts/room_engine.py bus

          echo "Launching 12 recurrent nodes inside one GitHub runner"
          pids=()
          for n in $(seq 0 11); do
            (
              export ROOM_NODE_ID="$n"
              python3 scripts/room_engine.py node --phase recurrent --bus room_work/bus-sense.json
            ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          [ "$failed" -eq 0 ] || { echo "A recurrent node failed"; exit 1; }

          echo "Integrating four independent entity contributions"
          python3 scripts/room_engine.py commit

      - name: Commit continuing Room
        run: |
          set -euo pipefail
          git config user.name "the-room"
          git config user.email "actions@users.noreply.github.com"
          git add room society/live.json
          if git diff --cached --quiet; then
            echo "No Room state change to commit"
            exit 0
          fi
          git commit -m "Room cognition v4 shared beat"
          git pull --rebase origin main
          git push origin HEAD:main
