name: Room relay transport probe
# validate-and-publish Worker reboot ordering fix: 2026-08-19b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-relay-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply only the boot-aware ingest patch in the checkout
        run: python3 scripts/apply_room_worker_reboot_fix.py

      - name: Execute actual patched RoomState.putLatest
        id: worker_sim
        continue-on-error: true
        run: |
          rm -f room/worker-ingest-simulator-diagnostic.json
          node scripts/room_worker_ingest_sim.mjs

      - name: Publish source only if simulator passed
        if: always()
        env:
          SIMULATOR_OUTCOME: ${{ steps.worker_sim.outcome }}
        run: |
          test -f room/worker-ingest-simulator-diagnostic.json || printf '%s\n' '{"pass":false,"error":"worker ingest simulator produced no diagnostic"}' > room/worker-ingest-simulator-diagnostic.json
          git config user.name "room-relay-probe"
          git config user.email "actions@users.noreply.github.com"
          git add room/worker-ingest-simulator-diagnostic.json
          if [ "$SIMULATOR_OUTCOME" = success ]; then
            git add cloudflare/room-worker/src/index.js
          else
            git restore cloudflare/room-worker/src/index.js
          fi
          git commit -m "Validate and apply Room Worker reboot ordering" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$n"
          done
          exit 1

      - name: Enforce patched simulator result
        if: always()
        env:
          SIMULATOR_OUTCOME: ${{ steps.worker_sim.outcome }}
        run: test "$SIMULATOR_OUTCOME" = success
