name: Room Continuity Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: room-continuity-watchdog
  cancel-in-progress: true

jobs:
  revive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Restart Room only when stale and inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          active=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow sarah-society.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")] | length')

          if [ "${active:-0}" -gt 0 ]; then
            echo "Room already has an active run; watchdog stays out of the way."
            exit 0
          fi

          age_seconds=$(python3 - <<'PY'
import json
from datetime import datetime, timezone

try:
    with open('room/conversation.json', 'r', encoding='utf-8') as f:
        data = json.load(f)
    raw = data.get('updated_at') or data.get('timestamp') or data.get('published_at')
    if not raw:
        print(999999)
    else:
        stamp = datetime.fromisoformat(raw.replace('Z', '+00:00'))
        print(max(0, int((datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds())))
except Exception:
    print(999999)
PY
          )

          echo "Latest Room beat age: ${age_seconds}s"
          if [ "$age_seconds" -lt 600 ]; then
            echo "Room is fresh; no restart needed."
            exit 0
          fi

          echo "Room is stale and inactive; dispatching a fresh runner."
          gh workflow run sarah-society.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f entity=auto
