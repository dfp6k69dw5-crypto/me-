name: The Room Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'society/pulse-kick.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: the-room-pulse-chain
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Give The Room a turn about every minute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in $(seq 1 330); do
            echo "Dispatching room turn $n of 330"
            gh workflow run sarah-society.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f entity=auto
            if [ "$n" -lt 330 ]; then
              sleep 60
            fi
          done

          echo "Handing The Room pulse to a fresh GitHub runner"
          gh workflow run sarah-society-pulse.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
