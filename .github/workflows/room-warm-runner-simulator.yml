name: Room memory routing repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-warm-runner-simulator.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: room-memory-routing-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Apply and compile memory routing repair
        run: |
          set -euo pipefail
          python3 tools/apply_room_memory_routing_guard.py
          python3 -m py_compile scripts/room_engine_v5_core.py scripts/room_engine_v5.py scripts/room_private_commit.py
          grep -q '_memory_relevant_to_listener' scripts/room_engine_v5_core.py
          grep -q '_dedupe_memories' scripts/room_engine_v5_core.py

      - name: Commit verified source repair
        run: |
          set -euo pipefail
          git config user.name room-memory-routing-repair
          git config user.email actions@users.noreply.github.com
          git add scripts/room_engine_v5_core.py
          git commit -m 'Route Room memories to relevant minds only'
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1

      - name: Cancel resident Room and dispatch repaired runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 20 --json databaseId --jq '.[].databaseId')"
          for id in $ids; do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          for n in $(seq 1 30); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 1 --json databaseId --jq 'length')"
            [ "$active" -eq 0 ] && break
            sleep 2
          done
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
