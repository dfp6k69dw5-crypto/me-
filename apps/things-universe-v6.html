function k(s){return String(s||'').toLowerCase().trim().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ').slice(0,80)}
function L(s){return String(s||'').trim().replace(/_/g,' ').replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function valid(w){w=k(w);return w.length>1&&w.length<55&&!STOP.has(w)&&!/^(wikipedia|article|category|list of)/.test(w)}
const reverseMap=new Map();
for(const [from,list] of Object.entries(LOCAL))for(const [to,rel] of list){const tk=k(to);if(!reverseMap.has(tk))reverseMap.set(tk,[]);reverseMap.get(tk).push([from,'connected with'])}
const semCache=new Map();
async function semantic(term){const key=k(term);if(semCache.has(key))return semCache.get(key);const map=new Map();let i=0;for(const [w,rel] of [...(LOCAL[key]||[]),...(reverseMap.get(key)||[])]){const wk=k(w);if(valid(wk)&&wk!==key&&!map.has(wk))map.set(wk,{key:wk,label:L(w),score:190-(i++*6),rel,source:'local'})}
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),4500);const r=await fetch(`${DM}?ml=${encodeURIComponent(key)}&max=60`,{signal:c.signal});clearTimeout(t);if(r.ok){const a=await r.json();for(const x of a){const wk=k(x.word);if(!valid(wk)||wk===key)continue;const score=Math.log10((Number(x.score)||1)+10)*26;const prev=map.get(wk);if(!prev||score>prev.score)map.set(wk,{key:wk,label:L(x.word),score,rel:prev?.rel||'semantically related to',source:prev?.source||'datamuse'})}}}catch{}
 const out=[...map.values()].sort((a,b)=>b.score-a.score);semCache.set(key,out);return out}
let nodes=[],links=[],A=null,B=null,selected=null,meet=null,round=0,busy=false,auto=false,autoToken=0,view={x:0,y:0,s:1},drag=null;

function side(n){return n?.sides?.A&&n?.sides?.B?'both':n?.sides?.A?'A':n?.sides?.B?'B':n?.side||''}
function other(s){return s==='A'?'B':'A'}
function nodeByKey(key){return nodes.find(n=>n.key===key)}
function nodeById(id){return nodes.find(n=>n.id===id)}

function edgeId(a,b){a=a.id||a;b=b.id||b;return a<b?a+'|'+b:b+'|'+a}
function addLink(a,b,label){if(!a||!b||a.id===b.id)return;const id=edgeId(a,b);if(!links.some(l=>edgeId(l.a,l.b)===id))links.push({a:a.id,b:b.id,label:label||'related to',bridge:false})}

function resetSearch(){for(const s of ['A','B']){const st=searches[s];st.seen=new Set();st.frontier=[];st.parents=new Map();st.expanded=new Set();const root=s==='A'?A:B;if(root){st.seen.add(root.key);st.frontier.push(root.key)}}meet=null;nodes.forEach(n=>n.bridge=false);links.forEach(l=>l.bridge=false);pair();status(A&&B?'Two roots ready':'Ready')}

async function semanticMap(keys,per=30){const m=new Map();for(const key of keys){for(const x of (await semantic(key)).slice(0,per)){const old=m.get(x.key);if(!old||x.score>old.score)m.set(x.key,{...x,from:key})}}return m}
async function sharedCandidate(){const aKeys=sourceKeys('A',5),bKeys=sourceKeys('B',5);if(!aKeys.length||!bKeys.length)return null;const [ma,mb]=await Promise.all([semanticMap(aKeys,35),semanticMap(bKeys,35)]);let best=null;for(const [key,a] of ma){const b=mb.get(key);if(!b||key===A.key||key===B.key)continue;const score=a.score+b.score+(nodeByKey(key)?25:0);if(!best||score>best.score)best={key,label:a.label||b.label,a,b,score}}return best&&best.score>105?best:null}
async function connectShared(c){const pa=nodeByKey(c.a.from),pb=nodeByKey(c.b.from);if(!pa||!pb)return false;const n=addNode(c.key,'A',Math.min(pa.depth+1,pb.depth+1),c.label);addNode(c.key,'B',n.depth,n.label);n.sides.A=n.sides.B=true;n.side='both';addLink(pa,n,c.a.rel);addLink(pb,n,c.b.rel);searches.A.seen.add(n.key);searches.B.seen.add(n.key);searches.A.frontier.push(n.key);searches.B.frontier.push(n.key);if(!searches.A.parents.has(n.key))searches.A.parents.set(n.key,pa.key);if(!searches.B.parents.has(n.key))searches.B.parents.set(n.key,pb.key);meet=n;layout();markBridge();status(`Bridge found: ${n.label}`);return true}
async function chooseBatch(s,beam=3){const own=searches[s],opp=searches[other(s)],oppRoot=s==='A'?B:A;if(!oppRoot)return[];const srcs=sourceKeys(s,3);if(!srcs.length)return[];const oppMap=await semanticMap(sourceKeys(other(s),4).concat([oppRoot.key]),28);let all=[];for(const src of srcs){const list=await semantic(src);own.expanded.add(src);for(const x of list.slice(0,45)){if(own.seen.has(x.key)||x.key===oppRoot.key)continue;const score=(opp.seen.has(x.key)?10000:0)+x.score+(oppMap.get(x.key)?.score||0)*1.6+(nodeByKey(x.key)?0:10)+(x.source==='local'?30:0);all.push({src,...x,total:score})}}all.sort((a,b)=>b.total-a.total);const out=[],used=new Set();for(const c of all){if(used.has(c.key))continue;used.add(c.key);out.push(c);if(out.length>=beam)break}return out}
async function expandBatch(s,beam=3){const own=searches[s],opp=searches[other(s)],batch=await chooseBatch(s,beam);let added=0;for(const c of batch){const src=nodeByKey(c.src);if(!src)continue;const n=addNode(c.key,s,(src.depth||0)+1,c.label);addLink(src,n,c.rel);own.seen.add(n.key);own.frontier.push(n.key);if(!own.parents.has(n.key))own.parents.set(n.key,src.key);added++;if(opp.seen.has(n.key)){n.sides.A=n.sides.B=true;n.side='both';meet=n;break}}layout();render();if(meet)markBridge();return added}
async function searchRound(){if(busy||!A||!B||meet)return false;busy=true;round++;thinking(true,`Round ${round}: comparing both trees…`);status(`Round ${round}: looking for shared concepts`);try{const shared=await sharedCandidate();if(shared)return await connectShared(shared);thinking(true,`Round ${round}: growing A toward ${B.label}…`);const aa=await expandBatch('A',3);if(meet)return true;thinking(true,`Round ${round}: growing B toward ${A.label}…`);const bb=await expandBatch('B',3);if(meet){markBridge();return true}const shared2=await sharedCandidate();if(shared2)return await connectShared(shared2);status(`Round ${round}: +${aa} on A, +${bb} on B`);return false}catch(e){status(`Round ${round}: search error — trying another route next round`);return false}finally{busy=false;thinking(false)}}
async function hardSearch(){if(!A||!B){toast('Add two ideas first');return}$('#bridge').disabled=true;for(let i=0;i<14&&!meet;i++){await searchRound();await new Promise(r=>setTimeout(r,90))}$('#bridge').disabled=false;if(meet){fit();explain()}else toast('No bridge yet — Auto-grow can keep going')}
function explain(){if(!A||!B){toast('Add two ideas first');return}const p=visiblePath(A,B);let h=`<h2>${A.label} ↔ ${B.label}</h2>`;if(!p)h+=`<div class="box"><strong>Not connected yet</strong><p>${round} search rounds have explored ${searches.A.seen.size} concepts from A and ${searches.B.seen.size} from B.</p></div>`;else{let items='';for(let i=0;i<p.length-1;i++){const e=links.find(e=>edgeId(e.a,e.b)===edgeId(p[i],p[i+1]));items+=`<li><b>${p[i].label}</b> — ${e?.label||'related to'} → <b>${p[i+1].label}</b></li>`}h+=`<div class="box"><strong>Visible bridge found</strong><p>The two trees meet${meet?` at <b>${meet.label}</b>`:''}.</p></div><div class="box"><strong>Path</strong><ul>${items}</ul></div>`}h+=`<div class="box"><strong>What the engine is doing</strong><p>Both sides grow several candidate concepts, compare semantic neighborhoods, and favor concepts that are close to the opposite tree. The graph still works from its built-in concept network if the online semantic source fails.</p></div>`;$('#readerBody').innerHTML=h;$('#reader').classList.add('open')}
function layout(){if(!nodes.length)return;const stage=$('#stage').getBoundingClientRect(),w=stage.width,h=stage.height;const groups={A:[],B:[],both:[],other:[]};for(const n of nodes)groups[side(n)==='A'?'A':side(n)==='B'?'B':side(n)==='both'?'both':'other'].push(n);function place(list,cx,dir){const byDepth=new Map();for(const n of list){if(!byDepth.has(n.depth))byDepth.set(n.depth,[]);byDepth.get(n.depth).push(n)}for(const [d,arr] of byDepth){const spread=Math.min(h*.72,Math.max(90,arr.length*34)),start=h/2-spread/2;arr.forEach((n,i)=>{const targetX=cx+dir*d*Math.min(92,w*.12),targetY=arr.length===1?h/2:start+(spread*(i/(Math.max(1,arr.length-1))));if(!Number.isFinite(n.x)||!n.x){n.x=targetX+(Math.random()-.5)*25;n.y=targetY+(Math.random()-.5)*18}else{n.x=n.x*.55+targetX*.45;n.y=n.y*.55+targetY*.45}})}}place(groups.A,w*.22,1);place(groups.B,w*.78,-1);for(const n of groups.both){n.x=w*.5;n.y=h*.5+(Math.random()-.5)*30}for(const n of groups.other){n.x=w*.5;n.y=h*.5+(Math.random()-.5)*90}for(let r=0;r<18;r++){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,min=34;if(dist<min){const push=(min-dist)/2;a.x-=dx/dist*push;a.y-=dy/dist*push;b.x+=dx/dist*push;b.y+=dy/dist*push}}}}
function render(){const svg=$('#graph');while(svg.firstChild)svg.removeChild(svg.firstChild);if(!nodes.length){status('Ready');pair();return}const g=document.createElementNS(SVG,'g');g.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.s})`);svg.appendChild(g);for(const e of links){const a=nodeById(e.a),b=nodeById(e.b);if(!a||!b)continue;const line=document.createElementNS(SVG,'line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','link'+(e.bridge?' bridge':''));g.appendChild(line);if(view.s>.72&&nodes.length<80){const t=document.createElementNS(SVG,'text');t.setAttribute('x',(a.x+b.x)/2);t.setAttribute('y',(a.y+b.y)/2);t.setAttribute('class','edgeLabel');t.textContent=e.label;g.appendChild(t)}}for(const n of nodes){const ng=document.createElementNS(SVG,'g');ng.setAttribute('class','node'+(n===meet?' meet':'')+(Date.now()<(n.freshUntil||0)?' fresh':''));ng.dataset.id=n.id;const c=document.createElementNS(SVG,'circle');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',n===meet?13:n.bridge?11:10);c.setAttribute('fill',n.bridge?'#c7a7ff':side(n)==='A'?'#70e2da':side(n)==='B'?'#e3cc7b':side(n)==='both'?'#c7a7ff':'#9cb1c9');ng.appendChild(c);if(view.s>.45||nodes.length<45){const t=document.createElementNS(SVG,'text');t.setAttribute('x',n.x+13);t.setAttribute('y',n.y+4);t.textContent=n.label.length>28?n.label.slice(0,26)+'…':n.label;ng.appendChild(t)}ng.addEventListener('click',ev=>{ev.stopPropagation();selected=n;$('#cardTag').textContent=n.bridge?'bridge node':side(n)==='A'?'tree A':side(n)==='B'?'tree B':side(n)==='both'?'shared concept':'concept';$('#cardTitle').textContent=n.label;semantic(n.key).then(list=>$('#cardDesc').textContent=list.length?`Strong nearby concepts: ${list.slice(0,6).map(x=>x.label).join(', ')}.`:'No nearby concepts loaded yet.');$('#card').classList.add('open')});g.appendChild(ng)}pair();status($('#status').textContent||'Ready')}
function fit(){if(!nodes.length)return;const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),minX=Math.min(...xs)-70,maxX=Math.max(...xs)+100,minY=Math.min(...ys)-70,maxY=Math.max(...ys)+70,w=$('#stage').clientWidth,h=$('#stage').clientHeight,bw=maxX-minX,bh=maxY-minY,s=Math.min(1.5,.9/Math.max(bw/w,bh/h,.001));view={s,x:w/2-s*(minX+bw/2),y:h/2-s*(minY+bh/2)};render()}
async function addThing(term){const key=k(term);if(!key)return;const s=!A?'A':!B?'B':'';const n=addNode(term,s,0,term.trim());if(s==='A')A=n;else if(s==='B')B=n;layout();render();await sprout(n,s?7:5);if(A&&B){resetSearch();round=0;const p=visiblePath(A,B);if(p){meet=p.find(n=>n.sides.A&&n.sides.B)||null;markBridge();status('The two trees already overlap')}else status('Two roots ready — start Auto-grow or Find bridge')}fit()}
async function autoLoop(token){while(auto&&token===autoToken&&!meet){await searchRound();if(!auto||token!==autoToken||meet)break;await new Promise(r=>setTimeout(r,800))}if(meet&&auto){auto=false;$('#auto').textContent='Auto-grow: off';$('#auto').classList.remove('on');fit()}}
function toggleAuto(){if(auto){auto=false;autoToken++;$('#auto').textContent='Auto-grow: off';$('#auto').classList.remove('on');status('Ready');return}if(!A||!B){toast('Add two ideas first');return}if(!searches.A.seen.size||!searches.B.seen.size)resetSearch();auto=true;const token=++autoToken;$('#auto').textContent='Auto-grow: on';$('#auto').classList.add('on');status('Auto-searching both trees…');autoLoop(token)}
function resetAll(){auto=false;autoToken++;nodes=[];links=[];A=B=selected=meet=null;round=0;view={x:0,y:0,s:1};for(const s of ['A','B']){searches[s].seen=new Set();searches[s].frontier=[];searches[s].parents=new Map();searches[s].expanded=new Set()}$('#auto').textContent='Auto-grow: off';$('#auto').classList.remove('on');$('#card').classList.remove('open');$('#reader').classList.remove('open');render()}
const graph=$('#graph');graph.addEventListener('wheel',e=>{e.preventDefault();const rect=graph.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=view.s,ns=Math.max(.15,Math.min(6,old*(e.deltaY<0?1.12:.89))),wx=(mx-view.x)/old,wy=(my-view.y)/old;view.x=mx-wx*ns;view.y=my-wy*ns;view.s=ns;render()},{passive:false});graph.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};graph.setPointerCapture(e.pointerId)});graph.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+(e.clientX-drag.x);view.y=drag.vy+(e.clientY-drag.y);render()});graph.addEventListener('pointerup',()=>drag=null);graph.addEventListener('pointercancel',()=>drag=null);
$('#add').onclick=()=>{const v=$('#q').value.trim();if(v){$('#q').value='';addThing(v)}};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#add').click()}});$('#fit').onclick=fit;$('#reset').onclick=resetAll;$('#auto').onclick=toggleAuto;$('#bridge').onclick=hardSearch;$('#explain').onclick=explain;$('#closeCard').onclick=()=>$('#card').classList.remove('open');$('#closeReader').onclick=()=>$('#reader').classList.remove('open');$('#setA').onclick=()=>{if(selected){A=selected;resetSearch();round=0;status('A changed — search reset')}};$('#setB').onclick=()=>{if(selected){B=selected;resetSearch();round=0;status('B changed — search reset')}};$('#grow').onclick=()=>selected&&sprout(selected,8);window.addEventListener('resize',()=>{layout();fit()});render();
</script>
</body>
