<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050608">
<title>Inner Phone</title>
<style>
:root{--bg:#050608;--glass:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);--text:#f7f7f5;--muted:#8f949d;--green:#dfffe7;--green2:#8ee4a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{display:grid;place-items:center;background:radial-gradient(110% 80% at 50% 0%,#171b22 0%,#090b0f 48%,#030405 100%)}
.stage{width:100%;height:100%;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.outer{width:min(94vw,430px);height:min(94vh,840px);border:1px solid rgba(255,255,255,.13);border-radius:44px;padding:10px;background:linear-gradient(155deg,#171a20,#050607 62%);box-shadow:0 28px 90px rgba(0,0,0,.62),inset 0 0 0 1px rgba(255,255,255,.035);position:relative}
.outer:before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:94px;height:24px;border-radius:18px;background:#010101;z-index:3}
.screen{height:100%;border-radius:35px;overflow:hidden;background:linear-gradient(180deg,#0d1015,#060708 56%,#050606);position:relative;padding:36px 22px 20px;display:flex;flex-direction:column}
.status{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#858b95;letter-spacing:.06em}.depth{color:#b4bac4}
.brand{text-align:center;margin:10px 0 14px}.brand .label{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.34em;color:#8d949f;margin-left:.34em}.brand .sub{font-size:11px;color:#5f6670;margin-top:7px}
.display{height:94px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));display:flex;align-items:center;justify-content:center;padding:12px 18px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.number{font-size:clamp(28px,8vw,40px);font-weight:300;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:white}.number.empty{color:#4d535c}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;flex:1;align-content:center}.key{appearance:none;border:1px solid rgba(255,255,255,.08);background:var(--glass);color:white;border-radius:22px;min-height:58px;font-size:27px;font-weight:350;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);touch-action:manipulation}.key:active{transform:scale(.96);background:rgba(255,255,255,.14)}
.call{appearance:none;border:0;border-radius:22px;min-height:62px;margin-top:14px;background:linear-gradient(180deg,var(--green),#b9f4c8);color:#071009;font-weight:800;font-size:16px;letter-spacing:.18em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 28px rgba(84,228,122,.13);touch-action:manipulation}.call:active{transform:scale(.985)}.call[disabled]{opacity:.28;box-shadow:none}.phoneGlyph{font-size:20px;letter-spacing:0}.note{text-align:center;color:#686f79;font-size:11px;line-height:1.4;margin:12px 2px 2px}.tiny{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#454b53;letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
@media(max-height:700px){.outer{height:98vh}.screen{padding-top:30px}.brand{margin:4px 0 8px}.display{height:72px;margin-bottom:9px}.key{min-height:48px}.keys{gap:8px}.call{min-height:52px;margin-top:9px}.note{margin-top:7px}}
</style>
</head>
<body>
<div class="stage">
  <div class="outer" aria-label="Inner Phone shell">
    <main class="screen">
      <div class="status"><span>INNER/01</span><span class="depth">PHONE INSIDE PHONE</span></div>
      <section class="brand"><div class="label">INNER PHONE</div><div class="sub">manual line · no contacts</div></section>
      <div class="display"><div id="number" class="number empty">—</div></div>
      <div id="keys" class="keys" aria-label="Dial pad"></div>
      <button id="call" class="call" disabled><span class="phoneGlyph">☎</span><span>CALL</span></button>
      <div class="note">Enter a number manually. This page does not request your contacts.<div class="tiny">Your device controls the final call handoff</div></div>
    </main>
  </div>
</div>
<script>
(()=>{
  const numberEl=document.getElementById('number');
  const keysEl=document.getElementById('keys');
  const callBtn=document.getElementById('call');
  let value='';
  const layout=['1','2','3','4','5','6','7','8','9','+','0','⌫'];
  function clean(){return value.replace(/(?!^\+)\D/g,'').replace(/\+(?=.)/g,(m,o)=>o===0?'+':'')}
  function draw(){numberEl.textContent=value||'—';numberEl.classList.toggle('empty',!value);callBtn.disabled=!clean()}
  function press(k){
    if(k==='⌫'){value=value.slice(0,-1)}
    else if(k==='+'){if(!value)value='+'}
    else if(value.length<24){value+=k}
    draw();
    if(navigator.vibrate)navigator.vibrate(8);
  }
  layout.forEach(k=>{const b=document.createElement('button');b.className='key';b.textContent=k;b.setAttribute('aria-label',k==='⌫'?'Delete':k);b.onclick=()=>press(k);keysEl.appendChild(b)});
  callBtn.onclick=()=>{const n=clean();if(!n)return;location.href='tel:'+encodeURIComponent(n)};
  draw();
})();
</script>
</body>
</html>
