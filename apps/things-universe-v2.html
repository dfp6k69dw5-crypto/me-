<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Things Universe — Concept Bridge</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{--bg:#071018;--panel:#101a28;--line:#26384f;--text:#eef4ff;--muted:#91a2ba;--a:#76e2d8;--b:#d8c985;--meet:#c1a8ff;--edge:#6f819f;--hot:#ffffff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:radial-gradient(900px 600px at 0 -10%,#18304c,transparent 58%),radial-gradient(900px 650px at 100% 100%,#1b1530,transparent 55%),var(--bg)}button,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr}.top{padding:max(10px,env(safe-area-inset-top)) 10px 9px;background:rgba(7,16,24,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}.row{display:flex;align-items:center;gap:7px;min-width:0}.brand{min-width:0;margin-right:auto}.ey{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--b)}h1{font-size:20px;line-height:1;margin:4px 0 0;letter-spacing:-.04em}.search{margin-top:8px;display:flex;gap:7px}.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:#0e1725;color:var(--text);padding:10px 12px;outline:0}.btn{border:1px solid var(--line);border-radius:12px;background:#111b2a;color:var(--text);padding:9px 10px;white-space:nowrap}.btn.on{color:var(--a);border-color:#477679}.btn.hot{border-color:#806eb1;color:#e4dcff}.primary{background:linear-gradient(135deg,#31506f,#20354f);font-weight:800}.tools{display:flex;gap:7px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.pair{margin-top:7px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pair b{color:var(--text)}.stage{position:relative;min-height:0;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none}.link{stroke:var(--edge);stroke-opacity:.42}.link.bridge{stroke:var(--hot);stroke-opacity:.95}.node text{font-size:10px;fill:#edf4ff;paint-order:stroke;stroke:#071018;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node circle{stroke:rgba(255,255,255,.34);stroke-width:1}.node.bridge circle{stroke:#fff;stroke-width:2.5}.edgeText{font-size:8px;fill:#a9b7cb;paint-order:stroke;stroke:#071018;stroke-width:3px;pointer-events:none}.edgeText.bridge{fill:#fff;font-weight:700}.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.empty div{max-width:430px;text-align:center;padding:24px;color:var(--muted);line-height:1.45}.empty b{display:block;color:var(--text);font-size:28px;letter-spacing:-.04em;margin-bottom:7px}.card{position:absolute;left:10px;right:10px;top:10px;z-index:20;display:none;background:rgba(15,25,39,.97);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.card.open{display:block}.card h2{margin:5px 30px 6px 0;font-size:21px;letter-spacing:-.035em}.card p{margin:0;color:#c6d2e4;font-size:12px;line-height:1.45}.tag{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--b)}.close{position:absolute;right:9px;top:7px;border:0;background:none;color:var(--muted);font-size:24px}.cardBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.reader{position:fixed;inset:0;z-index:50;display:none;background:linear-gradient(180deg,#0b1320,#071018);overflow:hidden}.reader.open{display:flex;flex-direction:column}.rh{display:flex;align-items:center;gap:8px;padding:max(13px,env(safe-area-inset-top)) 15px 12px;border-bottom:1px solid rgba(255,255,255,.08)}.rh b{font-size:16px}.rh .btn{margin-left:auto}.rb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:17px 15px max(170px,calc(env(safe-area-inset-bottom) + 140px))}.rb h2{font-size:30px;line-height:1.02;letter-spacing:-.05em;margin:0 0 14px}.box{border:1px solid rgba(255,255,255,.08);border-radius:17px;background:rgba(255,255,255,.025);padding:13px;margin-bottom:11px}.box strong{display:block;margin-bottom:5px}.box p,.box li{font-size:13px;line-height:1.5;color:#d0dbea}.box ul{padding-left:18px;margin:7px 0 0}.hud{position:absolute;left:9px;bottom:calc(9px + env(safe-area-inset-bottom));z-index:5;padding:7px 9px;border-radius:999px;background:rgba(15,25,39,.84);border:1px solid rgba(255,255,255,.06);font-size:9px;color:var(--muted);pointer-events:none}.legend{position:absolute;right:9px;bottom:calc(9px + env(safe-area-inset-bottom));z-index:5;padding:7px 9px;border-radius:999px;background:rgba(15,25,39,.84);border:1px solid rgba(255,255,255,.06);font-size:9px;color:var(--muted);pointer-events:none}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;z-index:30;max-width:calc(100% - 20px);background:#152235;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:10px;text-align:center}.toast.show{display:block}@media(max-width:620px){h1{font-size:19px}.hud,.legend{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="row"><div class="brand"><div class="ey">actual ideas · visible relationships</div><h1>Things Universe</h1></div><button class="btn" id="fit">Fit</button><button class="btn" id="reset">Reset</button></div>
  <div class="search"><input id="q" placeholder="Type the first idea"><button class="btn primary" id="add">Add thing</button></div>
  <div class="tools"><button class="btn" id="auto">Auto-grow: off</button><button class="btn" id="compare">Explain A ↔ B</button><button class="btn hot" id="bridge">Find bridge</button></div>
  <div class="pair" id="pair">A: <b>none</b> · B: <b>none</b> — add or tap nodes to choose.</div>
</header>
<main class="stage" id="stage">
  <svg id="svg"></svg>
  <div class="empty" id="empty"><div><b>Start with two ideas.</b>Add idea A, then idea B. Their trees will grow from opposite sides and search for a concept where they meet.</div></div>
  <div class="card" id="card"><button class="close" id="x">×</button><span class="tag" id="tag"></span><h2 id="title"></h2><p id="desc"></p><div class="cardBtns"><button class="btn" id="a">Set A</button><button class="btn" id="b">Set B</button><button class="btn" id="grow">Grow from here</button></div></div>
  <div class="reader" id="reader"><div class="rh"><b>Relationship</b><button class="btn" id="rx">Close</button></div><div class="rb" id="rb"></div></div>
  <div class="toast" id="toast"></div>
  <div class="hud"><span id="status">Ready</span> · <span id="count">0 nodes</span></div>
  <div class="legend"><span class="dot" style="background:var(--a)"></span>A tree &nbsp; <span class="dot" style="background:var(--b)"></span>B tree &nbsp; <span class="dot" style="background:var(--meet)"></span>meeting</div>
</main></div>
<script>
'use strict';
const $=s=>document.querySelector(s), API='https://api.conceptnet.io', STORE='things-universe-concept-v2';
const GOOD=new Set(['RelatedTo','IsA','PartOf','HasA','UsedFor','CapableOf','Causes','CausesDesire','HasPrerequisite','MotivatedByGoal','HasProperty','AtLocation','SimilarTo','Antonym','DistinctFrom','MannerOf','SymbolOf','ReceivesAction','Desires','DefinedAs','LocatedNear','MadeOf']);
const REL_SCORE={IsA:7,PartOf:7,HasA:6,UsedFor:7,CapableOf:6,Causes:8,CausesDesire:7,HasPrerequisite:6,MotivatedByGoal:7,HasProperty:6,AtLocation:4,RelatedTo:3,SimilarTo:7,Antonym:6,DistinctFrom:5,MannerOf:5,SymbolOf:6,ReceivesAction:4,Desires:6,DefinedAs:7,LocatedNear:2,MadeOf:5};
const REL_TEXT={RelatedTo:'related to',IsA:'is a',PartOf:'part of',HasA:'has',UsedFor:'used for',CapableOf:'can',Causes:'causes',CausesDesire:'can make someone want',HasPrerequisite:'requires',MotivatedByGoal:'motivated by',HasProperty:'has property',AtLocation:'found at',SimilarTo:'similar to',Antonym:'opposite of',DistinctFrom:'distinct from',MannerOf:'manner of',SymbolOf:'symbol of',ReceivesAction:'receives action',Desires:'desires',DefinedAs:'defined as',LocatedNear:'near',MadeOf:'made of'};
let nodes=[],links=[],selected=null,A=null,B=null,timer=null,busy=false,meetingKey=null,bridgeKeys=new Set(),bridgeEdges=new Set();
let search={A:null,B:null}, edgeCache=new Map(), relatedCache=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function key(s){return String(s||'').toLowerCase().trim().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,80)}
function titleCase(s){return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function uri(k){return '/c/en/'+encodeURIComponent(k)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function status(s){$('#status').textContent=s;$('#count').textContent=`${nodes.length} nodes`;$('#empty').style.display=nodes.length?'none':'grid';save()}
function pairText(){ $('#pair').innerHTML=`A: <b>${esc(A?.label||'none')}</b> · B: <b>${esc(B?.label||'none')}</b> — ${A&&B?'grow the trees until they meet':'add or tap nodes to choose.'}`; $('#q').placeholder=!A?'Type the first idea':!B?'Type the second idea':'Add another idea'; }
function save(){try{localStorage.setItem(STORE,JSON.stringify({nodes:nodes.map(({x,y,vx,vy,fx,fy,...n})=>n),links:links.map(l=>({source:l.source.id||l.source,target:l.target.id||l.target,rel:l.rel,label:l.label,weight:l.weight,bridge:!!l.bridge})),A:A?.id||null,B:B?.id||null,meetingKey}))}catch{}}
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;nodes=s.nodes||[];links=s.links||[];A=nodes.find(n=>n.id===s.A)||null;B=nodes.find(n=>n.id===s.B)||null;meetingKey=s.meetingKey||null;bridgeKeys=new Set(nodes.filter(n=>n.bridge).map(n=>n.key));bridgeEdges=new Set(links.filter(l=>l.bridge).map(l=>edgeId(l.source,l.target)));}catch{}}
function nodeByKey(k){return nodes.find(n=>n.key===k)}
function nodeById(id){return nodes.find(n=>n.id===id)}
function addNode(k,label,side,depth=0){k=key(k);if(!k)return null;let n=nodeByKey(k);if(!n){n={id:'n'+Math.random().toString(36).slice(2,10),key:k,label:(label||titleCase(k)).slice(0,70),side:side||'',sides:{A:side==='A',B:side==='B'},depth,bridge:false};nodes.push(n)}else if(side){n.sides=n.sides||{A:false,B:false};n.sides[side]=true;if(n.sides.A&&n.sides.B)n.side='both';else if(!n.side)n.side=side;n.depth=Math.min(n.depth??depth,depth)}return n}
function edgeId(a,b){a=a.id||a;b=b.id||b;return a<b?a+'|'+b:b+'|'+a}
function addLink(a,b,rel,label,weight=1){if(!a||!b||a.id===b.id)return null;const id=edgeId(a,b);let e=links.find(x=>edgeId(x.source,x.target)===id);if(!e){e={source:a.id,target:b.id,rel,label,weight,bridge:false};links.push(e)}return e}
function getOther(edge,k){const s=edge.start?.term||edge.start?.['@id']||'',e=edge.end?.term||edge.end?.['@id']||'',sk=conceptKey(s),ek=conceptKey(e);if(sk===k)return {obj:edge.end,key:ek,direction:'out'};if(ek===k)return {obj:edge.start,key:sk,direction:'in'};return null}
function conceptKey(id){const m=String(id||'').match(/^\/c\/en\/([^/]+)/);return m?decodeURIComponent(m[1]):''}
function cleanLabel(s){return String(s||'').replace(/_/g,' ').trim()}
function acceptable(k,label){if(!k||k.length<2||k.length>55)return false;if(/^(something|someone|person|thing|stuff|object|entity|anything|everything|nothing)$/i.test(label))return false;if(/\b(wikipedia|category|article|list of)\b/i.test(label))return false;return true}
async function fetchEdges(k){k=key(k);if(edgeCache.has(k))return edgeCache.get(k);const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),9000);try{const r=await fetch(`${API}/c/en/${encodeURIComponent(k)}?offset=0&limit=100`,{signal:ctrl.signal});if(!r.ok)throw Error('Concept lookup failed');const j=await r.json();const out=[];for(const e of j.edges||[]){const rel=e.rel?.label;if(!GOOD.has(rel))continue;const o=getOther(e,k);if(!o||o.obj?.language!=='en')continue;const label=cleanLabel(o.obj.label||o.key);if(!acceptable(o.key,label))continue;const weight=Number(e.weight)||1;out.push({key:o.key,label,rel,relText:REL_TEXT[rel]||rel,weight,direction:o.direction,score:(REL_SCORE[rel]||2)*Math.log2(weight+1)});}out.sort((a,b)=>b.score-a.score);edgeCache.set(k,out);return out;}finally{clearTimeout(tm)}}
async function fetchRelated(k){k=key(k);if(relatedCache.has(k))return relatedCache.get(k);const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),9000);try{const r=await fetch(`${API}/related/c/en/${encodeURIComponent(k)}?filter=/c/en&limit=100`,{signal:ctrl.signal});if(!r.ok)throw Error('Semantic lookup failed');const j=await r.json();const map=new Map();for(const x of j.related||[]){const ck=conceptKey(x['@id']);if(ck)map.set(ck,Number(x.weight)||0)}map.set(k,1);relatedCache.set(k,map);return map;}finally{clearTimeout(tm)}}
async function describeNode(n){if(n.desc)return n.desc;try{const edges=await fetchEdges(n.key);const top=edges.slice(0,3).map(e=>`${e.relText} ${e.label}`);n.desc=top.length?`${n.label}: ${top.join(' · ')}.`:`${n.label} is a concept in the graph.`;}catch{n.desc=`${n.label} is a concept in the graph.`;}return n.desc}
function initSearch(){if(!A||!B)return false;search={A:{root:A.key,seen:new Set([A.key]),frontier:[A.key],expanded:new Set(),parent:new Map()},B:{root:B.key,seen:new Set([B.key]),frontier:[B.key],expanded:new Set(),parent:new Map()}};meetingKey=null;bridgeKeys.clear();bridgeEdges.clear();nodes.forEach(n=>{n.bridge=false;if(n.id!==A.id&&n.id!==B.id&&n.side==='both')n.side=''});links.forEach(l=>l.bridge=false);return true}
function semanticScore(k,map){return map?.get(k)||0}
async function chooseExpansion(side){const own=search[side],other=search[side==='A'?'B':'A'];if(!own||!other)return null;const oppositeMap=await fetchRelated(other.root).catch(()=>new Map());let sources=own.frontier.filter(k=>!own.expanded.has(k));if(!sources.length)sources=[...own.seen].filter(k=>!own.expanded.has(k));sources=sources.slice(0,4);let candidates=[];for(const src of sources){const edges=await fetchEdges(src).catch(()=>[]);for(const e of edges.slice(0,35)){if(own.seen.has(e.key))continue;const meetBonus=other.seen.has(e.key)?120:0;const sem=semanticScore(e.key,oppositeMap);const novelty=nodeByKey(e.key)?-4:4;const generalPenalty=/^(entity|object|physical_object|whole|abstraction|psychological_feature)$/i.test(e.key)?-20:0;const score=meetBonus+e.score*2.2+sem*45+novelty+generalPenalty;candidates.push({src,...e,total:score});}own.expanded.add(src)}candidates.sort((a,b)=>b.total-a.total);return candidates[0]||null}
function sideOf(n){if(n.sides?.A&&n.sides?.B)return'both';return n.sides?.A?'A':n.sides?.B?'B':n.side||''}
async function expandSide(side){const own=search[side],other=search[side==='A'?'B':'A'];const c=await chooseExpansion(side);if(!c)return false;const src=nodeByKey(c.src)||addNode(c.src,titleCase(c.src),side);const n=addNode(c.key,c.label,side,(src.depth||0)+1);addLink(src,n,c.rel,c.relText,c.weight);own.seen.add(c.key);own.frontier.push(c.key);if(!own.parent.has(c.key))own.parent.set(c.key,{from:c.src,rel:c.relText});if(other.seen.has(c.key)){meetingKey=c.key;n.sides.A=true;n.sides.B=true;n.side='both';markBridge();toast(`Trees met at ${n.label}`);status(`Bridge found: ${n.label}`);}render();return true}
async function smartRound(){if(busy||!A||!B||meetingKey)return;busy=true;try{if(!search.A||search.A.root!==A.key||search.B.root!==B.key)initSearch();status('Thinking across both trees…');await Promise.all([fetchRelated(A.key).catch(()=>null),fetchRelated(B.key).catch(()=>null)]);await expandSide('A');if(!meetingKey)await expandSide('B');if(!meetingKey)status('Growing both trees toward each other…');}finally{busy=false}}
function pathToRoot(side,k){const st=search[side],out=[k];let cur=k,guard=0;while(cur!==st.root&&guard++<80){const p=st.parent.get(cur);if(!p)break;cur=p.from;out.push(cur)}return out.reverse()}
function markBridge(){if(!meetingKey||!search.A||!search.B)return;const pa=pathToRoot('A',meetingKey),pb=pathToRoot('B',meetingKey);const full=[...pa,...pb.reverse().slice(1)];bridgeKeys=new Set(full);for(const n of nodes)n.bridge=bridgeKeys.has(n.key);bridgeEdges.clear();for(let i=0;i<full.length-1;i++){const a=nodeByKey(full[i]),b=nodeByKey(full[i+1]);if(a&&b)bridgeEdges.add(edgeId(a,b))}for(const l of links)l.bridge=bridgeEdges.has(edgeId(l.source,l.target));render();}
function visibleNeighbors(id){return links.filter(l=>(l.source.id||l.source)===id||(l.target.id||l.target)===id).map(l=>(l.source.id||l.source)===id?(l.target.id||l.target):(l.source.id||l.source))}
function visiblePath(a,b){const q=[[a.id,[a.id]]],seen=new Set([a.id]);while(q.length){const[cur,p]=q.shift();if(cur===b.id)return p.map(nodeById);for(const nx of visibleNeighbors(cur))if(!seen.has(nx)){seen.add(nx);q.push([nx,[...p,nx]])}}return null}
function findEdge(a,b){return links.find(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)})}
function openReader(html){$('#rb').innerHTML=html;$('#reader').classList.add('open')}
function explain(){if(!A||!B){toast('Choose A and B first');return}const p=visiblePath(A,B);if(!p){openReader(`<h2>${esc(A.label)} ↔ ${esc(B.label)}</h2><div class="box"><strong>Not connected yet</strong><p>The two visible trees have not met. Turn on Auto-grow or use Find bridge and the search will keep expanding from both sides.</p></div><div class="box"><strong>How it is thinking</strong><p>Each expansion weighs ConceptNet relationship quality, edge strength, semantic closeness to the opposite root, novelty, and whether the candidate is already present in the other tree.</p></div>`);return}let steps=[];for(let i=0;i<p.length-1;i++){const e=findEdge(p[i],p[i+1]);steps.push(`<li><b>${esc(p[i].label)}</b> — ${esc(e?.label||'related to')} → <b>${esc(p[i+1].label)}</b></li>`)}openReader(`<h2>${esc(A.label)} ↔ ${esc(B.label)}</h2><div class="box"><strong>Bridge found</strong><p>The two independently growing concept trees now share a visible path${meetingKey?` through <b>${esc(nodeByKey(meetingKey)?.label||meetingKey)}</b>`:''}.</p></div><div class="box"><strong>Connection path</strong><ul>${steps.join('')}</ul></div><div class="box"><strong>What this means</strong><p>This is a conceptual path in a commonsense knowledge graph. It shows ideas that mediate between A and B; it is not evidence that A causes B.</p></div>`)}
async function addThing(term){const k=key(term);if(!k)return;const side=!A?'A':!B?'B':'';const n=addNode(k,term.trim(),side,0);if(side==='A')A=n;else if(side==='B')B=n;render();pairText();status(`Added ${n.label}`);if(side){await growManual(n,4);if(A&&B)initSearch();}fitGraph()}
async function growManual(n,limit=7){status(`Growing from ${n.label}…`);const edges=await fetchEdges(n.key).catch(()=>[]);const side=sideOf(n)==='both'?'':sideOf(n);for(const e of edges.slice(0,limit)){const m=addNode(e.key,e.label,side,(n.depth||0)+1);addLink(n,m,e.rel,e.relText,e.weight)}render();status(`Grew from ${n.label}`)}
async function findBridge(){if(!A||!B){toast('Choose A and B first');return}if(!search.A||search.A.root!==A.key||search.B.root!==B.key)initSearch();for(let i=0;i<18&&!meetingKey;i++){await smartRound()}if(meetingKey){fitGraph();explain()}else{toast('No meeting yet — Auto-grow can keep searching');status('No bridge yet; search frontier is still open')}}
function toggleAuto(){if(timer){clearInterval(timer);timer=null;$('#auto').textContent='Auto-grow: off';$('#auto').classList.remove('on');status('Ready');return}if(A&&B&&!search.A)initSearch();timer=setInterval(()=>smartRound(),1800);$('#auto').textContent='Auto-grow: on';$('#auto').classList.add('on');status(A&&B?'Growing both trees toward each other…':'Add two ideas to start bridge search')}
function color(n){const s=sideOf(n);return s==='both'?getComputedStyle(document.documentElement).getPropertyValue('--meet').trim():s==='A'?getComputedStyle(document.documentElement).getPropertyValue('--a').trim():s==='B'?getComputedStyle(document.documentElement).getPropertyValue('--b').trim():'#9fb2cc'}
const svg=d3.select('#svg'),g=svg.append('g'),lg=g.append('g'),eg=g.append('g'),ng=g.append('g');
const zoom=d3.zoom().scaleExtent([.12,8]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);
const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(82).strength(.34)).force('charge',d3.forceManyBody().strength(-260)).force('center',d3.forceCenter(innerWidth/2,innerHeight/2)).force('collision',d3.forceCollide().radius(25)).force('x',d3.forceX(d=>sideOf(d)==='A'?innerWidth*.29:sideOf(d)==='B'?innerWidth*.71:innerWidth*.5).strength(.095));
function render(){let l=lg.selectAll('line').data(links,d=>edgeId(d.source,d.target));l.exit().remove();l=l.enter().append('line').attr('class','link').merge(l).classed('bridge',d=>!!d.bridge).attr('stroke-width',d=>d.bridge?3:1.2);let et=eg.selectAll('text').data(links,d=>edgeId(d.source,d.target));et.exit().remove();et=et.enter().append('text').attr('class','edgeText').merge(et).classed('bridge',d=>!!d.bridge).text(d=>d.label);let n=ng.selectAll('g').data(nodes,d=>d.id);n.exit().remove();const en=n.enter().append('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=d.fy=null}));en.append('circle');en.append('text').attr('x',14).attr('y',4);en.on('click',async(e,d)=>{selected=d;$('#tag').textContent=d.bridge?'bridge path':sideOf(d)==='A'?'tree A':sideOf(d)==='B'?'tree B':sideOf(d)==='both'?'meeting node':'concept';$('#title').textContent=d.label;$('#desc').textContent=await describeNode(d);$('#card').classList.add('open')});n=en.merge(n).classed('bridge',d=>!!d.bridge);n.select('circle').attr('r',d=>d.bridge?12:10).attr('fill',color);n.select('text').text(d=>d.label.length>28?d.label.slice(0,26)+'…':d.label);sim.nodes(nodes).on('tick',()=>{l.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);et.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);n.attr('transform',d=>`translate(${d.x},${d.y})`)});sim.force('link').links(links);sim.force('x',d3.forceX(d=>sideOf(d)==='A'?innerWidth*.29:sideOf(d)==='B'?innerWidth*.71:innerWidth*.5).strength(.095));sim.alpha(.7).restart();pairText();status($('#status').textContent||'Ready')}
function fitGraph(){if(!nodes.length)return;const box=g.node().getBBox(),w=$('#stage').clientWidth,h=$('#stage').clientHeight,scale=Math.min(1.45,.9/Math.max(box.width/w,box.height/h,.001)),tx=w/2-scale*(box.x+box.width/2),ty=h/2-scale*(box.y+box.height/2);svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale))}
$('#add').onclick=async()=>{const v=$('#q').value.trim();if(!v)return;$('#q').value='';await addThing(v)};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#add').click()}});$('#a').onclick=()=>{if(selected){A=selected;A.sides.A=true;if(A.sides.B)A.side='both';else A.side='A';initSearch();render();toast('Set A')}};$('#b').onclick=()=>{if(selected){B=selected;B.sides.B=true;if(B.sides.A)B.side='both';else B.side='B';initSearch();render();toast('Set B')}};$('#grow').onclick=()=>selected&&growManual(selected);$('#x').onclick=()=>$('#card').classList.remove('open');$('#rx').onclick=()=>$('#reader').classList.remove('open');$('#compare').onclick=explain;$('#bridge').onclick=findBridge;$('#auto').onclick=toggleAuto;$('#fit').onclick=fitGraph;$('#reset').onclick=()=>{if(timer)toggleAuto();localStorage.removeItem(STORE);nodes=[];links=[];selected=A=B=null;meetingKey=null;search={A:null,B:null};bridgeKeys.clear();bridgeEdges.clear();edgeCache.clear();relatedCache.clear();$('#card').classList.remove('open');$('#reader').classList.remove('open');render();status('Ready')};
window.addEventListener('resize',()=>{sim.force('center',d3.forceCenter(innerWidth/2,innerHeight/2));sim.force('x',d3.forceX(d=>sideOf(d)==='A'?innerWidth*.29:sideOf(d)==='B'?innerWidth*.71:innerWidth*.5).strength(.095));sim.alpha(.25).restart()});
restore();render();if(A&&B)initSearch();if(nodes.length)setTimeout(fitGraph,250);
</script>
