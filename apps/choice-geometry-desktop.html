<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choice Geometry Desktop 4K</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030507;color:#eef3f8;font-family:Segoe UI,Arial,sans-serif}.bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid #202936;background:#070b11}.name{font-weight:700;margin-right:auto}.sub{font-size:11px;color:#8794a6}.bar button{height:30px;border:1px solid #2b3544;border-radius:8px;background:#101720;color:#eef3f8;font-weight:700;padding:0 10px;cursor:pointer}.bar button.primary{background:#eef3f8;color:#07101a}.frame{width:100%;height:calc(100% - 47px);border:0;display:block;background:#030507}</style></head><body><div class="bar"><div><div class="name">Choice Geometry — Desktop 4K</div><div class="sub" id="status">loading engine…</div></div><button class="primary" id="ultra">RENDER 4K</button><button id="save">SAVE 4K PNG</button><button id="mobile">MOBILE VERSION</button></div><iframe class="frame" id="app" src="choice-geometry-mobile.html"></iframe><script>const f=document.getElementById('app'),status=document.getElementById('status');let ready=false,timer=0;function enhance(){let w,d,c;try{w=f.contentWindow;d=f.contentDocument;c=d&&d.getElementById('field')}catch(e){return false}if(!w||!d||!c||typeof w.paint!=='function')return false;if(ready)return true;ready=true;c.width=c.height=2048;c.style.maxWidth='none';const style=d.createElement('style');style.textContent='.app{max-width:1600px!important}.stage{min-height:min(88vh,1200px)!important}.sub{display:block!important}.panel{width:340px}';d.head.appendChild(style);const sub=d.querySelector('.sub');if(sub)sub.textContent='DESKTOP 4K · 4096px SUPERSAMPLED FINAL RENDER';const note=d.querySelector('.note');if(note)note.textContent='Desktop mode: controls stay responsive, then the field automatically refines to a 4096px supersampled render on a 2048px display canvas.';const render=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!ready)return;status.textContent='rendering 4096px field…';requestAnimationFrame(()=>{w.paint(4096,0.73,'desktop 4K');status.textContent='4096px supersampled · 2048px display'})},420)};d.querySelectorAll('input').forEach(x=>{x.addEventListener('input',render);x.addEventListener('change',render)});d.querySelectorAll('button').forEach(x=>x.addEventListener('click',()=>{clearTimeout(timer);timer=setTimeout(render,350)}));document.getElementById('ultra').onclick=()=>{clearTimeout(timer);status.textContent='rendering 4096px field…';requestAnimationFrame(()=>{w.paint(4096,0.73,'desktop 4K');status.textContent='4096px supersampled · 2048px display'})};document.getElementById('save').onclick=()=>{status.textContent='creating 4096px PNG…';const ow=c.width,oh=c.height;c.width=c.height=4096;w.paint(4096,0.73,'export 4K');c.toBlob(b=>{if(b){const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='choice-geometry-4096.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}c.width=ow;c.height=oh;w.paint(4096,0.73,'desktop 4K');status.textContent='4096px PNG saved'},'image/png')};document.getElementById('mobile').onclick=()=>location.href='choice-geometry-mobile.html';setTimeout(()=>document.getElementById('ultra').click(),250);return true}const poll=setInterval(()=>{if(enhance())clearInterval(poll)},120);f.addEventListener('load',()=>{ready=false;setTimeout(enhance,100)});</script></body></html>
