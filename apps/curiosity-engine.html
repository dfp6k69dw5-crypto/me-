<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>Curiosity Engine</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7" onerror="this.onerror=null;this.src='https://unpkg.com/d3@7/dist/d3.min.js'"></script>
<style>
:root{--bg:#070912;--panel:#0e1320;--panel2:#121a2a;--line:#24304a;--text:#eef4ff;--muted:#92a0b9;--accent:#d8c98f;--cyan:#78e5dd;--violet:#b59cff;--pink:#f299c1;--warn:#f1c46e;--good:#8ee1a9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:radial-gradient(900px 650px at 10% -10%,#17203a 0,transparent 60%),radial-gradient(700px 500px at 100% 100%,#151126 0,transparent 55%),var(--bg)}
button,input,select{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{padding:10px 12px 9px;display:flex;gap:8px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(7,9,18,.78);backdrop-filter:blur(16px);z-index:20}.brand{min-width:0;margin-right:auto}.eyebrow{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}.brand h1{font-size:19px;line-height:1;margin:4px 0 0;letter-spacing:-.035em}.iconbtn,.smallbtn,.modebtn,.primary{border:1px solid var(--line);background:#111827;color:var(--text);border-radius:12px;cursor:pointer}.iconbtn{width:38px;height:38px}.smallbtn{padding:8px 10px;font-size:12px}.primary{padding:11px 14px;background:linear-gradient(135deg,#283b55,#1c263b);font-weight:700}.workspace{position:relative;min-height:0}.graph{position:absolute;inset:0}.graph svg{width:100%;height:100%;display:block}.link{stroke:#66738d;stroke-opacity:.35}.link.hyp{stroke-dasharray:5 5;stroke:#d8c98f;stroke-opacity:.8}.node circle{stroke:rgba(255,255,255,.32);stroke-width:1.3}.node text{fill:#dce7fb;font-size:11px;paint-order:stroke;stroke:#070912;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node.seed circle{filter:drop-shadow(0 0 9px rgba(120,229,221,.55))}.hud{position:absolute;left:10px;right:10px;top:10px;display:grid;grid-template-columns:1fr auto;gap:8px;pointer-events:none;z-index:10}.seedbox{display:flex;gap:7px;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(14,19,32,.88);backdrop-filter:blur(14px);pointer-events:auto}.seedbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}.modes{display:flex;gap:5px;pointer-events:auto}.modebtn{padding:8px 10px;font-size:11px;color:var(--muted);background:rgba(14,19,32,.88)}.modebtn.active{color:#071013;background:var(--cyan);border-color:transparent;font-weight:800}.controls{position:absolute;left:10px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px);z-index:11}.pill{border:1px solid var(--line);border-radius:999px;background:rgba(14,19,32,.9);color:var(--text);padding:8px 11px;font-size:11px;backdrop-filter:blur(10px);cursor:pointer}.pill.on{border-color:#4b6f76;color:var(--cyan)}#mobileExportBtn{display:none}.side{position:absolute;right:10px;top:66px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 126px);display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:9}.panel{border:1px solid var(--line);border-radius:16px;background:rgba(14,19,32,.9);backdrop-filter:blur(16px);pointer-events:auto;overflow:hidden}.panel summary{list-style:none;padding:11px 12px;cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.02em}.panel summary::-webkit-details-marker{display:none}.panelbody{padding:0 12px 12px;max-height:210px;overflow:auto}.item{padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:12px;line-height:1.35}.item strong{display:block;margin-bottom:3px}.muted{color:var(--muted)}.tag{display:inline-block;padding:3px 6px;border-radius:999px;background:#1b2639;color:#aebbd1;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em}.drawer{position:absolute;left:10px;bottom:58px;width:min(360px,calc(100% - 20px));max-height:48%;border:1px solid var(--line);border-radius:18px;background:rgba(14,19,32,.96);backdrop-filter:blur(18px);padding:14px;z-index:12;display:none;overflow:auto}.drawer.open{display:block}.drawer h2{margin:5px 0 8px;font-size:22px;letter-spacing:-.04em}.drawer p{font-size:13px;line-height:1.45;color:#c5d0e1}.drawer .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.drawer a{color:var(--cyan);font-size:12px}.close{float:right;background:none;border:0;color:var(--muted);font-size:21px}.status{display:flex;align-items:center;gap:8px;padding:8px 11px max(8px,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.06);color:var(--muted);font-size:10px;background:rgba(7,9,18,.82);z-index:20}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px rgba(142,225,169,.5)}.toast{position:absolute;left:50%;top:75px;transform:translateX(-50%);padding:9px 12px;border-radius:999px;background:#151d2d;border:1px solid var(--line);font-size:11px;color:#dce7fb;z-index:30;display:none;max-width:calc(100% - 24px);text-align:center}.toast.show{display:block}.empty{height:100%;display:grid;place-items:center;pointer-events:none}.emptyinner{text-align:center;padding:28px;color:var(--muted);max-width:430px}.emptyinner b{display:block;color:var(--text);font-size:28px;letter-spacing:-.045em;margin-bottom:8px}
@media(max-width:720px){.top{padding-top:max(9px,env(safe-area-inset-top))}.panelbody{max-height:145px}.node text{font-size:10px}.controls{bottom:10px}.drawer{bottom:58px;max-height:43%}.brand h1{font-size:17px}.smallbtn.hide-mobile{display:none}#mobileExportBtn{display:inline-block}.hud{grid-template-columns:1fr}.modes{justify-content:flex-start}.seedbox{order:1}.side{top:118px;width:min(280px,72vw);max-height:38%;}.toast{top:116px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="eyebrow">living knowledge graph</div><h1>Curiosity Engine</h1></div><button class="smallbtn hide-mobile" id="exportBtn">Export JSON</button><button class="smallbtn" id="resetBtn">Reset</button></header>
<main class="workspace" id="workspace">
<div id="graph" class="graph"></div>
<div id="empty" class="empty"><div class="emptyinner"><b>Give it one strange thing.</b>It will gather nearby ideas, wander outward, and look for bridges that might be worth testing.</div></div>
<div class="hud"><div class="seedbox"><input id="seedInput" placeholder="an idea, paper topic, equation, pattern…"><button class="primary" id="goBtn">Grow</button></div><div class="modes"><button class="modebtn active" data-mode="general">General</button><button class="modebtn" data-mode="research">Research</button><button class="modebtn" data-mode="math">Math / Pattern</button></div></div>
<div class="controls"><button class="pill" id="expandBtn">Explore selected</button><button class="pill" id="wanderBtn">Auto-Wander: off</button><button class="pill" id="gapBtn">Find gaps</button><button class="pill" id="fitBtn">Fit graph</button><button class="pill" id="mobileExportBtn">Export</button></div>
<div class="side">
<details class="panel" open><summary>Curiosity Queue</summary><div class="panelbody" id="queue"></div></details>
<details class="panel"><summary>Thinking Log</summary><div class="panelbody" id="log"></div></details>
<details class="panel"><summary>Possible Bridges</summary><div class="panelbody" id="bridges"></div></details>
</div>
<div class="drawer" id="drawer"><button class="close" id="closeDrawer">×</button><span class="tag" id="dType"></span><h2 id="dTitle"></h2><p id="dDesc"></p><div class="muted" id="dWhy" style="font-size:12px"></div><div class="row"><button class="smallbtn" id="dExplore">Explore from here</button><button class="smallbtn" id="dTest" style="display:none">Test bridge</button></div><div style="margin-top:10px"><a id="dSource" target="_blank" rel="noopener" style="display:none">Open source ↗</a></div></div>
<div class="toast" id="toast"></div>
</main>
<footer class="status"><span class="dot"></span><span id="statusText">Ready. Facts show sources; hypotheses are labeled.</span></footer>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORE='curiosity-engine-v2';
let mode='general', selected=null, wanderTimer=null, isBusy=false;
let nodes=[], links=[], bridgeCandidates=[];
let sim, svg, g, linkSel, nodeSel, zoom;
const colors={seed:'#78e5dd',wiki:'#8fc6ff',paper:'#b59cff',author:'#f299c1',topic:'#d8c98f',pattern:'#8ee1a9',hypothesis:'#f1c46e'};
const STOP=new Set('this that with from into about which where when then than were been have has had does your their there these those using used also such between through'.split(' '));
function uid(prefix='n'){return prefix+'_'+Math.random().toString(36).slice(2,9)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}
function words(s=''){return new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)))}
function jaccard(a,b){let A=words(a),B=words(b),i=0;A.forEach(x=>{if(B.has(x))i++});return i/Math.max(1,new Set([...A,...B]).size)}
function nodeById(id){return nodes.find(n=>n.id===id)}
function degree(id){return links.filter(l=>(l.source.id||l.source)===id||(l.target.id||l.target)===id).length}
function addNode(n){let key=(n.canonical||n.title||'').toLowerCase();let existing=nodes.find(x=>(x.canonical||x.title||'').toLowerCase()===key&&x.type===n.type);if(existing)return existing;let x={id:uid(),confidence:.7,created:Date.now(),...n};nodes.push(x);return x}
function addLink(a,b,kind='related',strength=.6,hyp=false){if(!a||!b||a.id===b.id)return;let exists=links.some(l=>{let s=l.source.id||l.source,t=l.target.id||l.target;return (s===a.id&&t===b.id)||(s===b.id&&t===a.id)});if(!exists)links.push({source:a.id,target:b.id,kind,strength,hyp});}
let STATELOG=[];
function log(msg){let e={t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),msg};STATELOG.unshift(e);STATELOG=STATELOG.slice(0,40);renderLog();save()}
function setStatus(s){$('#statusText').textContent=s}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function save(){try{localStorage.setItem(STORE,JSON.stringify({mode,nodes:nodes.map(n=>({...n,x:undefined,y:undefined,vx:undefined,vy:undefined,fx:undefined,fy:undefined})),links:links.map(l=>({...l,source:l.source.id||l.source,target:l.target.id||l.target})),log:STATELOG,bridges:bridgeCandidates}))}catch(e){setStatus('Graph is running, but browser storage is unavailable.')}}
function restore(){try{let s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;mode=s.mode||'general';nodes=s.nodes||[];links=s.links||[];STATELOG=s.log||[];bridgeCandidates=s.bridges||[];$$('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderLog();renderBridges()}catch(e){}}
async function fetchJSON(url,label='Source',timeout=9000){let c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{let r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error(label+' returned '+r.status);return await r.json()}catch(e){if(e.name==='AbortError')throw Error(label+' timed out');throw e}finally{clearTimeout(timer)}}
function initGraph(){if(!window.d3){setStatus('Graph library failed to load. Reload to try the fallback source.');toast('Graph library did not load');return}let root=d3.select('#graph'),w=$('#workspace').clientWidth,h=$('#workspace').clientHeight;svg=root.append('svg');g=svg.append('g');zoom=d3.zoom().scaleExtent([.2,4]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);g.append('g').attr('class','links');g.append('g').attr('class','nodes');sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>90+(1-d.strength)*80).strength(d=>.15+d.strength*.45)).force('charge',d3.forceManyBody().strength(-240)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide().radius(d=>d.type==='seed'?34:26));updateGraph();window.addEventListener('resize',()=>{let w=$('#workspace').clientWidth,h=$('#workspace').clientHeight;sim.force('center',d3.forceCenter(w/2,h/2)).alpha(.3).restart()})}
function updateGraph(){if(!sim||!g)return;let ls=g.select('.links').selectAll('line').data(links,d=>`${d.source.id||d.source}-${d.target.id||d.target}`);ls.exit().remove();linkSel=ls.enter().append('line').attr('class',d=>'link'+(d.hyp?' hyp':'')).attr('stroke-width',d=>1+d.strength*2).merge(ls);let ns=g.select('.nodes').selectAll('g').data(nodes,d=>d.id);ns.exit().remove();let en=ns.enter().append('g').attr('class',d=>'node '+(d.type==='seed'?'seed':'')).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));en.append('circle').attr('r',d=>d.type==='seed'?18:(d.type==='hypothesis'?13:10)).attr('fill',d=>colors[d.type]||'#aab5c7');en.append('text').attr('x',14).attr('y',4).text(d=>d.title.length>34?d.title.slice(0,31)+'…':d.title);en.on('click',(e,d)=>{selected=d;showDrawer(d)});nodeSel=en.merge(ns);sim.nodes(nodes).on('tick',()=>{linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`)});sim.force('link').links(links);sim.alpha(.65).restart();$('#empty').style.display=nodes.length?'none':'grid';renderQueue();save()}
function fitGraph(){if(!nodes.length||!g||!svg)return;let b=g.node().getBBox(),w=$('#workspace').clientWidth,h=$('#workspace').clientHeight;if(!b.width&&!b.height)return;let scale=Math.min(1.4,.88/Math.max(Math.max(1,b.width)/w,Math.max(1,b.height)/h));let tx=w/2-scale*(b.x+b.width/2),ty=h/2-scale*(b.y+b.height/2);svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale))}
function showDrawer(n){$('#drawer').classList.add('open');$('#dType').textContent=n.type+(n.hypothesis?' · hypothesis':'');$('#dTitle').textContent=n.title;$('#dDesc').textContent=n.description||'No description yet.';$('#dWhy').textContent=(n.why?'Why connected: '+n.why+' · ':'')+'Confidence '+Math.round((n.confidence||.5)*100)+'%';$('#dSource').style.display=n.url?'inline':'none';if(n.url)$('#dSource').href=n.url;$('#dTest').style.display=n.type==='hypothesis'?'inline-block':'none'}
function renderLog(){$('#log').innerHTML=STATELOG.length?STATELOG.map(x=>`<div class="item"><span class="muted">${esc(x.t)}</span> ${esc(x.msg)}</div>`).join(''):'<div class="item muted">The graph has not wandered yet.</div>'}
function scoreQueue(n){let age=Math.min(1,Math.max(0,(Date.now()-(n.created||Date.now()))/60000)),recent=n.lastExpanded&&Date.now()-n.lastExpanded<45000?.28:0;return (1/(1+degree(n.id)))*.6+(n.confidence||.5)*.25+age*.15-recent}
function renderQueue(){let q=nodes.filter(n=>!['seed','hypothesis'].includes(n.type)).sort((a,b)=>scoreQueue(b)-scoreQueue(a)).slice(0,6);$('#queue').innerHTML=q.length?q.map(n=>`<div class="item"><strong>${esc(n.title)}</strong><span class="muted">${esc(n.type)} · ${degree(n.id)} connections · curiosity ${Math.max(0,Math.round(scoreQueue(n)*100))}</span></div>`).join(''):'<div class="item muted">Grow a seed and the queue will fill itself.</div>'}
function renderBridges(){let b=bridgeCandidates.slice(0,6);$('#bridges').innerHTML=b.length?b.map(x=>`<div class="item"><strong>${esc(x.aTitle)} ↔ ${esc(x.bTitle)}</strong><span class="muted">${esc(x.reason)} · score ${Math.round(x.score*100)}</span><br><button class="smallbtn testBridge" data-id="${x.id}" style="margin-top:6px">Test</button></div>`).join(''):'<div class="item muted">Run Gap Finder after the graph has several branches.</div>';$$('.testBridge').forEach(b=>b.onclick=()=>testBridge(bridgeCandidates.find(x=>x.id===b.dataset.id)))}
async function wikiSearch(q,limit=7){let u='https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit='+limit+'&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=2';let j=await fetchJSON(u,'Wikipedia');return Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0))}
async function crossrefSearch(q,limit=7){let fields='DOI,title,author,published,is-referenced-by-count,subject,URL,type,publisher';let u='https://api.crossref.org/works?query.bibliographic='+encodeURIComponent(q)+'&rows='+limit+'&select='+encodeURIComponent(fields);let j=await fetchJSON(u,'Crossref',11000);return j.message?.items||[]}
function cleanWiki(s=''){return s.replace(/\s+/g,' ').trim().slice(0,340)}
function crossrefYear(w){return w.published?.['date-parts']?.[0]?.[0]||'Year unknown'}
function crossrefTitle(w){return Array.isArray(w.title)&&w.title[0]?w.title[0]:'Untitled work'}
function crossrefAuthors(w){return (w.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(' ')).filter(Boolean)}
async function growSeed(seed){if(!seed.trim()||isBusy)return;isBusy=true;setStatus('Growing from seed…');nodes=[];links=[];bridgeCandidates=[];STATELOG=[];selected=null;let root=addNode({type:'seed',title:seed.trim(),canonical:'seed:'+seed.trim(),description:'Starting point for this exploration.',confidence:1,why:'user seed'});updateGraph();try{if(mode==='math')await growMath(root,seed);else if(mode==='research')await growResearch(root,seed);else await growGeneral(root,seed);log(`Started with “${seed.trim()}” in ${mode} mode.`);updateGraph();setTimeout(fitGraph,350)}catch(e){toast(e.message);log('A public source failed, so the graph kept the seed and stopped this branch.')}finally{isBusy=false;setStatus('Ready. Select a node or let Auto-Wander choose one.')}}
async function growGeneral(parent,q){let arr=await wikiSearch(q,8);arr.forEach(p=>{let n=addNode({type:'wiki',title:p.title,canonical:'wiki:'+p.pageid,description:cleanWiki(p.extract||''),url:p.fullurl,confidence:.82,why:`Wikipedia search relationship to “${q}”`});addLink(parent,n,'retrieved',.75)});log(`Wikipedia returned ${arr.length} nearby concepts for “${q}”.`)}
async function growResearch(parent,q){let arr;try{arr=await crossrefSearch(q,8)}catch(e){log('Crossref did not respond; falling back to general public concepts for this branch.');toast('Research source unavailable — using Wikipedia');return growGeneral(parent,q)}arr.forEach(w=>{let title=crossrefTitle(w),subjects=(w.subject||[]).slice(0,2),authors=crossrefAuthors(w).slice(0,2),doi=w.DOI||title;let n=addNode({type:'paper',title,canonical:'crossref:'+doi,description:`${crossrefYear(w)} · ${w['is-referenced-by-count']||0} references-to count · ${w.publisher||w.type||'scholarly work'} · source: Crossref`,url:w.URL||(w.DOI?'https://doi.org/'+w.DOI:null),confidence:.87,why:`Crossref bibliographic search relationship to “${q}”`});addLink(parent,n,'retrieved',.8);subjects.forEach(s=>{let t=addNode({type:'topic',title:s,canonical:'crossref-subject:'+s.toLowerCase(),description:'Subject metadata reported by Crossref.',confidence:.82,why:`subject metadata for ${title}`});addLink(n,t,'topic',.78)});authors.forEach(name=>{let au=addNode({type:'author',title:name,canonical:'crossref-author:'+name.toLowerCase(),description:'Author metadata reported by Crossref.',confidence:.86,why:`author of ${title}`});addLink(n,au,'author',.82)})});log(`Crossref returned ${arr.length} scholarly works for “${q}”.`)}
function mathFeatures(expr){let f=[],low=expr.toLowerCase(),compact=low.replace(/\s/g,'');if(/sin|cos/.test(low))f.push(['oscillation / periodicity','trigonometric periodic structure']);if(/e\s*\^|exp/.test(low))f.push(['exponential structure','exponential term']);if(/i\s*\(/.test(low)||/e\^\{?i/.test(low)||/complex/.test(low))f.push(['complex-plane rotation','imaginary exponential suggests rotation in the complex plane']);if(/t\s*\^\s*[23456789]/.test(low)||/t[²³⁴⁵⁶⁷⁸⁹]/.test(low))f.push(['polynomial growth','higher-order polynomial term']);if(/sin\s*n|sin\s*\(?n/.test(low))f.push(['phase perturbation','sine term changes phase across index n']);if(/2\s*π|2\s*pi|2\\pi/.test(low))f.push(['rotational symmetry','full-turn angular factor']);if(/\/\s*9|\/9/.test(low))f.push(['ninefold spacing','division by 9 suggests nine angular sectors']);if(/3t-t\^2|3t-t2/.test(compact))f.push(['parabolic vertical motion','quadratic vertical component']);if(!f.length)f.push(['mathematical structure','general symbolic pattern']);return f}
async function growMath(root,expr){let feats=mathFeatures(expr);for(let [title,why] of feats){let n=addNode({type:'pattern',title,canonical:'pattern:'+title,description:why,confidence:.72,why:'structural heuristic from the equation'});addLink(root,n,'derived',.7)}log(`Extracted ${feats.length} structural features without claiming they are unique.`);for(let [title] of feats.slice(0,3)){try{let arr=await wikiSearch(title,3);arr.forEach(p=>{let parent=nodes.find(n=>n.canonical==='pattern:'+title);let w=addNode({type:'wiki',title:p.title,canonical:'wiki:'+p.pageid,description:cleanWiki(p.extract||''),url:p.fullurl,confidence:.78,why:`public concept related to ${title}`});addLink(parent,w,'retrieved',.65)})}catch(e){log(`Could not reach Wikipedia for the ${title} branch.`)}}log('The strongest pattern features reached outward into public concepts.')}
async function expandNode(n){if(!n||isBusy||n.type==='hypothesis')return;isBusy=true;setStatus('Exploring '+n.title+'…');let beforeN=nodes.length,beforeL=links.length;try{if(n.type==='paper'||n.type==='author'||mode==='research')await growResearch(n,n.title);else await growGeneral(n,n.title);n.lastExpanded=Date.now();updateGraph();let dn=nodes.length-beforeN,dl=links.length-beforeL;log(dn||dl?`Expanded “${n.title}”: +${dn} nodes, +${dl} connections.`:`Expanded “${n.title}”, but it mostly rediscovered things already in the graph.`)}catch(e){toast(e.message);log(`Could not expand “${n.title}” because a public source did not respond.`)}finally{isBusy=false;setStatus('Ready.')}}
function findGaps(){let eligible=nodes.filter(n=>!['seed','hypothesis'].includes(n.type)),c=[];for(let i=0;i<eligible.length;i++)for(let j=i+1;j<eligible.length;j++){let a=eligible[i],b=eligible[j],connected=links.some(l=>{let s=l.source.id||l.source,t=l.target.id||l.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)});if(connected)continue;let similarity=jaccard((a.title+' '+(a.description||'')),(b.title+' '+(b.description||''))),diversity=a.type!==b.type?.12:0,score=Math.min(.95,similarity*1.7+diversity);if(score>.18)c.push({id:uid('b'),a:a.id,b:b.id,aTitle:a.title,bTitle:b.title,score,reason:similarity>.12?'shared language across otherwise separate nodes':'cross-type structural gap'})}bridgeCandidates=c.sort((a,b)=>b.score-a.score).slice(0,12);renderBridges();if(!bridgeCandidates.length)toast('No strong gap candidates yet');else{log(`Gap Finder surfaced ${bridgeCandidates.length} unverified bridge candidates.`);toast('Possible bridges found')}save()}
async function testBridge(c){if(!c||isBusy)return;let a=nodeById(c.a),b=nodeById(c.b);if(!a||!b)return;isBusy=true;setStatus('Testing a possible bridge…');try{let evidence=[],source='Wikipedia';try{evidence=await wikiSearch(`${a.title} ${b.title}`,4)}catch(e){}if(!evidence.length){source='Crossref';try{evidence=(await crossrefSearch(a.title+' '+b.title,4)).map(x=>({title:crossrefTitle(x),fullurl:x.URL||(x.DOI?'https://doi.org/'+x.DOI:null),extract:(x.subject||[]).join(', ')}))}catch(e){}}let strength=Math.min(.9,.28+evidence.length*.12),canonical='hyp:'+a.id+':'+b.id,existing=nodes.find(n=>n.canonical===canonical&&n.type==='hypothesis');let payload={type:'hypothesis',title:`${a.title} ↔ ${b.title}`,canonical,description:evidence.length?`${source} found ${evidence.length} potentially relevant public results. This raises the bridge's plausibility but does not demonstrate a mechanism.`:'The combined public search did not find convincing evidence. The bridge remains uncertain.',confidence:evidence.length?strength:.24,why:`Gap Finder candidate tested with a combined ${source} search`,hypothesis:true,url:evidence[0]?.fullurl||null,lastTested:Date.now()};let h=existing?(Object.assign(existing,payload),existing):addNode(payload);addLink(a,h,'hypothesis',strength,true);addLink(h,b,'hypothesis',strength,true);updateGraph();log(evidence.length?`Bridge test found ${evidence.length} potentially relevant ${source} results for “${a.title}” and “${b.title}”.`:`Bridge test found little public support for “${a.title}” ↔ “${b.title}”.`);selected=h;showDrawer(h)}finally{isBusy=false;setStatus('Ready. Hypotheses remain visibly separate from retrieved facts.')}}
function toggleWander(){if(wanderTimer){clearInterval(wanderTimer);wanderTimer=null;$('#wanderBtn').textContent='Auto-Wander: off';$('#wanderBtn').classList.remove('on');setStatus('Auto-Wander paused.');return}$('#wanderBtn').textContent='Auto-Wander: on';$('#wanderBtn').classList.add('on');setStatus('Auto-Wander is choosing underexplored nodes.');wanderTimer=setInterval(async()=>{if(isBusy||!nodes.length)return;let q=nodes.filter(n=>!['seed','hypothesis'].includes(n.type)).sort((a,b)=>scoreQueue(b)-scoreQueue(a));if(q[0])await expandNode(q[0]);if(nodes.length>45){toggleWander();toast('Paused at 45 nodes to stay readable')}},9000)}
function exportGraph(){let blob=new Blob([JSON.stringify({mode,nodes,links:links.map(l=>({...l,source:l.source.id||l.source,target:l.target.id||l.target})),bridges:bridgeCandidates,log:STATELOG},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='curiosity-graph.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('#goBtn').onclick=()=>growSeed($('#seedInput').value);$('#seedInput').addEventListener('keydown',e=>{if(e.key==='Enter')growSeed(e.target.value)});$$('.modebtn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('.modebtn').forEach(x=>x.classList.toggle('active',x===b));save();toast(mode==='math'?'Pattern heuristics ready':mode[0].toUpperCase()+mode.slice(1)+' mode')});$('#expandBtn').onclick=()=>selected?expandNode(selected):toast('Tap a node first');$('#wanderBtn').onclick=toggleWander;$('#gapBtn').onclick=findGaps;$('#fitBtn').onclick=fitGraph;$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');$('#dExplore').onclick=()=>selected&&expandNode(selected);$('#dTest').onclick=()=>{if(!selected||selected.type!=='hypothesis')return;let ids=links.filter(l=>(l.source.id||l.source)===selected.id||(l.target.id||l.target)===selected.id).map(l=>(l.source.id||l.source)===selected.id?(l.target.id||l.target):(l.source.id||l.source));if(ids.length>=2)testBridge({a:ids[0],b:ids[1],aTitle:nodeById(ids[0])?.title,bTitle:nodeById(ids[1])?.title})};$('#resetBtn').onclick=()=>{if(wanderTimer)toggleWander();nodes=[];links=[];bridgeCandidates=[];STATELOG=[];selected=null;localStorage.removeItem(STORE);renderLog();renderBridges();updateGraph();$('#drawer').classList.remove('open');setStatus('Reset complete.')};$('#exportBtn').onclick=exportGraph;$('#mobileExportBtn').onclick=exportGraph;
if(matchMedia('(max-width:720px)').matches)$$('.panel').forEach(p=>p.removeAttribute('open'));
restore();initGraph();renderBridges();if(nodes.length)setTimeout(fitGraph,400);if(!nodes.length)$('#seedInput').value='C_n(t)=((1+t^4)e^{i(2πn/9+.1 sin n)}, 3t-t^2)';
</script>
