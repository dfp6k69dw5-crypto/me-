<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<title>The Fast Nonsense Predictor</title>
<style>
:root{--bg:#070a0f;--card:#101720;--ink:#edf1e8;--dim:#84909b;--line:#22303d;--gold:#d8b66a;--cyan:#71c9ce;--green:#7fd0a7;--red:#ed8b7c;--amber:#e2b56a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#15283b 0,#070a0f 48%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding:20px 13px 70px}.wrap{max-width:1240px;margin:auto}header{padding:10px 2px 8px}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}h1{font:700 clamp(31px,6vw,64px)/.98 Georgia,serif;letter-spacing:-.035em;margin:8px 0 10px}.warning{margin-top:8px;color:#8f8269;font-size:10px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pill,button,input,select{border:1px solid var(--line);background:#0c1218;color:var(--ink);border-radius:6px}.pill{padding:8px 10px;font-size:11px}.pill.live{border-color:#315e4a;color:var(--green)}button{padding:10px 13px;font:12px inherit;cursor:pointer}input,select{padding:10px;font:13px inherit}input{width:170px;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-bottom:12px}.hero>div,.card,.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(16,23,32,.96),rgba(10,15,21,.96));border-radius:10px}.oracle,.forecast{padding:20px}.label{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}.big{font:700 clamp(50px,9vw,96px)/.92 Georgia,serif;color:var(--gold);font-variant-numeric:tabular-nums;margin:9px 0}.price{font:700 38px Georgia,serif;margin:8px 0}.move{font:700 29px Georgia,serif;color:var(--cyan);margin:5px 0}.fine{font-size:10px;color:var(--dim);line-height:1.45;margin-top:7px}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.score div{border:1px solid var(--line);padding:9px;border-radius:6px}.score b{display:block;font:700 20px Georgia,serif;color:var(--ink);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:14px;min-height:162px;position:relative;overflow:hidden}.card.flash:after{content:"";position:absolute;inset:0;background:rgba(216,182,106,.1);animation:flash .45s forwards;pointer-events:none}@keyframes flash{to{opacity:0}}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#bcc6ca}.status{font-size:9px;padding:4px 6px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}.status.live{color:var(--green);border-color:#315e4a}.status.stale{color:var(--amber);border-color:#604e2e}.status.error{color:var(--red);border-color:#633933}.metric{font:700 27px/1.05 Georgia,serif;margin:16px 0 5px;font-variant-numeric:tabular-nums}.sub{font-size:10px;color:var(--dim);line-height:1.35;min-height:25px}.spark{height:28px;width:100%;margin-top:7px}.spark path{fill:none;stroke:var(--cyan);stroke-width:1.5;vector-effect:non-scaling-stroke}.source{font-size:9px;color:#596875;margin-top:6px}.panel{margin-top:12px;padding:14px}.events{max-height:210px;overflow:auto}.evt{font-size:10px;color:#8e9aa2;padding:5px 0;border-top:1px solid #18222b}.evt b{color:#d6ddd9;font-weight:500}.up{color:var(--green)}.down{color:var(--red)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.score{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid{grid-template-columns:1fr}.big{font-size:68px}.card{min-height:145px}}
</style>
</head>
<body><main class="wrap">
<header><div class="eyebrow">FAST ORACLE · MK III</div><h1>The Fast Nonsense Predictor</h1><div class="warning">Experiment, not investment advice.</div></header>
<div class="bar"><span class="pill live" id="health">CONNECTING…</span><span class="pill" id="clock">—</span><input id="ticker" value="ES=F" maxlength="32" aria-label="Symbol"><select id="horizon"><option value="30">30 sec</option><option value="60" selected>60 sec</option><option value="120">120 sec</option></select><button id="loadTicker">LOAD</button><button id="refresh">REFRESH</button></div>
<section class="hero"><div class="oracle"><div class="label">R</div><div class="big" id="oracleOut">—</div><div id="seedLine" class="fine">waiting</div><div class="fine">F₀(x)=x · Fₙ(x)=(x²+n·x+Fₙ₋₁(x)) mod 1,000,003</div></div><div class="forecast"><div class="label" id="forecastLabel">ES=F · 60 sec</div><div class="price" id="marketPrice">—</div><div class="move" id="prediction">—</div><div class="score"><div><span class="label">settled</span><b id="settled">0</b></div><div><span class="label">hit</span><b id="hitRate">—</b></div><div><span class="label">corr</span><b id="corr">—</b></div><div><span class="label">reverse</span><b id="reverse">—</b></div></div></div></section>
<section class="grid" id="grid"></section>
<section class="panel"><div class="label">Results</div><div class="events" id="events"></div></section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), num=(x,d=0)=>Number.isFinite(Number(x))?Number(x):d, fmt=(x,d=2)=>Number(x).toFixed(d);
const MARKET='https://room-live-mirror.dfp6k69dw5.workers.dev/api/market', MOD=1000003n;
const products={btc:'BTC-USD',eth:'ETH-USD',sol:'SOL-USD',doge:'DOGE-USD',ltc:'LTC-USD',link:'LINK-USD',avax:'AVAX-USD',bch:'BCH-USD',xrp:'XRP-USD'};
const cfg={market:{name:'Target',source:'Yahoo · 1m',cadence:10000,stale:90000},btc:{name:'BTC',source:'Coinbase',cadence:0,stale:15000},eth:{name:'ETH',source:'Coinbase',cadence:0,stale:15000},sol:{name:'SOL',source:'Coinbase',cadence:0,stale:15000},doge:{name:'DOGE',source:'Coinbase',cadence:0,stale:15000},ltc:{name:'LTC',source:'Coinbase',cadence:0,stale:15000},link:{name:'LINK',source:'Coinbase',cadence:0,stale:15000},avax:{name:'AVAX',source:'Coinbase',cadence:0,stale:15000},bch:{name:'BCH',source:'Coinbase',cadence:0,stale:15000},xrp:{name:'XRP',source:'Coinbase',cadence:0,stale:15000},pressure:{name:'Order pressure',source:'Coinbase',cadence:0,stale:15000},wiki:{name:'Wiki edits',source:'Wikimedia SSE',cadence:0,stale:20000}};
const state={cards:{},hist:{},events:[],ws:null,wiki:null,wikiTimes:[],lastMarketTs:0,lastMarketPrice:null,pending:[],results:[],lastPredictionTs:0};
Object.keys(cfg).forEach(k=>state.cards[k]={status:'waiting',updated:0,value:null,factor:null});
function cardHTML(k){const c=cfg[k];return '<article class="card" id="card-'+k+'"><div class="top"><span class="name">'+c.name+'</span><span class="status" id="st-'+k+'">WAIT</span></div><div class="metric" id="m-'+k+'">—</div><div class="sub" id="sub-'+k+'">—</div><svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"><path id="sp-'+k+'" d=""></path></svg><div class="source">'+c.source+'</div></article>'}
$('grid').innerHTML=Object.keys(cfg).map(cardHTML).join('');
function log(msg){state.events.unshift({t:Date.now(),msg});state.events=state.events.slice(0,70);$('events').innerHTML=state.events.map(e=>'<div class="evt">'+new Date(e.t).toLocaleTimeString()+' · '+e.msg+'</div>').join('')}
function spark(k,v){if(!Number.isFinite(v))return;const h=state.hist[k]||(state.hist[k]=[]);h.push(v);if(h.length>45)h.shift();const lo=Math.min(...h),hi=Math.max(...h),sp=hi-lo||1;$('sp-'+k).setAttribute('d',h.map((x,i)=>(i?'L':'M')+(i/Math.max(1,h.length-1)*100).toFixed(1)+' '+(26-(x-lo)/sp*23).toFixed(1)).join(' '))}
function setCard(k,metric,detail,factor,raw){const c=state.cards[k];c.status='live';c.updated=Date.now();c.value=raw===undefined?factor:raw;c.factor=Number.isFinite(factor)?clamp(factor,-1,1):null;$('m-'+k).textContent=metric;$('sub-'+k).textContent=detail;$('st-'+k).textContent='LIVE';$('st-'+k).className='status live';const el=$('card-'+k);el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');spark(k,num(c.value,0));recompute()}
function fail(k){const c=state.cards[k];c.status=c.updated?'stale':'error';$('st-'+k).textContent=c.updated?'STALE':'ERROR';$('st-'+k).className='status '+(c.updated?'stale':'error');recompute()}
async function request(url,ms=8500){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal,headers:{accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function alex(seed){let x=BigInt(Math.abs(Math.trunc(seed)))%MOD;for(let i=1n;i<=1000n;i++){const tri=i*(i+1n)/2n;x=(x+i*x*x+x*tri)%MOD}return Number(x)}
function seedFromSignals(){let seed=17,used=0;Object.keys(cfg).forEach((k,i)=>{const f=state.cards[k].factor;if(Number.isFinite(f)){seed=(seed+Math.round((f+1)*50000)*(i+11))%1000003;used++}});return {seed,used}}
function recompute(){let live=0;Object.keys(cfg).forEach(k=>{if(state.cards[k].status==='live')live++});$('health').textContent=live>=10?'LIVE':live>=6?'PARTIAL':'CONNECTING';$('health').className='pill '+(live>=10?'live':'');const s=seedFromSignals(),r=s.used>=4?alex(s.seed):null;$('oracleOut').textContent=r===null?'—':r.toLocaleString();$('seedLine').textContent=r===null?s.used+'/12':'seed '+s.seed+' · '+s.used+'/12';score();if(r!==null&&state.lastMarketPrice!==null&&state.lastMarketTs>state.lastPredictionTs)issuePrediction(r)}
function issuePrediction(r){const horizon=Number($('horizon').value)||60,y=(r/1000002)*2-1,predPct=y*.35,start=state.lastMarketPrice,ts=state.lastMarketTs;state.pending.push({symbol:$('ticker').value,horizon,start,ts,predPct,r});state.pending=state.pending.slice(-80);state.lastPredictionTs=ts;$('forecastLabel').textContent=$('ticker').value+' · '+horizon+' sec';$('prediction').textContent=(predPct>=0?'▲ +':'▼ ')+fmt(predPct,3)+'%';$('prediction').className='move '+(predPct>=0?'up':'down');log('<b>FORECAST</b> '+(predPct>=0?'UP ':'DOWN ')+fmt(Math.abs(predPct),3)+'%')}
function settle(price,ts){const keep=[];for(const p of state.pending){if(ts-p.ts>=p.horizon){const actualPct=(price/p.start-1)*100,hit=Math.sign(actualPct)===Math.sign(p.predPct);state.results.push({pred:p.predPct,actual:actualPct,hit});state.results=state.results.slice(-200);log('<b>'+(hit?'HIT':'MISS')+'</b> '+fmt(p.predPct,3)+'% → '+fmt(actualPct,3)+'%')}else keep.push(p)}state.pending=keep;try{localStorage.setItem('fastOracleResults',JSON.stringify(state.results))}catch(e){}score()}
function pearson(a){if(a.length<3)return NaN;const mx=a.reduce((s,x)=>s+x.pred,0)/a.length,my=a.reduce((s,x)=>s+x.actual,0)/a.length;let n=0,dx=0,dy=0;for(const x of a){const X=x.pred-mx,Y=x.actual-my;n+=X*Y;dx+=X*X;dy+=Y*Y}return dx&&dy?n/Math.sqrt(dx*dy):NaN}
function score(){const a=state.results,n=a.length,h=n?a.filter(x=>x.hit).length/n:NaN,c=pearson(a);$('settled').textContent=n;$('hitRate').textContent=Number.isFinite(h)?fmt(h*100,0)+'%':'—';$('corr').textContent=Number.isFinite(c)?fmt(c,3):'—';$('reverse').textContent=Number.isFinite(c)?(c<-.15?'YES':'NO'):'—'}
async function market(){try{const s=($('ticker').value||'ES=F').toUpperCase().replace(/[^A-Z0-9.^=_-]/g,'').slice(0,32)||'ES=F';$('ticker').value=s;const j=await request(MARKET+'?symbol='+encodeURIComponent(s)+'&interval=1m&range=1d&prepost=1&fresh='+Date.now());const r=j?.payload?.chart?.result?.[0],meta=r?.meta||{},q=r?.indicators?.quote?.[0]||{},times=r?.timestamp||[],closes=q.close||[];let p=NaN,ts=0;for(let i=Math.min(times.length,closes.length)-1;i>=0;i--){if(Number.isFinite(Number(closes[i]))&&Number.isFinite(Number(times[i]))){p=Number(closes[i]);ts=Number(times[i]);break}}if(!Number.isFinite(p)){p=num(meta.regularMarketPrice,NaN);ts=Math.floor(Date.now()/1000)}if(!Number.isFinite(p))throw Error('no market price');if(ts>state.lastMarketTs&&state.lastMarketPrice!==null)settle(p,ts);const prev=state.lastMarketPrice??p,move=prev?100*(p-prev)/prev:0;state.lastMarketPrice=p;state.lastMarketTs=Math.max(ts,state.lastMarketTs);$('marketPrice').textContent=fmt(p,2);setCard('market',fmt(p,2),(move>=0?'+':'')+fmt(move,3)+'%',clamp(move/.25,-1,1),p)}catch(e){fail('market')}}
function crypto(){try{if(state.ws){state.ws.onclose=null;state.ws.close()}}catch(e){}const ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');state.ws=ws;const ids=Object.values(products);const timer=setTimeout(()=>{if(ws.readyState!==1)Object.keys(products).forEach(fail)},9000);ws.onopen=()=>{clearTimeout(timer);ws.send(JSON.stringify({type:'subscribe',product_ids:ids,channels:['ticker']}))};ws.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.type!=='ticker')return;const key=Object.keys(products).find(k=>products[k]===j.product_id);if(!key)return;const p=num(j.price,NaN),open=num(j.open_24h,p),bid=num(j.best_bid,NaN),ask=num(j.best_ask,NaN),bs=num(j.best_bid_size,0),as=num(j.best_ask_size,0);if(!Number.isFinite(p))return;const pct=open?100*(p-open)/open:0;setCard(key,p>=1000?Math.round(p).toLocaleString():p>=1?fmt(p,2):fmt(p,4),(pct>=0?'+':'')+fmt(pct,2)+'%',clamp(pct/6,-1,1),p);if(key==='btc'&&Number.isFinite(bid)&&Number.isFinite(ask)){const spread=(ask-bid)/((ask+bid)/2)*10000,imb=(bs-as)/(bs+as||1);setCard('pressure',(imb>=0?'+':'')+fmt(imb,2),fmt(spread,2)+' bp',clamp(imb,-1,1),imb)}}catch(err){}};ws.onerror=()=>Object.keys(products).forEach(fail);ws.onclose=()=>{if(document.visibilityState==='visible'){Object.keys(products).forEach(fail);setTimeout(crypto,3500)}}}
function wiki(){try{if(state.wiki)state.wiki.close()}catch(e){}const es=new EventSource('https://stream.wikimedia.org/v2/stream/recentchange');state.wiki=es;es.onmessage=e=>{try{JSON.parse(e.data);const now=Date.now();state.wikiTimes.push(now);state.wikiTimes=state.wikiTimes.filter(t=>now-t<10000);const rate=state.wikiTimes.length*6;setCard('wiki',rate+' / min','',clamp((rate-600)/900,-1,1),rate)}catch(err){}};es.onerror=()=>fail('wiki')}
function refresh(){market();if(!state.ws||state.ws.readyState>1)crypto();if(!state.wiki)wiki()}
setInterval(market,cfg.market.cadence);setInterval(()=>{const now=Date.now();Object.keys(cfg).forEach(k=>{const c=state.cards[k];if(c.updated&&now-c.updated>cfg[k].stale&&c.status==='live'){c.status='stale';$('st-'+k).textContent='STALE';$('st-'+k).className='status stale'}});recompute()},2500);
try{const saved=JSON.parse(localStorage.getItem('fastOracleResults')||'[]');if(Array.isArray(saved))state.results=saved.slice(-200)}catch(e){}
$('loadTicker').onclick=()=>{state.pending=[];state.lastPredictionTs=0;state.lastMarketTs=0;state.lastMarketPrice=null;market()};$('ticker').onkeydown=e=>{if(e.key==='Enter')$('loadTicker').click()};$('horizon').onchange=()=>{state.pending=[];state.lastPredictionTs=0};$('refresh').onclick=refresh;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString(),1000);
crypto();wiki();market();score();recompute();
})();
</script>
</body></html>
