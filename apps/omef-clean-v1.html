<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>OMEF Clean v1</title><style>
:root{--bg:#0d0d0d;--panel:#1c1c1c;--text:#eee;--muted:#aaa;--line:#333;--accent:#109b91;--canvas:#000;--ink:255,255,255}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:980px;margin:auto}.stage{position:sticky;top:0;height:48svh;min-height:320px;background:var(--canvas);z-index:20;border-bottom:1px solid var(--line)}canvas{width:100%;height:100%;display:block;background:var(--canvas)}.hud{position:absolute;left:10px;top:10px;background:#000c;color:#fff;font:11px Menlo,monospace;padding:6px 8px}.status{position:absolute;left:10px;top:42px;background:#000b;color:#fff;border-radius:20px;padding:5px 8px;font-size:10px}.focus{position:absolute;right:10px;top:10px;border:1px solid #555;background:#111d;color:#fff;border-radius:999px;padding:8px 12px}.panel{background:var(--panel)}section{padding:13px 12px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 5px}.sub{font-size:11px;color:var(--muted);line-height:1.4}.row{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;margin:9px 0;font-size:13px}.row label{color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.v{background:#555;color:#fff;border-radius:7px;text-align:center;padding:5px 2px;font:10px Menlo,monospace}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:9px;padding:10px;background:var(--accent);color:#fff;font-weight:800}.actions button.secondary{background:#555}.metrics{font:10px/1.45 Menlo,monospace;color:#888;margin-top:8px}body.focusMode .panel{display:none}body.focusMode .stage{position:fixed;inset:0;width:100vw;height:100svh;z-index:999}
</style></head><body><div class="app"><div class="stage"><canvas id="cv" width="1000" height="760"></canvas><div class="hud" id="hud">OMEF Clean v1 · 0 pts</div><div class="status" id="status">booting</div><button id="focus" class="focus">Focus</button></div><div class="panel"><section><h1>OMEF Clean v1</h1><div class="sub">Fresh single-file rewrite. Classic point renderer. One OMEF-derived autonomous core. No species layer yet.</div><div class="actions" style="margin-top:10px"><button id="random">Random visible</button><button id="mutate">Mutate slightly</button><button id="reset" class="secondary">Reset</button><button id="render" class="secondary">Render again</button></div></section><section>
<div class="row"><label>Pair</label><input id="pair" type="range" min="0" max="200" value="100"><span class="v" id="pairV">1.00</span></div>
<div class="row"><label>Triad</label><input id="triad" type="range" min="0" max="200" value="100"><span class="v" id="triadV">1.00</span></div>
<div class="row"><label>Market</label><input id="market" type="range" min="0" max="200" value="100"><span class="v" id="marketV">1.00</span></div>
<div class="row"><label>Shadow</label><input id="shadow" type="range" min="0" max="200" value="100"><span class="v" id="shadowV">1.00</span></div>
<div class="row"><label>Regime</label><input id="regime" type="range" min="0" max="200" value="100"><span class="v" id="regimeV">1.00</span></div>
<div class="row"><label>Golden</label><input id="golden" type="range" min="0" max="200" value="100"><span class="v" id="goldenV">1.00</span></div>
<div class="row"><label>Fibonacci</label><input id="fib" type="range" min="0" max="200" value="100"><span class="v" id="fibV">1.00</span></div>
<div class="row"><label>Edge</label><input id="edge" type="range" min="0" max="200" value="100"><span class="v" id="edgeV">1.00</span></div>
<div class="metrics" id="metrics"></div></section><section>
<div class="row"><label>Points</label><input id="points" type="range" min="10000" max="120000" step="10000" value="50000"><span class="v" id="pointsV">50K</span></div>
<div class="row"><label>Ink</label><input id="ink" type="range" min="1" max="100" value="34"><span class="v" id="inkV">34</span></div>
<div class="row"><label>Size</label><input id="size" type="range" min="1" max="4" value="1"><span class="v" id="sizeV">1</span></div>
</section></div></div><script>
(function(){'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),token=0,seed=0x51f15e,baseSeed=seed;
var $=id=>document.getElementById(id),ids=['pair','triad','market','shadow','regime','golden','fib','edge'];
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function params(){var p={};ids.forEach(id=>p[id]=+$((id)).value/100);return p}
function sync(){ids.forEach(id=>$(id+'V').textContent=(+$(id).value/100).toFixed(2));$('pointsV').textContent=Math.round(+$('points').value/1000)+'K';$('inkV').textContent=$('ink').value;$('sizeV').textContent=$('size').value}
function stateMaker(P,sd){
 var r=rng(sd),U=new Float64Array(10),prev=new Float64Array(10),hist=new Float64Array(60*10),head=0,alpha=new Float64Array([.37,.28,.21,.14]),zS=new Float64Array(18),zL=new Float64Array(18),h=new Float64Array(8),theta=new Float64Array(10),step=0;
 for(var i=0;i<10;i++)U[i]=(r()-.5)*.18; for(i=0;i<18;i++){zS[i]=Math.sin(.31*i+sd*.001)*.08;zL[i]=Math.cos(.19*i+sd*.0013)*.08}
 function H(lag,i){var slot=(head-lag+60)%60;return hist[slot*10+i]}
 return function(){
   for(var i=0;i<10;i++)prev[i]=U[i];
   var phase=.016*step, golden=0;
   for(i=0;i<9;i++){var a=.027*(1+i*.031),b=a/1.61803398875,ix=i*2,cs=Math.cos(a),ss=Math.sin(a),cl=Math.cos(b),sl=Math.sin(b),xs=zS[ix],ys=zS[ix+1],xl=zL[ix],yl=zL[ix+1];zS[ix]=.9992*(cs*xs-ss*ys);zS[ix+1]=.9992*(ss*xs+cs*ys);zL[ix]=.99955*(cl*xl-sl*yl);zL[ix+1]=.99955*(sl*xl+cl*yl);golden+=zS[ix]+zL[ix]}
   var m0=.9*U[0]-.55*U[6]+.35*H(13,2),m1=.85*U[7]+.42*U[3]-.31*H(21,5),m2=-.72*U[2]+.63*U[8]+.28*H(34,1),m3=-.66*U[9]+.4*U[4]-.22*H(55,7),mx=Math.max(m0,m1,m2,m3),ev=[Math.exp(m0-mx),Math.exp(m1-mx),Math.exp(m2-mx),Math.exp(m3-mx)],sum=ev[0]+ev[1]+ev[2]+ev[3],rate=.008+.05*P.regime;for(i=0;i<4;i++)alpha[i]=(1-rate)*alpha[i]+rate*ev[i]/sum;
   var fibv=.34*h[0]+.21*h[1]+.13*h[2]+.08*h[3]+.05*h[4]+.03*h[5]+.02*h[6]+.01*h[7];for(i=7;i>0;i--)h[i]=h[i-1];h[0]=Math.tanh(.72*fibv+.28*(U[9]-U[2])+.16*P.fib*Math.sin(U[4]*3));
   var next=new Float64Array(10);
   for(i=0;i<10;i++){
     var j=(i+3)%10,k=(i+7)%10,q=(i+5)%10;
     var pair=P.pair*(.55*Math.tanh(U[j])-.38*Math.tanh(U[k])+.16*Math.tanh(U[q]));
     var tri=P.triad*.62*Math.tanh(U[j])*Math.tanh(U[k]);
     var market=P.market*.42*(H(13,j)-H(34,k));
     var shadow=P.shadow*.36*((U[i]-H(21,i))-(H(13,j)-H(34,j)));
     var reg=P.regime*.34*((alpha[0]-alpha[3])*Math.sin(i*.7)+(alpha[1]-alpha[2])*Math.cos(i*.53));
     var cyc=P.golden*.26*(zS[(i%9)*2]+zL[((i+4)%9)*2]);
     theta[i]=.997*theta[i]+.003*P.edge*Math.tanh(U[j]-U[k]);
     var nl=U[i]+pair+tri+market+shadow+reg+cyc+.2*P.fib*h[0]+.18*theta[i]+.07*Math.sin(phase+i*.41);
     var brake=1+.18*(.55+.35*P.edge)*(U[i]*U[i]+U[j]*U[j]);
     next[i]=Math.tanh(nl/brake);
   }
   for(i=0;i<10;i++){U[i]=next[i];hist[head*10+i]=U[i]}
   head=(head+1)%60;step++;
   var x=1.25*(U[0]-U[7])+.8*(U[3]*U[6]-U[2]*U[8])+.55*h[0]+.36*(zS[0]+zL[8]);
   var y=1.25*(U[1]+U[8]-U[4])+.8*(U[5]*U[9]-U[0]*U[6])+.55*(alpha[1]-alpha[3])+.36*(zS[7]-zL[3]);
   return [x,y,U[0],U[7]];
 }
}
function sample(n,P,sd){var st=stateMaker(P,sd),pts=[],minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,q;for(var i=0;i<n+700;i++){q=st();if(i<700)continue;if(!isFinite(q[0])||!isFinite(q[1]))continue;pts.push([q[0],q[1]]);if(q[0]<minX)minX=q[0];if(q[0]>maxX)maxX=q[0];if(q[1]<minY)minY=q[1];if(q[1]>maxY)maxY=q[1]}return{pts,minX,maxX,minY,maxY,w:maxX-minX,h:maxY-minY}}
function score(S){if(S.pts.length<3000||!isFinite(S.w)||!isFinite(S.h)||S.w<.08||S.h<.08)return -1;var aspect=Math.min(S.w,S.h)/Math.max(S.w,S.h),cells=new Uint8Array(32*24),occ=0;for(var i=0;i<S.pts.length;i+=5){var p=S.pts[i],x=Math.floor((p[0]-S.minX)/(S.w||1)*31),y=Math.floor((p[1]-S.minY)/(S.h||1)*23),ix=y*32+x;if(x>=0&&x<32&&y>=0&&y<24&&!cells[ix]){cells[ix]=1;occ++}}return occ+80*aspect}
function fingerprint(S){var a=0,b=0,c=0,step=Math.max(1,Math.floor(S.pts.length/500));for(var i=0;i<S.pts.length;i+=step){var p=S.pts[i];a+=Math.sin(p[0]*3.17+i*.011);b+=Math.cos(p[1]*2.71-i*.013);c+=p[0]*p[1]}return(Math.abs((a*911+b*353+c*271)|0)).toString(16)}
function render(){token++;var my=token;sync();var P=params(),total=+$('points').value,S=sample(total,P,seed);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);if(!S.pts.length){$('status').textContent='no orbit';return}var scale=Math.min(cv.width*.93/(S.w||1),cv.height*.93/(S.h||1)),ox=cv.width/2-scale*(S.minX+S.maxX)/2,oy=cv.height/2+scale*(S.minY+S.maxY)/2,alpha=.008+(+$('ink').value)/1000,size=+$('size').value,idx=0;ctx.fillStyle='rgba(255,255,255,'+alpha+')';$('status').textContent='rendering';function batch(){if(my!==token)return;var t=performance.now();ctx.beginPath();while(idx<S.pts.length&&performance.now()-t<6){var p=S.pts[idx++];ctx.rect(ox+p[0]*scale,oy-p[1]*scale,size,size)}ctx.fill();if(idx<S.pts.length)requestAnimationFrame(batch);else{$('status').textContent='ready';$('hud').textContent='OMEF Clean v1 · '+S.pts.length.toLocaleString()+' pts';$('metrics').textContent='fingerprint '+fingerprint(S)+' · span '+S.w.toFixed(3)+' × '+S.h.toFixed(3)+' · score '+score(S).toFixed(1)}}requestAnimationFrame(batch)}
function randomVisible(){var r=rng((seed+0x9e3779b9)>>>0),best=null,bp=null,bs=seed;for(var t=0;t<28;t++){var P={};ids.forEach(id=>P[id]=.25+1.75*r());var sd=(r()*0xffffffff)>>>0,S=sample(8000,P,sd),sc=score(S);if(!best||sc>best.sc){best={sc:sc,S:S};bp=P;bs=sd}}if(bp){ids.forEach(id=>$(id).value=Math.round(bp[id]*100));seed=bs;render()}}
function mutate(){var r=rng((seed^0xa5a5a5a5)>>>0);ids.forEach(id=>{var el=$(id);el.value=clamp(+el.value+(r()-.5)*24,0,200)});seed=(seed+7919)>>>0;render()}
$('random').onclick=randomVisible;$('mutate').onclick=mutate;$('reset').onclick=()=>{ids.forEach(id=>$(id).value=100);seed=baseSeed;render()};$('render').onclick=render;$('focus').onclick=()=>{document.body.classList.toggle('focusMode');$('focus').textContent=document.body.classList.contains('focusMode')?'Controls':'Focus'};ids.concat(['points','ink','size']).forEach(id=>$(id).oninput=()=>{sync();clearTimeout(window._rr);window._rr=setTimeout(render,120)});render();
})();
</script></body></html>
