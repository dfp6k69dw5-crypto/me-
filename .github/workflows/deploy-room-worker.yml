name: Deploy validated Room Worker
# self-reporting deployment gate: 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/room-worker/**'
      - '.github/workflows/deploy-room-worker.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-room-live-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check deploy credentials without exposing them
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials are available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials are not available in the expected GitHub Actions secret/variable names.'
          fi

      - name: Refuse unvalidated Worker source
        id: validate
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        run: |
          node scripts/room_worker_ingest_sim.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('room/worker-ingest-simulator-diagnostic.json'))
          if not d.get('pass'):
              raise SystemExit('Worker source simulator is not green; refusing deployment')
          print('Worker source simulator is green.')
          PY

      - name: Deploy existing room-live-mirror Worker
        id: deploy_worker
        if: steps.creds.outputs.available == 'true' && steps.validate.outcome == 'success'
        continue-on-error: true
        run: npx --yes wrangler@latest deploy --config cloudflare/room-worker/wrangler.toml

      - name: Push current Room feed through deployed Worker
        id: ingest
        if: steps.deploy_worker.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          token_json=$(curl -fsS --connect-timeout 3 --max-time 8 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror")
          relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
          test -n "$relay_token"
          ingest=$(curl -fsS --connect-timeout 3 --max-time 8 \
            -X POST \
            -H "Authorization: Bearer ${relay_token}" \
            -H 'Content-Type: application/json' \
            --data-binary @room/feed.json \
            "${ROOM_RELAY_URL}/api/ingest")
          printf '%s\n' "$ingest"
          accepted=$(printf '%s' "$ingest" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("accepted"))).lower())')
          test "$accepted" = true

      - name: Verify live relay now matches the current Room boot
        id: verify
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --connect-timeout 3 --max-time 8 \
            -H 'Origin: https://maaronfanberg-lab.github.io' \
            "${ROOM_RELAY_URL}/api/feed?fresh=$(date +%s)" > /tmp/live-relay.json
          python3 - <<'PY'
          import json
          from datetime import datetime
          local=json.load(open('room/feed.json'))
          raw=json.load(open('/tmp/live-relay.json'))
          remote=raw.get('feed',raw)
          ls=local.get('state',{}); rs=remote.get('state',{})
          def ts(x):
              return datetime.fromisoformat(str(x).replace('Z','+00:00')).timestamp()
          lg=local.get('generated_at') or ls.get('last_run')
          rg=remote.get('generated_at') or rs.get('last_run')
          lag=ts(lg)-ts(rg)
          print(json.dumps({
            'local_boot':ls.get('boot_id'),
            'relay_boot':rs.get('boot_id'),
            'local_cycle':ls.get('cycle'),
            'relay_cycle':rs.get('cycle'),
            'timestamp_lag_seconds':lag,
          },indent=2))
          if ls.get('boot_id') != rs.get('boot_id'):
              raise SystemExit('Relay is still on the wrong Room boot')
          if lag > 90:
              raise SystemExit('Relay is still stale')
          PY

      - name: Write non-secret deployment status
        if: always()
        env:
          CREDS_AVAILABLE: ${{ steps.creds.outputs.available }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p room
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          creds=os.environ.get('CREDS_AVAILABLE')=='true'
          out={
            'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'worker':'room-live-mirror',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'credentials_available':creds,
            'validate':os.environ.get('VALIDATE_OUTCOME') or 'skipped',
            'deploy':os.environ.get('DEPLOY_OUTCOME') or 'skipped',
            'ingest':os.environ.get('INGEST_OUTCOME') or 'skipped',
            'verify':os.environ.get('VERIFY_OUTCOME') or 'skipped',
          }
          out['pass']=creds and out['validate']=='success' and out['deploy']=='success' and out['ingest']=='success' and out['verify']=='success'
          out['state']='deployed-and-verified' if out['pass'] else ('missing-github-cloudflare-credentials' if not creds else 'deployment-or-verification-failed')
          open('room/cloudflare-deploy-status.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Publish deployment status
        if: always()
        run: |
          git config user.name "room-worker-deployer"
          git config user.email "actions@users.noreply.github.com"
          git add room/cloudflare-deploy-status.json
          git commit -m "Record Room Worker deployment status" || exit 0
          for n in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$n"
          done
          exit 1
