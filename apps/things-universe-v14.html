async function common(){if(!rootA||!rootB)return 0;let ak=S.A.queue.filter(k=>!S.A.expanded.has(k)).slice(0,8),bk=S.B.queue.filter(k=>!S.B.expanded.has(k)).slice(0,8),ma=new Map(),mb=new Map();for(const q of ak)for(const x of(await concepts(q)).slice(0,50))if(!ma.has(x.k))ma.set(x.k,{...x,from:q});for(const q of bk)for(const x of(await concepts(q)).slice(0,50))if(!mb.has(x.k))mb.set(x.k,{...x,from:q});let best=null;for(const[k,a]of ma){let b=mb.get(k);if(!b||k===rootA.k||k===rootB.k)continue;let sc=a.score+b.score;if(!best||sc>best.sc)best={k,a,b,sc}}if(!best)return 0;let pa=byKey(best.a.from),pb=byKey(best.b.from),n=byKey(best.k)||node(best.a.l);n.a=n.b=true;edge(pa,n,best.a.r,'A',true,best.a.src);edge(pb,n,best.b.r,'B',true,best.b.src);S.A.seen.add(n.k);S.B.seen.add(n.k);if(!S.A.queue.includes(n.k))S.A.queue.push(n.k);if(!S.B.queue.includes(n.k))S.B.queue.push(n.k);mark(n,true,{kind:'explicit intersection',confidence:'Strong',why:'Both concept territories independently reached the same explicit concept.'});render();return 1}
async function roundGo(){if(busy||!rootA)return 0;busy=true;round++;thinking(true,'Concept round '+round+'…');let add=0;try{add+=await expand('A',rootB?6:8);if(rootB)add+=await expand('B',6);if(rootB)await common();stalls=add?0:stalls+1;ui(`Round ${round}: +${add}`);if(auto&&stalls>=7){auto=false;token++;$('#auto').classList.remove('on');$('#auto').textContent='Auto-grow: off';toast(rootB?'Direct growth exhausted — Find bridge can climb higher.':'No more direct links found.')}return add}catch{ui('Retrying next round');return 0}finally{busy=false;thinking(false)}}
async function sprout(n,s,lim=9){thinking(true,'Finding conceptual links…');let list=await concepts(n.k),add=0;for(const c of list.slice(0,lim)){let ex=!!byKey(c.k),q=node(c.l,s,n);edge(n,q,c.r,s,false,c.src);S[s].seen.add(q.k);if(!S[s].queue.includes(q.k))S[s].queue.push(q.k);if(!ex)add++}render();thinking(false);ui(add?'Sprouted '+add:'No direct links yet');if(!list.length)toast('No direct links loaded for '+n.l)}async function addThing(t){let s=!rootA?'A':!rootB?'B':'';if(!s){toast('Reset to start a new pair');return}let n=node(t,s);if(s==='A')rootA=n;else rootB=n;S[s].seen.add(n.k);S[s].queue.push(n.k);render();await sprout(n,s,9);if(rootA&&rootB){fronts();round=stalls=0;ui('Two conceptual islands ready')}setTimeout(fitGraph,260)}async function loop(t){while(auto&&t===token){await roundGo();if(!auto||t!==token)break;await new Promise(r=>setTimeout(r,900))}}function toggle(){if(auto){auto=false;token++;$('#auto').classList.remove('on');$('#auto').textContent='Auto-grow: off';ui('Ready');return}if(!rootA){toast('Add an idea first');return}auto=true;stalls=0;let t=++token;$('#auto').classList.add('on');$('#auto').textContent='Auto-grow: on';ui('Growing conceptual links…');loop(t)}
async function deepCommon(){thinking(true,'Searching wider explicit territory…');const choose=s=>{let st=S[s],root=s==='A'?rootA:rootB,arr=[root.k,...st.queue.filter(k=>k!==root.k)].slice(0,7);return[...new Set(arr)]};let ak=choose('A'),bk=choose('B'),[aa,bb]=await Promise.all([Promise.all(ak.map(async q=>[q,(await concepts(q)).slice(0,75)])),Promise.all(bk.map(async q=>[q,(await concepts(q)).slice(0,75)]))]);let ma=new Map(),mb=new Map();for(const[q,list]of aa)for(const x of list){let old=ma.get(x.k);if(!old||x.score>old.score)ma.set(x.k,{...x,from:q})}for(const[q,list]of bb)for(const x of list){let old=mb.get(x.k);if(!old||x.score>old.score)mb.set(x.k,{...x,from:q})}let best=null;for(const[k,a]of ma){let b=mb.get(k);if(!b||k===rootA.k||k===rootB.k)continue;let sc=a.score+b.score+(a.src==='curated'?45:0)+(b.src==='curated'?45:0);if(!best||sc>best.sc)best={k,a,b,sc}}if(!best)return 0;let pa=byKey(best.a.from)||rootA,pb=byKey(best.b.from)||rootB,n=byKey(best.k)||node(best.a.l);n.a=n.b=true;edge(pa,n,best.a.r,'A',true,best.a.src);edge(pb,n,best.b.r,'B',true,best.b.src);S.A.seen.add(n.k);S.B.seen.add(n.k);if(!S.A.queue.includes(n.k))S.A.queue.push(n.k);if(!S.B.queue.includes(n.k))S.B.queue.push(n.k);mark(n,true,{kind:'explicit intersection',confidence:'Strong',why:`Both sides independently reach ${n.l}.`});render();return 1}
function familyCounts(list){let m=new Map();for(const x of list){let f=x.fam||inferFamily(x.r,x.l);if(f)m.set(f,(m.get(f)||0)+1)}return m}function evidenceFor(h,list,root){let fam=familyCounts(list),score=0,reasons=[],direct=list.find(x=>x.k===h.k),matches=[];if(direct){score+=125;reasons.push(`${root.l} ${direct.r} ${h.l}`)}for(const f of h.f||[]){let n=fam.get(f)||0;if(n){score+=Math.min(42,14*n);reasons.push(`${n} nearby ${f} relation${n===1?'':'s'}`)}}let seen=new Set();for(const x of list.slice(0,65)){let txt=(' '+x.k+' '+x.l.toLowerCase()+' ');for(const term of h.terms||[])if(!seen.has(term)&&txt.includes(' '+term+' ')){seen.add(term);matches.push(x.l);score+=11}}let rk=' '+root.k+' ';for(const term of h.terms||[])if(rk.includes(' '+term+' ')){score+=20;reasons.push(`${root.l} itself matches ${term}`);break}if(matches.length)reasons.push('nearby concepts: '+matches.slice(0,4).join(', '));return{score,direct,reasons}}
async function inferBridges(max=3){thinking(true,'Trying shared contexts, processes and patterns…');let[la,lb]=await Promise.all([concepts(rootA.k),concepts(rootB.k)]),candidates=[];for(const h of HUBS){if(h.k===rootA.k||h.k===rootB.k)continue;let a=evidenceFor(h,la,rootA),b=evidenceFor(h,lb,rootB);if(a.score<26||b.score<26)continue;let generic=['system','interaction','process'].includes(h.k);let sc=h.base+Math.min(a.score,b.score)*1.7+(a.score+b.score)*.35-(generic?18:0);candidates.push({h,a,b,sc})}candidates.sort((x,y)=>y.sc-x.sc);if(!candidates.length)return 0;let picked=[],used=new Set();for(const c of candidates){if(used.has(c.h.k))continue;if(picked.length&&c.sc<picked[0].sc-58)break;picked.push(c);used.add(c.h.k);if(picked.length>=max)break}let added=0;for(const c of picked){let h=c.h,n=byKey(h.k)||node(h.l),confidence=(c.a.direct&&c.b.direct)?'Strong':c.sc>=245?'Moderate':'Exploratory';let meta={kind:h.type,confidence,why:`${rootA.l}: ${c.a.reasons[0]||'related evidence'}. ${rootB.l}: ${c.b.reasons[0]||'related evidence'}.`,score:Math.round(c.sc)};n.a=n.b=true;let ra=c.a.direct?.r||h.rel,rb=c.b.direct?.r||h.rel;edge(rootA,n,ra,'A',true,c.a.direct?'explicit':'inferred',{kind:c.a.direct?'explicit':'inferred',confidence,evidence:c.a.reasons});edge(rootB,n,rb,'B',true,c.b.direct?'explicit':'inferred',{kind:c.b.direct?'explicit':'inferred',confidence,evidence:c.b.reasons});S.A.seen.add(n.k);S.B.seen.add(n.k);if(!S.A.queue.includes(n.k))S.A.queue.push(n.k);if(!S.B.queue.includes(n.k))S.B.queue.push(n.k);mark(n,added===0,meta);added++}render();return added}
async function bridge(){if(!rootA||!rootB){toast('Add two ideas first');return}let before=bridgeCount;$('#bridge').disabled=true;try{if(await deepCommon()){ui('Strong bridge found');explain();return}thinking(true,'Expanding both sides…');for(let i=0;i<3;i++){await expand('A',8);await expand('B',8)}if(await deepCommon()){ui('Strong bridge found');explain();return}let n=await inferBridges(3);if(n){ui(`${n} higher-level bridge${n===1?'':'s'} found`);explain();setTimeout(fitGraph,250)}else{ui('No defensible bridge yet');toast('No strong bridge found — try Auto-grow for more territory.')}}finally{$('#bridge').disabled=false;thinking(false);if(bridgeCount===before)render()}}
function neigh(id){return edges.map(e=>{let s=e.source?.id||e.source,t=e.target?.id||e.target;return s===id?t:t===id?s:null}).filter(Boolean)}function path(a,b){let q=[[a.id,[a.id]]],seen=new Set([a.id]);while(q.length){let[cur,p]=q.shift();if(cur===b.id)return p.map(byId);for(const nx of neigh(cur))if(!seen.has(nx)){seen.add(nx);q.push([nx,[...p,nx]])}}return null}function eb(a,b){return edges.find(e=>{let s=e.source?.id||e.source,t=e.target?.id||e.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)})}function explain(){if(!rootA||!rootB){toast('Add two ideas first');return}let p=path(rootA,rootB),h=`<h2>${rootA.l} ↔ ${rootB.l}</h2>`;if(!p)h+=`<div class="box"><strong>Still separate</strong><p>${round} direct-growth rounds so far. Find bridge will also try shared contexts, processes, structures, functions, patterns, signals and softer analogies.</p></div>`;else{let z='',soft=false;for(let i=0;i<p.length-1;i++){let e=eb(p[i],p[i+1]);if(e?.src==='inferred')soft=true;z+=`<li><b>${p[i].l}</b> — ${e?.rel||'connects conceptually to'} → <b>${p[i+1].l}</b>${e?.src==='inferred'?' <em>(exploratory)</em>':''}</li>`}h+=`<div class="box"><strong>${soft?'Higher-level conceptual bridge':'Explicit conceptual bridge found'}</strong><ul>${z}</ul></div>`;let bn=p.find(n=>n.meta?.why);if(bn)h+=`<div class="box"><strong>${bn.meta.confidence||'Conceptual'} · ${bn.meta.kind||'bridge'}</strong><p>${bn.meta.why}</p></div>`}h+=`<div class="box"><p>Direct edges come from curated relationships or ConceptNet. When direct paths fail, dashed bridge edges are evidence-based higher-level inferences rather than word similarity; they are labeled exploratory or moderate instead of being presented as hard facts.</p></div>`;$('#rb').innerHTML=h;$('#reader').classList.add('open')}
let svg=d3.select('#svg'),g=svg.append('g'),lg=g.append('g'),eg=g.append('g'),ng=g.append('g');const zoom=d3.zoom().scaleExtent([.015,40]).on('zoom',e=>{g.attr('transform',e.transform);$('#zoomPct').textContent=Math.round(e.transform.k*100)+'%'});svg.call(zoom);let sim=d3.forceSimulation().force('link',d3.forceLink().id(d=>d.id).distance(d=>d.bridge?116:92).strength(d=>d.bridge?.5:.35)).force('charge',d3.forceManyBody().strength(-245)).force('collision',d3.forceCollide(d=>d.bridge?18:13)).alphaDecay(.033).velocityDecay(.35);function fill(n){return n.bridge?'#c6a7ff':side(n)==='A'?'#76e2d8':side(n)==='B'?'#d8c985':'#9cb1c9'}function forces(){let w=$('#stage').clientWidth,h=$('#stage').clientHeight;sim.force('x',d3.forceX(d=>side(d)==='A'?w*.28:side(d)==='B'?w*.72:w*.5).strength(d=>d.bridge?.045:.018)).force('y',d3.forceY(h*.5).strength(.012))}function render(){forces();let A=lg.selectAll('line').data(edges,d=>`${d.source?.id||d.source}-${d.target?.id||d.target}`);A.exit().remove();A=A.enter().append('line').merge(A).attr('stroke-width',d=>d.bridge?1.9:1.05).attr('class',d=>'link'+(d.bridge?' bridge':'')+(d.src==='inferred'?' inferred':''));let E=eg.selectAll('text').data(edges,d=>`${d.source?.id||d.source}-${d.target?.id||d.target}`);E.exit().remove();E=E.enter().append('text').attr('class','edgeText').merge(E).text(d=>d.rel);let N=ng.selectAll('g').data(nodes,d=>d.id);N.exit().remove();let en=N.enter().append('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.18).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));en.append('circle');en.append('text').attr('x',11).attr('y',3);en.on('click',(e,d)=>{e.stopPropagation();$('#tag').textContent=d.bridge?(d.meta?.confidence?d.meta.confidence+' bridge':'bridge concept'):side(d)==='A'?'A territory':'B territory';$('#ct').textContent=d.l;if(d.meta?.why){$('#cd').textContent=d.meta.why;$('#card').class $('#add').onclick=()=>{let v=$('#q').value.trim();if(v){$('#q').value='';addThing(v)}};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#add').click()}});$('#auto').onclick=toggle;$('#bridge').onclick=bridge;$('#explain').onclick=explain;$('#fit').onclick=fitGraph;$('#zp').onclick=()=>svg.transition().duration(160).call(zoom.scaleBy,1.55);$('#zm').onclick=()=>svg.transition().duration(160).call(zoom.scaleBy,1/1.55);$('#cx').onclick=()=>$('#card').classList.remove('open');$('#rx').onclick=()=>$('#reader').classList.remove('open');$('#reset').onclick=()=>{auto=false;token++;nodes=[];edges=[];rootA=rootB=null;round=bridgeCount=stalls=0;cache.clear();for(const s of ['A','B']){S[s].seen=new Set();S[s].queue=[];S[s].expanded=new Set()}$('#auto').classList.remove('on');$('#auto').textContent='Auto-grow: off';$('#card').classList.remove('open');lg.selectAll('*').remove();eg.selectAll('*').remove();ng.selectAll('*').remove();svg.call(zoom.transform,d3.zoomIdentity);render();ui('Ready')};function vv(){document.documentElement.style.setProperty('--h',Math.round(window.visualViewport?.height||innerHeight)+'px');requestAnimationFrame(resize)}window.visualViewport?.addEventListener('resize',vv);window.visualViewport?.addEventListener('scroll',vv);addEventListener('resize',vv);vv();resize();render();ui('Ready');
