name: Room brain cutover via diagnostic slot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-private-model-diagnostic.yml'

permissions:
  actions: write
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop old Room runner and dispatch current Room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run cancel 32871228038 --repo "$GITHUB_REPOSITORY"
          for attempt in 1 2 3 4 5; do
            if gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto; then
              echo "new-room-dispatched"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
