name: The Room Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/room_bare_label_repair_once.py'

permissions:
  contents: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push'
        with:
          ref: main
          fetch-depth: 2

      - name: Apply bare move-label repair
        if: github.event_name == 'push'
        run: python3 scripts/room_bare_label_repair_once.py

      - name: Restart The Room pulse only if it stopped
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          active="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow sarah-society-pulse.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting")] | length')"

          echo "Active Room pulse runs: $active"
          if [ "$active" = "0" ]; then
            echo "The Room pulse is stopped; starting a new one"
            gh workflow run sarah-society-pulse.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          else
            echo "The Room pulse is already alive"
          fi
