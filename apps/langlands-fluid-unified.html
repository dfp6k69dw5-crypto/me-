<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Langlands Fluid v72</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#aaa;font:13px monospace}#boot{position:fixed;inset:0;display:grid;place-items:center}</style></head><body><div id="boot">loading fluid field…</div><script>(async()=>{try{const ps=[];for(let i=0;i<4;i++){const r=await fetch(`langlands-fluid-v72-payload/part${i}.txt?v=72`,{cache:'no-store'});if(!r.ok)throw Error('payload '+i+' failed');ps.push((await r.text()).trim())}if(!('DecompressionStream'in window))throw Error('Please update your browser.');const b=Uint8Array.from(atob(ps.join('')),c=>c.charCodeAt(0));const html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='Unable to start: '+e.message}})();</script></body></html>
