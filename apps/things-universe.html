<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Things Universe</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><style>
:root{--bg:#071018;--p:#101a28;--l:#26384f;--t:#eef4ff;--m:#91a2ba;--thing:#76e2d8;--bridge:#d8c985;--edge:#6f819f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:radial-gradient(900px 600px at 0 -10%,#18304c,transparent 58%),radial-gradient(900px 650px at 100% 100%,#1b1530,transparent 55%),var(--bg)}button,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr}.top{padding:max(10px,env(safe-area-inset-top)) 10px 9px;background:rgba(7,16,24,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}.r{display:flex;align-items:center;gap:7px;min-width:0}.brand{min-width:0;margin-right:auto}.ey{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--bridge)}h1{font-size:20px;line-height:1;margin:4px 0 0;letter-spacing:-.04em}.search{margin-top:8px;display:flex;gap:7px}.search input{flex:1;min-width:0;border:1px solid var(--l);border-radius:14px;background:#0e1725;color:var(--t);padding:10px 12px;outline:0}.btn{border:1px solid var(--l);border-radius:12px;background:#111b2a;color:var(--t);padding:9px 10px;white-space:nowrap}.btn.on{color:var(--thing);border-color:#477679}.primary{background:linear-gradient(135deg,#31506f,#20354f);font-weight:800}.tools{display:flex;gap:7px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.pair{margin-top:7px;font-size:10px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pair b{color:var(--t)}.stage{position:relative;min-height:0;overflow:hidden}svg{width:100%;height:100%;display:block;touch-action:none}.link{stroke:var(--edge);stroke-opacity:.48}.node text{font-size:10px;fill:#edf4ff;paint-order:stroke;stroke:#071018;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node circle{stroke:rgba(255,255,255,.35);stroke-width:1}.edgeText{font-size:8px;fill:#a9b7cb;paint-order:stroke;stroke:#071018;stroke-width:3px;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.empty div{max-width:430px;text-align:center;padding:24px;color:var(--m);line-height:1.45}.empty b{display:block;color:var(--t);font-size:28px;letter-spacing:-.04em;margin-bottom:7px}.card{position:absolute;left:10px;right:10px;top:10px;z-index:20;display:none;background:rgba(15,25,39,.97);border:1px solid var(--l);border-radius:18px;padding:14px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.card.open{display:block}.card h2{margin:5px 30px 6px 0;font-size:21px;letter-spacing:-.035em}.card p{margin:0;color:#c6d2e4;font-size:12px;line-height:1.45}.tag{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:var(--bridge)}.close{position:absolute;right:9px;top:7px;border:0;background:none;color:var(--m);font-size:24px}.cardBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.reader{position:fixed;inset:0;z-index:50;display:none;background:linear-gradient(180deg,#0b1320,#071018);overflow:hidden}.reader.open{display:flex;flex-direction:column}.rh{display:flex;align-items:center;gap:8px;padding:max(13px,env(safe-area-inset-top)) 15px 12px;border-bottom:1px solid rgba(255,255,255,.08)}.rh b{font-size:16px}.rh .btn{margin-left:auto}.rb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:17px 15px max(170px,calc(env(safe-area-inset-bottom) + 140px))}.rb h2{font-size:30px;line-height:1.02;letter-spacing:-.05em;margin:0 0 14px}.box{border:1px solid rgba(255,255,255,.08);border-radius:17px;background:rgba(255,255,255,.025);padding:13px;margin-bottom:11px}.box strong{display:block;margin-bottom:5px}.box p,.box li{font-size:13px;line-height:1.5;color:#d0dbea}.box ul{padding-left:18px;margin:7px 0 0}.hud{position:absolute;left:9px;bottom:calc(9px + env(safe-area-inset-bottom));z-index:5;padding:7px 9px;border-radius:999px;background:rgba(15,25,39,.82);border:1px solid rgba(255,255,255,.06);font-size:9px;color:var(--m);pointer-events:none}.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;z-index:30;max-width:calc(100% - 20px);background:#152235;border:1px solid var(--l);border-radius:999px;padding:8px 11px;font-size:10px;text-align:center}.toast.show{display:block}@media(max-width:620px){h1{font-size:19px}.hud{display:none}}
</style></head><body><div class="app"><header class="top"><div class="r"><div class="brand"><div class="ey">actual things · visible relationships</div><h1>Things Universe</h1></div><button class="btn" id="fit">Fit</button><button class="btn" id="reset">Reset</button></div><div class="search"><input id="q" placeholder="Type a thing — Finnish, prime numbers, birdsong, trees…"><button class="btn primary" id="add">Add thing</button></div><div class="tools"><button class="btn" id="auto">Auto-grow: off</button><button class="btn" id="compare">Explain A ↔ B</button><button class="btn" id="bridge">Interesting bridge</button></div><div class="pair" id="pair">A: <b>none</b> · B: <b>none</b> — tap a node to choose.</div></header><main class="stage" id="stage"><svg id="svg"></svg><div class="empty" id="empty"><div><b>Start with a thing.</b>The circles are recognizable things and concepts. Grow any node to discover more things connected to it.</div></div><div class="card" id="card"><button class="close" id="x">×</button><span class="tag" id="tag"></span><h2 id="title"></h2><p id="desc"></p><div class="cardBtns"><button class="btn" id="a">Set A</button><button class="btn" id="b">Set B</button><button class="btn" id="grow">Grow from here</button></div></div><div class="reader" id="reader"><div class="rh"><b>Relationship</b><button class="btn" id="rx">Close</button></div><div class="rb" id="rb"></div></div><div class="toast" id="toast"></div><div class="hud"><span id="status">Ready</span> · <span id="count">0 nodes</span></div></main></div><script>
'use strict';
const $=s=>document.querySelector(s), API='https://en.wikipedia.org/w/api.php?origin=*&format=json';
let nodes=[],links=[],selected=null,A=null,B=null,timer=null; const STORE='things-universe-v1';
const bad=/^(help|portal|template|category|wikipedia|special|talk|list of|outline of|index of|main page)/i;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function id(){return 'n'+Math.random().toString(36).slice(2,10)}
function save(){try{localStorage.setItem(STORE,JSON.stringify({nodes:nodes.map(({x,y,vx,vy,fx,fy,...n})=>n),links:links.map(l=>({source:l.source.id||l.source,target:l.target.id||l.target,label:l.label})),A:A?.id||null,B:B?.id||null}))}catch{}}
function restore(){try{let s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return;nodes=s.nodes||[];links=s.links||[];A=nodes.find(n=>n.id===s.A)||null;B=nodes.find(n=>n.id===s.B)||null}catch{}}
function status(s){$('#status').textContent=s;$('#count').textContent=`${nodes.length} nodes`;$('#empty').style.display=nodes.length?'none':'grid';save()}
function nodeByTitle(t){return nodes.find(n=>n.title.toLowerCase()===t.toLowerCase())}
function addNode(o){let n=nodeByTitle(o.title);if(n){if(o.desc&&!n.desc)n.desc=o.desc;return n}n={id:id(),title:o.title,desc:o.desc||'',kind:o.kind||'thing',categories:o.categories||[],expanded:false};nodes.push(n);return n}
function addLink(a,b,label='links to'){if(!a||!b||a.id===b.id)return;let e=links.find(l=>{let s=l.source.id||l.source,t=l.target.id||l.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)});if(!e)links.push({source:a.id,target:b.id,label});}
async function wikiSearch(term){let u=`${API}&action=query&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrlimit=1&prop=extracts|categories&exintro=1&explaintext=1&cllimit=20`;let j=await fetch(u).then(r=>r.json()),p=Object.values(j.query?.pages||{})[0];if(!p)throw Error('No matching thing found');return{title:p.title,desc:(p.extract||'').slice(0,650),categories:(p.categories||[]).map(c=>c.title.replace(/^Category:/,''))}}
async function wikiLinks(title){let u=`${API}&action=query&titles=${encodeURIComponent(title)}&prop=links|categories&plnamespace=0&pllimit=60&cllimit=50`;let j=await fetch(u).then(r=>r.json()),p=Object.values(j.query?.pages||{})[0];let cats=(p?.categories||[]).map(c=>c.title.replace(/^Category:/,''));let arr=(p?.links||[]).map(x=>x.title).filter(x=>!bad.test(x)&&x.length<55);return{links:arr,categories:cats}}
async function summaries(titles){if(!titles.length)return[];let u=`${API}&action=query&titles=${encodeURIComponent(titles.join('|'))}&prop=extracts&exintro=1&explaintext=1`;let j=await fetch(u).then(r=>r.json());return Object.values(j.query?.pages||{}).map(p=>({title:p.title,desc:(p.extract||'').slice(0,330)}))}
function sharedCategory(a,b){let Aset=new Set((a.categories||[]).map(x=>x.toLowerCase()));return(b.categories||[]).find(x=>Aset.has(x.toLowerCase()))}
async function addThing(term){if(!term.trim())return;status('Looking up thing…');try{let o=await wikiSearch(term.trim()),n=addNode(o);update();await growNode(n,true);fitGraph();status(`Added ${n.title}`)}catch(e){toast(e.message);status('Ready')}}
async function growNode(n,small=false){if(!n||n.loading)return;n.loading=true;status(`Growing from ${n.title}…`);try{let data=await wikiLinks(n.title);n.categories=data.categories||n.categories;let pool=data.links.sort(()=>Math.random()-.5).slice(0,small?7:10),sum=await summaries(pool);for(let o of sum){let m=addNode(o);let shared=sharedCategory(n,m);addLink(n,m,shared?`shared: ${shared}`:'article link')}n.expanded=true;update();status(`Grew from ${n.title}`)}catch(e){toast('Could not grow that node');status('Ready')}finally{n.loading=false}}
function pairText(){$('#pair').innerHTML=`A: <b>${esc(A?.title||'none')}</b> · B: <b>${esc(B?.title||'none')}</b> — tap a node to choose.`;save()}
function setPair(which,n){if(which==='A')A=n;else B=n;pairText()}
function neighbors(id){return links.filter(l=>(l.source.id||l.source)===id||(l.target.id||l.target)===id).map(l=>(l.source.id||l.source)===id?(l.target.id||l.target):(l.source.id||l.source))}
function path(a,b){let q=[[a.id,[a.id]]],seen=new Set([a.id]);while(q.length){let[cur,p]=q.shift();if(cur===b.id)return p.map(x=>nodes.find(n=>n.id===x));for(let nx of neighbors(cur))if(!seen.has(nx)){seen.add(nx);q.push([nx,[...p,nx]])}}return null}
function edge(a,b){return links.find(l=>{let s=l.source.id||l.source,t=l.target.id||l.target;return(s===a.id&&t===b.id)||(s===b.id&&t===a.id)})}
function openReader(html){$('#rb').innerHTML=html;$('#reader').classList.add('open')}
function explain(a,b){if(!a||!b){toast('Choose A and B first');return}let p=path(a,b);if(!p){openReader(`<h2>${esc(a.title)} ↔ ${esc(b.title)}</h2><div class="box"><strong>No visible path yet</strong><p>Grow one or both nodes. The app only shows relationships it has actually discovered.</p></div>`);return}let steps=[];for(let i=0;i<p.length-1;i++){let e=edge(p[i],p[i+1]);steps.push(`<li><b>${esc(p[i].title)}</b> — ${esc(e?.label||'connected')} → <b>${esc(p[i+1].title)}</b></li>`)}let common=sharedCategory(a,b);openReader(`<h2>${esc(a.title)} ↔ ${esc(b.title)}</h2><div class="box"><strong>What connects them</strong><p>${common?`They share the Wikipedia category <b>${esc(common)}</b>. `:''}The graph currently contains a ${p.length-1}-step path between them.</p></div><div class="box"><strong>Visible chain of things</strong><ul>${steps.join('')}</ul></div><div class="box"><strong>Interpretation</strong><p>This is a navigational relationship, not a claim that one thing causes another. The useful part is the chain: it shows which recognizable things bridge the two ideas.</p></div>`)}
function interesting(){if(nodes.length<3){toast('Grow the universe a little first');return}let best=null;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let p=path(nodes[i],nodes[j]);if(!p||p.length<4||p.length>7)continue;let score=p.length+(sharedCategory(nodes[i],nodes[j])?0:3);if(!best||score>best.score)best={a:nodes[i],b:nodes[j],score}}if(!best){toast('No unusual bridge yet');return}setPair('A',best.a);setPair('B',best.b);explain(best.a,best.b)}
let svg=d3.select('#svg'),g=svg.append('g'),lg=g.append('g'),eg=g.append('g'),ng=g.append('g');
let zoom=d3.zoom().scaleExtent([.03,30]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);let sim=d3.forceSimulation().force('link',d3.forceLink().id(d=>d.id).distance(95).strength(.35)).force('charge',d3.forceManyBody().strength(-240)).force('collision',d3.forceCollide(20));
function update(){let w=$('#stage').clientWidth,h=$('#stage').clientHeight;sim.force('center',d3.forceCenter(w/2,h/2));let L=lg.selectAll('line').data(links,d=>`${d.source.id||d.source}-${d.target.id||d.target}`);L.exit().remove();L=L.enter().append('line').attr('class','link').attr('stroke-width',1.3).merge(L);let E=eg.selectAll('text').data(links,d=>`${d.source.id||d.source}-${d.target.id||d.target}`);E.exit().remove();E=E.enter().append('text').attr('class','edgeText').text(d=>d.label).merge(E);let N=ng.selectAll('g').data(nodes,d=>d.id);N.exit().remove();let en=N.enter().append('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));en.append('circle').attr('r',d=>d.expanded?11:9).attr('fill',d=>d.expanded?'#76e2d8':'#d8c985');en.append('text').attr('x',13).attr('y',4).text(d=>d.title.length>32?d.title.slice(0,30)+'…':d.title);en.on('click',(e,d)=>{selected=d;$('#tag').textContent=d.expanded?'expanded thing':'thing';$('#title').textContent=d.title;$('#desc').textContent=d.desc||'A thing in the current relationship universe.';$('#card').classList.add('open')});N=en.merge(N);sim.nodes(nodes).on('tick',()=>{L.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);E.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);N.attr('transform',d=>`translate(${d.x},${d.y})`)});sim.force('link').links(links);sim.alpha(.8).restart();status('Ready')}
function fitGraph(){if(!nodes.length)return;let b=g.node().getBBox(),w=$('#stage').clientWidth,h=$('#stage').clientHeight,k=Math.min(2,.88/Math.max(b.width/w,b.height/h,.001)),x=w/2-k*(b.x+b.width/2),y=h/2-k*(b.y+b.height/2);svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(x,y).scale(k))}
function toggleAuto(){if(timer){clearInterval(timer);timer=null;$('#auto').textContent='Auto-grow: off';$('#auto').classList.remove('on');return}$('#auto').textContent='Auto-grow: on';$('#auto').classList.add('on');timer=setInterval(()=>{let c=nodes.filter(n=>!n.loading).sort((a,b)=>(a.expanded?1:0)-(b.expanded?1:0)||neighbors(a.id).length-neighbors(b.id).length);if(c[0])growNode(c[0],false)},7000)}
$('#add').onclick=()=>{let v=$('#q').value;$('#q').value='';addThing(v)};$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#add').click()}});$('#x').onclick=()=>$('#card').classList.remove('open');$('#a').onclick=()=>selected&&setPair('A',selected);$('#b').onclick=()=>selected&&setPair('B',selected);$('#grow').onclick=()=>selected&&growNode(selected,false);$('#compare').onclick=()=>explain(A,B);$('#bridge').onclick=interesting;$('#fit').onclick=fitGraph;$('#auto').onclick=toggleAuto;$('#rx').onclick=()=>$('#reader').classList.remove('open');$('#reset').onclick=()=>{if(timer)toggleAuto();localStorage.removeItem(STORE);nodes=[];links=[];A=B=selected=null;$('#card').classList.remove('open');pairText();update();status('Reset')};window.addEventListener('resize',()=>update());restore();pairText();update();if(nodes.length)setTimeout(fitGraph,250);
</script></body></html>
