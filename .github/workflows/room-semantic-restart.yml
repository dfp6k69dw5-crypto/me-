name: Room semantic restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-semantic-restart.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: the-room-world-main
  cancel-in-progress: true

jobs:
  restart:
    if: contains(github.event.head_commit.message, 'Activate semantic topic sanitizer')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto

# Armed after creation so GitHub sees this workflow before the triggering push.
