name: Sarah Society

on:
  workflow_dispatch:
    inputs:
      entity:
        description: Who gets the next three-node turn?
        required: true
        default: auto
        type: choice
        options:
          - auto
          - sarah
          - mara
          - owen
          - jules
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: sarah-society-world
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      entity: ${{ steps.pick.outputs.entity }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        name: Choose who is active
        env:
          FORCED_ENTITY: ${{ github.event.inputs.entity || 'auto' }}
        run: python3 scripts/society_select.py

  think:
    needs: select
    if: needs.select.outputs.entity != 'rest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load the brain from this GitHub repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view society-brain-v1 --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p society_model runtime
          gh release download society-brain-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'society-brain-q4_0.gguf' \
            --dir society_model
          gh release download society-brain-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'llama-runtime-linux-x64.tar.gz' \
            --dir runtime
          tar -xzf runtime/llama-runtime-linux-x64.tar.gz -C runtime
          cli="$(find runtime -type f -name 'llama-cli' | head -n 1)"
          test -n "$cli"
          chmod +x "$cli"
          echo "LLAMA_CLI=$GITHUB_WORKSPACE/$cli" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/$(dirname "$cli")" >> "$GITHUB_ENV"
          echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  society_model/society-brain-q4_0.gguf' | sha256sum -c -

      - name: Three independent nodes think
        env:
          ENTITY_ID: ${{ needs.select.outputs.entity }}
          SOCIETY_MODEL_PATH: ${{ github.workspace }}/society_model/society-brain-q4_0.gguf
        run: |
          set +e
          pids=()
          for n in 0 1 2; do
            (NODE_ID="$n" python3 scripts/society_node.py) >"node-$n.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for n in 0 1 2; do
            if ! wait "${pids[$n]}"; then status=1; fi
            echo "===== node $n ====="
            cat "node-$n.log"
          done
          exit "$status"

      - name: Resolve three nodes into one entity turn
        env:
          ENTITY_ID: ${{ needs.select.outputs.entity }}
        run: python3 scripts/society_commit.py

      - name: Commit the continuing world
        run: |
          git config user.name "sarah-society"
          git config user.email "actions@users.noreply.github.com"
          git add society
          git commit -m "Society turn: ${{ needs.select.outputs.entity }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
