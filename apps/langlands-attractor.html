<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Langlands Attractor — Responsive Engine</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{min-height:44px;border:1px solid #343434;border-radius:11px;background:#151515;color:#eee;font-weight:750;padding:9px 10px}
button.primary{background:#eee;color:#050505;border-color:#eee}.app{max-width:960px;margin:auto;min-height:100svh;background:#000}
.stage{position:sticky;top:0;height:46svh;min-height:310px;background:#000;border-bottom:1px solid #242424;z-index:20}
canvas{width:100%;height:100%;display:block;background:#000;touch-action:none}
.hud{position:absolute;left:8px;top:max(8px,env(safe-area-inset-top));display:flex;gap:5px;flex-wrap:wrap;max-width:78%;pointer-events:none}
.chip{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #373737;background:rgba(0,0,0,.78);padding:5px 7px;border-radius:999px}
.focus{position:absolute;right:8px;top:max(8px,env(safe-area-inset-top))}
.panel{background:#0a0a0a}.sec{padding:12px;border-bottom:1px solid #252525}.title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}h1{margin:0;font-size:22px}.note,.status{font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8a8a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pointPresets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.pointPresets button{min-height:36px;font-size:11px;padding:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctl{background:#111;border:1px solid #222;border-radius:10px;padding:8px}.top{display:flex;justify-content:space-between;gap:8px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.route{color:#666;font:8.5px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;margin:3px 0 5px}input[type=range]{width:100%;accent-color:#eee;touch-action:pan-y}
.pointsCtl{background:#111;border:1px solid #292929;border-radius:11px;padding:10px;margin-top:9px}.pointsValue{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace}.progress{height:5px;background:#1d1d1d;border-radius:999px;overflow:hidden;margin-top:7px}.bar{height:100%;width:0;background:#ddd}
body.full{overflow:hidden}body.full .panel{display:none}body.full .stage{position:fixed;inset:0;width:100vw;height:100svh;z-index:99}
@media(min-width:760px){.actions{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud"><span class="chip" id="state">starting</span><span class="chip" id="meta">g4 · r6 · |Z|4</span><span class="chip" id="count">0 pts</span></div>
    <button class="focus" id="focus">Focus</button>
  </div>
  <div class="panel">
    <div class="sec">
      <div class="title"><h1>Langlands Attractor</h1><span class="note">responsive · up to 1,000,000</span></div>
      <div class="actions">
        <button class="primary" id="random">Random visible</button>
        <button id="mutate">Mutate</button>
        <button id="render">Render target</button>
        <button id="stop">Stop</button>
        <button id="reset">Reset</button>
      </div>
      <div class="pointsCtl">
        <div class="top"><span>Point target</span><span class="pointsValue" id="v_points">1,000,000</span></div>
        <input id="points" type="range" min="25000" max="1000000" step="25000" value="1000000">
        <div class="pointPresets"><button data-points="50000">50K</button><button data-points="200000">200K</button><button data-points="500000">500K</button><button data-points="1000000">1M</button></div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="status" id="msg" aria-live="polite">Sliders use fast previews. Render target only when you want the selected density.</div>
    </div>
    <div class="sec">
      <div class="title"><b>Strong movers</b><span class="note">wide mathematical ranges</span></div>
      <div class="grid" id="controls"></div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var seed=240909856,token=0,timer=0,W=0,H=0,acc=null,img=null,camera=null,targetPoints=1000000,TEST=location.search.indexOf('test=1')>=0;
var P={morph:1.55,xy:.65,yz:-.35,zx:.55,fm:.82,swirl:1.10,structure:.90,bif:.55,fold:.42,memory:.12,rank:6,center:4,genus:4,light:.72,dark:.52,clarity:.76,branches:1};
var DEFAULT=JSON.parse(JSON.stringify(P));
var specs=[
 ['morph','Morph power',.25,4.5,.01,'changes recurrence frequency + gain'],

function resize(){var r=cv.getBoundingClientRect(),d=Math.min(1.25,window.devicePixelRatio||1),nw=Math.max(320,Math.floor(r.width*d)),nh=Math.max(310,Math.floor(r.height*d));if(nw!==W||nh!==H){W=nw;H=nh;cv.width=W;cv.height=H;acc=new Float32Array(W*H);img=ctx.createImageData(W,H)}}
function stepper(branch,s0){s0=(s0==null?seed:s0);var R=rng(hash32(s0+branch*2654435761)),q=Math.max(1,Math.round(P.center)),rk=Math.max(1,Math.round(P.rank)),zp=TAU*(branch%q)/q,rp=TAU*(branch%rk)/rk;var x=(R()*2-1)*.35+Math.cos(zp)*.12,y=(R()*2-1)*.35+Math.sin(rp)*.12,z=(R()*2-1)*.24,w=(R()*2-1)*.24,px=x,py=y,pz=z,pw=w,t=0;

  t++;
  var th=Math.atan2(y,x),rad=Math.hypot(x,y)+1e-6;
  var genusF=.16*(P.genus-2),A=1.05+1.35*P.morph+.055*rk+genusF,B=1.28+1.05*P.morph+.035*q+.11*P.genus;
  var dual=P.fm*(.75*z-.55*w)+P.swirl*(.32*th+.18*Math.sin(t*.004+zp));

  var nz=Math.sin(.78*z+1.25*P.zx*zx+.48*P.structure*(x-y)+.34*centerWave+.28*P.fm*(x*w-y*z));
  var nw=Math.sin(.84*w+.38*P.fm*(x*w-y*z)+.34*rankWave+.25*P.swirl*(x+y));
  var fold=clamp(P.fold/2,0,1),lim=2.8-.55*fold;
  nx=lim*Math.tanh(nx/lim);ny=lim*Math.tanh(ny/lim);nz=1.8*Math.tanh(nz/1.8);nw=1.8*Math.tanh(nw/1.8);
  var mem=clamp(P.memory,0,.85);nx=(1-mem)*nx+mem*(x+.72*(x-px));ny=(1-mem)*ny+mem*(y+.72*(y-py));nz=(1-mem*.7)*nz+mem*.7*(z+.5*(z-pz));nw=(1-mem*.7)*nw+mem*.7*(w+.5*(w-pw));

  var proj=P.swirl*.42*z+P.fm*.25*w+P.bif*.12*Math.sin(rk*th),c=Math.cos(proj),s=Math.sin(proj);
  var qx=c*x-s*y+.42*P.structure*z+.18*P.zx*Math.sin(z*x*rk),qy=s*x+c*y+.34*P.structure*w+.18*P.xy*Math.sin(x*y*q);
  var cross=Math.abs(x*y+y*z+z*x),phase=Math.abs(Math.cos(rk*w+q*th*.2+dual));

}
function measure(s0){var B=Math.min(Math.max(1,Math.round(P.branches)),3),burn=260,steps=1000,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,grid=new Set(),valid=0;for(var b=0;b<B;b++){var st=stepper(b,s0);for(var i=0;i<burn+steps;i++){var p=st();if(i<burn||!Number.isFinite(p[0])||!Number.isFinite(p[1]))continue;valid++;minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);var gx=Math.floor(clamp((p[0]+4)/8,0,.999)*30),gy=Math.floor(clamp((p[1]+4)/8,0,.999)*30);grid.add(gx+','+gy)}}var w=maxx-minx,h=maxy-miny,occ=grid.size,ratio=(w>0&&h>0)?Math.min(w,h)/Math.max(w,h):0;var ok=valid>steps*.7&&w>.12&&h>.12&&w<12&&h<12&&occ>16&&ratio>.025;return{ok:ok,w:w,h:h,occ:occ,cx:(minx+maxx)/2,cy:(miny+maxy)/2,score:(ok?1000:0)+occ+ratio*100}}
function addPoint(x,y,a){var ix=(W*.5+(x-camera.cx)*camera.s)|0,iy=(H*.5-(y-camera.cy)*camera.s)|0;if(ix<1||iy<1||ix>=W-1||iy>=H-1)return;var i=iy*W+ix;acc[i]+=a;acc[i-1]+=.08*a;acc[i+1]+=.08*a}

async function render(mode){var my=++token;resize();var total=TEST?(mode==='full'?10000:5000):(mode==='full'?targetPoints:(mode==='drag'?24000:80000));$('state').textContent=mode==='full'?'rendering':'preview';$('count').textContent='0 / '+fmt(total);$('bar').style.width='0%';var m=measure(seed);if(!m.ok){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);$('state').textContent='recovering';$('msg').textContent='This state collapsed — recovering to a known visible state.';Object.assign(P,safe[0]);seed=240909856;sync();m=measure(seed);if(!m.ok){$('state').textContent='error';$('msg').textContent='Engine could not recover. Tap Reset.';return}}
 camera={cx:m.cx,cy:m.cy,s:Math.min(W,H)*.91/Math.max(m.w,m.h,.001)};acc.fill(0);var B=Math.max(1,Math.round(P.branches)),sts=[];for(var b=0;b<B;b++){var st=stepper(b);for(var k=0;k<500;k++)st();sts.push(st)}var chunk=mode==='full'?6000:2200,done=0;while(done<total){if(my!==token)return;var end=Math.min(total,done+chunk);for(;done<end;done++){var p=sts[done%B]();if(Number.isFinite(p[0])&&Number.isFinite(p[1]))addPoint(p[0],p[1],p[2])}if(done===total||done%(chunk*3)===0)raster();$('count').textContent=fmt(done)+' / '+fmt(total);$('bar').style.width=(done/total*100).toFixed(1)+'%';await new Promise(requestAnimationFrame)}$('state').textContent='ready';$('meta').textContent='g'+Math.round(P.genus)+' · r'+Math.round(P.rank)+' · |Z|'+Math.round(P.center);$('msg').textContent=(mode==='full'?'Full target rendered':'Preview rendered')+' · target '+fmt(targetPoints)+' points.'}
function sync(){specs.forEach(function(s){var k=s[0],el=$(k);if(el){el.value=P[k];$('v_'+k).textContent=(['rank','center','genus','branches'].indexOf(k)>=0?Math.round(P[k]):(+P[k]).toFixed(2))}});$('v_points').textContent=fmt(targetPoints)}
function buildControls(){specs.forEach(function(s){var k=s[0],lab=s[1],mn=s[2],mx=s[3],step=s[4],route=s[5],d=document.createElement('div');d.className='ctl';d.innerHTML='<div class="top"><span>'+lab+'</span><span id="v_'+k+'"></span></div><div class="route">'+route+'</div><input id="'+k+'" type="range" min="'+mn+'" max="'+mx+'" step="'+step+'">';$('controls').appendChild(d)});sync();specs.forEach(function(s){var k=s[0],el=$(k);el.addEventListener('input',function(){P[k]=+el.value;$('v_'+k).textContent=(['rank','center','genus','branches'].indexOf(k)>=0?Math.round(P[k]):(+P[k]).toFixed(2));clearTimeout(timer);timer=setTimeout(function(){render('drag')},55)});el.addEventListener('change',function(){P[k]=+el.value;clearTimeout(timer);render('preview')})})}
function jitterFrom(base,R){Object.assign(P,base);P.morph=clamp(P.morph+rand(R,-.55,.55),.25,4.5);P.xy=clamp(P.xy+rand(R,-.8,.8),-3,3);P.yz=clamp(P.yz+rand(R,-.8,.8),-3,3);P.zx=clamp(P.zx+rand(R,-.8,.8),-3,3);P.fm=clamp(P.fm+rand(R,-.45,.45),0,3);P.swirl=clamp(P.swirl+rand(R,-1.0,1.0),-5,5);P.structure=clamp(P.structure+rand(R,-.32,.32),0,2);P.bif=clamp(P.bif+rand(R,-.7,.7),-3,3);P.fold=clamp(P.fold+rand(R,-.3,.3),0,2);P.memory=clamp(P.memory+rand(R,-.12,.12),0,.85);P.rank=clamp(Math.round(P.rank+rand(R,-3,3)),1,24);P.center=clamp(Math.round(P.center+rand(R,-3,3)),1,20);P.genus=clamp(Math.round(P.genus+rand(R,-2,2)),2,12);P.branches=R()<.78?1:Math.min(3,Math.max(1,Math.round(P.branches+rand(R,-1,1))))}
