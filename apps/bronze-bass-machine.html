<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Deep Bass Machine</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#eee;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{margin:0;font-size:clamp(28px,8vw,54px);letter-spacing:.04em}.sub{color:#aaa;margin:6px 0 18px}.card{background:#13151a;border:1px solid #343741;border-radius:20px;padding:16px;margin:12px 0}.strike{width:min(70vw,330px);aspect-ratio:1;border-radius:50%;margin:18px auto;display:grid;place-items:center;user-select:none;touch-action:manipulation;border:1px solid #54545b;background:radial-gradient(circle at 38% 30%,#ffffff10 0 15%,transparent 35%),radial-gradient(circle,#34343a,#1e1f24 52%,#101115 74%);box-shadow:inset 0 0 70px #ffffff08,0 0 80px #00000055;font-size:28px;font-weight:800;letter-spacing:.14em}.strike.hit{animation:hit .45s}@keyframes hit{0%{transform:scale(.97);filter:brightness(1.45)}100%{transform:scale(1)}}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button,select{background:#17191f;color:#eee;border:1px solid #454954;border-radius:12px;padding:11px 13px;font:inherit}button{cursor:pointer}.status{text-align:center;color:#b9b9c2;font-size:13px;min-height:20px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ctl{background:#0d0f13;border:1px solid #2a2d34;border-radius:12px;padding:10px}.ctl label{display:flex;justify-content:space-between;font-size:12px;color:#bbb}.ctl output{color:#ddd}input{width:100%;accent-color:#888b96}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}.key{padding:10px 2px;text-align:center;background:#101217;border:1px solid #30333b;border-radius:10px;touch-action:manipulation}.key b{display:block}@media(max-width:520px){.controls{grid-template-columns:1fr 1fr}.keys{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><h1>DEEP BASS MACHINE</h1><div class="sub">Huge soft strike → deep resonant body → pleasant harmonic hum. No metallic shimmer.</div><section class="card"><div id="strike" class="strike">STRIKE</div><div id="status" class="status">Tap STRIKE to start audio</div><div class="row"><button id="dn">−</button><select id="note"></select><button id="up">+</button><button id="stop">STOP</button></div><div id="keys" class="keys"></div></section><section class="card"><div class="row"><button data-p="choir">DEEP CHOIR</button><button data-p="monolith">MONOLITH</button><button data-p="wind">DARK WIND</button><button data-p="savage">SAVAGE BODY</button></div><div id="controls" class="controls"></div></section></main><script>
(()=>{const AC=window.AudioContext||window.webkitAudioContext;let c,master,noise,voices=[];const S={body:[0,1,.78],strike:[0,1,.58],weight:[0,1,.9],hum:[0,1,.72],bloom:[0,1,.62],grind:[0,1,.2],damp:[0,1,.3],size:[1,30,24]};const root=document.getElementById('controls');for(const[k,v]of Object.entries(S)){let d=document.createElement('div');d.className='ctl';d.innerHTML=`<label>${k.toUpperCase()}<output></output></label><input id="${k}" type="range" min="${v[0]}" max="${v[1]}" step="${k==='size'?'.1':'.01'}" value="${v[2]}">`;root.appendChild(d);let i=d.querySelector('input'),o=d.querySelector('output');let f=()=>o.value=k==='size'?(+i.value).toFixed(1)+' m':Math.round(+i.value*100)+'%';f();i.oninput=()=>{v[2]=+i.value;f()}}
const N=[];for(let m=24;m<=47;m++){let a=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];N.push({n:a[m%12]+(Math.floor(m/12)-1),f:440*2**((m-69)/12)})}let sel=document.getElementById('note');N.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x.n;sel.appendChild(o)});sel.value=12;dn.onclick=()=>sel.value=Math.max(0,+sel.value-1);up.onclick=()=>sel.value=Math.min(N.length-1,+sel.value+1);const keys=document.getElementById('keys');N.slice(0,12).forEach((x,i)=>{let b=document.createElement('div');b.className='key';b.innerHTML=`<b>${x.n}</b>${x.f.toFixed(1)} Hz`;b.onpointerdown=e=>play(x.f,.75,e);keys.appendChild(b)});
function mkNoise(){noise=c.createBuffer(1,c.sampleRate*.4,c.sampleRate);let d=noise.getChannelData(0),b=0;for(let i=0;i<d.length;i++){b=.985*b+(Math.random()*2-1)*.015;d[i]=b*3.2}}
async function init(){if(!AC)throw new Error('Web Audio is not available');if(!c){c=new AC;master=c.createGain();master.gain.value=.78;let lim=c.createDynamicsCompressor();lim.threshold.value=-11;lim.knee.value=12;lim.ratio.value=10;lim.attack.value=.004;lim.release.value=.24;master.connect(lim);lim.connect(c.destination);mkNoise()}if(c.state!=='running')await c.resume();status.textContent=c.state==='running'?'Audio ready':'Tap again to unlock audio'}
function env(g,t,a,p,r){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+r)}function osc(f,type='sine'){let o=c.createOscillator();o.type=type;o.frequency.value=f;return o}function pan(i){let p=c.createStereoPanner();p.pan.value=i<3?0:Math.sin(i*1.37)*.28;return p}
const R=[1,1.5,2,2.5,3,4,5,6,8,10,12,15];
async function play(f,vel=.75,e){e?.preventDefault();try{await init();const t=c.currentTime+.015,B=S.body[2],W=S.weight[2],H=S.hum[2],BL=S.bloom[2],D=S.damp[2],Z=(S.size[2]-1)/29,G=S.grind[2],K=S.strike[2];let bus=c.createGain(),bodyBus=c.createGain(),humBus=c.createGain(),coreBus=c.createGain();bodyBus.gain.value=.28+.28*B;humBus.gain.value=.22+.28*H;coreBus.gain.value=.5+.3*W;bodyBus.connect(bus);humBus.connect(bus);coreBus.connect(bus);let lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900+1700*B;bodyBus.connect(lp);let sh=c.createWaveShaper(),n=1024,cv=new Float32Array(n);for(let i=0;i<n;i++){let x=i*2/n-1,a=1.5+G*8;cv[i]=(1+a)*x/(1+a*Math.abs(x))}sh.curve=cv;lp.connect(sh);let gg=c.createGain();gg.gain.value=.05+.22*G;sh.connect(gg);gg.connect(bus);bus.connect(master);
let th=osc(f*.5),tg=c.createGain();th.connect(tg);tg.connect(coreBus);env(tg,t,.004,.3*vel*(.7+.3*K),.22+.18*Z);th.start(t);th.stop(t+.8);
let ns=c.createBufferSource();ns.buffer=noise;let nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=280+950*K;let ng=c.createGain();ns.connect(nf);nf.connect(ng);ng.connect(bodyBus);env(ng,t,.002,.09+.08*K,.08+.16*K);ns.start(t);ns.stop(t+.45);
let core=osc(f),cG=c.createGain();core.connect(cG);cG.connect(coreBus);env(cG,t,.014,.25*vel*(.6+.4*W),7+12*Z+7*H);core.start(t);core.stop(t+30);let V=[core,th];R.forEach((r,i)=>{let F=f*r;if(F>4200)return;let h=i/(R.length-1),o=osc(F,i<4?'sine':'triangle'),g=c.createGain(),p=pan(i);o.connect(g);g.connect(p);p.connect(bodyBus);let spec=Math.exp(-i*.42),amp=.16*vel*spec*(.62+.5*B)*(1-.72*h);let decay=Math.max(.55,(4+11*Z)*(1-h*.58)*(1-.72*D));env(g,t,.004+.012*h,amp,decay);o.start(t);o.stop(t+decay+.6);V.push(o)});
[[1,.18,0],[2,.085,.24],[3,.055,.7],[5,.035,1.2]].forEach(([m,a,delay],i)=>{let o=osc(f*m,i?'triangle':'sine'),g=c.createGain(),p=pan(i);o.connect(g);g.connect(p);p.connect(humBus);let pk=a*vel*(i?BL:H);g.gain.setValueAtTime(.0001,t);g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(Math.max(.0002,pk),t+delay+.65);g.gain.exponentialRampToValueAtTime(.0001,t+10+15*H+7*Z);o.start(t);o.stop(t+35);V.push(o)});voices.push(V);let b=document.getElementById('strike');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')}catch(x){status.textContent='Audio error: '+(x.message||x)}}
strike.onpointerdown=e=>play(N[+sel.value].f,.82,e);stop.onclick=()=>{if(!c)return;let t=c.currentTime;voices.flat().forEach(o=>{try{o.stop(t+.02)}catch{}});voices=[]};const P={choir:{body:.8,strike:.56,weight:.92,hum:.78,bloom:.72,grind:.14,damp:.27,size:24},monolith:{body:.65,strike:.45,weight:1,hum:.63,bloom:.32,grind:.1,damp:.18,size:30},wind:{body:.72,strike:.38,weight:.86,hum:.82,bloom:.58,grind:.08,damp:.34,size:28},savage:{body:.78,strike:.62,weight:.9,hum:.56,bloom:.42,grind:.48,damp:.3,size:20}};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let p=P[b.dataset.p];for(let[k,v]of Object.entries(p)){S[k][2]=v;let i=document.getElementById(k);i.value=v;i.dispatchEvent(new Event('input'))}});})();
</script></body></html>
